                  items:
                    type: object
                    properties:
                      product_id: { type: integer, minimum: 1, nullable: true }
                      counted_quantity: { type: integer, minimum: 0, maximum: 1000000, nullable: true }
                      note: { type: string, nullable: true, maxLength: 500 }
