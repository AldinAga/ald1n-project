        device_name: { type: [string, 'null'] }
        push_provider: { type: [string, 'null'] }
        push_registered: { type: boolean }
        app_version: { type: [string, 'null'] }
        build_number: { type: [string, 'null'] }
        locale: { type: [string, 'null'] }
        timezone: { type: [string, 'null'] }
        notifications_enabled: { type: boolean }
        is_current: { type: boolean }
        active: { type: boolean }
        last_seen_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
    MobileDeviceUpdateInput:
      type: object
      properties:
        device_name: { type: [string, 'null'], maxLength: 120 }
        push_provider: { type: [string, 'null'], enum: [expo, fcm, apns, null] }
        push_token: { type: [string, 'null'], maxLength: 4096 }
        app_version: { type: [string, 'null'], maxLength: 40 }
        build_number: { type: [string, 'null'], maxLength: 40 }
        locale: { type: [string, 'null'], maxLength: 20 }
        timezone: { type: [string, 'null'], maxLength: 64 }
        notifications_enabled: { type: boolean }
    OrderPrivateFile:
      type: object
      required: [original_name, mime_type, size_bytes]
      properties:
        original_name: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer, minimum: 0 }

    OrderPaymentLedgerEntry:
      type: object
      required: [id, number, entry_type, entry_label, status, amount_rsd, payment_method, has_proof]
      properties:
        id: { type: integer }
        number: { type: string }
        entry_type: { type: string }
        entry_label: { type: string }
        status: { type: string }
        amount_rsd: { type: number }
        payment_method: { type: string }
        paid_at: { type: [string, 'null'], format: date-time }
        rejection_reason: { type: [string, 'null'] }
        has_proof: { type: boolean }
        proof: { anyOf: [{ $ref: '#/components/schemas/OrderPrivateFile' }, { type: 'null' }] }

    OrderDocumentSummary:
      type: object
      required: [id, number, type, revision_number, status, currency, total_rsd]
      properties:
        id: { type: integer }
        number: { type: string }
        type: { type: string }
        revision_number: { type: integer, minimum: 1 }
        status: { type: string, const: issued }
        issued_at: { type: [string, 'null'], format: date-time }
        due_at: { type: [string, 'null'], format: date }
        currency: { type: string }
        total_rsd: { type: number }

    OrderDeliverySummary:
      type: object
      required: [id, delivery_method, delivery_method_label, has_proof]
      properties:
        id: { type: integer }
        delivery_method: { type: string }
        delivery_method_label: { type: string }
        delivered_at: { type: [string, 'null'], format: date-time }
        recipient_name: { type: [string, 'null'] }
        recipient_phone: { type: [string, 'null'] }
        reference: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        has_proof: { type: boolean }
        proof: { anyOf: [{ $ref: '#/components/schemas/OrderPrivateFile' }, { type: 'null' }] }

    OrderBankTransferSnapshot:
      type: object
      properties:
        account_label: { type: [string, 'null'] }
        account_number: { type: [string, 'null'] }
        recipient_name: { type: [string, 'null'] }
        recipient_address: { type: [string, 'null'] }
        payment_code: { type: [string, 'null'] }
        purpose: { type: [string, 'null'] }
        reference: { type: [string, 'null'] }

    OrderPostCreateCapabilities:
      type: object
      required: [can_view_payments, can_upload_payment_proof, can_view_documents, can_issue_order_confirmation, can_view_delivery_proof]
      properties:
        can_view_payments: { type: boolean }
        can_upload_payment_proof: { type: boolean }
        can_view_documents: { type: boolean }
        can_issue_order_confirmation: { type: boolean }
        can_view_delivery_proof: { type: boolean }

    OrderPaymentProofLimits:
      type: object
      required: [max_bytes, extensions, mime_types]
      properties:
        max_bytes: { type: integer, minimum: 1 }
        extensions:
          type: array
          items: { type: string }
        mime_types:
          type: array
          items: { type: string }

    OrderPostCreate:
      type: object
      required: [order, payments, documents, capabilities, payment_proof_limits]
      properties:
        order:
          type: object
          required: [id, order_number, status, payment_method, payment_status, payment_state, subtotal_rsd, paid_total_rsd, remaining_rsd]
          properties:
            id: { type: integer }
            order_number: { type: string }
            status: { type: string }
            payment_method: { type: string }
            payment_status: { type: string }
            payment_state: { type: string }
            subtotal_rsd: { type: number }
            paid_total_rsd: { type: number }
            remaining_rsd: { type: number, minimum: 0 }
            payment_due_at: { type: [string, 'null'], format: date-time }
            tracking_number: { type: [string, 'null'] }
            completed_at: { type: [string, 'null'], format: date-time }
            completion_note: { type: [string, 'null'] }
        bank_transfer: { anyOf: [{ $ref: '#/components/schemas/OrderBankTransferSnapshot' }, { type: 'null' }] }
        payments:
          type: array
          items: { $ref: '#/components/schemas/OrderPaymentLedgerEntry' }
        documents:
          type: array
          items: { $ref: '#/components/schemas/OrderDocumentSummary' }
        delivery: { anyOf: [{ $ref: '#/components/schemas/OrderDeliverySummary' }, { type: 'null' }] }
        capabilities: { $ref: '#/components/schemas/OrderPostCreateCapabilities' }
        payment_proof_limits: { $ref: '#/components/schemas/OrderPaymentProofLimits' }
    AfterSalesCaseSummary:
      type: object
      required: [id, case_number, order, case_type, case_type_label, priority, priority_label, status, status_label, subject, can_message]
      properties:
        id: { type: integer }
        case_number: { type: string }
        order:
          type: object
          properties:
            id: { type: integer }
            order_number: { type: string }
        case_type: { type: string, enum: [complaint, return, service] }
        case_type_label: { type: string }
        priority: { type: string, enum: [low, normal, high, urgent] }
        priority_label: { type: string }
        status: { type: string, enum: [open, under_review, awaiting_customer, approved, in_service, resolved, rejected, closed] }
        status_label: { type: string }
        subject: { type: string }
        assignee:
          anyOf:
            - type: 'null'
            - type: object
              properties:
                id: { type: integer }
                name: { type: string }
        due_at: { type: [string, 'null'], format: date-time }
        can_message: { type: boolean }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }

    AfterSalesAttachment:
      type: object
      required: [id, original_name, mime_type, size_bytes, download_path]
      properties:
        id: { type: integer }
        original_name: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer, minimum: 0 }
        download_path: { type: string }
        created_at: { type: [string, 'null'], format: date-time }

    AfterSalesMessage:
      type: object
      required: [id, body, attachments]
      properties:
        id: { type: integer }
        body: { type: string }
        author:
          anyOf:
            - type: 'null'
            - type: object
              properties:
                id: { type: integer }
                name: { type: string }
                kind: { type: string, enum: [staff, customer] }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/AfterSalesAttachment' }
        created_at: { type: [string, 'null'], format: date-time }

    AfterSalesAction:
      type: object
      properties:
        id: { type: integer }
        action_number: { type: string }
        action_type: { type: string }
        action_type_label: { type: string }
        status: { type: string }
        status_label: { type: string }
        scheduled_at: { type: [string, 'null'], format: date-time }
        due_at: { type: [string, 'null'], format: date-time }
        amount_rsd: { type: [number, 'null'] }
        reference: { type: [string, 'null'] }
        public_note: { type: [string, 'null'] }
        completion_note: { type: [string, 'null'] }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              quantity: { type: integer }
        work_order:
          anyOf:
            - type: 'null'
            - type: object
              properties:
                id: { type: integer }
                work_order_number: { type: string }
                status: { type: string }
                status_label: { type: string }
                planned_start_at: { type: [string, 'null'], format: date-time }
                planned_end_at: { type: [string, 'null'], format: date-time }
                completion_result: { type: [string, 'null'] }
                team:
                  anyOf:
                    - type: 'null'
                    - type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        phone: { type: [string, 'null'] }
                attachments:
                  type: array
                  items: { $ref: '#/components/schemas/AfterSalesAttachment' }

    AfterSalesCase:
      allOf:
        - $ref: '#/components/schemas/AfterSalesCaseSummary'
        - type: object
          properties:
            description: { type: string }
            requested_resolution: { type: [string, 'null'] }
            requested_resolution_label: { type: [string, 'null'] }
            resolution_type: { type: [string, 'null'] }
            resolution_type_label: { type: [string, 'null'] }
            resolution_summary: { type: [string, 'null'] }
            first_response_at: { type: [string, 'null'], format: date-time }
            resolved_at: { type: [string, 'null'], format: date-time }
            closed_at: { type: [string, 'null'], format: date-time }
            limits:
              type: object
              properties:
                subject_max_length: { type: integer }
                description_min_length: { type: integer }
                description_max_length: { type: integer }
                issue_description_max_length: { type: integer }
                message_max_length: { type: integer }
                max_attachments: { type: integer }
                max_attachment_bytes: { type: integer }
                attachment_mime_types:
                  type: array
                  items: { type: string }
            items:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  order_item_id: { type: [integer, 'null'] }
                  product_id: { type: [integer, 'null'] }
                  sku: { type: string }
                  name: { type: string }
                  quantity: { type: integer }
                  issue_description: { type: [string, 'null'] }
            actions:
              type: array
              items: { $ref: '#/components/schemas/AfterSalesAction' }
            messages:
              type: array
              items: { $ref: '#/components/schemas/AfterSalesMessage' }
            attachments:
              type: array
              items: { $ref: '#/components/schemas/AfterSalesAttachment' }

    AfterSalesOptions:
      type: object
      properties:
        order:
          type: object
          properties:
            id: { type: integer }
            order_number: { type: string }
            shipping:
              type: object
              properties:
                full_name: { type: string }
                address: { type: string }
                city: { type: string }
                postal_code: { type: string }
                phone: { type: string }
            items:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  product_id: { type: [integer, 'null'] }
                  sku: { type: string }
                  name: { type: string }
                  quantity: { type: integer }
        case_types: { type: object, additionalProperties: { type: string } }
        priorities: { type: object, additionalProperties: { type: string } }
        requested_resolutions: { type: object, additionalProperties: { type: string } }
        defaults:
          type: object
          properties:
            priority: { type: string, enum: [low, normal, high, urgent] }
        limits:
          type: object
          properties:
            subject_max_length: { type: integer }
            description_min_length: { type: integer }
            description_max_length: { type: integer }
            issue_description_max_length: { type: integer }
            message_max_length: { type: integer }
            max_attachments: { type: integer }
            max_attachment_bytes: { type: integer }
            attachment_mime_types:
              type: array
              items: { type: string }
    WarrantySummary:
      type: object
      required: [id, warranty_number, order, status, status_label, product_name]
      properties:
        id: { type: integer }
        warranty_number: { type: string }
        order:
          type: object
          required: [id, order_number]
          properties:
            id: { type: integer }
            order_number: { type: string }
        status: { type: string, enum: [active, expired, void] }
        status_label: { type: string }
        product_name: { type: string }
        product_sku: { type: [string, 'null'] }
        starts_at: { type: [string, 'null'], format: date }
        expires_at: { type: [string, 'null'], format: date }
        next_maintenance_at: { type: [string, 'null'], format: date }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }

    WarrantyMaintenanceRecord:
      type: object
      required: [id, status, status_label]
      properties:
        id: { type: integer }
        status: { type: string, enum: [due, scheduled, completed, cancelled] }
        status_label: { type: string }
        due_at: { type: [string, 'null'], format: date }
        scheduled_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        result: { type: [string, 'null'] }

    Warranty:
      allOf:
        - { $ref: '#/components/schemas/WarrantySummary' }
        - type: object
          required: [quantity, serial_numbers, maintenance_records]
          properties:
            quantity: { type: integer, minimum: 0 }
            serial_numbers:
              type: array
              items: { type: string }
            duration_months: { type: [integer, 'null'] }
            duration_days: { type: [integer, 'null'] }
            maintenance_interval_months: { type: [integer, 'null'] }
            last_maintenance_at: { type: [string, 'null'], format: date }
            terms: { type: [string, 'null'] }
            void_reason: { type: [string, 'null'] }
            maintenance_records:
              type: array
              items: { $ref: '#/components/schemas/WarrantyMaintenanceRecord' }
    CommissionPayment:
      type: object
      properties:
        method: { type: [string, 'null'], enum: [bank_transfer, cash, other, null] }
        method_label: { type: [string, 'null'] }
        reference: { type: [string, 'null'] }
        paid_at: { type: [string, 'null'], format: date-time }

    Commission:
      type: object
      required: [id, order, total_eur, status, status_label, responsible_name]
      properties:
        id: { type: integer }
        order:
          type: object
          required: [id, order_number]
          properties:
            id: { type: integer }
            order_number: { type: string }
        total_eur: { type: number, format: double, minimum: 0 }
        status: { type: string, enum: [pending, approved, paid, cancelled] }
        status_label: { type: string }
        status_note: { type: [string, 'null'] }
        responsible_name: { type: string }
        payment: { anyOf: [{ $ref: '#/components/schemas/CommissionPayment' }, { type: 'null' }] }
        status_updated_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }

    CommissionTotals:
      type: object
      required: [pending_eur, approved_eur, paid_eur, count]
      properties:
        pending_eur: { type: number, format: double, minimum: 0 }
        approved_eur: { type: number, format: double, minimum: 0 }
        paid_eur: { type: number, format: double, minimum: 0 }
        count: { type: integer, minimum: 0 }

    CommissionListResponse:
      type: object
      required: [data, summary, links, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Commission' }
        summary: { $ref: '#/components/schemas/CommissionTotals' }
        links:
          type: object
          required: [first, last, prev, next]
          properties:
            first: { type: [string, 'null'] }
            last: { type: [string, 'null'] }
            prev: { type: [string, 'null'] }
            next: { type: [string, 'null'] }
        meta:
          type: object
          required: [current_page, from, last_page, path, per_page, to, total]
          properties:
            current_page: { type: integer }
            from: { type: [integer, 'null'] }
            last_page: { type: integer }
            path: { type: string }
            per_page: { type: integer }
            to: { type: [integer, 'null'] }
            total: { type: integer }
    ApiError:
      type: object
      required: [message, code, request_id]
      properties:
        message: { type: string }
        code: { type: string }
        request_id: { type: [string, 'null'] }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
  responses:
    ValidationError:
      description: Validacija nije prošla
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthenticated:
      description: Token nedostaje, istekao je ili je opozvan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Korisnik ili token nema potrebnu dozvolu
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Resurs nije pronađen ili ne pripada korisniku
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Poslovni konflikt
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    RateLimited:
      description: Prekoračeno ograničenje zahteva
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
