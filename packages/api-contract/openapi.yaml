openapi: 3.1.0
info:
  title: Ald1n CMS Mobile API
  version: 2.2.0
  description: |
    Stabilni JSON ugovor za React Native / Expo klijente. Sve zaštićene rute
    koriste Laravel Sanctum Bearer token. Greške koriste jedinstveni envelope
    sa code i request_id poljima.
servers:
  - url: https://cms.ald1n.com
    description: Production
  - url: http://localhost:8000
    description: Local development
tags:
  - name: Auth
  - name: Bootstrap
  - name: Account
  - name: Devices
  - name: Catalog
  - name: Orders
  - name: AfterSales
  - name: Warranties
  - name: Commissions
  - name: Notifications
  - name: Admin Catalog
    description: Administratorsko kreiranje i metadata za katalog artikala.
  - name: Admin
    description: Centralni Mobile Admin foundation i administratorski moduli.
paths:
  /api/v1/admin/catalog/purchase-costs:
    get:
      tags: [Admin Catalog]
      summary: SuperAdmin masovni pregled nabavnih cena
      operationId: listAdminPurchaseCosts
      parameters:
        - { name: show, in: query, schema: { type: string, enum: [all] } }
      responses:
        '200':
          description: Artikli i stanje pokrivenosti nabavnim cenama.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '403': { description: Dostupno samo Super Administratoru sa catalog.manage_products. }
    put:
      tags: [Admin Catalog]
      summary: SuperAdmin masovni upis nabavnih cena u RSD
      operationId: updateAdminPurchaseCosts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [costs]
              properties:
                costs:
                  type: object
                  maxProperties: 500
                  additionalProperties:
                    type: number
                    minimum: 0.01
                    maximum: 9999999999.99
      responses:
        '200':
          description: Nabavne cene su transakciono sačuvane i auditovane.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '403': { description: Dostupno samo Super Administratoru sa catalog.manage_products. }
        '422': { description: Nevalidna cena, prazan batch ili artikal više nije dostupan. }
  /api/v1/admin/catalog/products/archived:
    get:
      tags: [Admin Catalog]
      summary: Administratorska lista arhiviranih artikala
      operationId: listArchivedAdminCatalogProducts
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, enum: [20, 50, 100] } }
      responses:
        '200':
          description: Paginated arhivirani artikli.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/v1/admin/catalog/products/{product}:
    get:
      tags: [Admin Catalog]
      summary: Administratorski detalj artikla za edit
      operationId: getAdminCatalogProduct
      parameters:
        - { name: product, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Pun edit payload artikla uključujući specifikacije.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { description: Artikal nije u manage scope-u. }
    put:
      tags: [Admin Catalog]
      summary: Izmena postojećeg artikla
      operationId: updateAdminCatalogProduct
      parameters:
        - { name: product, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Artikal je izmenjen kroz postojeći ProductAdminService.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '409': { description: Arhivirani artikal prvo mora biti vraćen. }
        '422': { description: Validacija ProductRequest pravila nije prošla. }
  /api/v1/admin/catalog/products/{product}/archive:
    post:
      tags: [Admin Catalog]
      summary: Arhiviranje artikla
      operationId: archiveAdminCatalogProduct
      parameters:
        - { name: product, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Artikal je arhiviran; ponovljen poziv je bezbedan.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/v1/admin/catalog/products/{product}/restore:
    post:
      tags: [Admin Catalog]
      summary: Vraćanje artikla iz arhive
      operationId: restoreAdminCatalogProduct
      parameters:
        - { name: product, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Artikal je vraćen iz arhive; ponovljen poziv je bezbedan.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/v1/admin/catalog/products/{product}/images:
    get:
      tags: [Admin Catalog]
      summary: Administratorski pregled svih fotografija artikla
      operationId: listAdminCatalogProductImages
      parameters:
        - { name: product, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Fotografije u canonical primary/sort redosledu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductImageCollectionResponse'
        '404': { description: Artikal nije u image-manage scope-u. }
    post:
      tags: [Admin Catalog]
      summary: Dodavanje fotografija novom ili postojećem artiklu
      operationId: uploadAdminCatalogProductImages
      parameters:
        - name: product
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Fotografije su obrađene kroz postojeći ProductImageService.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductImageUploadResponse'
        '401':
          description: Neautorizovan zahtev.
        '403':
          description: Nedostaje catalog.manage_products ili catalog.manage_images dozvola.
        '404':
          description: Artikal nije vidljiv u administratorskom catalog scope-u.
        '422':
          description: Maksimalno 20 JPG/JPEG/PNG/WebP fajlova do 10 MiB po fajlu.
  /api/v1/admin/catalog/products/{product}/images/reorder:
    post:
      tags: [Admin Catalog]
      summary: Promena redosleda fotografija
      operationId: reorderAdminCatalogProductImages
      parameters:
        - { name: product, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image_ids]
              properties:
                image_ids:
                  type: array
                  items: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Novi redosled je sačuvan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductImageCollectionResponse' }
  /api/v1/admin/catalog/products/{product}/images/{image}/primary:
    post:
      tags: [Admin Catalog]
      summary: Postavljanje glavne fotografije
      operationId: setPrimaryAdminCatalogProductImage
      parameters:
        - { name: product, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: image, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Glavna fotografija je promenjena i pomerena na prvo mesto.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductImageCollectionResponse' }
  /api/v1/admin/catalog/products/{product}/images/{image}/rotate:
    post:
      tags: [Admin Catalog]
      summary: Fizička rotacija fotografije
      operationId: rotateAdminCatalogProductImage
      parameters:
        - { name: product, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: image, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [degrees]
              properties:
                degrees: { type: integer, enum: [90, 180, 270] }
      responses:
        '200':
          description: Fotografija je rotirana; legacy slika koristi copy-on-write.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductImageCollectionResponse' }
        '422': { description: Rotacija nije tehnički moguća ili format nije podržan. }
  /api/v1/admin/catalog/products/{product}/images/{image}:
    delete:
      tags: [Admin Catalog]
      summary: Brisanje lokalne fotografije artikla
      operationId: deleteAdminCatalogProductImage
      parameters:
        - { name: product, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: image, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Fotografija je uklonjena; ako je bila glavna, sledeća postaje glavna.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductImageCollectionResponse' }
        '422': { description: Legacy fotografija mora prvo biti rotirana u lokalnu copy-on-write kopiju. }
  # MOBILE_V0_8_SUPERADMIN_DIRECT_SALE_BATCH10
  /api/v1/admin/catalog/products/{product}/direct-sale/options:
    get:
      tags: [Admin Catalog]
      summary: SuperAdmin opcije za direktnu prodaju artikla
      operationId: getAdminCatalogProductDirectSaleOptions
      parameters:
        - { name: product, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Artikalski lager, referentna kataloška RSD cena, payment metode i stabilni idempotency ključ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDirectSaleOptionsEnvelope' }
        '403': { description: Samo SuperAdministrator može evidentirati direktnu prodaju. }
        '404': { description: Artikal nije u administratorskom manage scope-u. }
  /api/v1/admin/catalog/products/{product}/direct-sale:
    post:
      tags: [Admin Catalog]
      summary: Evidentiranje direktne prodaje artikla
      description: Koristi postojeći DirectSaleService. Identičan retry sa istim idempotency ključem ne kreira duplu prodaju.
      operationId: recordAdminCatalogProductDirectSale
      parameters:
        - { name: product, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDirectSaleInput'
      responses:
        '201':
          description: Standardna direktna prodaja se odmah evidentira kao plaćena i dostavljena; deferred_payment odmah evidentira dostavu i lager, a naplatu vodi kroz postojeći Receivables plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDirectSaleResponse' }
        '403': { description: Samo SuperAdministrator može evidentirati direktnu prodaju. }
        '404': { description: Artikal nije u administratorskom manage scope-u. }
        '422': { description: Validacija, lager, EUR/RSD kurs ili idempotency ugovor nisu prošli. }
        '429': { description: Previše administratorskih write zahteva. }
  # MOBILE_V1_0_ADMIN_CATALOG_DICTIONARIES_BATCH22
  /api/v1/admin/catalog/dictionaries/brands/reorder:
    patch:
      tags: [Admin Catalog]
      summary: Promena redosleda globalnih brendova bez dupliranja Brand Manager CRUD-a
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, minItems: 1, maxItems: 1000, items: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Raspored brendova je sačuvan. }
        '403': { description: Nedostaje catalog.manage_taxonomy dozvola. }
        '422': { description: Lista sadrži nepostojeću stavku ili nije validna. }
  /api/v1/admin/catalog/dictionaries/product-types/{productType}:
    get:
      tags: [Admin Catalog]
      summary: Pun Mobile konfiguracioni detalj tipa proizvoda
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: productType, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Tip, automatska kategorija, kompletnost, name-template i sva polja sa pivot konfiguracijom. }
        '403': { description: Nedostaje catalog.manage_taxonomy dozvola. }
        '404': { description: Tip proizvoda ne postoji. }
  /api/v1/admin/catalog/dictionaries/product-types/{productType}/fields/reorder:
    patch:
      tags: [Admin Catalog]
      summary: Promena redosleda specifikacija dodeljenih tipu proizvoda
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: productType, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, minItems: 1, maxItems: 500, items: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Raspored dodeljenih specifikacija je sačuvan. }
        '403': { description: Nedostaje catalog.manage_taxonomy dozvola. }
        '422': { description: Lista sadrži polje koje nije dodeljeno ovom tipu. }
  /api/v1/admin/catalog/dictionaries/specification-fields/{item}/purge:
    delete:
      tags: [Admin Catalog]
      summary: Bezbedno trajno brisanje specifikacionog polja
      description: Zahteva tačan naziv polja i koristi isti SpecificationFieldLifecycleService kao Laravel CMS; čisti vrednosti, opcije, zavisnosti i dodele te preračunava kompletnost.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: item, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_name]
              properties:
                confirm_name: { type: string, maxLength: 120 }
      responses:
        '200': { description: Polje i povezani podaci su bezbedno trajno obrisani. }
        '403': { description: Nedostaje catalog.manage_taxonomy dozvola. }
        '422': { description: Naziv za potvrdu se ne podudara. }
  /api/v1/admin/catalog/dictionaries/{resource}/reorder:
    patch:
      tags: [Admin Catalog]
      summary: Promena redosleda kataloškog šifarnika
      security: [{ bearerAuth: [] }]
      parameters:
        - name: resource
          in: path
          required: true
          schema: { type: string, enum: [categories, product-lines, product-types, specification-fields] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, minItems: 1, maxItems: 1000, items: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Novi raspored je sačuvan. }
        '403': { description: Nedostaje catalog.manage_taxonomy dozvola. }
        '422': { description: Lista nije validna ili sadrži nepostojeću stavku. }
  /api/v1/admin/catalog/dictionaries/{resource}:
    get:
      tags: [Admin Catalog]
      summary: Lista i reference za Mobile kataloški šifarnik
      security: [{ bearerAuth: [] }]
      parameters:
        - name: resource
          in: path
          required: true
          schema: { type: string, enum: [categories, product-lines, product-types, specification-fields] }
      responses:
        '200': { description: Stavke, reference, opcije i capabilities za izabrani šifarnik. }
        '403': { description: Nedostaje catalog.manage_taxonomy dozvola. }
    post:
      tags: [Admin Catalog]
      summary: Kreiranje stavke kataloškog šifarnika
      description: Koristi isti CatalogDictionaryManagerService, automatsku kategoriju tipa, completeness i specification dependency servise kao CMS.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: resource
          in: path
          required: true
          schema: { type: string, enum: [categories, product-lines, product-types, specification-fields] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '201': { description: Stavka je kreirana i prateći lifecycle je izvršen. }
        '403': { description: Nedostaje catalog.manage_taxonomy dozvola. }
        '422': { description: Validacija ili dependency/completeness pravilo nije prošlo. }
  /api/v1/admin/catalog/dictionaries/{resource}/{item}:
    put:
      tags: [Admin Catalog]
      summary: Izmena stavke kataloškog šifarnika
      security: [{ bearerAuth: [] }]
      parameters:
        - name: resource
          in: path
          required: true
          schema: { type: string, enum: [categories, product-lines, product-types, specification-fields] }
        - { name: item, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Stavka je izmenjena kroz shared CMS/Mobile business lifecycle. }
        '403': { description: Nedostaje catalog.manage_taxonomy dozvola. }
        '404': { description: Stavka ne postoji. }
        '422': { description: Validacija ili lifecycle pravilo nije prošlo. }
    delete:
      tags: [Admin Catalog]
      summary: Deaktiviranje stavke bez fizičkog brisanja
      security: [{ bearerAuth: [] }]
      parameters:
        - name: resource
          in: path
          required: true
          schema: { type: string, enum: [categories, product-lines, product-types, specification-fields] }
        - { name: item, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Stavka je deaktivirana i istorijske veze su sačuvane. }
        '403': { description: Nedostaje catalog.manage_taxonomy dozvola. }
        '404': { description: Stavka ne postoji. }

  # MOBILE_V0_9_GLOBAL_BRAND_MANAGER_BATCH3
  /api/v1/admin/catalog/brands:
    get:
      tags: [Admin Catalog]
      summary: Globalni Brand Manager - lista brendova sa type-scoped vezama i linijama
      operationId: listAdminCatalogBrands
      security:
        - bearerAuth: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 190 } }
        - { name: product_type_id, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Globalni brendovi, dinamički tipovi, linije i capabilities.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { description: Neautorizovan zahtev. }
        '403': { description: Nedostaje catalog.manage_taxonomy dozvola. }
    post:
      tags: [Admin Catalog]
      summary: Kreira jedan globalni brend i povezuje ga sa izabranim tipovima
      operationId: createAdminCatalogBrand
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, status, sort_order, product_type_ids]
              properties:
                name: { type: string, maxLength: 120 }
                description: { type: [string, 'null'], maxLength: 65000 }
                website_url: { type: [string, 'null'], format: uri, maxLength: 255 }
                status: { type: string, enum: [active, inactive] }
                sort_order: { type: integer, minimum: 0, maximum: 1000000 }
                product_type_ids:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: integer, minimum: 1 }
                line_names_by_type:
                  type: object
                  additionalProperties:
                    type: array
                    maxItems: 10
                    items: { type: string, maxLength: 120 }
      responses:
        '201':
          description: Brend je kreiran.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { description: Neautorizovan zahtev. }
        '403': { description: Nedostaje catalog.manage_taxonomy dozvola. }
        '422': { description: Validacija nije prošla ili je globalni naziv duplikat. }
  /api/v1/admin/catalog/brands/options:
    get:
      tags: [Admin Catalog]
      summary: Dinamički tipovi, statusi i ograničenja za Brand Manager
      operationId: getAdminCatalogBrandOptions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Brand Manager opcije.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { description: Neautorizovan zahtev. }
        '403': { description: Nedostaje catalog.manage_taxonomy dozvola. }
  /api/v1/admin/catalog/brands/{brand}:
    put:
      tags: [Admin Catalog]
      summary: Menja globalni brend, type-scoped veze i do deset kuriranih linija po tipu
      operationId: updateAdminCatalogBrand
      security:
        - bearerAuth: []
      parameters:
        - { name: brand, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, status, sort_order, product_type_ids]
              properties:
                name: { type: string, maxLength: 120 }
                description: { type: [string, 'null'], maxLength: 65000 }
                website_url: { type: [string, 'null'], format: uri, maxLength: 255 }
                status: { type: string, enum: [active, inactive] }
                sort_order: { type: integer, minimum: 0, maximum: 1000000 }
                product_type_ids:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: integer, minimum: 1 }
                line_names_by_type:
                  type: object
                  additionalProperties:
                    type: array
                    maxItems: 10
                    items: { type: string, maxLength: 120 }
      responses:
        '200':
          description: Brend je sačuvan.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { description: Neautorizovan zahtev. }
        '403': { description: Nedostaje catalog.manage_taxonomy dozvola. }
        '404': { description: Brend nije pronađen. }
        '422': { description: Validacija nije prošla ili odnos ne može bezbedno biti uklonjen. }
  /api/v1/admin/catalog/options:
    get:
      tags: [Admin Catalog]
      summary: Opcije za kreiranje artikla
      operationId: getAdminCatalogCreateOptions
      responses:
        '200':
          description: Aktivni tipovi, brendovi, linije i podrazumevane vrednosti.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCatalogCreateOptionsEnvelope'
        '401':
          description: Neautorizovan zahtev.
        '403':
          description: Nedostaje catalog.manage_products dozvola.
  /api/v1/admin/catalog/products:
    get:
      tags: [Admin Catalog]
      summary: Administratorska lista aktivnih/ne-arhiviranih artikala
      operationId: listAdminCatalogProducts
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [draft, active, inactive] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, enum: [20, 50, 100] } }
      responses:
        '200':
          description: Paginated administratorski katalog.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { description: Neautorizovan zahtev. }
        '403': { description: Nedostaje catalog.manage_products dozvola. }
    post:
      tags: [Admin Catalog]
      summary: Kreiranje novog artikla
      operationId: createAdminCatalogProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProductCreateInput'
      responses:
        '201':
          description: Artikal je kreiran kroz postojeći ProductAdminService.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductCreateResponse'
        '401':
          description: Neautorizovan zahtev.
        '403':
          description: Nedostaje catalog.manage_products dozvola.
        '422':
          description: ProductRequest validacija nije prošla.
  /api/v1/auth/google:
    post:
      summary: Google login ili registracija mobilnog korisnika
      description: Verifikovani Google ID token se proverava na Laravel backendu. Aktivni postojeći korisnik dobija Sanctum token; novi korisnik može biti kreiran kao pending prema CMS pravilima registracije.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token, device_name]
              properties:
                id_token: { type: string }
                device_name: { type: string }
      responses:
        '201': { description: Prijava uspela i Sanctum token je izdat }
        '202': { description: Registracija je kreirana i čeka aktivaciju }
        '422': { description: Google identitet ili nalog nije prihvaćen }

  /api/v1/auth/token:
    post:
      tags: [Auth]
      summary: Prijava i izdavanje Sanctum tokena
      security: []
      operationId: createAuthToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password, device_name]
              properties:
                login: { type: string, maxLength: 190 }
                password: { type: string, maxLength: 4096 }
                device_name: { type: string, maxLength: 120 }
      responses:
        '201':
          description: Token je izdat
          content:
            application/json:
              schema:
                type: object
                required: [token, token_type, user, permissions, api_version]
                properties:
                  token: { type: string }
                  token_type: { type: string, const: Bearer }
                  expires_at: { type: [string, 'null'], format: date-time }
                  user: { $ref: '#/components/schemas/UserSummary' }
                  permissions:
                    type: array
                    items: { type: string }
                  api_version: { type: string, const: v1 }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Auth]
      summary: Opoziv trenutnog tokena i vezanog uređaja
      operationId: revokeCurrentAuthToken
      responses:
        '204': { description: Token je opozvan }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/bootstrap:
    get:
      tags: [Bootstrap]
      summary: Početni mobilni payload
      operationId: getMobileBootstrap
      responses:
        '200':
          description: Korisnik, dozvole, feature flagovi i verzije aplikacije
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [user, permissions, features, notification_counts, notification_preferences, app]
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      permissions:
                        type: array
                        items: { type: string }
                      features:
                        type: object
                        additionalProperties: { type: boolean }
                      notification_counts:
                        type: object
                        required: [unread]
                        properties:
                          unread: { type: integer, minimum: 0 }
                      notification_preferences: { $ref: '#/components/schemas/NotificationPreferences' }
                      app: { $ref: '#/components/schemas/AppContract' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/me:
    get:
      tags: [Account]
      summary: Trenutni korisnik
      operationId: getCurrentUser
      responses:
        '200':
          description: Korisnički podaci i dozvole
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [Account]
      summary: Ažuriranje profila
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string, maxLength: 100 }
                last_name: { type: [string, 'null'], maxLength: 100 }
                phone: { type: [string, 'null'], maxLength: 40 }
                address: { type: [string, 'null'], maxLength: 255 }
                city: { type: [string, 'null'], maxLength: 120 }
                postal_code: { type: [string, 'null'], maxLength: 20 }
      responses:
        '200':
          description: Profil je sačuvan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/me/password:
    put:
      tags: [Account]
      summary: Promena lozinke i opoziv svih API tokena
      operationId: updateCurrentUserPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string, minLength: 12 }
                password_confirmation: { type: string }
      responses:
        '200':
          description: Lozinka je promenjena; klijent mora ponovo da se prijavi
          content:
            application/json:
              schema:
                type: object
                required: [message, reauthenticate]
                properties:
                  message: { type: string }
                  reauthenticate: { type: boolean, const: true }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/me/notification-preferences:
    put:
      tags: [Account]
      summary: Ažuriranje kanala i kategorija obaveštenja
      operationId: updateNotificationPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferences' }
      responses:
        '200':
          description: Preference su sačuvane
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/NotificationPreferences' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/devices:
    get:
      tags: [Devices]
      summary: Lista mobilnih uređaja korisnika
      operationId: listMobileDevices
      parameters:
        - in: query
          name: include_revoked
