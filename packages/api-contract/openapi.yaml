          multipart/form-data:
            schema:
              type: object
              required: [shipment_method, shipped_at, recipient_name]
              properties:
                shipment_method: { type: string, enum: [courier, own_transport, other], default: courier }
                courier_service_id: { type: [integer, 'null'] }
                shipped_at: { type: string, format: date-time }
                recipient_name: { type: string, maxLength: 190 }
                recipient_phone: { type: [string, 'null'], maxLength: 60 }
                tracking_number: { type: [string, 'null'], maxLength: 120, description: Single canonical tracking input; required by the domain service for courier shipments. }
                note: { type: [string, 'null'], maxLength: 3000 }
