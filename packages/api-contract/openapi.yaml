                supplier_document_number: { type: string, nullable: true, maxLength: 100 }
                note: { type: string, nullable: true }
                idempotency_key: { type: string, maxLength: 200, description: Body fallback when the Idempotency-Key header is unavailable }
                items:
                  type: array
                  minItems: 1
                  maxItems: 250
                  items:
                    type: object
                    properties:
                      product_id: { type: integer, minimum: 1, nullable: true }
                      quantity: { type: integer, minimum: 1, maximum: 1000000, nullable: true }
                      unit_cost_rsd: { type: number, minimum: 0, maximum: 9999999999.99, nullable: true }
                      note: { type: string, nullable: true, maxLength: 500 }
      responses:
        '201': { description: Posted stock receipt }
