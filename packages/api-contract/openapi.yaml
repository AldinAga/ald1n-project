      responses:
        '200':
          description: Uređaji
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MobileDevice' }
    post:
      tags: [Devices]
      summary: Registracija ili osvežavanje instalacije
      operationId: registerMobileDevice
      requestBody:
        required: true
