  # MOBILE_V0_8_EUR_RSD_EXCHANGE_RATE_BATCH13
  /api/v1/admin/exchange-rate:
    get:
      tags: [Admin]
      summary: Trenutni EUR/RSD kurs, konfiguracija i istorija
      operationId: getAdminExchangeRate
      responses:
        '200':
          description: Centralna konfiguracija kursa i poslednjih 50 zapisa istorije
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminExchangeRateStateResponse' }
        '403': { description: Nedostaje system.manage_settings dozvola }
  /api/v1/admin/exchange-rate/manual:
    put:
      tags: [Admin]
      summary: Sačuvaj ručni EUR/RSD kurs
      operationId: saveAdminExchangeRateManual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rate]
              properties:
                rate: { type: number, minimum: 50, maximum: 250 }
      responses:
        '200':
          description: Ručni kurs je sačuvan kroz centralni ExchangeRateService
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminExchangeRateStateResponse' }
        '403': { description: Nedostaje system.manage_settings dozvola }
        '422': { description: Kurs nije validan }
  /api/v1/admin/exchange-rate/automatic:
    put:
      tags: [Admin]
      summary: Uključi ili isključi automatski EUR/RSD režim
      operationId: updateAdminExchangeRateAutomatic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, stale_after_hours]
              properties:
                enabled: { type: boolean }
                stale_after_hours: { type: integer, minimum: 1, maximum: 720 }
      responses:
        '200':
          description: Režim je sačuvan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminExchangeRateStateResponse' }
        '403': { description: Nedostaje system.manage_settings dozvola }
        '422': { description: Podešavanje nije validno }
        '502': { description: Automatski režim je sačuvan, ali trenutni provider sync nije uspeo }
  /api/v1/admin/exchange-rate/refresh:
    post:
      tags: [Admin]
      summary: Odmah sinhronizuj EUR/RSD kurs
      description: Forced one-off refresh ne uključuje automatski režim ako je trenutno aktivan ručni režim.
      operationId: refreshAdminExchangeRate
      responses:
        '200':
          description: Kurs je uspešno osvežen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminExchangeRateStateResponse' }
        '403': { description: Nedostaje system.manage_settings dozvola }
        '502': { description: Provider sinhronizacija nije uspela }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  schemas:
    AdminExchangeRateConfiguration:
      type: object
      required: [rate, mode, provider, source, provider_date, updated_at, last_attempt_at, last_error, stale_after_hours, is_stale]
      properties:
        rate: { type: [number, 'null'] }
        mode: { type: string, enum: [manual, auto] }
        provider: { type: string }
        source: { type: string }
        provider_date: { type: [string, 'null'], format: date }
        updated_at: { type: [string, 'null'] }
        last_attempt_at: { type: [string, 'null'] }
        last_error: { type: [string, 'null'] }
        stale_after_hours: { type: integer, minimum: 1, maximum: 720 }
        is_stale: { type: boolean }
    AdminExchangeRateHistoryItem:
      type: object
      required: [id, old_rate, new_rate, mode, provider, source, provider_date, triggered_by, status, message, created_at, updated_by, updater]
      properties:
        id: { type: integer, minimum: 1 }
        old_rate: { type: [number, 'null'] }
        new_rate: { type: [number, 'null'] }
        mode: { type: string, enum: [manual, auto] }
        provider: { type: string }
        source: { type: string }
        provider_date: { type: [string, 'null'], format: date }
        triggered_by: { type: string }
        status: { type: string, enum: [success, failed] }
        message: { type: [string, 'null'] }
        created_at: { type: [string, 'null'] }
        updated_by: { type: [integer, 'null'] }
        updater:
          anyOf:
            - type: object
              required: [id, name]
              properties:
                id: { type: integer, minimum: 1 }
                name: { type: string }
            - type: 'null'
    AdminExchangeRateCapabilities:
      type: object
      required: [manage, manual, automatic, refresh]
      properties:
        manage: { type: boolean, const: true }
        manual: { type: boolean, const: true }
        automatic: { type: boolean, const: true }
        refresh: { type: boolean, const: true }
    AdminExchangeRateData:
      type: object
      required: [configuration, history, capabilities]
      properties:
        configuration: { $ref: '#/components/schemas/AdminExchangeRateConfiguration' }
        history:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/AdminExchangeRateHistoryItem' }
        capabilities: { $ref: '#/components/schemas/AdminExchangeRateCapabilities' }
    AdminExchangeRateStateResponse:
      type: object
      required: [data]
      properties:
        message: { type: string }
        data: { $ref: '#/components/schemas/AdminExchangeRateData' }
        sync:
          type: object
          properties:
            rate: { type: number }
            source: { type: string }
            provider_date: { type: string, format: date }
    AdminUserRole:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string }
        slug: { type: string }
    AdminUserGroup:
      type: object
      required: [id, name, slug, status]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string }
        slug: { type: string }
        status: { type: string }
    AdminUser:
      type: object
      required: [id, username, email, name, status, effective_access, last_active_superadmin_protected]
      properties:
        id: { type: integer, minimum: 1 }
        username: { type: string, minLength: 3, maxLength: 50 }
        email: { type: string, format: email, maxLength: 190 }
        first_name: { type: [string, 'null'], maxLength: 100 }
        last_name: { type: [string, 'null'], maxLength: 100 }
        name: { type: string }
        phone: { type: [string, 'null'], maxLength: 40 }
        status: { type: string, enum: [pending, active, blocked] }
        role: { anyOf: [{ $ref: '#/components/schemas/AdminUserRole' }, { type: 'null' }] }
        group: { anyOf: [{ $ref: '#/components/schemas/AdminUserGroup' }, { type: 'null' }] }
        effective_access: { type: string, enum: [full, group, restricted] }
        last_login_at: { type: [string, 'null'], format: date-time }
        password_changed_at: { type: [string, 'null'], format: date-time }
        approved_at: { type: [string, 'null'], format: date-time }
        last_active_superadmin_protected: { type: boolean }
    AdminUserStatusOption:
      type: object
      required: [value, label]
      properties:
        value: { type: string, enum: [pending, active, blocked] }
        label: { type: string }
    AdminUserOptionsData:
      type: object
      required: [roles, groups, statuses, per_page]
      properties:
        roles: { type: array, items: { $ref: '#/components/schemas/AdminUserRole' } }
        groups: { type: array, items: { $ref: '#/components/schemas/AdminUserGroup' } }
        statuses: { type: array, items: { $ref: '#/components/schemas/AdminUserStatusOption' } }
        per_page: { type: array, items: { type: integer, enum: [20, 50, 100] } }
    AdminUserCapabilities:
      type: object
      required: [create, update, password_management, delete]
      properties:
        create: { type: boolean }
        update: { type: boolean }
        password_management: { type: boolean }
        delete: { type: boolean, const: false }
    AdminUserInputBase:
      type: object
      required: [role_id, username, email, status]
      properties:
        role_id: { type: integer, minimum: 1 }
        user_group_id: { type: [integer, 'null'], minimum: 1 }
        username: { type: string, minLength: 3, maxLength: 50 }
        email: { type: string, format: email, maxLength: 190 }
        first_name: { type: [string, 'null'], maxLength: 100 }
        last_name: { type: [string, 'null'], maxLength: 100 }
        phone: { type: [string, 'null'], maxLength: 40 }
