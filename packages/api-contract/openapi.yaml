          application/json:
            schema: { $ref: '#/components/schemas/MobileDeviceInput' }
      responses:
        '201':
          description: Uređaj je kreiran
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MobileDevice' }
        '200':
          description: Postojeća instalacija je osvežena
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/devices/{device}:
    parameters:
      - in: path
        name: device
        required: true
        schema: { type: integer }
    patch:
      tags: [Devices]
      summary: Ažuriranje uređaja ili push tokena
      operationId: updateMobileDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MobileDeviceUpdateInput' }
      responses:
        '200':
          description: Uređaj je ažuriran
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MobileDevice' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Devices]
      summary: Opoziv mobilne instalacije i njenog Sanctum tokena
      operationId: revokeMobileDevice
      responses:
        '204': { description: Uređaj je opozvan }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/catalog/filters:
    get:
      tags: [Catalog]
      summary: Dostupni kataloški filteri i šifarnici
      operationId: getCatalogFilters
      responses:
        '200':
          description: Brendovi, tipovi, linije, kategorije, specifikacije i sortiranja
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/products:
    get:
      tags: [Catalog]
      summary: Straničena lista proizvoda
      operationId: listProducts
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: brand_id, schema: { type: integer } }
        - { in: query, name: product_type_id, schema: { type: integer } }
        - { in: query, name: product_line_id, schema: { type: integer } }
        - { in: query, name: category_id, schema: { type: integer } }
        - { in: query, name: stock, schema: { type: string, enum: [available, low, out] } }
        - { in: query, name: sort, schema: { type: string, enum: [newest, updated, name, price_asc, price_desc] } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 6, maximum: 60, default: 20 } }
      responses:
        '200': { description: Lista proizvoda }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/products/{slug}:
    get:
      tags: [Catalog]
      summary: Detalj vidljivog proizvoda
      operationId: getProduct
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200': { description: Proizvod }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/orders/options:
    get:
      tags: [Orders]
      summary: Opcije potrebne za kreiranje porudžbine
      operationId: getOrderOptions
      responses:
        '200':
          description: Načini plaćanja, uključujući Odloženo plaćanje sa server-driven requires_due_date, bankovni računi, primaoci i podrazumevana adresa
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/orders:
    get:
      tags: [Orders]
      summary: Sopstvene porudžbine
      operationId: listOrders
      responses:
        '200': { description: Straničena lista porudžbina }
    post:
      tags: [Orders]
      summary: Kreiranje porudžbine
      operationId: createOrder
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shipping_full_name, shipping_address, shipping_city, shipping_postal_code, shipping_phone, payment_method, items]
              properties:
                supplier_user_id: { type: [integer, 'null'] }
                shipping_full_name: { type: string, maxLength: 190 }
                shipping_address: { type: string, maxLength: 255 }
                shipping_city: { type: string, maxLength: 120 }
                shipping_postal_code: { type: string, maxLength: 20 }
                shipping_phone: { type: string, maxLength: 40 }
                customer_note: { type: [string, 'null'], maxLength: 5000 }
                payment_method: { type: string, enum: [cash_on_delivery, bank_transfer, deferred_payment] }
                bank_account_id: { type: [integer, 'null'], description: Obavezno samo za bank_transfer. }
                payment_due_at: { type: [string, 'null'], format: date, description: Obavezno za deferred_payment; mora biti današnji ili budući datum. }
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id: { type: integer }
                      quantity: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        '201': { description: Porudžbina je kreirana }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/orders/assigned:
    get:
      tags: [Orders]
      summary: Porudžbine dodeljene prijavljenom odgovornom licu
      operationId: listAssignedOrders
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200': { description: Straničena lista porudžbina dodeljenih trenutnom odgovornom licu }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/orders/assigned/{order}:
    get:
      tags: [Orders]
      summary: Detalj porudžbine dodeljene prijavljenom odgovornom licu
      operationId: getAssignedOrder
      parameters:
        - in: path
          name: order
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Dodeljena porudžbina }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/orders/{order}:
    get:
      tags: [Orders]
      summary: Detalj sopstvene porudžbine
      operationId: getOrder
      parameters:
        - in: path
          name: order
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Porudžbina }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/orders/{order}/cancel:
    post:
      tags: [Orders]
      summary: Otkazivanje sopstvene porudžbine
      operationId: cancelOrder
      parameters:
        - in: path
          name: order
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '200': { description: Porudžbina je otkazana }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/orders/{order}/post-create:
    get:
      tags: [Orders]
      summary: Customer post-create payment, document and delivery summary
      operationId: getOrderPostCreate
      parameters:
        - in: path
          name: order
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Customer-safe post-create order state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/OrderPostCreate' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/orders/{order}/payments/proof:
    post:
      tags: [Orders]
      summary: Submit bank-transfer payment proof
      operationId: submitOrderPaymentProof
      parameters:
        - in: path
          name: order
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [amount_rsd, paid_at, proof]
              properties:
                amount_rsd: { type: number, minimum: 0.01, maximum: 9999999999.99 }
                paid_at: { type: string, format: date-time }
                reference: { type: [string, 'null'], maxLength: 190 }
                note: { type: [string, 'null'], maxLength: 2000 }
                proof: { type: string, format: binary }
      responses:
        '201':
          description: Payment proof submitted for verification
          content:
            application/json:
              schema:
                type: object
                required: [message, data]
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/OrderPaymentLedgerEntry' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/orders/{order}/payments/{payment}/proof:
    get:
      tags: [Orders]
      summary: Bearer download of customer payment proof
      operationId: downloadOrderPaymentProof
      parameters:
        - { in: path, name: order, required: true, schema: { type: integer } }
        - { in: path, name: payment, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Private payment proof
          headers:
            Cache-Control:
              schema: { type: string, example: "private, no-store, max-age=0" }
            X-Content-Type-Options:
              schema: { type: string, example: nosniff }
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/orders/{order}/documents/confirmation.pdf:
    get:
      tags: [Orders]
      summary: Issue or return customer order-confirmation PDF
      operationId: downloadOrderConfirmationPdf
      parameters:
        - { in: path, name: order, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Private order-confirmation PDF
          headers:
            Cache-Control:
              schema: { type: string, example: "private, no-store, max-age=0" }
          content:
            application/pdf: { schema: { type: string, format: binary } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { description: PDF rendering unavailable }

  /api/v1/orders/{order}/documents/{document}.pdf:
    get:
      tags: [Orders]
      summary: Bearer download of an issued customer order document
      operationId: downloadOrderDocumentPdf
      parameters:
        - { in: path, name: order, required: true, schema: { type: integer } }
        - { in: path, name: document, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Private issued order PDF
          headers:
            Cache-Control:
              schema: { type: string, example: "private, no-store, max-age=0" }
          content:
            application/pdf: { schema: { type: string, format: binary } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { description: PDF rendering unavailable }

  /api/v1/orders/{order}/delivery-proof:
    get:
      tags: [Orders]
      summary: Bearer download of customer delivery proof
      operationId: downloadOrderDeliveryProof
      parameters:
        - { in: path, name: order, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Private delivery proof
          headers:
            Cache-Control:
              schema: { type: string, example: "private, no-store, max-age=0" }
            X-Content-Type-Options:
              schema: { type: string, example: nosniff }
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/after-sales:
    get:
      tags: [AfterSales]
      summary: Lista vidljivih postprodajnih slučajeva
      operationId: listAfterSalesCases
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200':
          description: Straničena lista slučajeva
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AfterSalesCaseSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/after-sales/{case}:
    get:
      tags: [AfterSales]
      summary: Detalj vidljivog postprodajnog slučaja
      operationId: getAfterSalesCase
      parameters:
        - in: path
          name: case
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Detalj slučaja sa stavkama, radnjama, javnim porukama i prilozima
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AfterSalesCase' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/orders/{order}/after-sales/options:
    get:
      tags: [AfterSales]
      summary: Opcije za otvaranje postprodajnog slučaja za porudžbinu
      operationId: getAfterSalesOptions
      parameters:
        - in: path
          name: order
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Porudžbina, stavke, šifarnici i upload limiti
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AfterSalesOptions' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/orders/{order}/after-sales:
    post:
      tags: [AfterSales]
      summary: Otvaranje postprodajnog slučaja
      operationId: createAfterSalesCase
      parameters:
        - in: path
          name: order
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [case_type, priority, subject, description, items]
              properties:
                case_type: { type: string, enum: [complaint, return, service] }
                priority: { type: string, enum: [low, normal, high, urgent] }
                subject: { type: string, maxLength: 190 }
                description: { type: string, minLength: 20, maxLength: 10000 }
                requested_resolution: { type: [string, 'null'], enum: [repair, replacement, partial_refund, full_refund, return, inspection, other, null] }
                items:
                  type: object
                  minProperties: 1
                  description: Ključevi objekta su ID-jevi stavki porudžbine.
                  additionalProperties:
                    type: object
                    required: [selected, quantity]
                    properties:
                      selected: { type: boolean }
                      quantity: { type: integer, minimum: 1, maximum: 999 }
                      issue_description: { type: [string, 'null'], maxLength: 2000 }
                attachments:
                  type: array
                  maxItems: 6
                  items: { type: string, format: binary }
      responses:
        '201':
          description: Postprodajni slučaj je kreiran
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AfterSalesCase' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/after-sales/{case}/messages:
    post:
      tags: [AfterSales]
      summary: Slanje javne poruke u postprodajnom slučaju
      operationId: createAfterSalesMessage
      parameters:
        - in: path
          name: case
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 10000 }
                attachments:
                  type: array
                  maxItems: 6
                  items: { type: string, format: binary }
      responses:
        '201':
          description: Poruka je poslata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AfterSalesMessage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/after-sales/attachments/{attachment}:
    get:
