condition = "AND"
regexTarget = "line"
paths = ['''^(?:.*/b1099-tracked-tree/)?tools/storefront/b1157/B1157InstallCoordinator\.php$''']
regexes = ['''TOKENS_CSS_SHA256\s*=''']

