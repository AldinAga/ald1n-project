name: Report795 documentation checkpoint
on:
  push:
    branches: [docs/report795-owner-requirements-20261022]
    paths: ['.github/workflows/report795-docs-checkpoint.yml']
permissions:
  contents: write
concurrency:
  group: report795-docs-checkpoint
  cancel-in-progress: false
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply and verify documentation only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = AldinAga/ald1n-project
          test "$GITHUB_REF_NAME" = docs/report795-owner-requirements-20261022
          test "$(git hash-object AGENTS.md)" = 3325a1148de1aba7114eee0637b50efda0f57bda
          python3 <<'PYCODE'
          from pathlib import Path
          import hashlib,re
          def blob(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          path=Path('AGENTS.md')
          text=path.read_text()
          old=re.findall(r'^- \*\*Warranty expiry opt-in[^\n]*\n',text,re.M)
          assert len(old)==1
          replacement='- **Warranty expiry opt-in:** `warranty_expiry_alerts` defaults OFF and is independent of ordinary `warranty_updates`. Preserve strict immutable order-item/order ownership. The owner clarified the future expiry recipient policy on 2026-10-22: originating selling user plus active, individually opted-in SuperAdministrator, with no unrelated recipient or broadcast; see section 30. This narrowly scoped administrator exception is a pending implementation, not evidence that deployed owner-only code already supports it. Historical preference RED/GREEN: [39643629087](https://github.com/AldinAga/ald1n-project/actions/runs/39643629087), [39643826340](https://github.com/AldinAga/ald1n-project/actions/runs/39643826340). Do not activate global/bulk expiry delivery as part of preference wiring.\n'
          result=text.replace(old[0],replacement)+Path('docs/operations/OWNER-REQUIREMENTS-20261022.md').read_text()
          path.write_text(result)
          expected={'AGENTS.md': 'b9e249bd0af339569176792c97997c356bfdb58d', 'docs/operations/000-LATEST.md': '304617d8ca5db85f64bdbc87b7a206a15a318f7e', 'docs/operations/796-REPORT795-ACCEPTANCE-PROGRESS-AND-OWNER-REQUIREMENTS-20261022.md': '71e83a1968cf58f249bedd81fb3415d75e954251', 'docs/operations/OWNER-REQUIREMENTS-20261022.md': '151346bce699bc4b337047566685ad14e9b2d6ab'}
          for name,value in expected.items():
              assert blob(Path(name).read_bytes())==value, name
          report=Path('docs/operations/796-REPORT795-ACCEPTANCE-PROGRESS-AND-OWNER-REQUIREMENTS-20261022.md').read_text()
          assert len(re.findall(r'^\| M[0-9]{2} \|',report,re.M))==17
          assert len(re.findall(r'^\| M[0-9]{2} \|[^\n]*\| 1 \|',report,re.M))==7
          assert round(7/17*100,1)==41.2 and round(7/15*100,1)==46.7
          assert 'NEW_RUNTIME_IMPLEMENTATION=NOT_PERFORMED_IN_THIS_CHECKPOINT' in report
          print('DOCS_HASH_SCOPE_METRICS=PASS PRODUCTION=UNTOUCHED')
          PYCODE
          git rm .github/workflows/report795-docs-checkpoint.yml
          git add -- AGENTS.md
          git diff --cached --check
          git diff --check 7a14319300cfed42578664883f08b251ce69798d
          git diff --name-only 7a14319300cfed42578664883f08b251ce69798d | sort > "$RUNNER_TEMP/actual-docs"
          printf '%s\n' AGENTS.md docs/operations/000-LATEST.md docs/operations/796-REPORT795-ACCEPTANCE-PROGRESS-AND-OWNER-REQUIREMENTS-20261022.md docs/operations/OWNER-REQUIREMENTS-20261022.md | sort > "$RUNNER_TEMP/expected-docs"
          cmp "$RUNNER_TEMP/actual-docs" "$RUNNER_TEMP/expected-docs"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: apply bounded owner policy update and remove temporary checkpoint workflow'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "CHECKPOINT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
