name: User retirement draft safe QA
on:
  push:
    branches:
      - feature/user-retirement-batch2-20261016
permissions:
  contents: read
jobs:
  retirement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Android types, validation, full regression
        run: |
          set -euo pipefail
          cd apps/mobile/current
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run validate
          npm run test:release25
      - name: Laravel PHP syntax only - no production data
        run: |
          set -euo pipefail
          php -l apps/cms/current/app/Services/UserRetirementService.php
          php -l apps/cms/current/app/Http/Controllers/Admin/UserController.php
          php -l apps/cms/current/app/Http/Controllers/Api/V1/Admin/UserController.php
          php -l apps/cms/current/tests/Feature/UserRetirementSafetyContractTest.php
