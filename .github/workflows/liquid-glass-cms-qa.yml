name: Liquid Glass CMS isolated PHPUnit and static QA

on:
  push:
    branches:
      - design/liquid-glass-cms-20261018
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/liquid-glass-cms-qa.yml'
      - 'apps/cms/current/public/assets/css/ald1n-liquid-glass.css'
      - 'apps/cms/current/public/assets/js/ux-runtime.js'
      - 'apps/cms/current/resources/views/**'
      - 'apps/cms/current/tests/**'

permissions:
  contents: read

jobs:
  liquid-glass-cms:
    name: Disposable Laravel 13 / PHP 8.4 / MariaDB 10.11.19
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_ROOT_PASSWORD: liquid-glass-ci-only
          MARIADB_DATABASE: ald1n_liquid_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -pliquid-glass-ci-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ald1n_liquid_ci
      DB_USERNAME: root
      DB_PASSWORD: liquid-glass-ci-only
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      TURNSTILE_ENABLED: 'false'
      PULSE_ENABLED: 'false'
      TELESCOPE_ENABLED: 'false'
    steps:
      - name: Checkout isolated PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, intl, gd, zip, bcmath
          coverage: none
          tools: composer:v2
      - name: Install isolated CMS dependencies
        working-directory: apps/cms/current
        shell: bash
        run: |
          set -euo pipefail
          test "$DB_CONNECTION" = mysql
          test "$DB_DATABASE" = ald1n_liquid_ci
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate --force
      - name: Verify untouched generated theme assets
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git merge-base HEAD origin/main)"
          git diff --quiet "$BASE_SHA" HEAD -- apps/cms/current/public/assets/css/ald1n-ui-v2.css packages/design-tokens/ald1n-operator.json
          test -f apps/cms/current/public/assets/css/ald1n-liquid-glass.css
          echo 'GENERATED_THEME_UNCHANGED=PASS'
      - name: Execute real PHPUnit and canonical static gate
        working-directory: apps/cms/current
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = testing
          test "$DB_CONNECTION" = mysql
          test "$DB_DATABASE" = ald1n_liquid_ci
          php -l tests/Unit/LiquidGlassFoundationContractTest.php
          php -l tests/Feature/DashboardLegacyDesignTest.php
          php -l tests/Feature/ArchivedOrdersLiquidGlassTest.php
          php -l tests/Feature/ProductEditorLiquidGlassTest.php
          php artisan test tests/Unit/LiquidGlassFoundationContractTest.php --no-ansi
          php artisan test -c phpunit.mysql.xml tests/Feature/DashboardLegacyDesignTest.php --no-ansi
          php artisan test -c phpunit.mysql.xml tests/Feature/ArchivedOrdersLiquidGlassTest.php --no-ansi
          php artisan test -c phpunit.mysql.xml tests/Feature/ProductEditorLiquidGlassTest.php --no-ansi
          node --check public/assets/js/ux-runtime.js
          php bin/static-check.php
          echo 'LIQUID_GLASS_CMS_QA=PASS'
      - name: Confirm no production access required
        if: always()
        shell: bash
        run: |
          echo 'PRODUCTION_SOURCE_MUTATION=NO'
          echo 'PRODUCTION_DB_MUTATION=NO'
          echo 'OTA=NO'
          echo 'NATIVE_BUILD=NO'
          echo 'GOOGLE_PLAY=NO'
