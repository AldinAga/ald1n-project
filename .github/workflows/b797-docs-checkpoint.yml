          paths=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert paths=={'AGENTS.md','docs/operations/000-LATEST.md','.github/workflows/b797-docs-checkpoint.yml'}
          PY
      - name: Commit checkpoint and advance only isolated docs branch
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/docs/b797-pdf-source-checkpoint-20261023 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
