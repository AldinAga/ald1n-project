name: Ald1n Batch528 - isolated native compile and R8
on:
  push:
    branches:
      - audit/batch528-native-release-gate
permissions:
  contents: read
concurrency:
  group: ald1n-batch528-native
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_APP_ENV: production
      EXPO_PUBLIC_API_URL: https://cms.ald1n.com/api/v1
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Node 22 - fixed audit version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Record Android SDK and install observed Build24 components
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"
          manager="$(find "$sdk/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -x "$manager"
          "$manager" --version
          "$manager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
          test -x "$sdk/cmake/3.22.1/bin/ninja"
          "$manager" --list_installed
      - name: Actual compiler RED-GREEN, full release, R8 and lint
        shell: bash
        run: bash apps/mobile/current/scripts/batch528-ci.sh
      - name: Preserve audit evidence - never Play upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: batch528-native-evidence-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/ald1n-native-528/
            apps/mobile/current/android/app/build/outputs/bundle/release/*.aab
            apps/mobile/current/android/app/build/outputs/apk/release/*.apk
            apps/mobile/current/android/app/build/outputs/mapping/release/
            apps/mobile/current/android/app/build/reports/lint-results-release*
            apps/mobile/current/android/build/reports/problems/
