name: B1108 read-only hosting inventory contract (NO HOST ACCESS)
on:
  pull_request:
    paths: ['.github/workflows/b1108-host-inventory-contract.yml']
permissions:
  contents: read
jobs:
  isolated-script-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with: {php-version: '8.4', coverage: none}
      - name: Decode immutable reviewed operator artifact and syntax-check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b1108-evidence" "$RUNNER_TEMP/b1108-upload/incoming"
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/b1108-upload/incoming/b1108-storefront-host-inventory.sh"
          echo '0011225f5426c3874f54892db286c761a6887246e0604b51742ee4a12a74c028  '$RUNNER_TEMP'/b1108-upload/incoming/b1108-storefront-host-inventory.sh' | sha256sum --check
          bash -n "$RUNNER_TEMP/b1108-upload/incoming/b1108-storefront-host-inventory.sh"
      - name: Exercise valid read-only inventory and fail-closed boundaries on synthetic fixture
        shell: bash
        run: |
          set -euo pipefail
          root=/home/icaffeco/ald1n-project
          test ! -e "$root"
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$root"
          mkdir -p "$root/incoming" "$root/docs/operations" "$RUNNER_TEMP/b1108-bin"
          cp "$RUNNER_TEMP/b1108-upload/incoming/b1108-storefront-host-inventory.sh" "$root/incoming/"
          for p in apps/cms/current/composer.lock apps/mobile/current/package-lock.json apps/cms/current/public/assets/css/ald1n-ui-refinement.css apps/cms/current/resources/views/layouts/app.blade.php; do
            mkdir -p "$root/$(dirname "$p")"
            git show "ed21d450a2698f179624a9320028cff3a478d805:$p" > "$root/$p"
          done
          (cd "$root" && sha256sum --check <<'SHA256'
          4965e0f59599f68d677cd4604ded256b809ce82a52b36e355faeb6fcaffb1ff8  apps/cms/current/composer.lock
          de1584266558fe72e30cc7fa3332fa0c16758b526b561d5c58c4b7c1dadbb1d3  apps/mobile/current/package-lock.json
          f77a4ccad3efccb1f4bc1288bf8783b875648db8acb5a30592c92901aea114c9  apps/cms/current/public/assets/css/ald1n-ui-refinement.css
          26bf2f54ec706d5c8d9e9b52ccf2ff4ca439c62eead6606525232a3bf22e488d  apps/cms/current/resources/views/layouts/app.blade.php
          SHA256
          )
          cp "$root/apps/cms/current/resources/views/layouts/app.blade.php" "$RUNNER_TEMP/b1108-approved-layout.blade.php"
          mkdir -p "$root/apps/cms/current/vendor/composer"
          php -r '$x=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);file_put_contents($argv[2],json_encode(["packages"=>$x["packages"]],JSON_THROW_ON_ERROR));' "$root/apps/cms/current/composer.lock" "$root/apps/cms/current/vendor/composer/installed.json"
          printf '%s\n' SYNTHETIC_PRIVATE_SENTINEL_NOT_FOR_REPORT > "$root/apps/cms/current/.env"
          printf '%s\n' retained > "$root/docs/operations/1016-CI-SENTINEL.md"
          cat > "$RUNNER_TEMP/b1108-bin/git" <<'STUB'
          #!/usr/bin/env bash
          test "$1" = -C || exit 90
          test "$2" = /home/icaffeco/ald1n-project || exit 91
          shift 2
          case "$*" in
            'remote get-url origin') printf '%s\n' "${B1108_TEST_ORIGIN:-https://github.com/AldinAga/ald1n-project.git}";;
            'fetch --quiet origin main') exit 0;;
            'ls-tree -r --name-only origin/main docs/operations') printf '%s\n' docs/operations/1016-CI-SENTINEL.md;;
            'rev-parse HEAD'|'rev-parse origin/main') printf '%s\n' ed21d450a2698f179624a9320028cff3a478d805;;
            'symbolic-ref --quiet --short HEAD') printf '%s\n' main;;
            *) exit 92;;
          esac
          STUB
          chmod +x "$RUNNER_TEMP/b1108-bin/git"
          export PATH="$RUNNER_TEMP/b1108-bin:$PATH"
          evidence="$RUNNER_TEMP/b1108-evidence"
          run_expected() {
            expected="$1"; label="$2"; shift 2
            rc=0
            "$@" > "$evidence/$label.log" 2>&1 || rc=$?
            cat "$evidence/$label.log"
            test "$rc" = "$expected"
            printf '%s\n' "$rc" > "$evidence/$label.exit"
          }
          run_expected 2 noncanonical bash "$RUNNER_TEMP/b1108-upload/incoming/b1108-storefront-host-inventory.sh"
          printf '%s\n' '# tampered' >> "$root/incoming/b1108-storefront-host-inventory.sh"
          run_expected 2 integrity bash "$root/incoming/b1108-storefront-host-inventory.sh"
          test "$(find "$root/docs/operations" -type f | wc -l)" -eq 1
          cp "$RUNNER_TEMP/b1108-upload/incoming/b1108-storefront-host-inventory.sh" "$root/incoming/"
          run_expected 2 wrong_origin env B1108_TEST_ORIGIN=https://invalid.example/repo bash "$root/incoming/b1108-storefront-host-inventory.sh"
          test "$(find "$root/docs/operations" -type f | wc -l)" -eq 1
          find "$root/apps" -type f -print0 | sort -z | xargs -0 sha256sum > "$evidence/before.sha256"
          run_expected 0 valid bash "$root/incoming/b1108-storefront-host-inventory.sh"
          find "$root/apps" -type f -print0 | sort -z | xargs -0 sha256sum > "$evidence/after.sha256"
          diff -u "$evidence/before.sha256" "$evidence/after.sha256"
          grep -F 'SOURCE_VENDOR_INVENTORY=MATCH' "$evidence/valid.log"
          test "$(find "$root/docs/operations" -name '1017-B1108-*' -type f | wc -l)" -eq 1
          printf '\n<!-- synthetic unapproved layout drift -->\n' >> "$root/apps/cms/current/resources/views/layouts/app.blade.php"
          run_expected 2 layout_drift bash "$root/incoming/b1108-storefront-host-inventory.sh"
          test "$(find "$root/docs/operations" -name '1018-B1108-*' -type f | wc -l)" -eq 1
          grep -F '"matches_reviewed_main":false' "$evidence/layout_drift.log"
          cp "$RUNNER_TEMP/b1108-approved-layout.blade.php" "$root/apps/cms/current/resources/views/layouts/app.blade.php"
          echo '26bf2f54ec706d5c8d9e9b52ccf2ff4ca439c62eead6606525232a3bf22e488d  '$root'/apps/cms/current/resources/views/layouts/app.blade.php' | sha256sum --check
          printf '\n' >> "$root/apps/mobile/current/package-lock.json"
          run_expected 2 source_drift bash "$root/incoming/b1108-storefront-host-inventory.sh"
          test "$(find "$root/docs/operations" -name '1019-B1108-*' -type f | wc -l)" -eq 1
          mv "$root/apps/cms/current/vendor/composer/installed.json" "$RUNNER_TEMP/installed-fixture.json"
          run_expected 2 missing_vendor bash "$root/incoming/b1108-storefront-host-inventory.sh"
          test "$(find "$root/docs/operations" -name '1020-B1108-*' -type f | wc -l)" -eq 1
          if grep -R -F SYNTHETIC_PRIVATE_SENTINEL_NOT_FOR_REPORT "$root/docs/operations" "$evidence"; then exit 93; fi
          test "$(cat "$root/docs/operations/1016-CI-SENTINEL.md")" = retained
          cp "$root/docs/operations/"*B1108-* "$evidence/"
          echo 'B1108_SYNTHETIC_CONTRACT=PASS NO_HOST_ACCESS_NO_APP_RUNTIME_NO_DB NO_SECRET_READ' | tee "$evidence/result.txt"
      - name: Preserve tested root-relative delivery and isolated evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b1108-host-inventory-contract
          path: |
            ${{ runner.temp }}/b1108-evidence
            ${{ runner.temp }}/b1108-upload
          retention-days: 7
          if-no-files-found: error
