name: B1109 bounded host readiness contract (NO HOST ACCESS)
on:
  pull_request:
    paths: ['.github/workflows/b1109-readiness-contract.yml']
permissions:
  contents: read
jobs:
  isolated-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with: {php-version: '8.4', coverage: none}
      - name: Verify immutable operator bytes and Bash/PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b1109-upload/incoming"
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/b1109-upload/incoming/b1109-host-readiness.sh"
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/b1109-upload/incoming/b1109-host-readiness.php"
          echo 'e161095f5ab454df08a25f9152f86df9cfcbe012341f8a2ba46eab2755b4cf11  '$RUNNER_TEMP'/b1109-upload/incoming/b1109-host-readiness.sh' | sha256sum --check
          echo 'a7a49b97dba3754c7034768924e8f832bb469eda74c2b17f0f534d8a61ec5376  '$RUNNER_TEMP'/b1109-upload/incoming/b1109-host-readiness.php' | sha256sum --check
          bash -n "$RUNNER_TEMP/b1109-upload/incoming/b1109-host-readiness.sh"
          php -l "$RUNNER_TEMP/b1109-upload/incoming/b1109-host-readiness.php"
      - name: Real isolated full-script negative and positive contracts
        shell: bash
        env:
          B1065_FIXTURE_B64: 'IyBCMTA2NSBNMTMgaW5zdGFsbGVkLXNvdXJjZSBpc29sYXRlZCBmdW5jdGlvbmFsIFFBCgotIFN0YXR1czogUlVOTklORwo='
        run: |
          set -euo pipefail
          root=/home/icaffeco/ald1n-project
          cms="$root/apps/cms/current"
          docs="$root/docs/operations"
          evidence="$RUNNER_TEMP/b1109-evidence"
          upload="$RUNNER_TEMP/b1109-upload/incoming"
          test ! -e "$root"
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$root"
          mkdir -p "$root/incoming" "$docs" "$evidence" "$RUNNER_TEMP/b1109-bin"
          cp "$upload/"* "$root/incoming/"
          cp docs/operations/1070-B1108-STOREFRONT-HOST-INVENTORY-20261104-124414.md "$docs/"
          printf '%s\n' retained > "$docs/1071-CI-SENTINEL.md"
          printf '%s' "$B1065_FIXTURE_B64" | base64 --decode > "$docs/1065-B1065-M13-CONSOLIDATED-FUNCTIONAL-QA-20261103-121829-1719919.md"
          for dir in app config routes database/migrations resources/views tests bootstrap; do
            mkdir -p "$cms/$dir"
            printf '%s\n' '<?php return true;' > "$cms/$dir/fixture.php"
          done
          printf '%s\n' '<?php return false;' > "$cms/app/extra.php"
          mkdir -p "$cms/public" "$cms/vendor" "$cms/bootstrap/cache"
          printf '%s\n' PRIVATE_ENV_SENTINEL_NEVER_EXPORT > "$cms/.env"
          printf '%s\n' '# synthetic public boundary' > "$cms/public/.htaccess"
          chmod 600 "$cms/.env"
          git -C "$root" init -b main
          git -C "$root" add apps/cms/current/app apps/cms/current/config apps/cms/current/routes apps/cms/current/database/migrations apps/cms/current/resources/views apps/cms/current/tests apps/cms/current/bootstrap/fixture.php
          git -C "$root" -c user.name=Fixture -c user.email=fixture@example.test -c commit.gpgsign=false commit -m fixture
          export B1109_REAL_GIT="$(command -v git)"
          export B1109_REAL_PHP="$(command -v php)"
          export B1109_REAL_MV="$(command -v mv)"
          export B1109_REAL_TEE="$(command -v tee)"
          "$B1109_REAL_PHP" -r '$b=$argv[1]."/private-backups-ci\x27quoted";mkdir($b);$c=["backup"=>["path"=>$b],"public_storefront"=>["enabled"=>false,"catalog_readonly_enabled"=>false,"checkout_enabled"=>false],"database"=>["password"=>"PRIVATE_CACHE_SENTINEL_NEVER_EXPORT"],"misc"=>[null,true,false,-3,0.25,"quote\x27 slash\\ newline\n",[2=>"two"]]];file_put_contents($argv[1]."/apps/cms/current/bootstrap/cache/config.php","<?php return ".var_export($c,true).";\n");' "$root"
          cp "$cms/bootstrap/cache/config.php" "$RUNNER_TEMP/b1109-safe-cache.php"
          cat > "$RUNNER_TEMP/b1109-bin/id" <<'STUB'
          #!/usr/bin/env bash
          if [ "$*" = -un ]; then printf '%s\n' "${B1109_TEST_USER:-icaffeco}"; else /usr/bin/id "$@"; fi
          STUB
          cat > "$RUNNER_TEMP/b1109-bin/git" <<'STUB'
          #!/usr/bin/env bash
          test "$1" = -C || exit 90
          test "$2" = /home/icaffeco/ald1n-project || exit 91
          shift 2
          case "$*" in
            'remote get-url origin') printf '%s\n' https://github.com/AldinAga/ald1n-project.git;;
            'fetch --quiet origin main') exit 0;;
            'ls-tree -r --name-only origin/main docs/operations') printf '%s\n' docs/operations/1071-CI-SENTINEL.md;;
            'rev-parse origin/main') printf '%s\n' 82e483c6e08ad4101cad710d8d9a1af2a66ebc02;;
            *) exec "$B1109_REAL_GIT" -C /home/icaffeco/ald1n-project "$@";;
          esac
          STUB
          cat > "$RUNNER_TEMP/b1109-bin/php" <<'STUB'
          #!/usr/bin/env bash
          case "${B1109_TEST_PHP_CASE:-normal}" in
            missing_extension) exec "$B1109_REAL_PHP" -n -d disable_functions=token_get_all "$@";;
            stderr_only) printf '%s\n' PRIVATE_PHP_SENTINEL_NEVER_EXPORT >&2; exit 0;;
            stdout_noise) printf '%s\n' PRIVATE_PHP_SENTINEL_NEVER_EXPORT; exec "$B1109_REAL_PHP" "$@";;
            terminate) kill -TERM "$PPID"; exit 2;;
            kill) kill -KILL "$PPID"; exit 2;;
            *) exec "$B1109_REAL_PHP" "$@";;
          esac
          STUB
          cat > "$RUNNER_TEMP/b1109-bin/composer" <<'STUB'
          #!/usr/bin/env bash
          test "$*" = '--no-plugins --no-scripts --version' || exit 90
          printf '%s\n' 'Composer version 2.11.1 fixture'
          STUB
          cat > "$RUNNER_TEMP/b1109-bin/mv" <<'STUB'
          #!/usr/bin/env bash
          if [ "${B1109_TEST_MOVE_FAIL:-0}" = 1 ]; then exit 77; fi
          exec "$B1109_REAL_MV" "$@"
          STUB
          cat > "$RUNNER_TEMP/b1109-bin/tee" <<'STUB'
          #!/usr/bin/env bash
          if [ "${B1109_TEST_TEE_FAIL:-0}" = 1 ]; then cat > /dev/null; exit 74; fi
          exec "$B1109_REAL_TEE" "$@"
          STUB
          chmod +x "$RUNNER_TEMP/b1109-bin/"*
          export PATH="$RUNNER_TEMP/b1109-bin:$PATH"
          script="$root/incoming/b1109-host-readiness.sh"
          run_expected() {
            expected="$1"; label="$2"; shift 2
            rc=0
            "$@" > "$evidence/$label.log" 2>&1 || rc=$?
            tail -n 7 "$evidence/$label.log"
            test "$rc" = "$expected"
            printf '%s\n' "$rc" > "$evidence/$label.exit"
          }
          run_expected 2 wrong_path bash "$upload/b1109-host-readiness.sh"
          run_expected 2 hostile_owner env B1109_TEST_USER=root bash "$script"
          cp "$root/incoming/b1109-host-readiness.php" "$RUNNER_TEMP/b1109-helper-original.php"
          printf '%s\n' '# tampered' >> "$root/incoming/b1109-host-readiness.php"
          run_expected 2 helper_tamper bash "$script"
          cp "$RUNNER_TEMP/b1109-helper-original.php" "$root/incoming/b1109-host-readiness.php"
          printf '%s\n' '# tampered' >> "$script"
          run_expected 2 script_tamper bash "$script"
          cp "$upload/b1109-host-readiness.sh" "$script"
          mv "$docs/1070-B1108-STOREFRONT-HOST-INVENTORY-20261104-124414.md" "$RUNNER_TEMP/b1109-previous.md"
          run_expected 2 missing_previous bash "$script"
          mv "$RUNNER_TEMP/b1109-previous.md" "$docs/1070-B1108-STOREFRONT-HOST-INVENTORY-20261104-124414.md"
          test "$(find "$docs" -name '*-B1109-*' -type f | wc -l)" -eq 0
          before=$(sha256sum "$cms/.env" "$root/.git/HEAD" "$root/.git/index" "$cms/public/.htaccess")
          run_expected 2 complete_inventory bash "$script"
          grep -Fx SOURCE_CENSUS_STABLE=PASS "$evidence/complete_inventory.log"
          grep -Fx B1109_METADATA_COMPLETE=YES "$evidence/complete_inventory.log"
          grep -F 'UNCHANGED_INCOMPLETE_SNAPSHOT' "$evidence/complete_inventory.log"
          grep -F '"configured_path_confirmed":true,"existing_directory_outside_current_cms_public":true' "$evidence/complete_inventory.log"
          grep -Fx PROTECTED_FOUR_UNCHANGED=PASS "$evidence/complete_inventory.log"
          test "$(find "$docs" -name '1072-B1109-*.md' -type f | wc -l)" -eq 1
          after=$(sha256sum "$cms/.env" "$root/.git/HEAD" "$root/.git/index" "$cms/public/.htaccess")
          test "$before" = "$after"
          mkdir -p "$RUNNER_TEMP/b1109-other-public"
          chmod 0777 "$RUNNER_TEMP/b1109-other-public"
          "$B1109_REAL_PHP" -r '$c=["backup"=>["path"=>$argv[1]],"public_storefront"=>["enabled"=>false,"catalog_readonly_enabled"=>false,"checkout_enabled"=>false]];file_put_contents($argv[2],"<?php return ".var_export($c,true).";\n");' "$RUNNER_TEMP/b1109-other-public" "$cms/bootstrap/cache/config.php"
          run_expected 2 other_public_unattested bash "$script"
          grep -F '"existing_directory_outside_current_cms_public":true' "$evidence/other_public_unattested.log"
          grep -F '"privacy_permissions":"NOT_ATTESTED"' "$evidence/other_public_unattested.log"
          grep -Fx B1109_METADATA_COMPLETE=YES "$evidence/other_public_unattested.log"
          grep -Fx FINAL_STATUS=HOLD_READINESS_GATES "$evidence/other_public_unattested.log"
          grep -Fx RESTORE_OR_RELEASE_APPROVAL=NOT_EVALUATED "$evidence/other_public_unattested.log"
          cp "$RUNNER_TEMP/b1109-safe-cache.php" "$cms/bootstrap/cache/config.php"
          printf '%s\n' '<?php return 42;' > "$cms/app/untracked.php"
          run_expected 2 untracked_included bash "$script"
          grep -F '"path":"app/untracked.php"' "$evidence/untracked_included.log" | grep -F '"indexed":false'
          mv "$cms/app/extra.php" "$RUNNER_TEMP/b1109-extra.php"
          run_expected 2 tracked_subset_missing bash "$script"
          grep -Fx SOURCE_CENSUS_STABLE=HOLD_INCOMPLETE_SOURCE "$evidence/tracked_subset_missing.log"
          grep -F 'app/extra.php' "$evidence/tracked_subset_missing.log" | grep -F missing_indexed
          if grep -Fxq SOURCE_CENSUS_STABLE=PASS "$evidence/tracked_subset_missing.log"; then exit 81; fi
          mv "$RUNNER_TEMP/b1109-extra.php" "$cms/app/extra.php"
          mv "$cms/app" "$RUNNER_TEMP/b1109-app"
          mkdir "$cms/app"
          run_expected 2 zero_source_directory bash "$script"
          grep -Fx SOURCE_CENSUS_STABLE=HOLD_INCOMPLETE_SOURCE "$evidence/zero_source_directory.log"
          grep -F '"missing_dirs":["app"]' "$evidence/zero_source_directory.log"
          if grep -Fxq SOURCE_CENSUS_STABLE=PASS "$evidence/zero_source_directory.log"; then exit 82; fi
          rmdir "$cms/app"
          mv "$RUNNER_TEMP/b1109-app" "$cms/app"
          slot=0
          for dir in app config routes database/migrations resources/views tests bootstrap; do
            test ! -e "$RUNNER_TEMP/b1109-empty-$slot"
            mv "$cms/$dir" "$RUNNER_TEMP/b1109-empty-$slot"
            mkdir "$cms/$dir"
            slot=$((slot+1))
          done
          run_expected 2 entirely_empty_census bash "$script"
          grep -F '"reason_code":"EMPTY_OR_DUPLICATE_CENSUS"' "$evidence/entirely_empty_census.log"
          slot=0
          for dir in app config routes database/migrations resources/views tests bootstrap; do
            rmdir "$cms/$dir"
            mv "$RUNNER_TEMP/b1109-empty-$slot" "$cms/$dir"
            slot=$((slot+1))
          done
          mv "$cms" "$RUNNER_TEMP/b1109-cms"
          ln -s "$RUNNER_TEMP/b1109-cms" "$cms"
          run_expected 2 ancestor_symlink bash "$script"
          unlink "$cms"
          mv "$RUNNER_TEMP/b1109-cms" "$cms"
          printf '%s\n' '<?php echo "PRIVATE_CACHE_SENTINEL_NEVER_EXPORT"; return [];' > "$cms/bootstrap/cache/config.php"
          run_expected 2 nonliteral_cache bash "$script"
          grep -F CONFIG_CACHE_RETURN "$evidence/nonliteral_cache.log"
          test ! -e "$root/SHOULD_NOT_EXIST"
          printf '%s\n' "<?php return array('backup'=>array('path'=>('file_put_contents')('$root/SHOULD_NOT_EXIST','bad')));" > "$cms/bootstrap/cache/config.php"
          run_expected 2 quoted_function_cache bash "$script"
          grep -F NON_LITERAL_CONFIG_DATA "$evidence/quoted_function_cache.log"
          test ! -e "$root/SHOULD_NOT_EXIST"
          cp "$RUNNER_TEMP/b1109-safe-cache.php" "$cms/bootstrap/cache/config.php"
          run_expected 2 missing_extension env B1109_TEST_PHP_CASE=missing_extension bash "$script"
          grep -F '"reason_code":"ENTRY"' "$evidence/missing_extension.log"
          run_expected 2 stderr_no_marker env B1109_TEST_PHP_CASE=stderr_only bash "$script"
          grep -Fx FINAL_STATUS=HOLD_SOURCE_OR_HELPER_INCOMPLETE "$evidence/stderr_no_marker.log"
          run_expected 2 stdout_noise env B1109_TEST_PHP_CASE=stdout_noise bash "$script"
          grep -Fx HOLD_PHP_STDOUT_NOISE=YES "$evidence/stdout_noise.log"
          grep -F OUTPUT_FILTER_RC=2 "$evidence/stdout_noise.log"
          run_expected 2 report_move_failure env B1109_TEST_MOVE_FAIL=1 bash "$script"
          grep -F 'not committed atomically' "$evidence/report_move_failure.log"
          if grep -q '^REPORT=' "$evidence/report_move_failure.log"; then exit 83; fi
          run_expected 2 report_write_failure env B1109_TEST_TEE_FAIL=1 bash "$script"
          grep -F 'report write failed' "$evidence/report_write_failure.log"
          if grep -q '^REPORT=' "$evidence/report_write_failure.log"; then exit 84; fi
          run_expected 143 interrupted env B1109_TEST_PHP_CASE=terminate bash "$script"
          grep -Fx FINAL_STATUS=HOLD_INTERRUPTED "$evidence/interrupted.log"
          run_expected 137 killed env B1109_TEST_PHP_CASE=kill bash "$script"
          if grep -q '^REPORT=' "$evidence/killed.log"; then exit 85; fi
          test -d "$HOME/.ald1n-b1109-readiness-lock"
          run_expected 2 stale_lock bash "$script"
          rmdir "$HOME/.ald1n-b1109-readiness-lock"
          run_expected 2 after_interrupted_inventory bash "$script"
          grep -Fx SOURCE_CENSUS_STABLE=PASS "$evidence/after_interrupted_inventory.log"
          if grep -R -E 'PRIVATE_(ENV|CACHE|PHP)_SENTINEL_NEVER_EXPORT' "$docs" "$evidence"; then exit 86; fi
          test "$(cat "$docs/1071-CI-SENTINEL.md")" = retained
          "$B1109_REAL_PHP" -r '$seen=[];$files=array_merge(glob($argv[1]."/[0-9]*-B1109-*")?:[],glob($argv[1]."/.[0-9]*-B1109-*")?:[]);foreach($files as $p){if(preg_match("/\\.?([0-9]+)-B1109-/",basename($p),$m)){if(isset($seen[$m[1]]))exit(87);$seen[$m[1]]=true;}}if(count($seen)<10)exit(88);echo "MONOTONIC_REPORT_SEQUENCE_INCLUDES_INTERRUPTED_PENDING=PASS\n";' "$docs"
          cp "$docs/"*B1109-* "$evidence/"
          find "$docs" -maxdepth 1 -name '.*B1109-*' -type f -exec cp -- {} "$evidence/" \;
          echo 'B1109_ISOLATED_CONTRACT=PASS CANONICAL_PATH_OWNER_INTEGRITY_NONEMPTY_COMPLETE_SOURCE_NOISE_INTERRUPTION_ATOMIC_REPORT_NO_DB_NO_ENV_EXPORT' | tee "$evidence/result.txt"

      - name: Preserve exact tested upload and complete synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b1109-bounded-readiness-contract
          path: |
            ${{ runner.temp }}/b1109-upload
            ${{ runner.temp }}/b1109-evidence
          retention-days: 7
          if-no-files-found: error
