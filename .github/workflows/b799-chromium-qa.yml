name: B799 registered storefront disposable Chromium acceptance (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'apps/cms/current/**'
      - '.github/workflows/b799-chromium-qa.yml'
permissions:
  contents: read
concurrency:
  group: b799-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_DATABASE: ald1n_test
          MARIADB_USER: ald1n_test
          MARIADB_PASSWORD: ald1n_test
          MARIADB_ROOT_PASSWORD: ci_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      APP_URL: http://127.0.0.1:8124
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ald1n_test
      DB_USERNAME: ald1n_test
      DB_PASSWORD: ald1n_test
      CACHE_STORE: array
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: 'false'
      QUEUE_CONNECTION: sync
      TURNSTILE_ENABLED: 'false'
      MAIL_MAILER: array
      PUBLIC_STOREFRONT_ENABLED: 'true'
      PUBLIC_CHECKOUT_ENABLED: 'true'
      PUBLIC_CHECKOUT_TERMS_URL: https://example.test/synthetic-terms
      PUBLIC_CHECKOUT_PRIVACY_URL: https://example.test/synthetic-privacy
      PUBLIC_CHECKOUT_SHIPPING_DESCRIPTION: Synthetic free delivery CI only
      PUBLIC_CHECKOUT_SHIPPING_FEE_RSD: '0'
      PUBLIC_CHECKOUT_PAYMENT_METHODS: cash_on_delivery
      PUBLIC_CHECKOUT_SUPPORT_EMAIL: synthetic-support@example.test
      B799_BROWSER_BASE_URL: http://127.0.0.1:8124
      PLAYWRIGHT_NODE_ROOT: /tmp/b799-playwright
      B799_BROWSER_ARTIFACT_DIR: /tmp/b799-browser-screenshots
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_mysql,dom,curl,fileinfo,openssl,tokenizer,xml,xmlwriter,intl,gd,zip,bcmath
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Install exact isolated CMS dependencies
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          test "$APP_ENV" = testing
          test "$DB_HOST" = 127.0.0.1
          test "$DB_DATABASE" = ald1n_test
          test "$B799_BROWSER_BASE_URL" = http://127.0.0.1:8124
          test ! -e .env
          install -m 600 /dev/null .env
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          php -l tests/Browser/seed-public-shop-b799.php
          php tests/Support/check-checkout-concurrency-witness.php
          node --test tests/Browser/b799-release-product-lock.test.cjs
          node --check tests/Browser/b799-public-shop-browser.cjs
          php -l tests/Browser/seed-b812-registered-buyer.php
          node --check tests/Browser/b812-registered-buyer-browser.cjs
          if B812_BROWSER_ENGINE=unsupported node tests/Browser/b812-registered-buyer-browser.cjs > "$RUNNER_TEMP/b812-engine-rejection.log" 2>&1; then exit 1; fi
          grep -Fq B812_BROWSER_HOLD_UNSUPPORTED_ENGINE "$RUNNER_TEMP/b812-engine-rejection.log"
      - name: Install disposable Chromium and Firefox outside repository
        run: |
          set -euo pipefail
          mkdir -p "$PLAYWRIGHT_NODE_ROOT"
          npm install --no-save --no-package-lock --no-audit --no-fund --prefix "$PLAYWRIGHT_NODE_ROOT" playwright@1.56.1
          "$PLAYWRIGHT_NODE_ROOT/node_modules/.bin/playwright" install --with-deps chromium firefox
      - name: B812 registered Kupac real Chromium and Firefox, isolated from historical guest suite
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          test "$APP_ENV" = testing
          test "$DB_HOST" = 127.0.0.1
          test "$DB_DATABASE" = ald1n_test
          test "$MAIL_MAILER" = array
          test "$B799_BROWSER_BASE_URL" = http://127.0.0.1:8124
          test -f vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php
          for engine in chromium firefox; do
            php artisan migrate:fresh --force --no-ansi
            php artisan db:seed --class=CoreAccessSeeder --force --no-ansi
            php tests/Browser/seed-b812-registered-buyer.php --seed
            cd public
            php -S 127.0.0.1:8124 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php > "$RUNNER_TEMP/b812-$engine-server.log" 2>&1 &
            B812_PID=$!
            cd ..
            trap 'kill "$B812_PID" 2>/dev/null || true' EXIT
            READY=0
            for i in $(seq 1 45); do
              if curl --silent --fail --output /dev/null http://127.0.0.1:8124/registracija; then READY=1; break; fi
              if ! kill -0 "$B812_PID" 2>/dev/null; then break; fi
              sleep 1
            done
            test "$READY" = 1 || { echo 'B812_BROWSER_HTTP_BOOT_HOLD'; tail -n 15 "$RUNNER_TEMP/b812-$engine-server.log"; exit 5; }
            B812_BROWSER_ENGINE="$engine" B799_BROWSER_ARTIFACT_DIR="/tmp/b799-browser-screenshots/$engine" node tests/Browser/b812-registered-buyer-browser.cjs
            php tests/Browser/seed-b812-registered-buyer.php --verify
            echo "B812_REGISTERED_$engine=PASS_SYNTHETIC_NO_SMTP_NO_DEPLOY"
            kill "$B812_PID"
            wait "$B812_PID" || true
            trap - EXIT
          done
      - name: Preserve B812 synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b812-registered-buyer-chromium-firefox
          path: /tmp/b799-browser-screenshots/**/b812-*.png
          retention-days: 3
          if-no-files-found: warn
      - name: Exercise real localhost registered retail and responsive visuals
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          test "$APP_ENV" = testing
          test "$DB_DATABASE" = ald1n_test
          php artisan migrate:fresh --force --no-ansi
          php artisan db:seed --class=CoreAccessSeeder --force --no-ansi
          php tests/Browser/seed-public-shop-b799.php
          # Prior B812 engines use the same localhost IP; retain the real 6/min limiter.
          sleep 61
          php artisan serve --host=127.0.0.1 --port=8124 > "$RUNNER_TEMP/b799-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 45); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:8124/katalog; then READY=1; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          test "$READY" = 1 || { echo 'B799_BROWSER_HTTP_BOOT_HOLD'; exit 5; }
          node tests/Browser/b799-public-shop-browser.cjs
          php tests/Browser/seed-public-shop-b799.php --verify
      - name: Keep synthetic screenshots only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b799-public-retail-chromium
          path: /tmp/b799-browser-screenshots/
          retention-days: 3
          if-no-files-found: warn
      - name: Production boundary
        if: always()
        run: echo 'CI_DISPOSABLE_ONLY NO_PRODUCTION_DB_CUSTOMER_MAIL_CHECKOUT_DEPLOY_ANDROID_OTA_PLAY'

  trusted-scripts-https:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_DATABASE: ald1n_test
          MARIADB_USER: ald1n_test
          MARIADB_PASSWORD: ald1n_test
          MARIADB_ROOT_PASSWORD: ci_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      APP_URL: https://127.0.0.1:8443
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ald1n_test
      DB_USERNAME: ald1n_test
      DB_PASSWORD: ald1n_test
      CACHE_STORE: array
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: 'true'
      QUEUE_CONNECTION: sync
      TURNSTILE_ENABLED: 'false'
      MAIL_MAILER: array
      PUBLIC_STOREFRONT_ENABLED: 'true'
      PUBLIC_CHECKOUT_ENABLED: 'true'
      PUBLIC_CHECKOUT_TERMS_URL: https://example.test/synthetic-terms
      PUBLIC_CHECKOUT_PRIVACY_URL: https://example.test/synthetic-privacy
      PUBLIC_CHECKOUT_SHIPPING_DESCRIPTION: Synthetic free delivery CI only
      PUBLIC_CHECKOUT_SHIPPING_FEE_RSD: '0'
      PUBLIC_CHECKOUT_PAYMENT_METHODS: cash_on_delivery
      PUBLIC_CHECKOUT_SUPPORT_EMAIL: synthetic-support@example.test
      B799_BROWSER_BASE_URL: http://127.0.0.1:8124
      PLAYWRIGHT_NODE_ROOT: /tmp/b1115-playwright
      B1115_ARTIFACT_DIR: /tmp/b1115-safe-evidence
      B1115_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      GOOGLE_WEB_AUTH_ENABLED: 'true'
      GOOGLE_OAUTH_WEB_CLIENT_ID: synthetic-browser-client
      GOOGLE_OAUTH_CLIENT_SECRET: synthetic-not-a-provider-secret
      GOOGLE_OAUTH_REDIRECT_URI: https://127.0.0.1:8443/auth/google/callback
      TURNSTILE_SITE_KEY: synthetic-site-key
      TURNSTILE_SECRET_KEY: synthetic-not-a-provider-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_mysql,dom,curl,fileinfo,openssl,tokenizer,xml,xmlwriter,intl,gd,zip,bcmath
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Install exact disposable dependencies and syntax-check only the new harness
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          test "$APP_ENV" = testing
          test "$DB_HOST" = 127.0.0.1
          test "$DB_DATABASE" = ald1n_test
          test "$MAIL_MAILER" = array
          test "$APP_URL" = https://127.0.0.1:8443
          test ! -e .env
          install -m 600 /dev/null .env
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          php -l tests/Feature/TrustedScriptCspB1115Test.php
          php -l tests/Browser/seed-b1115-auth-csp.php
          node --check tests/Browser/b1115-auth-csp-browser.cjs
          mkdir -p "$PLAYWRIGHT_NODE_ROOT" "$B1115_ARTIFACT_DIR"
          npm install --no-save --no-package-lock --no-audit --no-fund --prefix "$PLAYWRIGHT_NODE_ROOT" playwright@1.56.1
          "$PLAYWRIGHT_NODE_ROOT/node_modules/.bin/playwright" install --with-deps chromium firefox
      - name: Focused real-middleware PHP assertions (preserve failure, continue independent browsers)
        working-directory: apps/cms/current
        run: |
          set -uo pipefail
          set +e
          php vendor/bin/phpunit tests/Feature/TrustedScriptCspB1115Test.php --colors=never 2>&1 | tee "$RUNNER_TEMP/b1115-php.log"
          RC=${PIPESTATUS[0]}
          echo "$RC" > "$RUNNER_TEMP/b1115-php.rc"
          echo "B1115_PHP_REAL_RC=$RC"
      - name: Actual TLS Chromium and Firefox; Turnstile OFF and controlled ON
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          test "$APP_URL" = https://127.0.0.1:8443
          export B1115_TLS_KEY="$RUNNER_TEMP/b1115-loopback.key"
          export B1115_TLS_CERT="$RUNNER_TEMP/b1115-loopback.crt"
          umask 077
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 -keyout "$B1115_TLS_KEY" -out "$B1115_TLS_CERT" -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1' > "$RUNNER_TEMP/b1115-tls-creation.log" 2>&1
          node tests/Browser/b1115-auth-csp-browser.cjs --proxy > "$RUNNER_TEMP/b1115-proxy.log" 2>&1 &
          PROXY_PID=$!
          SERVER_PID=''
          trap 'kill "$PROXY_PID" ${SERVER_PID:-} 2>/dev/null || true' EXIT
          TOTAL=0
          for turnstile in false true; do
            export TURNSTILE_ENABLED="$turnstile"
            for engine in chromium firefox; do
              php artisan migrate:fresh --force --no-ansi
              php artisan db:seed --class=CoreAccessSeeder --force --no-ansi
              APP_URL=http://127.0.0.1:8124 php tests/Browser/seed-b812-registered-buyer.php --seed
              php tests/Browser/seed-b1115-auth-csp.php --seed
              cd public
              php -S 127.0.0.1:8125 ../tests/Browser/seed-b1115-auth-csp.php > "$RUNNER_TEMP/b1115-$engine-$turnstile-server.log" 2>&1 &
              SERVER_PID=$!
              cd ..
              READY=0
              for i in $(seq 1 45); do
                if curl --silent --fail --cacert "$B1115_TLS_CERT" --output /dev/null https://127.0.0.1:8443/login; then READY=1; break; fi
                if ! kill -0 "$SERVER_PID" 2>/dev/null; then break; fi
                sleep 1
              done
              test "$READY" = 1 || { echo B1115_HOLD_TLS_BOOT; exit 5; }
              set +e
              B1115_BROWSER_ENGINE="$engine" node tests/Browser/b1115-auth-csp-browser.cjs
              RC=$?
              php tests/Browser/seed-b1115-auth-csp.php --verify
              VERIFY_RC=$?
              set -e
              echo "B1115_BROWSER_REAL_RC engine=$engine turnstile=$turnstile rc=$RC verify=$VERIFY_RC"
              if test "$RC" != 0 || test "$VERIFY_RC" != 0; then TOTAL=1; fi
              kill "$SERVER_PID"
              wait "$SERVER_PID" || true
              SERVER_PID=''
            done
          done
          echo "$TOTAL" > "$RUNNER_TEMP/b1115-browser.rc"
      - name: Safe evidence manifest (no source HTML, tokens, cookies, keys, database or screenshots)
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs'), path = require('node:path'), crypto = require('node:crypto');
          const dir = process.env.B1115_ARTIFACT_DIR;
          fs.mkdirSync(dir, {recursive: true});
          const files = fs.readdirSync(dir).sort();
          if (files.some(name => !/^(chromium|firefox)-(off|controlled-on)\.json$/.test(name))) throw Error('B1115_ARTIFACT_ALLOWLIST');
          const manifest = {source: process.env.B1115_SOURCE_SHA, privateMaterialIncluded: false, files: files.map(name => {
            const bytes = fs.readFileSync(path.join(dir, name));
            const report = JSON.parse(bytes);
            if (report.source !== process.env.B1115_SOURCE_SHA || !Array.isArray(report.results)) throw Error('B1115_SOURCE_BINDING');
            return {name, size: bytes.length, sha256: crypto.createHash('sha256').update(bytes).digest('hex'), passed: report.passed, failed: report.failed};
          })};
          fs.writeFileSync(path.join(dir, 'manifest.json'), JSON.stringify(manifest, null, 2)+'\n', {flag: 'wx'});
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b1115-trusted-script-https-safe-results
          path: /tmp/b1115-safe-evidence/*.json
          retention-days: 5
          if-no-files-found: error
      - name: Enforce actual PHP and browser return codes
        if: always()
        run: |
          test -f "$RUNNER_TEMP/b1115-php.rc"
          test -f "$RUNNER_TEMP/b1115-browser.rc"
          test "$(cat "$RUNNER_TEMP/b1115-php.rc")" = 0
          test "$(cat "$RUNNER_TEMP/b1115-browser.rc")" = 0
