name: B799 anonymous storefront disposable Chromium acceptance (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'apps/cms/current/**'
      - '.github/workflows/b799-chromium-qa.yml'
permissions:
  contents: read
concurrency:
  group: b799-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_DATABASE: ald1n_test
          MARIADB_USER: ald1n_test
          MARIADB_PASSWORD: ald1n_test
          MARIADB_ROOT_PASSWORD: ci_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      APP_URL: http://127.0.0.1:8124
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ald1n_test
      DB_USERNAME: ald1n_test
      DB_PASSWORD: ald1n_test
      CACHE_STORE: array
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: 'false'
      QUEUE_CONNECTION: sync
      TURNSTILE_ENABLED: 'false'
      MAIL_MAILER: array
      PUBLIC_STOREFRONT_ENABLED: 'true'
      PUBLIC_CHECKOUT_ENABLED: 'true'
      PUBLIC_CHECKOUT_TERMS_URL: https://example.test/synthetic-terms
      PUBLIC_CHECKOUT_PRIVACY_URL: https://example.test/synthetic-privacy
      PUBLIC_CHECKOUT_SHIPPING_DESCRIPTION: Synthetic free delivery CI only
      PUBLIC_CHECKOUT_SHIPPING_FEE_RSD: '0'
      PUBLIC_CHECKOUT_PAYMENT_METHODS: cash_on_delivery
      PUBLIC_CHECKOUT_SUPPORT_EMAIL: synthetic-support@example.test
      B799_BROWSER_BASE_URL: http://127.0.0.1:8124
      PLAYWRIGHT_NODE_ROOT: /tmp/b799-playwright
      B799_BROWSER_ARTIFACT_DIR: /tmp/b799-browser-screenshots
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_mysql,dom,curl,fileinfo,openssl,tokenizer,xml,xmlwriter,intl,gd,zip,bcmath
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Install exact isolated CMS dependencies
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          test "$APP_ENV" = testing
          test "$DB_HOST" = 127.0.0.1
          test "$DB_DATABASE" = ald1n_test
          test "$B799_BROWSER_BASE_URL" = http://127.0.0.1:8124
          test ! -e .env
          install -m 600 /dev/null .env
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          php -l tests/Browser/seed-public-shop-b799.php
          php tests/Support/check-checkout-concurrency-witness.php
          node --check tests/Browser/b799-public-shop-browser.cjs
          php -l tests/Browser/seed-b812-registered-buyer.php
          node --check tests/Browser/b812-registered-buyer-browser.cjs
      - name: Install disposable Chromium outside repository
        run: |
          set -euo pipefail
          mkdir -p "$PLAYWRIGHT_NODE_ROOT"
          npm install --no-save --no-package-lock --no-audit --no-fund --prefix "$PLAYWRIGHT_NODE_ROOT" playwright@1.56.1
          "$PLAYWRIGHT_NODE_ROOT/node_modules/.bin/playwright" install --with-deps chromium
      - name: B812 registered Kupac real Chromium, isolated from historical guest suite
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          test "$APP_ENV" = testing
          test "$DB_HOST" = 127.0.0.1
          test "$DB_DATABASE" = ald1n_test
          test "$MAIL_MAILER" = array
          test "$B799_BROWSER_BASE_URL" = http://127.0.0.1:8124
          php artisan migrate:fresh --force --no-ansi
          php artisan db:seed --class=CoreAccessSeeder --force --no-ansi
          php tests/Browser/seed-b812-registered-buyer.php --seed
          php artisan serve --host=127.0.0.1 --port=8124 > "$RUNNER_TEMP/b812-server.log" 2>&1 &
          B812_PID=$!
          trap 'kill "$B812_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 45); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:8124/registracija; then READY=1; break; fi
            if ! kill -0 "$B812_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          test "$READY" = 1 || { echo 'B812_BROWSER_HTTP_BOOT_HOLD'; tail -n 15 "$RUNNER_TEMP/b812-server.log"; exit 5; }
          node tests/Browser/b812-registered-buyer-browser.cjs
          php tests/Browser/seed-b812-registered-buyer.php --verify
          echo 'B812_REGISTERED_BROWSER=PASS_SYNTHETIC_NO_SMTP_NO_DEPLOY'
      - name: Preserve B812 synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b812-registered-buyer-chromium
          path: /tmp/b799-browser-screenshots/b812-*.png
          retention-days: 3
          if-no-files-found: warn
      - name: Exercise real localhost guest retail and responsive visuals
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          test "$APP_ENV" = testing
          test "$DB_DATABASE" = ald1n_test
          php artisan migrate:fresh --force --no-ansi
          php artisan db:seed --class=CoreAccessSeeder --force --no-ansi
          php tests/Browser/seed-public-shop-b799.php
          php artisan serve --host=127.0.0.1 --port=8124 > "$RUNNER_TEMP/b799-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 45); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:8124/katalog; then READY=1; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          test "$READY" = 1 || { echo 'B799_BROWSER_HTTP_BOOT_HOLD'; exit 5; }
          node tests/Browser/b799-public-shop-browser.cjs
          php tests/Browser/seed-public-shop-b799.php --verify
      - name: Keep synthetic screenshots only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b799-public-retail-chromium
          path: /tmp/b799-browser-screenshots/
          retention-days: 3
          if-no-files-found: warn
      - name: Production boundary
        if: always()
        run: echo 'CI_DISPOSABLE_ONLY NO_PRODUCTION_DB_CUSTOMER_MAIL_CHECKOUT_DEPLOY_ANDROID_OTA_PLAY'
