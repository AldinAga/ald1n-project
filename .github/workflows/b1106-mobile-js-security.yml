name: B1106 bounded JS security compatibility (NOT RELEASE APPROVAL)
on:
  pull_request:
    paths:
      - 'apps/mobile/current/package-lock.json'
      - '.github/workflows/b1106-mobile-js-security.yml'
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.23.4'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Prove exact reviewed lock with unchanged native and root declarations
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/b1106-mobile"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/source-head.txt"
          node - <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process'),assert=require('node:assert/strict'),crypto=require('node:crypto');
          // 2026-11-14: re-based onto the live SDK58 release line (versionCode 29).
          const base='6adb3b440b8cfdc068b142a98c418d9d91487f64',p='apps/mobile/current/package-lock.json';
          const old=JSON.parse(cp.execFileSync('git',['show',base+':'+p],{encoding:'utf8'})),bytes=fs.readFileSync(p),now=JSON.parse(bytes);
          assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'),'46809736f5fea19293d5c2cf6484e6ca04744ac7cbb700fed5326d83e33e497e');
          assert.deepEqual(now.packages[''],old.packages['']);
          // xmldom 0.8.15 and 0.9.12 were already in the SDK58 lock; four of the six advisories remain to patch.
          const expected={'node_modules/brace-expansion':'5.0.12','node_modules/node-forge':'1.4.3','node_modules/shell-quote':'1.12.0','node_modules/zod':'4.6.7'};
          const {isDeepStrictEqual}=require('node:util');
          assert(isDeepStrictEqual({a:1,b:2},{b:2,a:1}));assert(!isDeepStrictEqual({version:'1'},{version:'2'}));
          const keys=[...new Set([...Object.keys(old.packages),...Object.keys(now.packages)])],changed=[];
          for(const k of keys){if(!isDeepStrictEqual(old.packages[k],now.packages[k])){assert(k in expected,'unexpected package object changed: '+k);assert.equal(now.packages[k].version,expected[k]);changed.push(k);}}
          assert.deepEqual(changed.sort(),Object.keys(expected).sort());
          cp.execFileSync('git',['diff','--exit-code',base,'HEAD','--','apps/mobile/current/package.json','apps/mobile/current/app.config.js','apps/mobile/current/eas.json']);
          fs.writeFileSync(process.env.RUNNER_TEMP+'/b1106-mobile/lock-proof.json',JSON.stringify({baseline:base,changed,allOtherPackageObjectsUnchanged:true,noNativeConfigOrApplicationChange:true},null,2)+'\n');
          NODE
      - name: Full existing Mobile regression and prospective audit evidence
        working-directory: apps/mobile/current
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/b1106-mobile"
          npm exec --yes --package=npm@12.2.1 -- npm ci --ignore-scripts --no-audit --no-fund > "$evidence/install.log" 2>&1
          npm run typecheck > "$evidence/typecheck.log" 2>&1
          npm run validate > "$evidence/validator.log" 2>&1
          npm run test:release25 > "$evidence/release25.log" 2>&1
          tail -n 12 "$evidence/release25.log"
          echo '46809736f5fea19293d5c2cf6484e6ca04744ac7cbb700fed5326d83e33e497e  package-lock.json' | sha256sum --check
          rc=0
          npm exec --yes --package=npm@10.9.2 -- npm audit --package-lock-only --include=dev --ignore-scripts --audit=true --registry=https://registry.npmjs.org --json > "$evidence/audit.json" 2> "$evidence/audit.stderr" || rc=$?
          printf '%s\n' "$rc" > "$evidence/audit.exit"
          test "$rc" -le 1
          node - "$evidence" <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict'),dir=process.argv[2];
          const a=JSON.parse(fs.readFileSync(path.join(dir,'audit.json'))),v=a.metadata.vulnerabilities;
          assert.equal(v.critical,0);assert(v.total<=21);assert(v.high<=6);
          const log=fs.readFileSync(path.join(dir,'release25.log'),'utf8');
          for(const line of ['# tests 309','# pass 309','# fail 0','# cancelled 0','# skipped 0'])assert(log.split('\n').includes(line),line);
          fs.writeFileSync(path.join(dir,'scope.json'),JSON.stringify({status:'BOUNDED_COMPATIBILITY_PASS',remainingAffectedPackages:v,releaseApproved:false,scope:'Six reviewed JS security updates; remaining advisories require separate resolution. No native build or OTA.'},null,2)+'\n');
          console.log('B1106_JS_COMPATIBILITY_PASS_NOT_RELEASE_APPROVAL '+JSON.stringify(v));
          NODE
      - name: Preserve actual compatibility and unresolved audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b1106-bounded-js-compatibility
          path: ${{ runner.temp }}/b1106-mobile
          if-no-files-found: error
          retention-days: 7
