name: B1106 bounded JS security compatibility (NOT RELEASE APPROVAL)
on:
  pull_request:
    paths:
      - 'apps/mobile/current/package-lock.json'
      - '.github/workflows/b1106-mobile-js-security.yml'
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.23.4'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Prove reviewed lock policy against the PR base (security floors, frozen native pins, bounded Expo patch bumps)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/b1106-mobile"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/source-head.txt"
          EVIDENCE_DIR="$evidence" node - <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process'),assert=require('node:assert/strict'),crypto=require('node:crypto');
          const {isDeepStrictEqual}=require('node:util');
          const dir='apps/mobile/current/',lockPath=dir+'package-lock.json',pkgPath=dir+'package.json',base=process.env.BASE_SHA;
          assert(base,'BASE_SHA missing');
          const show=f=>cp.execFileSync('git',['show',base+':'+f],{encoding:'utf8',maxBuffer:1<<28});
          const old=JSON.parse(show(lockPath)),oldPkg=JSON.parse(show(pkgPath)),bytes=fs.readFileSync(lockPath),now=JSON.parse(bytes),nowPkg=JSON.parse(fs.readFileSync(pkgPath));
          const num=v=>v.split('-')[0].split('.').map(Number),major=v=>num(v)[0];
          const cmp=(a,b)=>{const x=num(a),y=num(b);for(let i=0;i<3;i++)if(x[i]!==y[i])return x[i]-y[i];return 0;};
          // Reviewed security floors (the six advisories of B1106). A lock may move up within the major, never below.
          const floors={'node_modules/brace-expansion':'5.0.12','node_modules/node-forge':'1.4.3','node_modules/shell-quote':'1.12.0','node_modules/zod':'4.6.7'};
          const xmldomFloor={0.8:'0.8.15',0.9:'0.9.12'};
          assert(cmp('1.4.3','1.4.2')>0&&cmp('4.6.7','4.6.7')===0&&cmp('0.9.12','0.9.9')>0&&major('5.0.12')===5);
          // 1. Lock and package.json agree (npm ci proves it again after this step).
          const root=now.packages[''];
          assert.deepEqual(root.dependencies,nowPkg.dependencies,'lock root dependencies differ from package.json');
          assert.deepEqual(root.devDependencies||{},nowPkg.devDependencies||{},'lock root devDependencies differ from package.json');
          // 2. Security floors hold.
          for(const [k,v] of Object.entries(floors)){const n=now.packages[k];assert(n,'missing '+k);assert(cmp(n.version,v)>=0&&major(n.version)===major(v),k+' below reviewed floor '+v+': '+n.version);}
          for(const [k,n] of Object.entries(now.packages))if(k.endsWith('node_modules/@xmldom/xmldom')){const f=xmldomFloor[n.version.split('.').slice(0,2).join('.')];assert(f&&cmp(n.version,f)>=0,k+' not on a reviewed xmldom line: '+n.version);}
          // 3. Declared dependency changes versus the PR base.
          const {dependencies:od,...oldRest}=oldPkg,{dependencies:nd,...nowRest}=nowPkg;
          assert.deepEqual(nowRest,oldRest,'package.json changed outside dependencies');
          const expoFamily=n=>n==='expo'||n.startsWith('expo-')||n.startsWith('@expo/');
          // Frozen native/runtime pins (also pinned exactly by the LG-03 wave1 gate): never moved by a security or SDK patch bump.
          const frozen=n=>n==='react'||n==='react-dom'||n==='react-native'||n.startsWith('@react-native/')||/^react-native-(nitro|android-liquid-glass|reanimated|worklets)/.test(n)||n==='tamagui'||n.startsWith('@tamagui/');
          const depNames=[...new Set([...Object.keys(od),...Object.keys(nd)])],declChanged=[];
          for(const n of depNames)if(od[n]!==nd[n]){
            assert(od[n]&&nd[n],'dependency added or removed: '+n);
            assert(!frozen(n),'frozen native/runtime dependency changed: '+n);
            assert(major(od[n].replace(/^[~^]/,''))===major(nd[n].replace(/^[~^]/,'')),'major jump in '+n);
            declChanged.push(n);
          }
          const sdkBump=declChanged.length>0;
          // 4. Lock node changes versus the PR base.
          const changed=[],keys=[...new Set([...Object.keys(old.packages),...Object.keys(now.packages)])];
          for(const k of keys){
            const a=old.packages[k],b=now.packages[k];
            if(k===''||isDeepStrictEqual(a,b))continue;
            const name=k.split('node_modules/').at(-1);
            assert(!frozen(name),'frozen node changed: '+k);
            if(b){
              assert(typeof b.resolved!=='string'||b.resolved.startsWith('https://registry.npmjs.org/'),'non-npm-registry source: '+k);
              assert(!(b.hasInstallScript&&!(a&&a.hasInstallScript)),'new install script: '+k);
            }
            if(a&&b)assert(major(a.version)===major(b.version),'major jump: '+k);
            if(!sdkBump)assert(k in floors||k.endsWith('node_modules/@xmldom/xmldom'),'package changed without a package.json change: '+k);
            changed.push(k);
          }
          // 5. Native config: untouched. The only permitted app.config.js edits are Expo SDK 58 version literals of an SDK patch bump.
          cp.execFileSync('git',['diff','--exit-code',base,'HEAD','--',dir+'eas.json']);
          const cfg=cp.execFileSync('git',['diff','-U0',base,'HEAD','--',dir+'app.config.js'],{encoding:'utf8'}).split('\n').filter(l=>/^[+-]/.test(l)&&!/^(\+\+\+|---)/.test(l));
          if(cfg.length){assert(sdkBump,'app.config.js changed without an Expo dependency bump');for(const l of cfg)assert(/~58\.\d+\.\d+/.test(l),'app.config.js change beyond the Expo SDK 58 version literal: '+l);}
          const proof={base,mode:sdkBump?'EXPO_SDK_PATCH_BUMP':'LOCK_ONLY_SECURITY',lockSha256:crypto.createHash('sha256').update(bytes).digest('hex'),declaredChanges:declChanged,changedNodes:changed.length,appConfigLinesChanged:cfg.length};
          const out=process.env.EVIDENCE_DIR;if(out)fs.writeFileSync(out+'/lock-proof.json',JSON.stringify(proof,null,2)+'\n');
          console.log('B1106_LOCK_POLICY_PASS '+JSON.stringify(proof));
          NODE
      - name: Full existing Mobile regression and prospective audit evidence
        working-directory: apps/mobile/current
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/b1106-mobile"
          npm exec --yes --package=npm@12.2.1 -- npm ci --ignore-scripts --no-audit --no-fund > "$evidence/install.log" 2>&1
          npm run typecheck > "$evidence/typecheck.log" 2>&1
          npm run validate > "$evidence/validator.log" 2>&1
          npm run test:release25 > "$evidence/release25.log" 2>&1
          tail -n 12 "$evidence/release25.log"
          # The lock is no longer pinned to one hash (that failed every legitimate bump); it must be unchanged by npm ci, and its hash is recorded as evidence.
          git diff --exit-code -- package.json package-lock.json
          sha256sum package-lock.json | tee "$evidence/lock-sha256.txt"
          # Declared Expo-family/native-module bumps must equal Expo's own SDK table, the same source `expo install --check` uses.
          node - "$evidence" <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict');
          const proof=JSON.parse(fs.readFileSync(path.join(process.argv[2],'lock-proof.json'))),deps=require('./package.json').dependencies,table=require('./node_modules/expo/bundledNativeModules.json');
          for(const n of proof.declaredChanges){if(n==='expo'){assert(/^~58\./.test(deps[n]),'expo left the SDK 58 line');continue;}assert.equal(deps[n],table[n],n+' is not the version Expo SDK ships for this release');}
          console.log('B1106_DECLARED_BUMPS_MATCH_EXPO_SDK_TABLE '+JSON.stringify(proof.declaredChanges));
          NODE
          rc=0
          npm exec --yes --package=npm@10.9.2 -- npm audit --package-lock-only --include=dev --ignore-scripts --audit=true --registry=https://registry.npmjs.org --json > "$evidence/audit.json" 2> "$evidence/audit.stderr" || rc=$?
          printf '%s\n' "$rc" > "$evidence/audit.exit"
          test "$rc" -le 1
          node - "$evidence" <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict'),dir=process.argv[2];
          const a=JSON.parse(fs.readFileSync(path.join(dir,'audit.json'))),v=a.metadata.vulnerabilities;
          assert.equal(v.critical,0);assert(v.total<=21);assert(v.high<=6);
          const log=fs.readFileSync(path.join(dir,'release25.log'),'utf8');
          // Floor of 309 (the reviewed count): the suite may grow, never shrink, and every test must pass.
          const n=k=>Number((log.match(new RegExp('^# '+k+' (\\d+)$','m'))||[])[1]);
          assert(n('tests')>=309,'release25 test count fell below 309: '+n('tests'));assert.equal(n('pass'),n('tests'));
          for(const line of ['# fail 0','# cancelled 0','# skipped 0'])assert(log.split('\n').includes(line),line);
          fs.writeFileSync(path.join(dir,'scope.json'),JSON.stringify({status:'BOUNDED_COMPATIBILITY_PASS',remainingAffectedPackages:v,releaseApproved:false,scope:'Six reviewed JS security updates; remaining advisories require separate resolution. No native build or OTA.'},null,2)+'\n');
          console.log('B1106_JS_COMPATIBILITY_PASS_NOT_RELEASE_APPROVAL '+JSON.stringify(v));
          NODE
      - name: Preserve actual compatibility and unresolved audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b1106-bounded-js-compatibility
          path: ${{ runner.temp }}/b1106-mobile
          if-no-files-found: error
          retention-days: 7
