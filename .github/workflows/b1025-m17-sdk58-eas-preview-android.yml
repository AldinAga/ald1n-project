name: B1025 M17 SDK58 one internal EAS Android APK (MANUAL ONLY)

# This is a paid native build. Only an intentional Run workflow on main can start it.
# No push / PR / schedule trigger; no OTA, Play, production AAB, or auto-submit.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: b1025-m17-one-sdk58-internal-eas-apk
  cancel-in-progress: false

jobs:
  exact-sdk58-internal-apk:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_FETCH_RETRIES: '1'
      M17_SOURCE_SHA: '4af7b16c4f47c6aa09271ed03993f477c9be1bd8'
      M17_PROFILE: 'm17-sdk58-uat'
      M17_RUNTIME: '1.0.0-m17-sdk58-uat1'
      M17_PROJECT_ID: 'd43b3866-6838-4217-a23e-3dc7f2cc76cc'

    steps:
      - name: Require exact PR123 head and complete source CI before paid build
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077
          test "$GITHUB_REF" = refs/heads/main
          test -n "$GH_READ_TOKEN"
          curl -fsS --retry 2 --retry-delay 2 \
            -H "Authorization: Bearer $GH_READ_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/AldinAga/ald1n-project/pulls/123' \
            > "$RUNNER_TEMP/b1025-pr123.json"
          curl -fsS --retry 2 --retry-delay 2 \
            -H "Authorization: Bearer $GH_READ_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/AldinAga/ald1n-project/actions/runs?head_sha=$M17_SOURCE_SHA&per_page=100" \
            > "$RUNNER_TEMP/b1025-ci-runs.json"
          node - "$RUNNER_TEMP/b1025-pr123.json" "$RUNNER_TEMP/b1025-ci-runs.json" <<'NODE'
          const fs=require('node:fs');
          const pr=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const runs=JSON.parse(fs.readFileSync(process.argv[3],'utf8'));
          const exact=process.env.M17_SOURCE_SHA;
          if(pr.head?.sha!==exact || pr.head?.repo?.full_name!=='AldinAga/ald1n-project'
             || pr.state!=='open' || pr.draft!==true || pr.merged_at!==null)
            throw Error('HOLD_PR123_HEAD_OR_DRAFT_CHANGED');
          const expected=[
            41312573168,41312573143,41312573131,41312573183,
            41312573210,41312573126,41312573112,41312573250,
            41312573116,41312573140,41312573164
          ];
          const actual=runs.workflow_runs;
          if(!Array.isArray(actual))throw Error('HOLD_CI_READ_UNTRUSTED');
          for(const id of expected){
            const same=actual.filter(x=>x.id===id);
            if(same.length!==1 || same[0].head_sha!==exact
               || same[0].status!=='completed' || same[0].conclusion!=='success')
              throw Error('HOLD_EXACT_HEAD_CI_NOT_SUCCESS_'+id);
          }
          console.log('B1025_EXACT_PR123_HEAD_AND_11_OF_11_CI=PASS');
          console.log('B1025_PAID_BUILD_DISPATCH_NOT_YET_ATTEMPTED');
          NODE

      - name: Checkout immutable SDK58 draft commit, no retained GitHub credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4af7b16c4f47c6aa09271ed03993f477c9be1bd8
          fetch-depth: 1
          persist-credentials: false

      - name: Use exact Node 22.23.4 (npm 10)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'

      - name: Verify SDK58 UAT profile, package, Firebase and runtime offline
        working-directory: apps/mobile/current
        env:
          EXPO_PUBLIC_APP_ENV: preview
          EAS_BUILD_PROFILE: m17-sdk58-uat
          ALD1N_M17_SDK58_UAT: isolated
          ALD1N_M17_SDK58_PROFILE: m17-sdk58-uat
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$M17_SOURCE_SHA"
          test "$(node --version)" = v22.23.4
          test "$(npm --version | cut -d. -f1)" = 10
          node - <<'NODE'
          const fs=require('node:fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const eas=JSON.parse(fs.readFileSync('eas.json','utf8'));
          const cfg=require('./app.config.js')({config:{}});
          const google=JSON.parse(fs.readFileSync('google-services.json','utf8'));
          const p=eas.build['m17-sdk58-uat'];
          const packages=(google.client??[]).map(x=>x.client_info?.android_client_info?.package_name);
          if(pkg.dependencies.expo!=='~58.0.25' || pkg.dependencies['react-native']!=='0.88.1'
             || pkg.dependencies['react-native-nitro-google-signin']!=='1.3.0'
             || pkg.version!=='1.0.0' || pkg.packageManager!=='npm@10.9.2'
             || eas.cli.version!=='27.2.0' || eas.cli.appVersionSource!=='remote'
             || p.channel!=='m17-sdk58-uat' || p.environment!=='preview'
             || p.distribution!=='internal' || p.autoIncrement!==false
             || p.android?.buildType!=='apk' || p.autoSubmit!==undefined
             || p.env?.ALD1N_M17_SDK58_UAT!=='isolated'
             || p.env?.ALD1N_M17_SDK58_PROFILE!=='m17-sdk58-uat'
             || cfg.version!=='1.0.0' || cfg.runtimeVersion!==process.env.M17_RUNTIME
             || cfg.android.package!=='com.ald1n.mobile.preview'
             || cfg.extra?.eas?.projectId!==process.env.M17_PROJECT_ID
             || cfg.extra?.apiUrl!=='https://cms.ald1n.com/api/v1'
             || !packages.includes('com.ald1n.mobile.preview')
             || eas.build.production?.channel!=='production'
             || eas.build['production-v15-16kb']?.channel!=='production')
            throw Error('HOLD_M17_INTERNAL_APK_IDENTITY_OR_RELEASE_PIN');
          console.log('B1025_APP_1.0.0_PROFILE_M17_SDK58_UAT_RUNTIME_AND_FIREBASE=PASS');
          console.log('B1025_PRODUCTION_CHANNEL_BUILD_AND_PLAY=NOT_TOUCHED');
          NODE
          git diff --exit-code
          git diff --check

      - name: Install exact SDK58 lock for EAS app config resolution
        working-directory: apps/mobile/current
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --engine-strict
          test -d node_modules/expo-router
          git diff --exit-code -- package.json package-lock.json eas.json app.config.js
          echo 'B1025_EXACT_LOCK_NPM_CI=PASS'

      - name: Authenticated EAS25 project and previous-build preflight (no mutation)
        working-directory: apps/mobile/current
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_APP_ENV: preview
          EAS_BUILD_PROFILE: m17-sdk58-uat
          ALD1N_M17_SDK58_UAT: isolated
          ALD1N_M17_SDK58_PROFILE: m17-sdk58-uat
        run: |
          set -Eeuo pipefail
          umask 077
          if test -z "$EXPO_TOKEN"; then
            echo 'HOLD_EXPO_TOKEN_GITHUB_SECRET_MISSING_NO_BUILD'
            exit 2
          fi
          npm exec --yes --package=eas-cli@27.2.0 -- eas --version > "$RUNNER_TEMP/b1025-cli-version.txt"
          test "$(cat "$RUNNER_TEMP/b1025-cli-version.txt")" = 'eas-cli/27.2.0 linux-x64 node-v22.23.4' || \
            grep -Eq '^eas-cli/27\.2\.0 ' "$RUNNER_TEMP/b1025-cli-version.txt" || \
            grep -Eq '^27\.2\.0$' "$RUNNER_TEMP/b1025-cli-version.txt"
          npm exec --yes --package=eas-cli@27.2.0 -- eas project:info > "$RUNNER_TEMP/b1025-project-info.txt"
          grep -Fq "$M17_PROJECT_ID" "$RUNNER_TEMP/b1025-project-info.txt" || \
            { echo 'HOLD_AUTHENTICATED_PROJECT_ID_MISMATCH'; exit 2; }
          grep -Fq 'ald1n-mobile' "$RUNNER_TEMP/b1025-project-info.txt" || \
            { echo 'HOLD_AUTHENTICATED_PROJECT_SLUG_MISMATCH'; exit 2; }
          npm exec --yes --package=eas-cli@27.2.0 -- eas config -p android -e "$M17_PROFILE" --json \
            > "$RUNNER_TEMP/b1025-eas-effective-config.json"
          test -s "$RUNNER_TEMP/b1025-eas-effective-config.json"
          npm exec --yes --package=eas-cli@27.2.0 -- eas build:version:get \
            -p android -e "$M17_PROFILE" --json \
            > "$RUNNER_TEMP/b1025-eas-remote-version.json" || \
            { echo 'HOLD_EAS_REMOTE_VERSION_NOT_ATTESTED_NO_BUILD'; exit 2; }
          npm exec --yes --package=eas-cli@27.2.0 -- eas build:list \
            -p android -e "$M17_PROFILE" --limit 50 --json \
            > "$RUNNER_TEMP/b1025-previous-builds.json"
          node - "$RUNNER_TEMP/b1025-eas-remote-version.json" "$RUNNER_TEMP/b1025-previous-builds.json" <<'NODE'
          const fs=require('node:fs');
          const ver=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const builds=JSON.parse(fs.readFileSync(process.argv[3],'utf8'));
          const rows=Array.isArray(builds)?builds:builds?.builds;
          if(!Array.isArray(rows))throw Error('HOLD_EAS_BUILD_LIST_SHAPE_UNTRUSTED');
          // Remote version must be known; no guessing before the billable dispatch.
          const code=ver?.versionCode ?? ver?.android?.versionCode ?? ver?.buildVersion;
          if(!Number.isSafeInteger(Number(code)) || Number(code)<1)
            throw Error('HOLD_PREVIEW_REMOTE_VERSION_CODE_UNKNOWN');
          if(rows.some(x=>x.gitCommitHash===process.env.M17_SOURCE_SHA))
            throw Error('HOLD_EXISTING_SAME_SOURCE_EAS_BUILD_DO_NOT_DUPLICATE');
          console.log('B1025_EAS_AUTH_PROJECT_AND_NO_DUPLICATE_PREVIEW=PASS');
          console.log('B1025_PREVIEW_REMOTE_VERSION_CODE_BEFORE_BUILD='+String(code));
          NODE
          git diff --exit-code -- package.json package-lock.json eas.json app.config.js

      - name: Dispatch ONE Expo SDK58 internal Android preview APK (NOT Play)
        working-directory: apps/mobile/current
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_APP_ENV: preview
          EAS_BUILD_PROFILE: m17-sdk58-uat
          ALD1N_M17_SDK58_UAT: isolated
          ALD1N_M17_SDK58_PROFILE: m17-sdk58-uat
        run: |
          set -Eeuo pipefail
          umask 077
          printf 'SOURCE_SHA=%s\nPROFILE=%s\nPLATFORM=android\nCOUNT_LIMIT=1\n' \
            "$M17_SOURCE_SHA" "$M17_PROFILE" > "$RUNNER_TEMP/b1025-dispatch-intent.txt"
          if ! npm exec --yes --package=eas-cli@27.2.0 -- eas build \
            --platform android --profile "$M17_PROFILE" --non-interactive --no-wait --json \
            > "$RUNNER_TEMP/b1025-eas-build-dispatch.json"; then
            echo 'HOLD_EAS_DISPATCH_OUTCOME_UNKNOWN_CHECK_EAS_BUILD_LIST_BEFORE_RETRY'
            exit 2
          fi
          node - "$RUNNER_TEMP/b1025-eas-build-dispatch.json" "$GITHUB_OUTPUT" <<'NODE'
          const fs=require('node:fs');
          const raw=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const obj=Array.isArray(raw)?raw[0]:raw;
          const id=obj?.id;
          if(!/^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(id??''))
            throw Error('HOLD_EAS_DISPATCH_ACCEPTED_BUT_BUILD_ID_NOT_TRUSTED_NO_RETRY');
          fs.appendFileSync(process.argv[3],`build_id=${id}\n`);
          console.log('B1025_EAS_ANDROID_INTERNAL_BUILD_DISPATCHED_ID='+id);
          console.log('B1025_BUILD_STATUS=REQUESTED_NOT_FINISHED_NOT_DEVICE_ACCEPTED');
          NODE
        id: eas_dispatch

      - name: Read back exact EAS build receipt after dispatch (no Play, no OTA)
        if: steps.eas_dispatch.outcome == 'success'
        working-directory: apps/mobile/current
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_APP_ENV: preview
          EAS_BUILD_PROFILE: m17-sdk58-uat
          ALD1N_M17_SDK58_UAT: isolated
          ALD1N_M17_SDK58_PROFILE: m17-sdk58-uat
          BUILD_ID: ${{ steps.eas_dispatch.outputs.build_id }}
        run: |
          set -Eeuo pipefail
          umask 077
          npm exec --yes --package=eas-cli@27.2.0 -- eas build:view "$BUILD_ID" --json \
            > "$RUNNER_TEMP/b1025-eas-readback.json"
          node - "$RUNNER_TEMP/b1025-eas-readback.json" <<'NODE'
          const fs=require('node:fs');
          const b=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const expected=process.env;
          if(b?.id!==expected.BUILD_ID || (b.platform&&b.platform!=='ANDROID')
            || (b.buildProfile&&b.buildProfile!==expected.M17_PROFILE)
            || (b.gitCommitHash&&b.gitCommitHash!==expected.M17_SOURCE_SHA))
            throw Error('HOLD_EAS_BUILD_ID_PROFILE_OR_SOURCE_READBACK');
          const sanitized={
            status:'EAS_BUILD_DISPATCHED_NOT_ACCEPTED',
            buildId:b.id,
            buildStatus:b.status ?? 'UNCONFIRMED',
            sourceSha:expected.M17_SOURCE_SHA,
            observedSourceSha:b.gitCommitHash ?? null,
            profile:expected.M17_PROFILE,
            runtimeVersion:expected.M17_RUNTIME,
            appVersion:'1.0.0',
            appPackage:'com.ald1n.mobile.preview',
            channel:'m17-sdk58-uat',
            observedVersionCode:b.appBuildVersion ?? null,
            signedApkSha256:'NOT_CHECKED',
            physical16kbUat:'NOT_CHECKED',
            googleSignInUat:'NOT_CHECKED',
            productionMutation:'NONE',
            googlePlaySubmission:'NONE',
            otaPublication:'NONE'
          };
          fs.writeFileSync(process.env.RUNNER_TEMP+'/b1025-sanitized-receipt.json',JSON.stringify(sanitized,null,2)+'\n',{mode:0o600});
          console.log('B1025_READBACK_BUILD_ID='+sanitized.buildId);
          console.log('B1025_READBACK_STATUS='+sanitized.buildStatus);
          console.log('B1025_EAS_BUILD_IS_NOT_YET_UAT_PASS_OR_RELEASE');
          NODE

      - name: Archive only bounded sanitized build receipt (never credentials or raw logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1025-m17-sdk58-internal-apk-receipt-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/b1025-sanitized-receipt.json
            ${{ runner.temp }}/b1025-dispatch-intent.txt
          if-no-files-found: warn
          retention-days: 14
