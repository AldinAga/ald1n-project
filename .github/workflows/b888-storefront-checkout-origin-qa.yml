name: B888 storefront checkout authority gate (NO DEPLOY)
on:
  pull_request:
    branches: [fix/b883-auth-local-redirects-20261025]
permissions:
  contents: read
jobs:
  checkout-authority:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_DATABASE: ald1n_test
          MARIADB_USER: ald1n_test
          MARIADB_PASSWORD: ald1n_test
          MARIADB_ROOT_PASSWORD: ci_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: https://cms.ald1n.com
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ald1n_test
      DB_USERNAME: ald1n_test
      DB_PASSWORD: ald1n_test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      TURNSTILE_ENABLED: 'false'
    steps:
      # The historical B809 cases are still executed UNMODIFIED by B803 full CMS
      # baseline/candidate regression (56 inherited additional failures, release HOLD).
      # This independent gate isolates new behavior; it cannot waive those failures.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Exact PR head, source and protected fixture boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          BASE=601ea692dcfd34f922d7f6544089a622521b8a3b
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed.txt"
          printf '%s\n' \
            .github/workflows/b888-storefront-checkout-origin-qa.yml \
            apps/cms/current/app/Http/Controllers/PublicCheckoutController.php \
            apps/cms/current/app/Http/Middleware/PublicRetailValidationRedirect.php \
            apps/cms/current/bootstrap/app.php \
            apps/cms/current/routes/web.php \
            apps/cms/current/tests/Feature/StorefrontCheckoutOriginB888Test.php \
            apps/cms/current/tests/Feature/StorefrontLocalValidationB889Test.php > "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/changed.txt"
          test -z "$(git diff --name-only "$BASE" HEAD -- apps/cms/current/tests/Feature/StorefrontRegistrationOnlyB809Test.php apps/cms/current/tests/Feature/BuyerCheckoutSessionBoundaryB815Test.php apps/cms/current/tests/Feature/StorefrontSecurityB806Test.php)"
          git diff --check
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_mysql,pdo_sqlite,dom,curl,fileinfo,openssl,tokenizer,xml,xmlwriter,intl,gd,zip,bcmath
          coverage: none
      - name: Locked PHP setup and B888/B889 independent new origin regressions
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          test ! -e .env
          install -m 600 /dev/null .env
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          php -l app/Http/Controllers/PublicCheckoutController.php
          php -l app/Http/Middleware/PublicRetailValidationRedirect.php
          php -l bootstrap/app.php
          php -l routes/web.php
          php -l tests/Feature/StorefrontCheckoutOriginB888Test.php
          php -l tests/Feature/StorefrontLocalValidationB889Test.php
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306;dbname=ald1n_test","ald1n_test","ald1n_test");if(!str_starts_with((string)$p->query("SELECT VERSION()")->fetchColumn(),"10.11.19-MariaDB"))exit(35);'
          vendor/bin/phpunit -c phpunit.mysql.xml --fail-on-warning --filter 'StorefrontCheckoutOriginB888Test|StorefrontLocalValidationB889Test' --log-junit "$RUNNER_TEMP/b888-junit.xml" tests/Feature
      - name: Exact B888 identity count, no skip and no hidden failures
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/b888-junit.xml" <<'PY'
          import sys,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          tests=list(root.iter('testcase'))
          ids=[((n.get('classname') or n.get('class')),n.get('name')) for n in tests]
          if len(tests)!=7 or len(ids)!=len(set(ids)) or any(not a or not b for a,b in ids):
              raise SystemExit('HOLD_TEST_CASE_COUNT_OR_IDENTITIES_'+str(len(tests)))
          if any(n.find(k) is not None for n in tests for k in ('failure','error','skipped','warning')):
              raise SystemExit('HOLD_NON_GREEN_CASES')
          print('B888_B889_SCOPED_ORIGIN_7_OF_7_PASS')
          PY
      - name: Archive synthetic test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b888-storefront-origin-junit
          path: ${{ runner.temp }}/b888-junit.xml
          retention-days: 7
      - name: Preserve release HOLD
        if: always()
        run: echo B888_ISOLATED_QA_ONLY_B803_56_FAILURES_UNWAIVED_STOREFRONT_OFF_NO_SSH_NO_DEPLOY
