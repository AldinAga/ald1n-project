# B1155 dashboard, dropdown menus, registration page, sales-by-subagent report and safe redirects installer. CI only, nothing is deployed.
#
# PAYLOAD GATE. The payload source (origin/main d2c07f62, the merge of PR 193, 194, 196, 197 and 198) and the code base it is applied to (ad901a58, the B1154 payload commit: the code that is live after B1154, Report1120) are
# named in ONE place: the block marked B1155_PAYLOAD in tools/storefront/b1155/DashboardReportsInstallCoordinator.php (BASE_COMMIT, SOURCE_COMMIT, STEPS and DIGESTS). If the source moves, change only that
# block; this file reads the commits from it (step with id "payload") and exports them as B1155_SRC to the later steps. The step fails when a commit is missing or malformed.
name: B1155 dashboard dropdowns registration subagent report installer (NO DEPLOY)
on:
  push:
    branches: [codex/b1155-installer-20261115]
    paths: ['.github/workflows/b1155-installer.yml', 'tools/storefront/b1155/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  # The B1154 payload commit and its code base (the live tree after Report1120 was built from them), the B1153 payload commit and its code base, the B1152 payload heads and their code base, the B1151 payload heads and the B1150
  # payload head, the B1149 payload head, the operator tooling heads (B1150 2c74fd7b and B1149 bf5ac045), the main commit that carries Report1120 and the code base of this rollout (ad901a58, the B1154 payload commit;
  # the payload source d2c07f62 is read from the coordinator).
  B1152_URL: 8505b11064589ea5514944fea954a6d5ef8acdb1
  B1152_PDF: cfe97253bf4c441b06d2ea6194e2180bf4e23f98
  B1152_CODE_BASE: 7e22afd4b7cde338d5198d9e1ad0e2e3c72f1d9a
  B1152_MAIN: fc954517a5bfafe0ab6029f938aa956ca27c9575
  B1151_EMAIL: 43d3ab6eac41bfb8f69554f2c933e880c5a1e00e
  B1151_THROTTLE: ae00c5f668a8385815f5b6fbdba8a66e55ca4d2e
  B1150_SOURCE: 14e628ba61b77e3c6854bed100c634d1999b5f33
  B1150_TOOLING: 2c74fd7b84ecfb242df9d2a94b8a22a707c858d6
  B1149_SOURCE: 7e7481582fa0be3e95503a81b316be63836e508c
  B1149_TOOLING: bf5ac045a8b045fbe0f7cd9fc8e7f154d6ff49f0
  B1153_CODE_BASE: af1e46a30169a410ebb269bdfc021f656a4538e9
  B1153_COMMIT: d760bb2c87a5365db305df8aa6f79226770a32f3
  B1154_CODE_BASE: 482d2fa51e12617cc5a29fba7ab5802954fa07e2
  B1154_COMMIT: ad901a580ea85fffbd6567f1f12965b396680d79
  B1155_REPORT_MAIN: 6acf8aa917c70751f88279845f08b7a90ff49e35
  B1155_BASE: ad901a580ea85fffbd6567f1f12965b396680d79
  B1155_MAIN: d2c07f62cee09b22248bcff2d4a8361523d7fee6
jobs:
  installer:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 300
    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_ROOT_PASSWORD: isolated-ci-only
          MARIADB_DATABASE: ald1n_b1155_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -pisolated-ci-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Fetch the chain commits (B1146 base, B1146-B1154 heads, main eca7755c, the code bases 7e22afd4, af1e46a3, 482d2fa5 and ad901a58, main 6acf8aa9 of Report1120, origin/main d2c07f62, tooling bases) by SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          chain="77a3efeabf59281fd820b4afffa14c4ebc209049 ef3f927b77ba573881c2b6dba341732c417e6725 eabe16af8c19fade882e25c70425eb43c3e17ed9 764bf5135ad6241d64f728e4b141cc2713dc6c48 560828458974a56a8f7173b986a40d46629e4d8b eca7755c6efe05143a6d3cd19f8c9e70b9ee3515 55d06b9cc010c976dfc56743763dbfeb09b87acf 7e7481582fa0be3e95503a81b316be63836e508c c41f78fcd0382c2f161a717a0061d5883d641730 6558e7a1584c58753af8b2bdfc7c0c7274d8f291 bf5ac045a8b045fbe0f7cd9fc8e7f154d6ff49f0 14e628ba61b77e3c6854bed100c634d1999b5f33 2c74fd7b84ecfb242df9d2a94b8a22a707c858d6 $B1151_EMAIL $B1151_THROTTLE $B1152_URL $B1152_PDF $B1152_CODE_BASE $B1152_MAIN $B1153_CODE_BASE $B1153_COMMIT $B1154_CODE_BASE $B1154_COMMIT $B1155_REPORT_MAIN $B1155_BASE $B1155_MAIN"
          git -c "http.https://github.com/.extraheader=$auth" fetch --no-tags origin 84facde9ff138d1e7dd0de7af5c811d800b0ccfe afa0c704a1c4ad096918f904b98a77e223398e22 $chain
          for c in $chain; do
            test "$(git rev-parse --verify "$c^{commit}")" = "$c"
          done
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: opcache,pdo_mysql,mysqli,pdo_sqlite,sqlite3,mbstring,dom,libxml,fileinfo,curl,gd,intl,bcmath,zip,posix
          coverage: none
      - name: Pin cms.ald1n.com to loopback so CI can never reach production
        run: |
          set -euo pipefail
          printf '\n127.0.0.1 cms.ald1n.com\n::1 cms.ald1n.com\n' | sudo tee -a /etc/hosts >/dev/null
          python3 -c 'import socket,sys;a={i[4][0] for i in socket.getaddrinfo("cms.ald1n.com",443)};print(sorted(a));sys.exit(0 if a and a<={"127.0.0.1","::1"} else 2)'
      - name: Syntax, portable operator shell, pinned helpers, tooling base and forbidden mechanisms absent from shipped code
        run: |
          set -euo pipefail
          for f in tools/storefront/b1155/*.php tools/storefront/b1154/*.php tools/storefront/b1153/*.php tools/storefront/b1152/*.php tools/storefront/b1151/*.php tools/storefront/b1150/*.php tools/storefront/b1149/*.php tools/storefront/b1148/*.php tools/storefront/b1147/*.php tools/storefront/b1146/*.php tools/storefront/b1145/*.php tools/storefront/b1144/*.php tools/storefront/b1134/*.php; do php -l "$f"; done
          w=tools/storefront/b1155/operator-wrapper.sh
          bash -n "$w"
          if grep -nE '<\(|>\(|/dev/fd|python3' "$w"; then exit 2; fi
          grep -q 'setsid nohup bash "$SCRIPT" --worker > /dev/null 2>&1 < /dev/null &' "$w"
          test "$(grep -v '^#' "$w" | head -n 1)" = "clear 2>/dev/null || printf '\033c'"
          grep -q 'exec >> "$REPORT" 2>&1 < /dev/null' "$w"
          grep -q 'if($highest<1120)exit(2)' "$w"
          printf '%s\n' \
            '9dce8324bd4464a1689918775736bcd3a850f2b1c2b1b0ca7e130a9e486da12b  tools/storefront/b1134/InstallFileOps.php' \
            '20ba7d5baa2affa719f8e858a5d5c6e89d46341cb20d2dbef4d8cfb2ca64b077  tools/storefront/b1134/ReleasePrimitives.php' \
            '1e790c20fb9712d416399975d6cbcce3be1bd2dc12ede59a95f2e1cc75ea7e3e  tools/storefront/b1134/runtime-directories.json' \
            '7e62150fcad0884255ddb3c18063f5e2a23852a3eb0fdecb978c2955392ccf6e  tools/storefront/b1144/LeanGates.php' \
            '3dbf4762e419d8df053fa7e642bd1b85df07d66dbffdb94fe0d8d5cdc1b50616  tools/storefront/b1144/FreshnessProbe.php' \
            '54a04bc4dea81d56ad5fe0e6b25a141d4a86acf803f6df95f1c5d2b7adff6a73  tools/storefront/b1144/LeanWeb.php' \
            '04a4bbd13b8aef346247d8641445ccb9f0a2d7fd3f26f7a03723724fc0132f69  tools/storefront/b1145/EnvFlags.php' \
            '642ddede76db8f1ea66bfc6a8d1ad74c894a70b665204cac4c96de17e97113a5  tools/storefront/b1145/AppState.php' \
            '46b159fbeab6c4f849dbb1a9291bbf13245b511ea58fd51646f26f28caa53fb9  tools/storefront/b1145/MigrateUnclampCoordinator.php' \
            'abcc9c64c6b9918d180afd387ec917a4924e1ce28c0099c0bbdae500e811c01f  tools/storefront/b1146/OverlayProbe.php' \
            '68b4b2af5ad5a6399991adf474cfc753abf77a483fb12d2c1669a4b307ce2c2b  tools/storefront/b1146/AppCheck.php' \
            'c4e4c0935b4c14e7fbee1089243f5be4784c5b25c5c0a62d11551d5dfa1461ce  tools/storefront/b1147/CatalogWeb.php' \
            '278b03d1914580063a71f4f12c99e741376fbedb268e4570614dc3ccf3213b73  tools/storefront/b1147/AppCheck.php' \
            'd52bf4d475d3b3b1e6bd33fb6e766d24414b19b0fb3ee4dc0e9cdce59ed9cde9  tools/storefront/b1147/CatalogOverlayCoordinator.php' \
            '69bbdca104bfcbc62948e06a464fcaff55b5bf100a7ab513299fb19d00600c7c  tools/storefront/b1148/GlassWeb.php' \
            '0951b1ca3e9fcf6b7a2c722ce412903b593a9aa0b63dca5200f810a54c39e16a  tools/storefront/b1148/AppCheck.php' \
            '332a13a5014845051aea3ffa68591b6075d798e94be5428e3cb288d222d3641b  tools/storefront/b1148/GlassOverlayCoordinator.php' \
            '3742a8c1100f9d7bab9c4c489cc2e22d789a4d954fb47e01eeb112c52067e1d3  tools/storefront/b1149/StorefrontInstallCoordinator.php' \
            'c090e207891fe0e70efaaa6c09ffb6eb00b44c475ccf4acc5790ac672a07c2ca  tools/storefront/b1149/StorefrontWeb.php' \
            'da100fde8e75fd0885e81366bc95d695f01bbedf31842dccec5fa5b2baa7aed3  tools/storefront/b1149/AppCheck.php' \
            'cf85b7822a0acba558c4c8a1b52a2dbdd24ee3c168be297cd1c663126e1402cb  tools/storefront/b1150/MediaInstallCoordinator.php' \
            '6c570b0c89be1e11d35a3155972c661d6af4b504d0ba6c68a9d8f397415227a8  tools/storefront/b1150/MediaWeb.php' \
            'd438f04becd62f226902d0cb66f9cb7cf2cb12a11d1b0dd624f44344c982f196  tools/storefront/b1150/AppCheck.php' \
            '2c29266b5f7c6f5d995f2fed17f4fd6515a9fa9a98bc972a5478cff5e2703016  tools/storefront/b1150/operator-entry.php' \
            '6842828a326e0397022479c6cd6a46ebf6da04a40326b7c03be5facffe8182ec  tools/storefront/b1151/AppCheck.php' \
            'becac22c0582f69338a27bf5acd82aa3e6583d846f939c9b4bb079300fee8872  tools/storefront/b1151/LegalAccountInstallCoordinator.php' \
            '96cb4550a6e2f0d5158788cdb62eff4fd4bf8d217ab0955d138bbe826f548262  tools/storefront/b1152/AppCheck.php' \
            '721ffe3f7387ef0326c798d50217bcdefee4b0a2aaebed190b75debb9c0ae97f  tools/storefront/b1152/OriginPinInstallCoordinator.php' \
            '457f3da1776654bf69930075e5c1851062e597a7e136217eae57a07ee6388a4b  tools/storefront/b1152/LoadProbe.php' \
            '3049f0a741bc47f4f32a3f0314d4509a9f61b0a047a995f2a5ae1ac7e044ca19  tools/storefront/b1153/AppCheck.php' \
            'c040b3b2afe9f5401d3a93b3e73edc3894174d250db49cdd362ead8185584cdd  tools/storefront/b1153/LogoCatalogInstallCoordinator.php' \
            '4b110fa05ba8f18e192a3332525c56dc0e5a8217daef21d2299ef1494e8ace97  tools/storefront/b1153/LoadProbe.php' \
            '6da48e7998be940c4cca83f5afbe82c59c79121c036ac4efaf2e02cb08037385  tools/storefront/b1154/AppCheck.php' \
            '51dd96f6798bbebc74def1d1ddaed9f85a632ea93abcbe22b2ffd8866a05d016  tools/storefront/b1154/AdminShellInstallCoordinator.php' \
            | sha256sum --check --strict
          # The B1134-B1149 tooling is the reviewed bf5ac045 copy (B1149 PASS, Report1115), byte for byte; it installs B1146 to B1149 for real below.
          git diff --quiet bf5ac045a8b045fbe0f7cd9fc8e7f154d6ff49f0 HEAD -- tools/storefront/b1134 tools/storefront/b1144 tools/storefront/b1145 tools/storefront/b1146 tools/storefront/b1147 tools/storefront/b1148 tools/storefront/b1149
          # The B1150 tooling is the reviewed 2c74fd7b copy (B1150 PASS, Report1116); it installs B1150 for real below.
          git diff --quiet 2c74fd7b84ecfb242df9d2a94b8a22a707c858d6 HEAD -- tools/storefront/b1150
          # The B1151 to B1154 tooling is what origin/main carries (B1151 PASS Report1117, B1152 PASS Report1118, B1153 PASS Report1119, B1154 PASS Report1120); they install B1151 to B1154 for real below. The pins above are their git blob digests.
          git diff --quiet "$B1155_MAIN" HEAD -- tools/storefront/b1151 tools/storefront/b1152 tools/storefront/b1153 tools/storefront/b1154
          shipped='tools/storefront/b1155/operator-entry.php tools/storefront/b1155/DashboardReportsInstallCoordinator.php tools/storefront/b1155/AppCheck.php tools/storefront/b1155/operator-wrapper.sh'
          if grep -niE '/usr/local/cpanel|uapi|DomainInfo|opcache_reset|php_flag|HostProcessGuard|--seed|migrate:fresh|migrate:rollback|migrate:refresh|migrate:reset|db:wipe|config:cache|view:cache|route:cache|public_storefront_open|Mail::|mail\(|CURLOPT_POST|CURLOPT_CUSTOMREQUEST|->set\(' $shipped; then exit 2; fi
          if grep -n $'\r' $shipped tools/storefront/b1155/README-SR.md; then exit 2; fi
          # The shipped code never names a password endpoint or a reset request (the view file name auth/forgot-password.blade.php in the file list is a path, not a request).
          if grep -nE '/account/password|/me/password|/auth/password|password/email|forgot-password([^.]|$)' $shipped; then exit 2; fi
          # No numbered operation report newer than Report1120 may ride along: the owner's wrapper would number the live report one higher.
          if git ls-files docs/operations | grep -E '/(112[1-9]|11[3-9][0-9])-'; then exit 2; fi
          # The pinned Report1120 is archived byte for byte in the repository (the digest is that of the git blob: a CRLF checkout on Windows has another one).
          test "$(git cat-file blob HEAD:docs/operations/1120-B1154-INSTALLER-20261115-105942.md | sha256sum | cut -d' ' -f1)" = 8840b73569db9f2dc1455b14bce5ec7824f27b417e4ef010ddcdcc837030ced0
          # Report1120 itself: terminal PASS facts, the tree and route counts it printed, the state id of the B1154 install.
          git cat-file blob HEAD:docs/operations/1120-B1154-INSTALLER-20261115-105942.md > "$RUNNER_TEMP/report1120.md"
          grep -qx 'B1154_FINAL=PASS_INSTALLED_ADMIN_SHELL_NAVIGATION_CSS_AND_VIEWS_SHOP_STATE_UNCHANGED' "$RUNNER_TEMP/report1120.md"
          grep -qx 'EXIT=0' "$RUNNER_TEMP/report1120.md"
          grep -qx 'B1154_PHASE="INSTALLED_PASS"' "$RUNNER_TEMP/report1120.md"
          grep -q '"verifiedFiles":8574' "$RUNNER_TEMP/report1120.md"
          grep -q '"routeCount":568' "$RUNNER_TEMP/report1120.md"
          grep -q '/home/icaffeco/.ald1n-b1154-state/192319eb0107b9c10c427642c53a53a7/backup' "$RUNNER_TEMP/report1120.md"
      - name: PAYLOAD GATE - the code base and the payload source are read from the B1155_PAYLOAD block of the coordinator
        id: payload
        continue-on-error: false
        run: |
          set -euo pipefail
          c=tools/storefront/b1155/DashboardReportsInstallCoordinator.php
          test "$(grep -c 'B1155_PAYLOAD (begin)' "$c")" = 1
          test "$(grep -c 'B1155_PAYLOAD (end)' "$c")" = 1
          block="$(sed -n '/B1155_PAYLOAD (begin)/,/B1155_PAYLOAD (end)/p' "$c")"
          base="$(grep -o "BASE_COMMIT='[a-f0-9]\{40\}'" <<<"$block" | cut -d"'" -f2)"
          src="$(grep -o "SOURCE_COMMIT='[a-f0-9]\{40\}'" <<<"$block" | cut -d"'" -f2)"
          test -n "$base" && test -n "$src"
          test "$base" = "$B1155_BASE" && test "$src" = "$B1155_MAIN"
          test "$src" != "$base"
          grep -q "public const STEPS=\[" <<<"$block"
          grep -q "public const DIGESTS=\[" <<<"$block"
          echo "B1155_SRC=$src" >> "$GITHUB_ENV"
          echo "payload: source=$src base=$base"
      - name: Fetch the B1155 payload source by SHA and prove the ancestry, the migration, config and composer diff, the routes diff (routes/web.php only) and that production is the B1154 tree
        if: ${{ !cancelled() && steps.payload.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" fetch --no-tags origin "$B1155_SRC"
          test "$(git rev-parse --verify "$B1155_SRC^{commit}")" = "$B1155_SRC"
          git merge-base --is-ancestor "$B1155_BASE" "$B1155_SRC"
          test "$B1155_BASE" = "$B1154_COMMIT"
          git merge-base --is-ancestor "$B1154_CODE_BASE" "$B1154_COMMIT"
          git merge-base --is-ancestor "$B1153_COMMIT" "$B1154_CODE_BASE"
          git merge-base --is-ancestor "$B1155_BASE" "$B1155_REPORT_MAIN"
          git merge-base --is-ancestor "$B1155_REPORT_MAIN" "$B1155_SRC"
          for c in "$B1152_URL" "$B1152_PDF" "$B1152_CODE_BASE"; do git merge-base --is-ancestor "$c" "$B1153_CODE_BASE"; done
          git merge-base --is-ancestor "$B1153_CODE_BASE" "$B1153_COMMIT"
          git merge-base --is-ancestor "$B1150_SOURCE" "$B1152_CODE_BASE"
          git merge-base --is-ancestor "$B1149_SOURCE" "$B1150_SOURCE"
          # No migration, no config, no composer and no .env change (the tests included): the diff of those paths is empty, in the whole CMS tree. Under routes/ only routes/web.php changes (two GET routes).
          test -z "$(git diff --name-only "$B1155_BASE" "$B1155_SRC" -- apps/cms/current/database apps/cms/current/config apps/cms/current/composer.json apps/cms/current/composer.lock apps/cms/current/.env apps/cms/current/.env.example)"
          test "$(git diff --name-only "$B1155_BASE" "$B1155_SRC" -- apps/cms/current/routes)" = "apps/cms/current/routes/web.php"
          echo "database, config and composer diff: empty; routes diff: routes/web.php only"
          # Production is the B1154 tree: the CMS diff from the B1152 code base to the B1153 code base, minus tests and bin, is exactly the nine B1152 files, the whole CMS tree (tests and bin included) of the
          # B1153 payload commit equals the B1154 code base, and the whole CMS tree of the main commit of Report1120 equals BASE (the B1154 payload commit), so BASE is the live tree.
          git diff --no-renames --name-only "$B1152_CODE_BASE" "$B1153_CODE_BASE" -- apps/cms/current | grep -vE '^apps/cms/current/(tests|bin)/' | sort > "$RUNNER_TEMP/b1152-files.txt"
          test "$(wc -l < "$RUNNER_TEMP/b1152-files.txt")" = 9
          cat "$RUNNER_TEMP/b1152-files.txt"
          git diff --quiet "$B1153_COMMIT" "$B1154_CODE_BASE" -- apps/cms/current
          echo "apps/cms/current of the B1153 payload commit equals the B1154 code base"
          git diff --quiet "$B1155_REPORT_MAIN" "$B1155_BASE" -- apps/cms/current
          echo "apps/cms/current of main 6acf8aa9 (Report1120) equals BASE"
      - name: Rebuild the inert runtime bundle of ef3f927b (the 7-day artifact 13363389798 has expired) and pin its manifest digest
        if: ${{ !cancelled() && steps.payload.outcome == 'success' }}
        id: runtime
        run: |
          set -euo pipefail
          # The bundle is built exactly as the B1130 job of b1082-storefront-current-main.yml built it (same source commit, same composer
          # 2.11.1, same locked dependencies, same manifest layout). The manifest holds the sha256 of every file, so the pinned manifest
          # digest d737387e... proves the rebuilt tree is byte for byte the tree that is on the host. The tar.gz itself carries a gzip
          # timestamp and is not byte-reproducible; nothing downstream pins its digest (the stage is made from the manifest).
          work="$RUNNER_TEMP/b1155-runtime"
          mkdir -p "$work/payload" "$work/stage" "$work/build/runtime"
          export B1130_BUILD="$work/build" B1130_HEAD_SHA=ef3f927b77ba573881c2b6dba341732c417e6725 B1130_OUT="$work/payload" B1130_WS="$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          work=pathlib.Path(os.environ['B1130_BUILD']); dest=work/'runtime'; ws=os.environ['B1130_WS']
          source=os.environ['B1130_HEAD_SHA']; prefix='apps/cms/current/'
          roots=('app/','bootstrap/','config/','database/migrations/','database/seeders/','resources/','routes/','public/','bin/')
          files={'artisan','composer.json','composer.lock','VERSION','RELEASE-TAG','CHANGELOG.md'}
          entries=subprocess.check_output(['git','-C',ws,'ls-tree','-r','-z',source,prefix]).split(b'\0')
          selected=[]
          for raw in entries:
              if not raw: continue
              meta,name=raw.decode().split('\t',1); mode,kind,blob=meta.split(); rel=name.removeprefix(prefix)
              if rel not in files and not rel.startswith(roots): continue
              parts=pathlib.PurePosixPath(rel).parts
              assert not rel.startswith('/') and '..' not in parts and '\\' not in rel,rel
              assert mode in ('100644','100755') and kind=='blob',(rel,mode,kind)
              assert not any(x in ('storage','node_modules','.git','tests','test','fixtures') or x.startswith('.env') for x in parts),rel
              if rel.startswith('bootstrap/cache/'): continue
              assert not rel.endswith(('.sql','.sql.gz','.gpg','.p12','.pfx','.key','.sqlite','.sqlite3','.dump')),rel
