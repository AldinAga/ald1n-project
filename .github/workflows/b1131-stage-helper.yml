name: B1143 startup disabled profile RED (NO DEPLOY)
on:
  push:
    branches: [codex/b1131-stage-helper-ci-20261104]
    paths: ['.github/workflows/b1131-stage-helper.yml', 'tools/storefront/b1143/**']
permissions:
  contents: read
jobs:
  uncached-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: opcache,curl
          coverage: none
      - name: Expected old endpoint startup-disabled rejection
        run: |
          set +e
          python3 tools/storefront/b1143/uncached-http-fixture.py tools/storefront/b1143/FrontCacheEndpoint.php > "$RUNNER_TEMP/red.txt" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/red.txt"
          test "$rc" != 0 && grep -F "STARTUP_DISABLED_PROFILE_MUST_BE_SUPPORTED', 503" "$RUNNER_TEMP/red.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b1143-red-evidence
          path: ${{ runner.temp }}/red.txt
          retention-days: 7
