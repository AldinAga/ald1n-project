name: B1142 native canonical44 calibration RED (NO DEPLOY)
on:
  push:
    branches: [codex/b1131-stage-helper-ci-20261104]
    paths: ['.github/workflows/b1131-stage-helper.yml', 'tools/storefront/b1142/**']
permissions:
  contents: read
jobs:
  native-calibration-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: curl
          coverage: none
      - name: Exercise unchanged actual calibration and real owned process guard
        run: |
          set -euo pipefail
          python3 tools/storefront/b1142/native-fixture.py "$GITHUB_WORKSPACE/tools/storefront/b1142" "$GITHUB_WORKSPACE/tools/storefront/b1135" red | tee "$RUNNER_TEMP/b1142-red.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b1142-native-red
          path: ${{ runner.temp }}/b1142-red.json
          if-no-files-found: error
          retention-days: 7
