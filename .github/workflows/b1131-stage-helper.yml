name: B1136 fresh web OPcache read-only verification (NO RESET)
on:
  push:
    branches: [codex/b1131-stage-helper-ci-20261104]
    paths: ['.github/workflows/b1131-stage-helper.yml', 'tools/storefront/b1136/**']
permissions:
  contents: read
jobs:
  focused-read:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: opcache,curl
          coverage: none
      - name: Native syntax and shell portability
        run: |
          set -euo pipefail
          for file in ReadEndpoint.php ReadControl.php operator-entry.php fixture-call.php; do php -l "tools/storefront/b1136/$file"; done
          bash -n tools/storefront/b1136/operator-wrapper.sh
          if grep -nE '<\(|>\(|/dev/fd|python3' tools/storefront/b1136/operator-wrapper.sh; then exit 2; fi
      - name: Actual front HTTP read, full and disabled cache, authentication and owned cleanup
        run: |
          set -euo pipefail
          python3 tools/storefront/b1136/http-fixture.py "$GITHUB_WORKSPACE/tools/storefront/b1136" "$GITHUB_WORKSPACE/apps/cms/current/public/index.php"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b1136-readonly-web-evidence
          path: ${{ runner.temp }}/b1136-http/receipt.json
          if-no-files-found: warn
          retention-days: 7
