name: B1141 existing canonical title classifier RED (NO DEPLOY)
on:
  push:
    branches: [codex/b1131-stage-helper-ci-20261104]
    paths: ['.github/workflows/b1131-stage-helper.yml', 'tools/storefront/b1141/**']
permissions:
  contents: read
jobs:
  focused-title-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: curl
          coverage: none
      - name: Preserve expected-reason RED against unchanged B1140 classifier
        run: |
          set -uo pipefail
          php tools/storefront/b1141/red-alias.php "$GITHUB_WORKSPACE/tools/storefront/b1140" > "$RUNNER_TEMP/b1141-red.txt" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/b1141-red.txt"
          test "$rc" = 2 || exit 2
          grep -Fx 'VALIDATED_ALIAS_TITLE_NOT_CLASSIFIED' "$RUNNER_TEMP/b1141-red.txt" || exit 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b1141-expected-red
          path: ${{ runner.temp }}/b1141-red.txt
          if-no-files-found: error
          retention-days: 7
