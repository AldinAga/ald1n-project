name: B1135 sentinel recovery focused verification (NO DEPLOY)
on:
  push:
    branches: [codex/b1131-stage-helper-ci-20261104]
    paths: ['.github/workflows/b1131-stage-helper.yml', 'tools/storefront/b1135/**']
permissions:
  contents: read
jobs:
  focused-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: opcache,curl
          coverage: none
      - name: Real PHP sentinel long-protection and blocked-cache behavior
        run: |
          set -euo pipefail
          php -l tools/storefront/b1135/HostWebControl.php
          php -l tools/storefront/b1135/FrontCacheEndpoint.php
          python3 tools/storefront/b1135/sentinel-fixture.py "$GITHUB_WORKSPACE/tools/storefront/b1135" "$GITHUB_WORKSPACE/tools/storefront/b1134"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b1135-focused-recovery-evidence
          path: ${{ runner.temp }}/b1135-sentinel/receipt.json
          if-no-files-found: warn
          retention-days: 7
