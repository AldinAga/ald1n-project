name: B1138 own-user selector read-only mock verification
on:
  push:
    branches: [codex/b1131-stage-helper-ci-20261104]
    paths: ['.github/workflows/b1131-stage-helper.yml', 'tools/storefront/b1138/**']
permissions:
  contents: read
jobs:
  readonly-selector:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Actual shell functions, fixed argv and sanitized target filtering
        run: |
          set -euo pipefail
          script=tools/storefront/b1138/b1138-selector-read.sh
          bash -n "$script"
          if grep -nE '<\(|>\(|/dev/fd|python3|--add-options|--replace-options|--reset-options|--delete-options|--quiet' "$script"; then exit 2; fi
          bash tools/storefront/b1138/fixtures.sh "$script"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b1138-selector-read-evidence
          path: ${{ runner.temp }}/b1138-fixture-receipt.json
          if-no-files-found: warn
          retention-days: 7
