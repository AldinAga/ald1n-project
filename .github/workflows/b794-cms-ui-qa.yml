name: B794 CMS UI isolated QA
on:
  push:
    branches: [feat/b794-ui-polish-20261022]
    paths:
      - 'apps/cms/current/**'
      - '.github/workflows/b794-cms-ui-qa.yml'
permissions:
  contents: read
concurrency:
  group: b794-ui-qa
  cancel-in-progress: false
jobs:
  cms:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_DATABASE: ald1n_test
          MARIADB_USER: ald1n_test
          MARIADB_PASSWORD: ald1n_test
          MARIADB_ROOT_PASSWORD: ci_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ald1n_test
      DB_USERNAME: ald1n_test
      DB_PASSWORD: ald1n_test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      TURNSTILE_ENABLED: 'false'
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_mysql,pdo_sqlite,dom,curl,fileinfo,openssl,tokenizer,xml
          coverage: none
      - name: Install exact Composer lock (no environment or migration scripts)
        working-directory: apps/cms/current
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Export public source and dependency-only test workspace
        run: |
          set -eu
          test -z "$(git ls-files 'apps/cms/current/.env' 'apps/cms/current/auth.json')"
          out="$RUNNER_TEMP/b794-workspace"
          mkdir -p "$out"
          git archive --format=tar HEAD > "$out/source.tar"
          tar -C apps/cms/current -czf "$out/vendor.tar.gz" vendor
          git rev-parse HEAD > "$out/source-commit.txt"
          sha256sum "$out/source.tar" "$out/vendor.tar.gz" > "$out/SHA256SUMS.txt"
      - name: Retain reproducible workspace for local browser and PHP QA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b794-public-source-test-workspace-${{ github.sha }}
          path: ${{ runner.temp }}/b794-workspace/
          retention-days: 1
          if-no-files-found: error
      - name: Canonical static gate
        working-directory: apps/cms/current
        run: php bin/static-check.php
      - name: Dashboard baseline on disposable MariaDB
        working-directory: apps/cms/current
        run: |
          php artisan test -c phpunit.mysql.xml tests/Unit/DashboardPeriodTest.php tests/Unit/DashboardBrandMixTest.php tests/Feature/DashboardD1Test.php tests/Feature/DashboardD2Test.php tests/Feature/DashboardD3Test.php
      - name: B794 regression tests when present
        working-directory: apps/cms/current
        run: |
          if test -f tests/Feature/UiRefinement794Test.php; then
            php artisan test -c phpunit.mysql.xml tests/Feature/UiRefinement794Test.php
          else
            echo 'Baseline only; B794 regression implementation not yet present.'
          fi
      - name: Scope
        if: always()
        run: echo 'PRODUCTION=UNTOUCHED ANDROID_BUILD=NONE OTA=NONE PLAY=NONE'
