name: Android v1.4 isolated Liquid Glass native compile
on:
  push:
    branches:
      - feature/android-v14-liquid-glass-poc-20261018
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout disposable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@4c85f50db61ecec01d8f8a1e3ca7a7c21f0fc75c
      - name: Install locked Expo dependencies and isolated candidate
        working-directory: apps/mobile/current
        shell: bash
        run: |
          set -euo pipefail
          test "${CI}" = 1
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts react-native-android-liquid-glass@0.2.1
          node -e "const p=require('./node_modules/react-native-android-liquid-glass/package.json'); if(p.version!=='0.2.1') process.exit(1)"
      - name: Materialize isolated navigation PoC
        working-directory: apps/mobile/current
        shell: bash
        run: |
          set -euo pipefail
          cp experiments/liquid-glass-v14/LiquidGlassV14NavigationPrototype.tsx.example experiments/liquid-glass-v14/LiquidGlassV14NavigationPrototype.tsx
          npx tsc --noEmit
      - name: Generate disposable Android native project
        working-directory: apps/mobile/current
        shell: bash
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --no-install
          test -d android
      - name: Compile disposable Android APK
        working-directory: apps/mobile/current/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo 'NATIVE_LIQUID_GLASS_COMPILE=PASS'
      - name: No production release
        if: always()
        run: |
          echo 'PRODUCTION_BUILD=NO'
          echo 'EAS_BUILD=NO'
          echo 'OTA=NO'
          echo 'PLAY_UPLOAD=NO'
