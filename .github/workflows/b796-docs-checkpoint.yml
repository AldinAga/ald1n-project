name: B796 documentation checkpoint
on:
  push:
    branches: [docs/b796-source-and-first-payment-20261022]
    paths: ['.github/workflows/b796-docs-checkpoint.yml']
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify immutable document inputs and apply exact four-file change
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = docs/b796-source-and-first-payment-20261022
          git merge-base --is-ancestor 6f81f2bcfca1559dae92c39be323a1c827c31239 HEAD
          python - <<'PY'
          import pathlib,subprocess,hashlib,gzip,base64,os
          expected={'AGENTS.md':'b9e249bd0af339569176792c97997c356bfdb58d','docs/operations/000-LATEST.md':'304617d8ca5db85f64bdbc87b7a206a15a318f7e','docs/operations/OWNER-REQUIREMENTS-20261022.md':'151346bce699bc4b337047566685ad14e9b2d6ab'}
          for p,sha in expected.items():
              assert subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip()==sha,p
          text=pathlib.Path('scripts/ci/b796-docs.patch.gz.b64').read_text()
          # Repair two identified transfer-only transcription errors; the full decoded hash remains mandatory.
          for wrong,right in [('yoq+c6Csn+sqJvnKir5yoq+c6Csn+sqJvnKir5zo','yoq+c6Csn+sqJvnKir5zo'),('VlcHbUzx1LtPY','VlcHbUzxLtPY')]:
              assert text.count(wrong)==1, 'Unexpected transferred payload'
              text=text.replace(wrong,right)
          patch=gzip.decompress(base64.b64decode(text))
          assert hashlib.sha256(patch).hexdigest()=='c08a25b08186bd0bff571c06e6edefe05b9ffec1b3a1c39c4f8a3654740fbbc4'
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'docs.patch';p.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply','--index',str(p)],check=True)
          wanted=set(expected)|{'docs/operations/797-BATCH796-OPERATOR-MOTION-TRACKING-SOURCE-QA-20261022.md'}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual==wanted,(wanted,actual)
          for name in ['AGENTS.md','docs/operations/OWNER-REQUIREMENTS-20261022.md']:
              body=pathlib.Path(name).read_text()
              assert 'FIRST verified positive incoming payment' in body
              assert 'explicitly settle partial/deposit' not in body
          assert 'PRODUCTION B796 PENDING' in pathlib.Path('docs/operations/000-LATEST.md').read_text()
          assert hashlib.sha256(pathlib.Path('docs/operations/797-BATCH796-OPERATOR-MOTION-TRACKING-SOURCE-QA-20261022.md').read_bytes()).hexdigest()=='cf508ba97310c493c69fb2ce77d9ebba4ec59ac1ef11121f664dabdeb0d99bfd'
          print('EXACT_DOCUMENTS_AND_FIRST_PAYMENT_DECISION=PASS')
          PY
          git rm scripts/ci/b796-docs.patch.gz.b64 .github/workflows/b796-docs-checkpoint.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(ops): record tested B796 delivery and first confirmed-payment warranty decision'
          test -z "$(git diff 6f81f2bcfca1559dae92c39be323a1c827c31239 HEAD -- apps .github scripts)"
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "DOCS_COMMIT=$(git rev-parse HEAD) APPLICATION_CHANGE=NONE PRODUCTION=UNTOUCHED" | tee -a "$GITHUB_STEP_SUMMARY"
