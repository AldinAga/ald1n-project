name: Android LG-04 Wave5 - Home Admin Orders source QA (NO EAS)
on:
  pull_request:
    branches:
      - feature/android-lg04-wave4-home-admin-shortcuts-20261020
    paths:
      - 'apps/mobile/current/src/app/(app)/(tabs)/home.tsx'
      - 'apps/mobile/current/src/app/(app)/admin/index.tsx'
      - 'apps/mobile/current/src/app/(app)/admin/orders/index.tsx'
      - 'apps/mobile/current/src/features/admin/orders-admin-api.ts'
      - 'apps/mobile/current/scripts/release25/android-lg04-wave5-home-admin-orders-polish.test.mjs'
      - 'apps/cms/current/app/Services/OrderIndexService.php'
      - 'apps/cms/current/app/Http/Controllers/Api/V1/Admin/OrderController.php'
      - 'apps/cms/current/tests/Unit/AdminOrderListItemSummaryTest.php'
      - '.github/workflows/android-lg04-wave5-home-admin-orders-source-qa.yml'
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Source-only Mobile regressions
        working-directory: apps/mobile/current
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --test scripts/release25/android-lg04-wave5-home-admin-orders-polish.test.mjs
          npm run typecheck
          npm run validate
          npm run test:release25
      - name: Build Android JS bundle ONLY (never EAS or OTA)
        working-directory: apps/mobile/current
        env:
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_API_URL: https://cms.ald1n.com/api/v1
          ALD1N_LG03_PLAY_TESTING: '1'
          EAS_BUILD_PROFILE: lg03-play-testing
        run: |
          set -euo pipefail
          npx expo export --platform android --output-dir "$RUNNER_TEMP/ald1n-lg04-wave5-js-only"
          test -d "$RUNNER_TEMP/ald1n-lg04-wave5-js-only"
          echo 'WAVE5_ANDROID_JS_ONLY_NO_EAS_BUILD=PASS'
  cms-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/cms/current
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, intl
          coverage: none
          tools: composer:v2
      - name: Composer and PHP source contract (no migrations or database)
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress --no-ansi
          php -l app/Services/OrderIndexService.php
          php -l app/Http/Controllers/Api/V1/Admin/OrderController.php
          php artisan test tests/Unit/AdminOrderListItemSummaryTest.php --stop-on-failure
          php bin/static-check.php
          echo 'CMS_PRODUCTION_DB_MUTATIONS=NONE'
          echo 'EAS_BUILDS=NONE'
          echo 'OTA_PLAY_MERGE=NONE'
