name: B797 isolated candidate integration
on:
  push:
    branches: ['feat/b797-first-payment-warranty-20261022']
    paths: ['.github/workflows/b797-candidate.yml']
permissions:
  contents: write
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_DATABASE: ald1n_test
          MARIADB_USER: ald1n_test
          MARIADB_PASSWORD: ald1n_test
          MARIADB_ROOT_PASSWORD: ci_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://127.0.0.1
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ald1n_test
      DB_USERNAME: ald1n_test
      DB_PASSWORD: ald1n_test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      TURNSTILE_ENABLED: 'false'
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_mysql,pdo_sqlite,dom,curl,fileinfo,openssl,tokenizer,xml,xmlwriter,intl,gd,zip,bcmath,pcntl
          coverage: none
      - name: Decode exact candidate and immutable baseline evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$DB_DATABASE" = ald1n_test
          test "$DB_HOST" = 127.0.0.1
          test ! -e apps/cms/current/.env
          mkdir -p "$RUNNER_TEMP/b797-green"
          gh api repos/AldinAga/ald1n-project/actions/artifacts/12458523622/zip > "$RUNNER_TEMP/b797-baseline.zip"
          echo "77e271d6f9bab0a229939f71c1d63238192d866d3cbbeea0b815a23c3371032a  $RUNNER_TEMP/b797-baseline.zip" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,lzma,os,zipfile
          data=''.join(Path(f'qa/b797-candidate/part{i:02d}.b64').read_text().strip() for i in range(5))
          patch=lzma.decompress(base64.b64decode(data,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='b912d1009f61a1d2d5c71821de73b1b35b66d52efba7c2835134e37f22143185'
          paths=[line.split()[2][2:] for line in patch.decode().splitlines() if line.startswith('diff --git ')]
          assert len(paths)==28 and all(p.startswith('apps/cms/current/') and '..' not in p for p in paths)
          Path(os.environ['RUNNER_TEMP']+'/b797-source.patch').write_bytes(patch)
          Path(os.environ['RUNNER_TEMP']+'/b797-green/paths.txt').write_text('\n'.join(paths)+'\n')
          z=zipfile.ZipFile(os.environ['RUNNER_TEMP']+'/b797-baseline.zip')
          Path(os.environ['RUNNER_TEMP']+'/b797-green/baseline.xml').write_bytes(z.read('baseline.xml'))
          PY
          git diff --exit-code 9bf18d475cd603783c7c81c6a2001875aed3ccee HEAD -- apps/cms/current/app apps/cms/current/routes apps/cms/current/database apps/cms/current/resources apps/cms/current/composer.lock
          git apply --check "$RUNNER_TEMP/b797-source.patch"
          git apply "$RUNNER_TEMP/b797-source.patch"
          git diff --check
          cd apps/cms/current
          install -m 600 /dev/null .env
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Targeted first-payment, direct-sale and isolated-recipient GREEN
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          vendor/bin/phpunit -c phpunit.mysql.xml --filter 'Warranty797RedTest|FirstPaymentWarranty797Test|WarrantyExpiryIsolation797Test' --log-junit "$RUNNER_TEMP/b797-green/targeted.xml" > "$RUNNER_TEMP/b797-green/targeted.log" 2>&1 || { cat "$RUNNER_TEMP/b797-green/targeted.log"; exit 1; }
          cat "$RUNNER_TEMP/b797-green/targeted.log"
          php bin/static-check.php > "$RUNNER_TEMP/b797-green/static.log" || { tail -60 "$RUNNER_TEMP/b797-green/static.log"; exit 1; }
      - name: Entire configured suite and no newly failing tests
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          rc=0
          vendor/bin/phpunit -c phpunit.mysql.xml --log-junit "$RUNNER_TEMP/b797-green/full.xml" > "$RUNNER_TEMP/b797-green/full.log" 2>&1 || rc=$?
          echo "FULL_SUITE_RC=$rc" | tee "$RUNNER_TEMP/b797-green/full-rc.txt"
          tail -15 "$RUNNER_TEMP/b797-green/full.log"
          python - <<'PY'
          import os,json,xml.etree.ElementTree as E
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'b797-green'
          def problems(p):
              return sorted({(c.attrib.get('classname'),c.attrib.get('name')) for c in E.parse(p).findall('.//testcase') if c.find('failure') is not None or c.find('error') is not None})
          before=problems(root/'baseline.xml'); after=problems(root/'full.xml'); new=sorted(set(after)-set(before))
          (root/'comparison.json').write_text(json.dumps({'baseline':before,'candidate':after,'new_failures':new},indent=2))
          print('BASELINE_PROBLEMS',len(before),'CANDIDATE_PROBLEMS',len(after),'NEW',new)
          assert not new, 'New failures are not permitted'
          PY
      - name: Publish only verified source to isolated feature branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feat/b797-first-payment-warranty-20261022
          git add apps/cms/current/app apps/cms/current/database/migrations/2026_10_22_210000_create_warranty_issuance_and_expiry_delivery_ledgers.php apps/cms/current/resources/views apps/cms/current/routes/web.php apps/cms/current/tests
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(cms): first-payment certificates and independent opted-in expiry recipients (B797 candidate)'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git rev-parse HEAD > "$RUNNER_TEMP/b797-green/source-commit.txt"
      - name: Export inspected source and synthetic evidence
        if: always()
        run: |
          git diff --binary > "$RUNNER_TEMP/b797-green/uncommitted.patch"
          tar --exclude=vendor --exclude=.env --exclude=storage --exclude=bootstrap/cache -czf "$RUNNER_TEMP/b797-green/cms-candidate.tar.gz" apps/cms/current
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b797-green-${{ github.sha }}
          path: ${{ runner.temp }}/b797-green/
          retention-days: 7
      - name: No production or release mutation
        if: always()
        run: echo 'PRODUCTION=NONE DATABASE=DISPOSABLE MAIL=array NATIVE_BUILD_OTA_PLAY=NONE'
