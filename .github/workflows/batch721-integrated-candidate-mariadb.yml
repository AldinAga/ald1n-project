name: Batch721 integrated candidate MariaDB QA
on:
  push:
    branches:
      - audit/b720-integrated-release-candidate-20261017
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mariadb-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_ROOT_PASSWORD: isolated-ci-only
          MARIADB_DATABASE: ald1n_retirement_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -pisolated-ci-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ald1n_retirement_ci
      DB_USERNAME: root
      DB_PASSWORD: isolated-ci-only
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      TURNSTILE_ENABLED: 'false'
      PULSE_ENABLED: 'false'
      TELESCOPE_ENABLED: 'false'
    steps:
      - name: Checkout exact integration candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source ancestry and immutable boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor bc7fdd3580c02ac3d45fd1b76b3b09aaf24bd60d HEAD
          git merge-base --is-ancestor 6f8791552be4a1568ee8f2f38cd20233ccea6d2f HEAD
          git merge-base --is-ancestor 0ccf871451ee7efeebbb257282c2615d8eab172e HEAD
          git diff --quiet bc7fdd3580c02ac3d45fd1b76b3b09aaf24bd60d -- apps/cms/current/public/.htaccess
          test -z "$(git status --porcelain)"
          echo EXACT_INTEGRATED_SOURCE=PASS
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, intl, gd, zip, bcmath
          coverage: none
          tools: composer:v2
      - name: Install dependencies in ephemeral runner
        working-directory: apps/cms/current
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate --force
      - name: Attest disposable MariaDB identity
        shell: bash
        run: |
          set -euo pipefail
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306;dbname=ald1n_retirement_ci","root","isolated-ci-only",[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]); if($p->query("SELECT DATABASE()")->fetchColumn()!=="ald1n_retirement_ci" || !preg_match("/^10\\.11\\.19-MariaDB/i",$p->query("SELECT VERSION()")->fetchColumn())) exit(31); echo "DISPOSABLE_MARIADB=PASS\\n";'
      - name: Retirement HTTP/MySQL integration
        working-directory: apps/cms/current
        shell: bash
        run: |
          set -euo pipefail
          php artisan test -c phpunit.mysql.xml tests/Feature/UserRetirementMySqlIntegrationTest.php --no-ansi
      - name: MariaDB ENUM migration compatibility
        working-directory: apps/cms/current
        shell: bash
        run: |
          set -euo pipefail
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306;dbname=ald1n_retirement_ci","root","isolated-ci-only",[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]); if(!preg_match("/^10\\.11\\.19-MariaDB/",(string)$p->query("SELECT VERSION()")->fetchColumn())) exit(31); $p->exec("CREATE DATABASE IF NOT EXISTS ald1n_issue19_mariadb_ci");'
          export DB_DATABASE=ald1n_issue19_mariadb_ci
          export ALD1N_DISPOSABLE_CI=mariadb-10.11.19-only
          php tests/Integration/StockMovementEnumMariaDbSafetyProbe.php
      - name: Positive manual commission baseline RED and candidate GREEN
        if: github.head_ref == 'codex/b1081-positive-commission-main-20261104'
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/b1081-commission-baseline"
          evidence="$RUNNER_TEMP/b1081-commission-evidence"
          base=ac52ce535ee8d9af3dbfb887d6f58a7923fcaa1a
          test ! -e "$baseline"
          mkdir -p "$evidence"
          git diff --exit-code "$base" HEAD -- apps/cms/current/composer.json apps/cms/current/composer.lock apps/mobile/current/package.json apps/mobile/current/package-lock.json apps/cms/current/app/Services/CommissionCalculator.php apps/cms/current/app/Services/OrderService.php ':(glob)apps/cms/current/tests/**/*B805*' ':(glob)apps/cms/current/tests/**/*B809*' ':(glob)apps/cms/current/tests/**/*B815*'
          git worktree add --detach "$baseline" "$base"
          for file in tests/Feature/ManualCommissionPolicyB1079Test.php tests/Unit/CommissionCalculatorTest.php tests/Unit/CommissionPercentagePolicyContractTest.php; do
            cp "apps/cms/current/$file" "$baseline/apps/cms/current/$file"
          done
          cp apps/cms/current/.env "$baseline/apps/cms/current/.env"
          composer install --working-dir="$baseline/apps/cms/current" --no-interaction --prefer-dist --no-progress
          php <<'PHP'
          <?php
          $pdo=new PDO('mysql:host=127.0.0.1;port=3306;dbname=ald1n_retirement_ci','root','isolated-ci-only',[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
          if(!str_starts_with((string)$pdo->query('SELECT VERSION()')->fetchColumn(),'10.11.19-MariaDB'))exit(31);
          foreach(['ald1n_commission_red_ci','ald1n_commission_green_ci'] as $name)$pdo->exec('CREATE DATABASE '.$name);
          echo "TWO_NEW_DISPOSABLE_COMMISSION_DATABASES=PASS\n";
          PHP
          run_commission() {
            tree="$1"; label="$2"; database="$3"
            set +e
            (cd "$tree/apps/cms/current" && DB_DATABASE="$database" php vendor/bin/phpunit -c phpunit.mysql.xml --log-junit "$evidence/$label.xml" tests/Feature/ManualCommissionPolicyB1079Test.php tests/Unit/CommissionCalculatorTest.php tests/Unit/CommissionPercentagePolicyContractTest.php) 2>&1 | tee "$evidence/$label.log"
            result=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$result" > "$evidence/$label.exit"
          }
          run_commission "$baseline" baseline ald1n_commission_red_ci
          run_commission "$GITHUB_WORKSPACE" candidate ald1n_commission_green_ci
          EVIDENCE="$evidence" python3 - <<'PY'
          import os,json,pathlib,xml.etree.ElementTree as E
          d=pathlib.Path(os.environ['EVIDENCE'])
          def read(label):
              cases=E.parse(d/(label+'.xml')).getroot().findall('.//testcase')
              ids=[(c.get('class',''),c.get('name')) for c in cases]
              bad=[c.get('name') for c in cases if c.find('failure') is not None or c.find('error') is not None]
              result={'count':len(cases),'assertions':sum(int(c.get('assertions','0')) for c in cases),'failed':bad,'errors':sum(c.find('error') is not None for c in cases),'skipped':sum(c.find('skipped') is not None for c in cases),'exit':int((d/(label+'.exit')).read_text())}
              assert len(ids)==len(set(ids))==24,result
              assert result['skipped']==0,result
              return result,ids
          before,old=read('baseline');after,new=read('candidate')
          assert old==new,'same exact owner-policy tests must execute on both sides'
          assert before['exit']!=0 and before['failed'] and before['errors']==0,before
          assert any('test_api_rejects_invalid_manual_amount_without_creating_product' in name and 'zero' in name for name in before['failed']),before
          assert after['exit']==0 and not after['failed'],after
          result={'base':'ac52ce535ee8d9af3dbfb887d6f58a7923fcaa1a','baseline':before,'candidate':after,'same_exact_cases':True,'protected_source_and_dependency_parity':True}
          (d/'comparison.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          PY
          (cd apps/cms/current && php bin/static-check.php) 2>&1 | tee "$evidence/static.log"
      - name: Retain complete commission policy evidence
        if: always() && github.head_ref == 'codex/b1081-positive-commission-main-20261104'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b1081-commission-main-red-green
          path: ${{ runner.temp }}/b1081-commission-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Product-only contracts and metadata repair real baseline versus candidate
        if: github.head_ref == 'codex/b1083-product-only-test-contracts-20261104'
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/b1083-contract-baseline"
          evidence="$RUNNER_TEMP/b1083-evidence"
          base=1c185c6c5a97d3917069c8d73ad4d2df781c0e7c
          test ! -e "$baseline"
          mkdir -p "$evidence"
          git diff --exit-code "$base" HEAD -- apps/cms/current/app apps/cms/current/resources apps/cms/current/database apps/cms/current/bootstrap apps/cms/current/config apps/cms/current/routes apps/cms/current/composer.json apps/cms/current/composer.lock apps/mobile ':(glob)apps/cms/current/tests/**/*B805*' ':(glob)apps/cms/current/tests/**/*B809*' ':(glob)apps/cms/current/tests/**/*B815*'
          git worktree add --detach "$baseline" "$base"
          cp apps/cms/current/.env "$baseline/apps/cms/current/.env"
          composer install --working-dir="$baseline/apps/cms/current" --no-interaction --prefer-dist --no-progress
          php <<'PHP'
          <?php
          $pdo=new PDO('mysql:host=127.0.0.1;port=3306;dbname=ald1n_retirement_ci','root','isolated-ci-only',[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
          if(!str_starts_with((string)$pdo->query('SELECT VERSION()')->fetchColumn(),'10.11.19-MariaDB'))exit(31);
          foreach(['ald1n_contract_red_ci','ald1n_contract_green_ci'] as $name)$pdo->exec('CREATE DATABASE '.$name);
          PHP
          run_contracts() {
            tree="$1"; label="$2"; database="$3"
            set +e
            (cd "$tree/apps/cms/current" && DB_DATABASE="$database" php vendor/bin/phpunit -c phpunit.mysql.xml --colors=never --log-junit "$evidence/$label.xml" tests/Unit/CatalogDetailBladeContractTest.php tests/Unit/StableMaintenanceContractTest.php tests/Unit/StorageCapacityTotalContractTest.php tests/Unit/LegacyReadOnlyGuardTest.php tests/Unit/DeliveryNoteMigrationContractTest.php tests/Feature/CatalogDetailPageTest.php tests/Feature/ProductionOrderInventoryTest.php) 2>&1 | tee "$evidence/$label.log"
            result=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$result" > "$evidence/$label.exit"
          }
          run_contracts "$baseline" baseline ald1n_contract_red_ci
          run_contracts "$GITHUB_WORKSPACE" candidate ald1n_contract_green_ci
          EVIDENCE="$evidence" python3 - <<'PY'
          import os,json,pathlib,xml.etree.ElementTree as E
          d=pathlib.Path(os.environ['EVIDENCE'])
          def read(label):
              root=E.parse(d/(label+'.xml')).getroot();ids=[];bad=[];assertions=0;skipped=0
              for suite in root.iter('testsuite'):
                  for c in suite.findall('testcase'):
                      key=(c.get('classname') or c.get('class') or suite.get('name'))+'::'+c.get('name')
                      ids.append(key);assertions+=int(c.get('assertions','0'))
                      if c.find('failure') is not None or c.find('error') is not None:bad.append(key)
                      skipped+=c.find('skipped') is not None
              assert len(ids)==len(set(ids)) and ids
              return {'cases':len(ids),'assertions':assertions,'failed':bad,'skipped':skipped,'exit':int((d/(label+'.exit')).read_text())},set(ids)
          before,old=read('baseline');after,new=read('candidate')
          assert before['exit']!=0 and len(before['failed'])==5,before
          assert after['exit']==0 and not after['failed'],after
          assert before['skipped']==after['skipped']==0
          missing=old-new
          assert len(missing)==1 and next(iter(missing)).endswith('::test_mutating_and_locking_queries_are_blocked'),missing
          added=new-old
          assert len(added)==8,added
          assert sum('::test_mutating_and_locking_queries_are_blocked with data set #' in x for x in added)==7,added
          assert sum(x.endswith('::test_product_storage_totals_and_legacy_fallback_remain_supported_without_variants') for x in added)==1,added
          result={'base':'1c185c6c5a97d3917069c8d73ad4d2df781c0e7c','baseline':before,'candidate':after,'old_provider_discovery_error':sorted(missing),'actual_original_provider_cases_and_new_storage_behavior':sorted(added),'application_and_protected_source_byte_identical':True}
          (d/'comparison.json').write_text(json.dumps(result,indent=2));print(json.dumps(result))
          PY
      - name: Retain all product-only contract evidence including RED
        if: always() && github.head_ref == 'codex/b1083-product-only-test-contracts-20261104'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b1083-real-mariadb-contract-red-green
          path: ${{ runner.temp }}/b1083-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Delegated catalog and portal contracts baseline versus candidate
        if: github.head_ref == 'codex/b1084-delegated-contracts-20261104'
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/b1084-contract-baseline"
          evidence="$RUNNER_TEMP/b1084-evidence"
          base=5be72c71ce6e0f42e6281a2ef9d3d2a41c385ce7
          test ! -e "$baseline"
          mkdir -p "$evidence"
          git diff --exit-code "$base" HEAD -- apps/cms/current/app apps/cms/current/resources apps/cms/current/database apps/cms/current/bootstrap apps/cms/current/config apps/cms/current/routes apps/cms/current/composer.json apps/cms/current/composer.lock apps/mobile ':(glob)apps/cms/current/tests/**/*B805*' ':(glob)apps/cms/current/tests/**/*B809*' ':(glob)apps/cms/current/tests/**/*B815*'
          git worktree add --detach "$baseline" "$base"
          cp apps/cms/current/.env "$baseline/apps/cms/current/.env"
          composer install --working-dir="$baseline/apps/cms/current" --no-interaction --prefer-dist --no-progress
          php <<'PHP'
          <?php
          $pdo=new PDO('mysql:host=127.0.0.1;port=3306;dbname=ald1n_retirement_ci','root','isolated-ci-only',[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
          if(!str_starts_with((string)$pdo->query('SELECT VERSION()')->fetchColumn(),'10.11.19-MariaDB'))exit(31);
          foreach(['ald1n_contract_red_ci','ald1n_contract_green_ci'] as $name)$pdo->exec('CREATE DATABASE '.$name);
          PHP
          run_contracts() {
            tree="$1"; label="$2"; database="$3"
            set +e
            (cd "$tree/apps/cms/current" && DB_DATABASE="$database" php vendor/bin/phpunit -c phpunit.mysql.xml --colors=never --log-junit "$evidence/$label.xml" tests/Unit/CatalogPageRuntimeContractTest.php tests/Unit/CatalogSettingsIntegrityHotfixContractTest.php tests/Unit/CatalogSettingsProductDataContractTest.php tests/Unit/CustomerPortal2ContractTest.php tests/Feature/CatalogAccessTest.php tests/Feature/CatalogDetailPageTest.php tests/Feature/CustomerPortal2Test.php tests/Feature/CustomerPortalDashboardTest.php) 2>&1 | tee "$evidence/$label.log"
            result=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$result" > "$evidence/$label.exit"
          }
          run_contracts "$baseline" baseline ald1n_contract_red_ci
          run_contracts "$GITHUB_WORKSPACE" candidate ald1n_contract_green_ci
          EVIDENCE="$evidence" python3 - <<'PY'
          import os,json,pathlib,xml.etree.ElementTree as E
          d=pathlib.Path(os.environ['EVIDENCE'])
          def read(label):
              root=E.parse(d/(label+'.xml')).getroot();ids=[];bad=[];assertions=0;skipped=0
              for suite in root.iter('testsuite'):
                  for c in suite.findall('testcase'):
                      key=(c.get('classname') or c.get('class') or suite.get('name'))+'::'+c.get('name')
                      ids.append(key);assertions+=int(c.get('assertions','0'))
                      if c.find('failure') is not None or c.find('error') is not None:bad.append(key)
                      skipped+=c.find('skipped') is not None
              assert len(ids)==len(set(ids)) and ids
              return {'cases':len(ids),'assertions':assertions,'failed':bad,'skipped':skipped,'exit':int((d/(label+'.exit')).read_text())},set(ids)
          before,old=read('baseline');after,new=read('candidate')
          expected={
              'Tests.Unit.CatalogPageRuntimeContractTest::test_all_correlated_catalog_pages_receive_their_required_view_data',
              'Tests.Unit.CatalogSettingsIntegrityHotfixContractTest::test_deleted_specification_fields_are_purged_without_stale_references',
              'Tests.Unit.CatalogSettingsProductDataContractTest::test_specification_fields_can_be_deactivated_or_permanently_deleted',
              'Tests.Unit.CustomerPortal2ContractTest::test_order_relink_requires_confirmation_and_writes_history',
          }
          # PHPUnit may spell namespaces with backslashes; preserve all identities.
          normalize=lambda values:{x.replace('\\\\','.') for x in values}
          assert before['exit']!=0 and normalize(before['failed'])==expected,before
          assert after['exit']==0 and not after['failed'],after
          assert before['skipped']==after['skipped']==0
          assert old==new,'no original testcase may disappear or be replaced'
          result={'base':'5be72c71ce6e0f42e6281a2ef9d3d2a41c385ce7','baseline':before,'candidate':after,'same_exact_testcase_identities':True,'application_and_protected_source_byte_identical':True}
          (d/'comparison.json').write_text(json.dumps(result,indent=2));print(json.dumps(result))
          PY
      - name: Retain all delegated contract evidence including RED
        if: always() && github.head_ref == 'codex/b1084-delegated-contracts-20261104'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b1084-real-mariadb-contract-red-green
          path: ${{ runner.temp }}/b1084-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Results do not deploy production
        if: always()
        run: |
          echo "PRODUCTION_DEPLOYMENT=NO"
          echo "PRODUCTION_DATABASE_MUTATIONS=ZERO"

  validator-paths:
    if: github.head_ref == 'fix/windows-validator-paths-20261103'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Locked install and complete Windows/POSIX validator regression
        working-directory: apps/mobile/current
        shell: bash
        run: |
          set -euo pipefail
          npm exec --yes --package=npm@10.9.2 -- npm ci --no-audit --no-fund
          node --test scripts/validate-project-paths.test.mjs
          npm run typecheck
          node scripts/validate-project.mjs
          git diff --exit-code -- package.json package-lock.json

  release-history:
    if: contains(fromJSON('["codex/b1080-release-history-main-20261104","codex/b1080-main-postmerge-20261104","codex/b1081-positive-commission-main-20261104"]'), github.head_ref) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Locked mobile install and existing canonical source gates only
        working-directory: apps/mobile/current
        shell: bash
        run: |
          set -euo pipefail
          export npm_config_cache="$RUNNER_TEMP/b1079-npm-cache"
          node -e "if(require('./package.json').packageManager!=='npm@10.9.2')process.exit(2)"
          npm exec --yes --package=npm@10.9.2 -- npm ci --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/b1079-mobile-install.log"
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/b1079-mobile-typecheck.log"
          node scripts/validate-project.mjs 2>&1 | tee "$RUNNER_TEMP/b1079-mobile-validator.log"
          git diff --exit-code -- package.json package-lock.json
      - name: Full Release25 baseline and candidate, preserve historical failures
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/b1079-release25-baseline"
          base=0b73ce6eed7fe671b960693fbe74a7db36fdc47f
          test ! -e "$baseline"
          git diff --exit-code "$base" HEAD -- apps/mobile/current/scripts/release25 apps/mobile/current/package.json apps/mobile/current/package-lock.json \
            ':(exclude)apps/mobile/current/scripts/release25/batch576-report575-remediation.test.mjs' \
            ':(exclude)apps/mobile/current/scripts/release25/batch682-eas-cli25-authority.test.mjs' \
            ':(exclude)apps/mobile/current/scripts/release25/deep-offline-contract.test.mjs'
          test "$(git diff --name-only "$base" HEAD -- apps/mobile/current/scripts/release25 | wc -l)" -eq 3
          git worktree add --detach "$baseline" "$base"
          test "$(git -C "$baseline" rev-parse HEAD)" = "$base"
          ln -s "$GITHUB_WORKSPACE/apps/mobile/current/node_modules" "$baseline/apps/mobile/current/node_modules"
          run_release25() {
            tree="$1"; label="$2"
            set +e
            (cd "$tree/apps/mobile/current" && node --test scripts/release25/*.test.mjs) 2>&1 | tee "$RUNNER_TEMP/b1079-$label-release25.tap"
            result=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$result" > "$RUNNER_TEMP/b1079-$label-release25.exit"
          }
          run_release25 "$baseline" baseline
          run_release25 "$GITHUB_WORKSPACE" candidate
          python3 - <<'PY'
          import json,os,pathlib,re
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          def scan(text):
              counts={}
              for key in ('tests','pass','fail','cancelled','skipped','todo'):
                  found=re.findall(r'(?m)^# '+key+r' (\d+)$',text)
                  assert found,'missing TAP count '+key
                  counts[key]=int(found[-1])
              failed=re.findall(r'(?m)^not ok \d+ - (.+)$',text)
              assert len(failed)==len(set(failed))==counts['fail'],'ambiguous TAP failures'
              return dict(counts,failed_ids=failed)
          fixture='\n'.join(['ok 1 - accepted','not ok 2 - sentinel','# tests 2','# pass 1','# fail 1','# cancelled 0','# skipped 0','# todo 0'])
          assert scan(fixture)['failed_ids']==['sentinel']
          try:
              scan(fixture.replace('not ok 2 - sentinel','ok 2 - sentinel'))
          except AssertionError:
              pass
          else:
              raise AssertionError('TAP census self-check did not reject hidden failure')
          results={}
          for label in ('baseline','candidate'):
              result=scan((root/('b1079-'+label+'-release25.tap')).read_text())
              assert result['tests']==309,result
              assert result['cancelled']==result['skipped']==result['todo']==0,result
              rc=int((root/('b1079-'+label+'-release25.exit')).read_text())
              assert rc==(1 if result['fail'] else 0),rc
              results[label]=result
          new=sorted(set(results['candidate']['failed_ids'])-set(results['baseline']['failed_ids']))
          report=dict(results,new_failed_ids=new,release25_source_and_dependency_census='three stale contract files reconciled with current dated headings and B1012 ALT Node22; all other tests and dependency locks unchanged')
          (root/'b1079-release25-comparison.json').write_text(json.dumps(report,indent=2))
          assert not new,new
          assert results['baseline']['fail']==4,results['baseline']
          if results['candidate']['fail']:
              raise SystemExit('HOLD_HISTORICAL_RELEASE25_FAILURES: '+str(results['candidate']['fail']))
          PY
      - name: Preserve source-gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b1079-mobile-source-qa
          path: |
            ${{ runner.temp }}/b1079-*.log
