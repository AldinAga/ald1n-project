          test "$(grep -cE '^incoming/b1157-payload-[0-9]{2}\.bin$' "$RUNNER_TEMP/members.txt")" = "$steps"
          test "$(wc -l < "$RUNNER_TEMP/package/b1157-digests.tsv")" = "$((steps + 1))"
          cp "$RUNNER_TEMP/package/b1157-digests.tsv" "$RUNNER_TEMP/digests.tsv"
          # Two builds give the same bytes.
          b "$RUNNER_TEMP/package-again" > /dev/null
          cmp "$RUNNER_TEMP/package/b1157-operator.zip" "$RUNNER_TEMP/package-again/b1157-operator.zip"
          cmp "$RUNNER_TEMP/package/b1157-digests.tsv" "$RUNNER_TEMP/package-again/b1157-digests.tsv"
          # The payload digests the reviewers gave are the digests of the shipped members (raw git blob bytes): the table in the digests file is the evidence.
          cat "$RUNNER_TEMP/digests.tsv"
          # The checks can fail (mutation proof): one hex character of one coded digest is flipped in a COPY of the tool directory and the build must refuse it, each time with the named code.
          mut="$RUNNER_TEMP/mutant"
          refuse() { # $1 = label, $2 = expected refusal code; runs package.php on the mutant tool directory and demands the named refusal and no package
            set +e
            out="$(pk "$mut" "$RUNNER_TEMP/mutant-out" 2>&1)"; rc=$?
            set -e
            echo "mutation $1: rc=$rc"; printf '%s\n' "$out" | grep -m1 'RuntimeException' || true
            test "$rc" != 0
            printf '%s\n' "$out" | grep -q "$2"
            if test -e "$RUNNER_TEMP/mutant-out/b1157-operator.zip"; then echo "a package was written despite the refusal"; exit 2; fi
          }
          flip() { # $1 = label, $2 = digest prefix to change, $3 = expected refusal pattern
            rm -rf "$mut" "$RUNNER_TEMP/mutant-out"; cp -r "$s/b1157" "$mut"
            test "$(grep -c "$2" "$mut/Payload.php")" = 1
            sed -i "s/$2/$(printf '%s' "$2" | sed 's/^./0/')/" "$mut/Payload.php"
            if cmp -s "$s/b1157/Payload.php" "$mut/Payload.php"; then echo "mutation did not change the file"; exit 2; fi
            refuse "$1" "$3"
          }
          regroup() { # $1 = label, $2 = path of the step, $3 = its coded group, $4 = the wrong group, $5 = expected refusal pattern
            rm -rf "$mut" "$RUNNER_TEMP/mutant-out"; cp -r "$s/b1157" "$mut"
            test "$(grep -c "\['$2','modified','$3','M'\]" "$mut/Payload.php")" = 1
            sed -i "s#\['$2','modified','$3','M'\]#['$2','modified','$4','M']#" "$mut/Payload.php"
            if cmp -s "$s/b1157/Payload.php" "$mut/Payload.php"; then echo "mutation did not change the file"; exit 2; fi
            refuse "$1" "$5"
          }
          # package.php is run from the real directory but with the MUTANT tool directory as its second argument: the payload constants come from the mutant copy. The step to mutate is chosen from Payload.php.
          pick() { php -r 'require $argv[1];$k=$argv[2];foreach(B1157Payload::STEPS as [$p,$kind,$g]){if($k==="new"&&$kind==="new"){echo $p," ",substr(B1157Payload::DIGESTS[$p][1],0,16);exit;}if($k==="mod"&&$kind==="modified"){echo $p," ",substr(B1157Payload::DIGESTS[$p][0],0,16);exit;}}' "$s/b1157/Payload.php" "$1"; }
          pickd() { php -r 'require $argv[1];$p=$argv[2];echo substr(B1157Payload::DIGESTS[$p][$argv[3]==="pre"?0:1],0,16);' "$s/b1157/Payload.php" "$1" "$2"; }
          read -r newp newd < <(pick new)
          read -r modp modd < <(pick mod)
          flip PAYLOAD_DIGEST_OF_A_NEW_FILE "$newd" 'PACKAGE_DIGEST_DIFFERS_FROM_THE_REVIEWED_ONE'
          flip PRE_STATE_DIGEST_OF_A_MODIFIED_FILE "$modd" 'PACKAGE_DIGEST_DIFFERS_FROM_THE_REVIEWED_ONE'
          flip PRE_STATE_DIGEST_PROVIDER "$(pickd app/Providers/AppServiceProvider.php pre)" 'PACKAGE_DIGEST_DIFFERS_FROM_THE_REVIEWED_ONE'
          flip PAYLOAD_DIGEST_ROUTES "$(pickd routes/web.php post)" 'PACKAGE_DIGEST_DIFFERS_FROM_THE_REVIEWED_ONE'
          # The group layout is checked as well: routes/web.php moved into the controller group, the provider without its guard group and a view before the routes must each be refused.
          viewp="$(php -r 'require $argv[1];foreach(B1157Payload::STEPS as [$p,$k,$g])if($g==="F"){echo $p;exit;}' "$s/b1157/Payload.php")"
          regroup ROUTES_IN_THE_CONTROLLER_GROUP routes/web.php E C '\(PACKAGE\|OVERLAY\)_'
          regroup PROVIDER_WITHOUT_ITS_GUARD_GROUP app/Providers/AppServiceProvider.php D C '\(PACKAGE\|OVERLAY\)_'
          test -n "$viewp" && regroup A_VIEW_BEFORE_THE_ROUTES "$viewp" F E '\(PACKAGE\|OVERLAY\)_'
          printf '{"mutation":"REFUSED_BY_THE_BUILD","payloadDigestNewFile":"PACKAGE_DIGEST_DIFFERS_FROM_THE_REVIEWED_ONE","preStateDigestModifiedFile":"PACKAGE_DIGEST_DIFFERS_FROM_THE_REVIEWED_ONE","preStateDigestProvider":"PACKAGE_DIGEST_DIFFERS_FROM_THE_REVIEWED_ONE","payloadDigestRoutes":"PACKAGE_DIGEST_DIFFERS_FROM_THE_REVIEWED_ONE","routesInTheControllerGroup":"PACKAGE_OR_OVERLAY_REFUSAL","providerWithoutItsGuardGroup":"PACKAGE_OR_OVERLAY_REFUSAL","viewBeforeTheRoutes":"PACKAGE_OR_OVERLAY_REFUSAL"}\n' | tee "$RUNNER_TEMP/mutation.json"
