name: B799 public retail CI (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'apps/cms/current/**'
      - '.github/workflows/b799-public-retail-qa.yml'
permissions:
  contents: read
jobs:
  public-retail-mariadb:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_DATABASE: ald1n_test
          MARIADB_USER: ald1n_test
          MARIADB_PASSWORD: ald1n_test
          MARIADB_ROOT_PASSWORD: ci_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ald1n_test
      DB_USERNAME: ald1n_test
      DB_PASSWORD: ald1n_test
      CACHE_STORE: array
      CACHE_LIMITER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      TURNSTILE_ENABLED: 'false'
      PUBLIC_RETAIL_ENABLED: 'true'
      PUBLIC_RETAIL_EMAIL_RECEIPT: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_mysql,pdo_sqlite,dom,curl,fileinfo,openssl,tokenizer,xml,xmlwriter,intl,gd,zip,bcmath
          coverage: none
      - name: Exact Composer dependencies
        working-directory: apps/cms/current
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Scoped private MariaDB public-order checks
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          test "$APP_ENV" = testing && test "$DB_DATABASE" = ald1n_test
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306;dbname=ald1n_test","ald1n_test","ald1n_test"); if(!str_starts_with((string)$p->query("SELECT VERSION()")->fetchColumn(),"10.11.19-MariaDB")) exit(35);'
          find app/Http/Controllers/Public app/Services/PublicRetailService.php app/Models/PublicOrderAccess.php database/migrations/2026_10_23_020000_create_public_order_accesses.php -type f -name '*.php' -exec php -l {} \;
          php bin/static-check.php > "$RUNNER_TEMP/b799-static.log"
          vendor/bin/phpunit -c phpunit.mysql.xml tests/Feature/PublicRetailEndToEndTest.php tests/Feature/ProductionOrderInventoryTest.php tests/Feature/WarrantyFirstPaymentIssuance798Test.php --log-junit "$RUNNER_TEMP/b799-tests.xml"
      - name: Synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b799-public-retail-${{ github.sha }}
          path: |
            ${{ runner.temp }}/b799-static.log
            ${{ runner.temp }}/b799-tests.xml
          retention-days: 7
          if-no-files-found: warn
      - name: No external production action
        if: always()
        run: echo 'TEST_DB_ONLY; NO_CUSTOMER_MAIL; NO_DEPLOY; NO_OTA; NO_PLAY; NO_BACKUP_MUTATION'
