name: LG04 Wave5 Home Admin native-safe source QA (NO BUILD)
on:
  push:
    branches:
      - feature/lg04-wave5-home-admin-shortcut-safe-20261021
  pull_request:
    paths:
      - 'apps/mobile/current/src/components/ui/operator-row.tsx'
      - 'apps/mobile/current/src/app/(app)/(tabs)/home.tsx'
      - 'apps/mobile/current/src/app/(app)/admin/index.tsx'
      - 'apps/mobile/current/scripts/release25/lg04-wave5-home-admin-native-safe.test.mjs'
      - '.github/workflows/lg04-wave5-home-admin-native-safe-qa.yml'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - working-directory: apps/mobile/current
        run: npm ci --no-audit --no-fund
      - working-directory: apps/mobile/current
        run: |
          set -euo pipefail
          node --test scripts/release25/lg04-wave5-home-admin-native-safe.test.mjs
          npm run typecheck
          npm run validate
          npm run test:release25
      - if: always()
        run: echo 'SOURCE_ONLY=YES NO_EAS_NO_OTA_NO_PLAY_NO_DEPLOY'
