name: B1145 controlled migrate and unclamp (NO DEPLOY)
on:
  push:
    branches: [codex/b1145-migrate-unclamp-20261108]
    paths: ['.github/workflows/b1145-migrate-unclamp.yml', 'tools/storefront/b1145/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  migrate-unclamp:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 80
    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_ROOT_PASSWORD: isolated-ci-only
          MARIADB_DATABASE: ald1n_b1145_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -pisolated-ci-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: opcache,pdo_mysql,mysqli,pdo_sqlite,sqlite3,mbstring,dom,curl,gd,intl,bcmath,zip,posix
          coverage: none
      - name: Pin cms.ald1n.com to loopback so CI can never reach production
        run: |
          set -euo pipefail
          printf '\n127.0.0.1 cms.ald1n.com\n::1 cms.ald1n.com\n' | sudo tee -a /etc/hosts >/dev/null
          python3 -c 'import socket,sys;a={i[4][0] for i in socket.getaddrinfo("cms.ald1n.com",443)};print(sorted(a));sys.exit(0 if a and a<={"127.0.0.1","::1"} else 2)'
      - name: Syntax, portable operator shell and forbidden mechanisms absent from shipped code
        run: |
          set -euo pipefail
          for f in tools/storefront/b1145/*.php; do php -l "$f"; done
          bash -n tools/storefront/b1145/operator-wrapper.sh
          bash -n tools/storefront/b1145/wrapper-sandbox-test.sh
          if grep -nE '<\(|>\(|/dev/fd|python3' tools/storefront/b1145/operator-wrapper.sh; then exit 2; fi
          grep -q 'setsid nohup bash "$SCRIPT" --worker > /dev/null 2>&1 < /dev/null &' tools/storefront/b1145/operator-wrapper.sh
          # AGENTS rule 26: the terminal clear is the first command after the shebang and the comment block.
          test "$(grep -v '^#' tools/storefront/b1145/operator-wrapper.sh | head -n 1)" = "clear 2>/dev/null || printf '\033c'"
          grep -q 'exec >> "$REPORT" 2>&1 < /dev/null' tools/storefront/b1145/operator-wrapper.sh
          grep -q "trap 'on_signal HUP 129' HUP" tools/storefront/b1145/operator-wrapper.sh
          grep -q 'if($highest<1107)exit(2)' tools/storefront/b1145/operator-wrapper.sh
          shipped='tools/storefront/b1145/operator-entry.php tools/storefront/b1145/MigrateUnclampCoordinator.php tools/storefront/b1145/EnvFlags.php tools/storefront/b1145/UnclampProbe.php tools/storefront/b1145/AppState.php tools/storefront/b1145/operator-wrapper.sh'
          if grep -niE '/usr/local/cpanel|uapi|DomainInfo|opcache_reset|php_flag|HostProcessGuard|UncachedProfile|--seed|migrate:fresh|migrate:rollback|migrate:refresh|migrate:reset|db:wipe|Mail::|mail\(' $shipped; then exit 2; fi
          if grep -n $'\r' $shipped tools/storefront/b1145/README-SR.md; then exit 2; fi
          test "$(sha256sum tools/storefront/b1145/report1106-fixture.md | cut -c1-64)" = 0ac995257de5e18d61b9e0ffcd207af616517cbc5e5295bc28954d3438e433f7
      - name: Unit - .env keys, rename through the symlink, pretend verdict, exact Report1106 facts, real probe with OPcache
        run: php tools/storefront/b1145/unit-fixture.php "$GITHUB_WORKSPACE/tools/storefront/b1145" "$GITHUB_WORKSPACE/tools/storefront/b1144" "$GITHUB_WORKSPACE/tools/storefront/b1134" | tee "$RUNNER_TEMP/unit.json"
      - name: Reuse authenticated exact existing runtime
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/b1145-runtime"
          mkdir -p "$work/payload" "$work/stage"
          curl --fail --silent --show-error --location -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/AldinAga/ald1n-project/actions/artifacts/13363389798/zip -o "$work/runtime.zip"
          echo "3e06da1172178f2bf96224fe49d62c8b3114c1b90784432a2200889542ec2f2c  $work/runtime.zip" | sha256sum --check --strict
          WORK="$work" python3 - <<'PY'
          import hashlib,os,pathlib,tarfile,zipfile
          root=pathlib.Path(os.environ['WORK'])
          with zipfile.ZipFile(root/'runtime.zip') as archive:
              assert set(archive.namelist())=={'cms-runtime.tar.gz','runtime-manifest.json','build-receipt.json','bundle.sha256'}
              for entry in archive.infolist():
                  assert entry.file_size<=64*1024*1024
                  (root/'payload'/entry.filename).write_bytes(archive.read(entry))
          assert hashlib.sha256((root/'payload/cms-runtime.tar.gz').read_bytes()).hexdigest()=='be650042d5d4573871790d082e376d88d3408fe6862907b8dada1cd2015a9488'
          assert hashlib.sha256((root/'payload/runtime-manifest.json').read_bytes()).hexdigest()=='d737387e60a981b3b404e0980d9b70cb95b6e1d506a39211981d49dcd12be4c6'
          with tarfile.open(root/'payload/cms-runtime.tar.gz') as archive:
              assert all((m.isfile() or m.isdir()) and not m.name.startswith('/') and '..' not in pathlib.PurePosixPath(m.name).parts for m in archive.getmembers())
              archive.extractall(root/'stage',filter='data')
          PY
          test "$(sha256sum tools/storefront/b1134/runtime-directories.json | cut -c1-64)" = 1e790c20fb9712d416399975d6cbcce3be1bd2dc12ede59a95f2e1cc75ea7e3e
      - name: Real coordinator on MariaDB 10.11.19 at 68 migrations - real pretend evidence, success, every HOLD, restore, crash re-entry
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        env:
          B1145_MARIADB_CONTAINER: ${{ job.services.mariadb.id }}
        run: |
          set -euo pipefail
          php tools/storefront/b1145/coordinator-fixture.php "$GITHUB_WORKSPACE/tools/storefront/b1145" "$GITHUB_WORKSPACE/tools/storefront/b1144" "$GITHUB_WORKSPACE/tools/storefront/b1134" "$RUNNER_TEMP/b1145-runtime/stage" "$RUNNER_TEMP/b1145-runtime/payload" "$GITHUB_WORKSPACE/tools/storefront/b1134/runtime-directories.json" | tee "$RUNNER_TEMP/coordinator.log"
          tail -n 200 "$RUNNER_TEMP/coordinator.log" | sed -n '/^{/,$p' > "$RUNNER_TEMP/coordinator.json"
      - name: Build operator ZIP
        id: package
        run: |
          set -euo pipefail
          php tools/storefront/b1145/package.php "$GITHUB_WORKSPACE/tools/storefront/b1145" "$GITHUB_WORKSPACE/tools/storefront/b1144" "$GITHUB_WORKSPACE/tools/storefront/b1134" "$RUNNER_TEMP/package" "$GITHUB_SHA" | tee "$RUNNER_TEMP/package.json"
          (cd "$RUNNER_TEMP/package" && sha256sum --check --strict b1145-operator.zip.sha256)
          unzip -Z1 "$RUNNER_TEMP/package/b1145-operator.zip" | sort > "$RUNNER_TEMP/members.txt"
          cat "$RUNNER_TEMP/members.txt"
          if grep -vE '^incoming/b1145-[A-Za-z0-9._-]+$' "$RUNNER_TEMP/members.txt"; then exit 2; fi
          test "$(wc -l < "$RUNNER_TEMP/members.txt")" = 10
      - name: Operator wrapper in a sandbox /home/icaffeco - integrity, canonical HOLD, entry wiring, pinned drift, tamper
        run: |
          set -euo pipefail
          sudo useradd --create-home --home-dir /home/icaffeco --shell /bin/bash icaffeco
          sudo chmod 755 /home/icaffeco
          install -m 0644 "$RUNNER_TEMP/package/b1145-operator.zip" /tmp/b1145-operator.zip
          as() { sudo -u icaffeco env -i HOME=/home/icaffeco PATH="$PATH" "$@"; }
          as mkdir -p /home/icaffeco/ald1n-project/incoming
          as unzip -q /tmp/b1145-operator.zip -d /home/icaffeco/ald1n-project
          for pair in b1134/ReleasePrimitives.php:b1134-release.php b1134/InstallFileOps.php:b1134-files.php b1144/LeanGates.php:b1144-gates.php b1144/FreshnessProbe.php:b1144-probe.php b1144/LeanWeb.php:b1144-web.php; do
            install -m 0644 "tools/storefront/${pair%%:*}" "/tmp/${pair##*:}"
            as cp "/tmp/${pair##*:}" "/home/icaffeco/ald1n-project/incoming/${pair##*:}"
          done
          script=/home/icaffeco/ald1n-project/incoming/b1145-controlled-migrate-unclamp.sh
          set +e
          out="$(as bash "$script" 2>&1)"; rc=$?
          set -e
          printf '%s\n' "$out"
          # The first output line carries the terminal clear (AGENTS 26), so this match is anchored at the end only.
          test "$rc" = 2 && grep -q 'HOLD: canonical reports or successful stage unavailable$' <<<"$out"
          set +e
          out="$(as bash "$script" --unexpected 2>&1)"; rc=$?
          set -e
          test "$rc" = 2 && grep -q 'unknown arguments' <<<"$out"
          as git init -q -b main /home/icaffeco/ald1n-project
          as git -C /home/icaffeco/ald1n-project -c user.name=Sandbox -c user.email=sandbox@example.invalid commit -q --allow-empty -m sandbox
          as git -C /home/icaffeco/ald1n-project update-ref refs/remotes/origin/main HEAD
          as mkdir -p /home/icaffeco/ald1n-project/docs/operations
          # The worker appends to its report itself (stdout is not the report), so the report file is what is checked.
          sandbox_report=/home/icaffeco/ald1n-project/docs/operations/9999-SANDBOX.md
          set +e
          sudo -u icaffeco env -i HOME=/home/icaffeco PATH="$PATH" REPORT="$sandbox_report" bash "$script" --worker > /dev/null 2>&1; rc=$?
          set -e
          out="$(sudo cat "$sandbox_report")"
          printf '%s\n' "$out"
          test "$rc" = 2 && grep -qx 'B1145_FINAL=HOLD' <<<"$out" && grep -qx 'B1145_PHASE="HOLD_PREFLIGHT_BLOCKED"' <<<"$out" && grep -q '^HELPER_SOURCE_SHA=' <<<"$out" && grep -q '"applicationFiles":"NONE","database":"NONE"' <<<"$out" && grep -q '^WORKER_PID=[0-9]' <<<"$out"
          if sudo grep -q $'\033' "$sandbox_report"; then echo 'escape byte in the report'; exit 2; fi
          as rm -f "$sandbox_report"
          as cp /home/icaffeco/ald1n-project/incoming/b1144-gates.php /tmp/b1144-gates.saved
          as bash -c 'printf "\n" >> /home/icaffeco/ald1n-project/incoming/b1144-gates.php'
          set +e
          sudo -u icaffeco env -i HOME=/home/icaffeco PATH="$PATH" REPORT="$sandbox_report" bash "$script" --worker > /dev/null 2>&1; rc=$?
          set -e
          out="$(sudo cat "$sandbox_report")"
          test "$rc" = 2 && grep -qx 'HOLD_CODE=PACKAGE_FILE_INTEGRITY' <<<"$out"
          # Removed so the report sequence of the next step still starts right after 1107.
          as rm -f "$sandbox_report"
          set +e
          sudo -u icaffeco env -i HOME=/home/icaffeco PATH="$PATH" REPORT=/tmp/elsewhere.md bash "$script" --worker > /dev/null 2>&1; rc=$?
          set -e
          test "$rc" = 2 && test ! -e /tmp/elsewhere.md
          as cp /tmp/b1144-gates.saved /home/icaffeco/ald1n-project/incoming/b1144-gates.php
          as bash -c 'printf "\n" >> /home/icaffeco/ald1n-project/incoming/b1145-coordinator.php'
          set +e
          out="$(as bash "$script" 2>&1)"; rc=$?
          set -e
          test "$rc" = 2 && grep -q 'HOLD: package integrity' <<<"$out"
          as bash -c 'printf "# tamper\n" >> /home/icaffeco/ald1n-project/incoming/b1145-controlled-migrate-unclamp.sh'
          set +e
          out="$(as bash "$script" 2>&1)"; rc=$?
          set -e
          test "$rc" = 2 && grep -q 'HOLD: operator script integrity' <<<"$out"
          printf '{"canonicalHold":true,"unknownArguments":"HOLD","entryWiring":"B1145_PHASE=HOLD_PREFLIGHT_BLOCKED_NO_MUTATION","pinnedB1144Drift":"HOLD","helperTamper":"HOLD","wrapperTamper":"HOLD"}\n' | tee "$RUNNER_TEMP/sandbox.json"
      - name: Operator wrapper past the report lock - INT/TERM release the lock, the detached worker survives the foreground
        run: |
          set -euo pipefail
          as() { sudo -u icaffeco env -i HOME=/home/icaffeco PATH="/tmp/b1145-shims:$PATH" "$@"; }
          sudo -u icaffeco unzip -o -q /tmp/b1145-operator.zip -d /home/icaffeco/ald1n-project
          mkdir -p /tmp/b1145-shims
          command -v php > /tmp/b1145-shims/real-php
          command -v git > /tmp/b1145-shims/real-git
          command -v setsid > /tmp/b1145-shims/real-setsid
          cat > /tmp/b1145-shims/php <<'SHIM'
          #!/bin/bash
          real="$(cat /tmp/b1145-shims/real-php)"
          for a in "$@"; do
            case "$a" in
              */reports.txt) if test -e /tmp/b1145-slow-sequence; then sleep 30; fi;;
              */incoming/b1145-controlled-migrate-unclamp.php) if test -e /tmp/b1145-slow-worker; then sleep 25; fi;;
            esac
          done
          exec "$real" "$@"
          SHIM
          cat > /tmp/b1145-shims/git <<'SHIM'
          #!/bin/bash
          if test "${3-}" = fetch; then printf 'SANDBOX_GIT_FETCH_STUBBED=%s\n' "$*"; exit 0; fi
          exec "$(cat /tmp/b1145-shims/real-git)" "$@"
          SHIM
          cat > /tmp/b1145-shims/setsid <<'SHIM'
          #!/bin/bash
          if test -e /tmp/b1145-slow-start; then sleep 75; fi
          exec "$(cat /tmp/b1145-shims/real-setsid)" "$@"
          SHIM
          chmod 755 /tmp/b1145-shims /tmp/b1145-shims/php /tmp/b1145-shims/git /tmp/b1145-shims/setsid
          as mkdir -p /home/icaffeco/.ald1n-stage
          as bash -c 'printf "sandbox predecessor\n" > /home/icaffeco/ald1n-project/docs/operations/1107-SANDBOX-PREDECESSOR.md'
          as git -C /home/icaffeco/ald1n-project remote add origin https://github.com/AldinAga/ald1n-project
          install -m 0755 tools/storefront/b1145/wrapper-sandbox-test.sh /tmp/b1145-wrapper-sandbox-test.sh
          as bash /tmp/b1145-wrapper-sandbox-test.sh | tee "$RUNNER_TEMP/wrapper-sandbox.json"
          grep -q '"workerSurvivesForegroundHupTerm":true' "$RUNNER_TEMP/wrapper-sandbox.json"
          grep -q '"lateWorkerSingleExitLine":true' "$RUNNER_TEMP/wrapper-sandbox.json"
          grep -q '"reportNumberedAfter1107":true' "$RUNNER_TEMP/wrapper-sandbox.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b1145-migrate-unclamp-evidence
          path: |
            ${{ runner.temp }}/unit.json
            ${{ runner.temp }}/coordinator.json
            ${{ runner.temp }}/coordinator.log
            ${{ runner.temp }}/package.json
            ${{ runner.temp }}/sandbox.json
            ${{ runner.temp }}/wrapper-sandbox.json
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ success() }}
        with:
          name: b1145-operator-package
          path: |
            ${{ runner.temp }}/package/b1145-operator.zip
            ${{ runner.temp }}/package/b1145-operator.zip.sha256
          retention-days: 30
