# Catalog redesign visual QA (NO DEPLOY). Author: Ald1n <https://ald1n.com>
# Renders the synthetic public catalog and shared shop pages in disposable
# Chromium at 375/768/1280 in dark and light, then keeps the PNG screenshots.
name: Catalog visual QA screenshots (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'apps/cms/current/resources/views/public-shop/**'
      - 'apps/cms/current/public/assets/css/ald1n-public-storefront.css'
      - 'apps/cms/current/app/Support/PublicCatalogPresentation.php'
      - 'apps/cms/current/app/Services/PublicRetailCatalogService.php'
      - 'apps/cms/current/app/Http/Controllers/PublicShopController.php'
      - 'apps/cms/current/tests/Browser/seed-catalog-visual.php'
      - 'apps/cms/current/tests/Browser/catalog-visual-browser.cjs'
      - 'apps/cms/current/tests/Feature/PublicCatalogRedesignTest.php'
      - '.github/workflows/catalog-visual-qa.yml'
permissions:
  contents: read
concurrency:
  group: catalog-visual-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_DATABASE: ald1n_test
          MARIADB_USER: ald1n_test
          MARIADB_PASSWORD: ald1n_test
          MARIADB_ROOT_PASSWORD: ci_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8124
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ald1n_test
      DB_USERNAME: ald1n_test
      DB_PASSWORD: ald1n_test
      CACHE_STORE: array
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: 'false'
      QUEUE_CONNECTION: sync
      TURNSTILE_ENABLED: 'false'
      MAIL_MAILER: array
      PUBLIC_STOREFRONT_ENABLED: 'true'
      PUBLIC_CHECKOUT_ENABLED: 'false'
      CATALOG_VISUAL_BASE_URL: http://127.0.0.1:8124
      PLAYWRIGHT_NODE_ROOT: /tmp/catalog-visual-playwright
      CATALOG_VISUAL_ARTIFACT_DIR: /tmp/catalog-visual-screenshots
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_mysql,dom,curl,fileinfo,openssl,tokenizer,xml,xmlwriter,intl,gd,zip,bcmath
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Install exact isolated CMS dependencies
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          test "$APP_ENV" = testing
          test "$DB_HOST" = 127.0.0.1
          test "$DB_DATABASE" = ald1n_test
          test ! -e .env
          install -m 600 /dev/null .env
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          php -l tests/Browser/seed-catalog-visual.php
          node --check tests/Browser/catalog-visual-browser.cjs
      - name: Focused catalog redesign PHPUnit (disposable MariaDB)
        id: phpunit
        continue-on-error: true
        working-directory: apps/cms/current
        env:
          LEGACY_DB_HOST: 127.0.0.1
          LEGACY_DB_PORT: '3306'
          LEGACY_DB_DATABASE: disabled
          LEGACY_DB_USERNAME: disabled_qa_legacy
          LEGACY_DB_PASSWORD: ''
          SESSION_DRIVER: array
          APP_URL: https://cms.ald1n.com
        run: |
          set -euo pipefail
          for test in PublicCatalogRedesignTest PublicNoScriptCspB872Test StorefrontHtmlOriginBoundaryB899Test PublicLegalPagesB1146Test; do
            php vendor/bin/phpunit -c phpunit.mysql.xml "tests/Feature/$test.php" --colors=never
          done
      - name: Install disposable Chromium outside repository
        run: |
          set -euo pipefail
          mkdir -p "$PLAYWRIGHT_NODE_ROOT"
          npm install --no-save --no-package-lock --no-audit --no-fund --prefix "$PLAYWRIGHT_NODE_ROOT" playwright@1.56.1
          "$PLAYWRIGHT_NODE_ROOT/node_modules/.bin/playwright" install --with-deps chromium
      - name: Render synthetic catalog in dark and light at 375/768/1280
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          test "$APP_ENV" = testing
          test "$DB_DATABASE" = ald1n_test
          php artisan migrate:fresh --force --no-ansi
          php artisan db:seed --class=CoreAccessSeeder --force --no-ansi
          php tests/Browser/seed-catalog-visual.php
          php artisan serve --host=127.0.0.1 --port=8124 > "$RUNNER_TEMP/catalog-visual-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 45); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:8124/katalog; then READY=1; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          test "$READY" = 1 || { echo 'CATALOG_VISUAL_HTTP_BOOT_HOLD'; tail -n 20 "$RUNNER_TEMP/catalog-visual-server.log"; exit 5; }
          node tests/Browser/catalog-visual-browser.cjs
      - name: Keep synthetic screenshots only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: catalog-visual-screenshots
          path: /tmp/catalog-visual-screenshots/*.png
          retention-days: 7
          if-no-files-found: warn
      - name: Enforce focused PHPUnit result
        if: always()
        run: test '${{ steps.phpunit.outcome }}' = success
      - name: Production boundary
        if: always()
        run: echo 'CI_DISPOSABLE_ONLY NO_PRODUCTION_DB_CUSTOMER_MAIL_CHECKOUT_DEPLOY'
