name: B896 storefront registration script CSP (NO DEPLOY)
on:
  pull_request:
    branches: [fix/b893-storefront-media-path-20261025]
permissions:
  contents: read
jobs:
  registration-csp:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_DATABASE: ald1n_test
          MARIADB_USER: ald1n_test
          MARIADB_PASSWORD: ald1n_test
          MARIADB_ROOT_PASSWORD: ci_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: https://cms.ald1n.com
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ald1n_test
      DB_USERNAME: ald1n_test
      DB_PASSWORD: ald1n_test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      TURNSTILE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Exact source, parent and three-path allowlist
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          BASE=1fa7dd8b4e3226c24aa1febe87be71a159906ae3
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE" HEAD | sort > "$RUNNER_TEMP/changed.txt"
          printf '%s\n' \
            .github/workflows/b896-storefront-registration-csp-qa.yml \
            apps/cms/current/app/Http/Middleware/PublicNoScriptCsp.php \
            apps/cms/current/tests/Feature/PublicRegistrationScriptCspB896Test.php | sort > "$RUNNER_TEMP/allowed.txt"
          test -z "$(comm -23 "$RUNNER_TEMP/changed.txt" "$RUNNER_TEMP/allowed.txt")"
          grep -Fx .github/workflows/b896-storefront-registration-csp-qa.yml "$RUNNER_TEMP/changed.txt"
          grep -Fx apps/cms/current/tests/Feature/PublicRegistrationScriptCspB896Test.php "$RUNNER_TEMP/changed.txt"
          test -z "$(git diff --name-only "$BASE" HEAD -- \
            apps/cms/current/tests/Feature/BuyerCheckoutSessionBoundaryB815Test.php \
            apps/cms/current/tests/Feature/StorefrontRegistrationOnlyB809Test.php \
            apps/cms/current/tests/Feature/StorefrontSecurityB806Test.php)"
          git diff --check
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_mysql,pdo_sqlite,dom,curl,fileinfo,openssl,tokenizer,xml,xmlwriter,intl,gd,zip,bcmath
          coverage: none
      - name: Real PHP8.4/MariaDB10.11.19 HTTP registration script CSP boundaries
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          test ! -e .env
          install -m 600 /dev/null .env
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          php -l tests/Feature/PublicRegistrationScriptCspB896Test.php
          php -l app/Http/Middleware/PublicNoScriptCsp.php
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306;dbname=ald1n_test","ald1n_test","ald1n_test"); if(!str_starts_with((string)$p->query("SELECT VERSION()")->fetchColumn(),"10.11.19-MariaDB"))exit(35);'
          vendor/bin/phpunit -c phpunit.mysql.xml --fail-on-warning \
            --log-junit "$RUNNER_TEMP/b896-junit.xml" \
            tests/Feature/PublicRegistrationScriptCspB896Test.php
      - name: Every original case must pass; source hashes
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/b896-junit.xml" <<'PY'
          import sys,xml.etree.ElementTree as ET
          cases=list(ET.parse(sys.argv[1]).getroot().iter('testcase'))
          identities=[(n.get('classname') or n.get('class'), n.get('name')) for n in cases]
          assert len(identities)==7 and len(set(identities))==7, 'HOLD_7_UNIQUE_CASES'
          assert all(c and m and c.endswith('PublicRegistrationScriptCspB896Test') for c,m in identities), 'HOLD_UNEXPECTED_IDENTITY'
          assert not any(n.find(tag) is not None for n in cases for tag in ('failure','error','skipped','warning')), 'HOLD_FAILED_SKIPPED_TESTS'
          print('B896_DISPOSABLE_REGISTRATION_CSP_7_OF_7_HTTP_PASS')
          PY
          sha256sum app/Http/Middleware/PublicNoScriptCsp.php \
            tests/Feature/PublicRegistrationScriptCspB896Test.php \
            > "$RUNNER_TEMP/b896-source.sha256"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Real Chromium and Firefox synthetic registration CSP enforcement (no third-party requests)
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          php artisan migrate --force
          php -r '$app=require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); App\Models\Setting::query()->updateOrCreate(["setting_key"=>"public_storefront_open"],["setting_value"=>"1","updated_by"=>null]); App\Models\Setting::query()->updateOrCreate(["setting_key"=>"turnstile_enabled"],["setting_value"=>"1","updated_by"=>null]);'
          php artisan serve --host=127.0.0.1 --port=18789 > "$RUNNER_TEMP/b897-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          status=000
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18789/registracija || true)
            test "$status" = 200 && break
            sleep 0.5
          done
          test "$status" = 200
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.57.0
          npx --no-install playwright install --with-deps chromium firefox
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { writeFileSync } from 'node:fs';
          import { chromium, firefox } from 'playwright';

          const results = [];
          for (const [name, engine] of [['chromium',chromium],['firefox',firefox]]) {
            const browser = await engine.launch({headless:true});
            try {
              const context = await browser.newContext();
              let offHostRequests=0;
              let unauthorizedScriptRequests=0;
              await context.route('**/*', async route => {
                const url=route.request().url();
                if (url === 'https://challenges.cloudflare.com/turnstile/v0/api.js') {
                  return route.fulfill({
                    status:200, contentType:'application/javascript',
                    body:'window.__B897_CLOUDFLARE_FAKE_SCRIPT_LOADED__=true;',
                  });
                }
                if (url.startsWith('http://127.0.0.1:18789/')) {
                  if (url.endsWith('/b897-forbidden-self.js')) unauthorizedScriptRequests++;
                  return route.continue();
                }
                offHostRequests++;
                return route.abort();
              });
              const page=await context.newPage();
              const response=await page.goto('http://127.0.0.1:18789/registracija',{waitUntil:'load'});
              assert.equal(response.status(),200,name+'_REGISTRATION_HTTP');
              const policy=response.headers()['content-security-policy'] ?? '';
              assert.match(policy,/script-src https:\/\/challenges\.cloudflare\.com(?:;|$)/,name+'_CSP_VENDOR_ONLY');
              assert.match(policy,/script-src-attr 'none'/,name+'_CSP_INLINE_HANDLERS_NONE');
              await page.waitForFunction(() => window.__B897_CLOUDFLARE_FAKE_SCRIPT_LOADED__===true,null,{timeout:10000});
              await page.evaluate(() => {
                window.__B897_FORBIDDEN_INLINE__=false;
                window.__B897_FORBIDDEN_SELF__=false;
                const inline=document.createElement('script');
                inline.textContent='window.__B897_FORBIDDEN_INLINE__=true';
                document.body.append(inline);
                const local=document.createElement('script');
                local.src='/b897-forbidden-self.js';
                document.body.append(local);
              });
              await page.waitForTimeout(400);
              assert.equal(await page.evaluate(()=>window.__B897_FORBIDDEN_INLINE__),false,name+'_INLINE_SCRIPT_BLOCKED');
              assert.equal(await page.evaluate(()=>window.__B897_FORBIDDEN_SELF__),false,name+'_NON_VENDOR_SCRIPT_BLOCKED');
              assert.equal(unauthorizedScriptRequests,0,name+'_CSP_DENIED_UNAPPROVED_FIRST_PARTY_JS_FETCH');
              // The app does not contact cms.ald1n.com or Cloudflare in CI.
              // All external navigation/resources are synthetic or aborted.
              results.push({browser:name,registrationHttp:200,turnstileFakeLoaded:true,
                inlineScriptBlocked:true,unapprovedScriptBlocked:true,
                sourcePolicyPresent:true,offHostRequestsAborted:offHostRequests});
              await context.close();
            } finally {
              await browser.close();
            }
          }
          writeFileSync(process.env.RUNNER_TEMP+'/b897-browser.json',
            JSON.stringify({sourceOnly:true,syntheticTurnstile:true,results},null,2)+'\n');
          assert.equal(results.length,2,'HOLD_BROWSER_COVERAGE');
          console.log('B897_CHROMIUM_AND_FIREFOX_REAL_BROWSER_CSP_PASS_2_OF_2');
          JS
      - name: Evidence, including intentional RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b896-registration-csp-evidence
          path: |
            ${{ runner.temp }}/b896-junit.xml
            ${{ runner.temp }}/b896-source.sha256
            ${{ runner.temp }}/b897-browser.json
            ${{ runner.temp }}/b897-server.log
            apps/cms/current/app/Http/Middleware/PublicNoScriptCsp.php
            apps/cms/current/tests/Feature/PublicRegistrationScriptCspB896Test.php
            .github/workflows/b896-storefront-registration-csp-qa.yml
          retention-days: 7
      - name: Production remains OFF
        if: always()
        run: echo B896_DISPOSABLE_SYNTHETIC_ONLY_STOREFRONT_OFF_NO_HOST_NO_EAS_NO_PLAY_NO_PROD
