name: ONE Android v1.5 production AAB - owner authorized - NO PLAY
on:
  push:
    branches:
      - ops/android-v15-one-production-aab-20261021
    paths:
      - '.github/workflows/android-v15-one-production-aab-20261021.yml'
permissions:
  contents: read
concurrency:
  group: ald1n-android-v15-one-aab-20261021
  cancel-in-progress: false
jobs:
  one-frozen-production-aab:
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      SOURCE_SHA: deb98808afe2568ed06da1c684b9b51d60734b12
      EAS_BUILD_PROFILE: production
      EXPO_PUBLIC_APP_ENV: production
      ALD1N_V15_RELEASE_GATE: approved
    steps:
      - name: Exact immutable release source checkout (NO PLAY)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: deb98808afe2568ed06da1c684b9b51d60734b12
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify immutable source and fail-closed release configuration
        shell: bash
        working-directory: apps/mobile/current
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$GITHUB_REF_NAME" = 'ops/android-v15-one-production-aab-20261021'
          node <<'NODE'
          const fs = require('fs');
          const c=fs.readFileSync('app.config.js','utf8');
          const e=JSON.parse(fs.readFileSync('eas.json','utf8'));
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const pass=c.includes("version: '1.5.0'")
            && c.includes("'1.5.0-native1'")
            && c.includes('LG03_DRAFT_NATIVE_MODULE_FORBIDS_PRODUCTION_EAS_BUILD')
            && e.cli.version==='25.0.0'
            && e.cli.appVersionSource==='remote'
            && e.build.production.channel==='production'
            && e.build.production.autoIncrement===true
            && e.build.production.env.ALD1N_V15_RELEASE_GATE==='approved'
            && e.build.production.android?.buildType==='app-bundle'
            && e.build.production.environment==='production'
            && pkg.dependencies['react-native-android-liquid-glass']==='0.2.1';
          if(!pass){ console.error('HOLD_V15_EXACT_SOURCE_CONFIG_DRIFT_NO_BUILD'); process.exit(21); }
          console.log('V15_EXACT_SOURCE_STATIC_PROFILE_READ=PASS');
          console.log('OWNER_AAB_ONLY_RELEASE_GATE=APPROVED');
          NODE
      - name: Lockfile install before any Expo config-plugin read
        working-directory: apps/mobile/current
        run: npm ci --no-audit --no-fund
      - name: Existing Expo account and exact project identity - READ ONLY
        working-directory: apps/mobile/current
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$EXPO_TOKEN" ]; then echo 'HOLD_EXPO_TOKEN_NOT_CONFIGURED_NO_BUILD'; exit 72; fi
          npm exec --yes --package=eas-cli@25.0.0 -- eas --version
          npm exec --yes --package=eas-cli@25.0.0 -- eas whoami
          npm exec --yes --package=eas-cli@25.0.0 -- eas project:info > "$RUNNER_TEMP/ald1n-v15-project-info.txt"
          if ! grep -Fq 'd43b3866-6838-4217-a23e-3dc7f2cc76cc' "$RUNNER_TEMP/ald1n-v15-project-info.txt"; then
            echo 'HOLD_EXPO_PROJECT_ID_NOT_CONFIRMED_NO_BUILD'
            exit 73
          fi
          echo 'EXPO_PROJECT_ID_AUTHENTICATED_READ=PASS'
      - name: Read EAS production Android remote versionCode - NO AUTO INCREMENT
        working-directory: apps/mobile/current
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if ! npm exec --yes --package=eas-cli@25.0.0 -- eas build:version:get \
             --platform android --profile production --json --non-interactive \
             > "$RUNNER_TEMP/v15-android-version.json"; then
            echo 'HOLD_REMOTE_VERSION_GET_FAILED_NO_BUILD'
            exit 74
          fi
          node <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/v15-android-version.json','utf8'));
          const candidates=[
            raw?.versionCode,
            raw?.androidVersionCode,
            raw?.android?.versionCode,
            raw?.buildVersion?.versionCode,
            raw?.buildVersion?.androidVersionCode,
            raw?.android?.buildVersion,
          ];
          const value=candidates.find(v=>Number.isInteger(Number(v))&&Number(v)>0);
          if(value===undefined){
            console.error('HOLD_REMOTE_VERSION_RESPONSE_UNRECOGNIZED_NO_BUILD fields='+Object.keys(raw||{}).join(','));
            process.exit(75);
          }
          const current=Number(value);
          console.log('EAS_REMOTE_ANDROID_VERSION_CODE='+current);
          console.log('PLAY_TESTING_KNOWN_CODE=26 (historical Issue52, NOT current Play attestation)');
          if(current!==26){
            console.error('HOLD_REMOTE_VERSIONCODE_CHANGED_STOP_BEFORE_BUILD');
            process.exit(76);
          }
          console.log('EAS_REMOTE_VERSIONCODE_READ=PASS_NO_AUTO_INCREMENT');
          console.log('NEXT_BUILD_VERSION_CODE=UNATTESTED_UNTIL_ACTUAL_EAS_RESULT');
          NODE
      - name: Read original PROD Android EAS upload keystore - READ ONLY GraphQL
        working-directory: apps/mobile/current
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const query=[
            'query V15ProductionSigning($name: String!, $identifier: String) {',
            ' app { byFullName(fullName: $name) {',
            ' id fullName',
            ' androidAppCredentials(filter: { applicationIdentifier: $identifier, legacyOnly: false }) {',
            ' applicationIdentifier isLegacy',
            ' androidAppBuildCredentialsList {',
            ' isDefault androidKeystore { id sha1CertificateFingerprint sha256CertificateFingerprint }',
            ' } } } } }',
          ].join('\n');
          function hold(code){ console.error(code); process.exit(77); }
          const token=process.env.EXPO_TOKEN;
          if(!token)hold('HOLD_EXPO_TOKEN_NOT_CONFIGURED_NO_BUILD');
          const response=await fetch('https://api.expo.dev/graphql',{
            method:'POST',
            headers:{'content-type':'application/json',authorization:'Bearer '+token},
            body:JSON.stringify({query,variables:{name:'@ald1n/ald1n-mobile',identifier:'com.ald1n.mobile'}}),
            signal:AbortSignal.timeout(20000),
          }).catch(()=>null);
          if(!response?.ok)hold('HOLD_EXPO_PRODUCTION_SIGNING_READ_UNAVAILABLE_NO_BUILD');
          const json=await response.json().catch(()=>null);
          if(!json||json.errors?.length)hold('HOLD_EXPO_PRODUCTION_SIGNING_GRAPHQL_UNAVAILABLE_NO_BUILD');
          const app=json.data?.app?.byFullName;
          if(app?.id!=='d43b3866-6838-4217-a23e-3dc7f2cc76cc'||app?.fullName!=='@ald1n/ald1n-mobile')
            hold('HOLD_EXPO_PROJECT_ID_MISMATCH_NO_BUILD');
          const creds=(app.androidAppCredentials||[]).filter(x=>x.applicationIdentifier==='com.ald1n.mobile'&&!x.isLegacy);
          if(creds.length!==1)hold('HOLD_PRODUCTION_ANDROID_APP_CREDENTIALS_MISSING_OR_AMBIGUOUS_NO_BUILD');
          const defaults=(creds[0].androidAppBuildCredentialsList||[]).filter(x=>x.isDefault&&x.androidKeystore?.id);
          if(defaults.length!==1||!defaults[0].androidKeystore.sha1CertificateFingerprint||!defaults[0].androidKeystore.sha256CertificateFingerprint)
            hold('HOLD_PRODUCTION_DEFAULT_KEYSTORE_MISSING_OR_AMBIGUOUS_NO_BUILD');
          const clean=v=>String(v||'').replace(/[^a-f0-9]/gi,'').toLowerCase();
          const sha1=clean(defaults[0].androidKeystore.sha1CertificateFingerprint);
          const g=JSON.parse(readFileSync('./google-services.json','utf8'));
          const production=g.client.find(c=>c.client_info?.android_client_info?.package_name==='com.ald1n.mobile');
          const clientSha1=(production?.oauth_client||[])
            .filter(c=>c.client_type===1&&c.android_info?.package_name==='com.ald1n.mobile')
            .map(c=>clean(c.android_info?.certificate_hash));
          if(!/^[a-f0-9]{40}$/.test(sha1)||!clientSha1.includes(sha1))
            hold('HOLD_PRODUCTION_FIREBASE_OAUTH_UPLOAD_SIGNER_MISMATCH_NO_BUILD');
          console.log('EXPO_EXACT_PROJECT_ID=PASS');
          console.log('PRODUCTION_DEFAULT_KEYSTORE_EXISTS=PASS_READ_ONLY');
          console.log('PRODUCTION_FIREBASE_UPLOAD_SHA1_MATCH=PASS');
          console.log('PRODUCTION_KEYSTORE_SHA256_PRESENT=PASS');
          console.log('KEYSTORE_OR_SECRET_EXPORTED=NEVER');
          NODE
      - name: Real production app.config native identity after pinned npm ci
        working-directory: apps/mobile/current
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const config=require('./app.config.js')({config:{}});
          const p=require('./eas.json').build.production;
          if(config.version!=='1.5.0'||config.runtimeVersion!=='1.5.0-native1'
            ||config.android?.package!=='com.ald1n.mobile'
            ||config.owner!=='ald1n'||config.extra?.eas?.projectId!=='d43b3866-6838-4217-a23e-3dc7f2cc76cc'
            ||p.android?.buildType!=='app-bundle'||p.channel!=='production'
            ||p.env.ALD1N_V15_RELEASE_GATE!=='approved') {
            console.error('HOLD_PRODUCTION_APP_RUNTIME_IDENTITY_NO_BUILD'); process.exit(91);
          }
          console.log('PRODUCTION_BUILD_APP=1.5.0');
          console.log('PRODUCTION_BUILD_RUNTIME=1.5.0-native1');
          console.log('PRODUCTION_BUILD_PACKAGE=com.ald1n.mobile');
          console.log('PRODUCTION_BUILD_CHANNEL=production');
          NODE
      - name: Exact source EAS idempotency check (NO duplicate builds)
        working-directory: apps/mobile/current
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npm exec --yes --package=eas-cli@25.0.0 -- eas build:list \
            --platform android --build-profile production \
            --git-commit-hash "$SOURCE_SHA" --limit 20 --json --non-interactive \
            > "$RUNNER_TEMP/v15-exact-source-build-list.json"
          node <<'NODE'
          const fs=require('node:fs');
          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/v15-exact-source-build-list.json','utf8'));
          const builds=Array.isArray(raw)?raw:Array.isArray(raw?.builds)?raw.builds:null;
          if(!builds) { console.error('HOLD_EAS_BUILD_LIST_UNREADABLE_NO_BUILD'); process.exit(92); }
          if(builds.length!==0) { console.error('HOLD_EXISTING_PRODUCTION_BUILD_FOR_EXACT_SHA_COUNT='+builds.length); process.exit(93); }
          console.log('EXACT_SOURCE_DEDUP=PASS_ZERO_BUILDS');
          NODE
      - name: Launch exactly ONE signed production Android AAB and await result (NEVER AUTO SUBMIT)
        working-directory: apps/mobile/current
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          echo 'OWNER_APPROVAL=2026-10-21_ONE_PRODUCTION_AAB_ONLY'
          echo 'ONE_EAS_AAB_DISPATCH_REQUEST=YES'
          echo 'NO_PLAY_SUBMIT=YES'
          echo 'NO_OTA=YES'
          git diff --quiet && git diff --cached --quiet
          if ! npm exec --yes --package=eas-cli@25.0.0 -- eas build \
            --platform android \
            --profile production \
            --freeze-credentials \
            --non-interactive \
            --wait \
            --json \
            --message "ALD1N_V15_ONE_PRODUCTION_AAB source:$SOURCE_SHA run:$GITHUB_RUN_ID NO_SUBMIT" \
            > "$RUNNER_TEMP/v15-one-production-aab.json"; then
            echo 'HOLD_AAB_FAILED_OR_OUTCOME_UNKNOWN_DO_NOT_RERUN_BLINDLY'
            exit 94
          fi
          node <<'NODE'
          const fs=require('node:fs');
          const raw=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/v15-one-production-aab.json','utf8'));
          const build=Array.isArray(raw)?raw.find(z=>z.platform==='ANDROID'):raw;
          const id=build?.id;
          const code=Number(build?.appBuildVersion);
          console.log('AAB_BUILD_ID='+(id||'UNKNOWN'));
          if(/^[0-9a-f-]{36}$/i.test(String(id||'')))console.log('AAB_BUILD_URL=https://expo.dev/accounts/ald1n/projects/ald1n-mobile/builds/'+id);
          console.log('AAB_BUILD_STATUS='+(build?.status||'UNKNOWN'));
          console.log('AAB_APP_VERSION='+(build?.appVersion||'VERIFY_IN_EAS'));
          console.log('AAB_VERSION_CODE='+(Number.isInteger(code)?code:'UNKNOWN'));
          console.log('AAB_RUNTIME_VERSION=1.5.0-native1');
          console.log('AAB_PACKAGE=com.ald1n.mobile');
          console.log('AAB_SOURCE_SHA='+process.env.SOURCE_SHA);
          console.log('AAB_PROFILE_CHANNEL=production/production');
          if(!/^[0-9a-f-]{36}$/i.test(String(id||''))||build?.status!=='FINISHED'||!Number.isInteger(code)||code<=26){
            console.error('HOLD_BUILD_METADATA_UNVERIFIED_DO_NOT_RERUN');process.exit(95);
          }
          console.log('ONE_PRODUCTION_AAB=FINISHED_NO_PLAY_SUBMIT');
          NODE
      - name: Immutable one-build audit footer
        if: always()
        run: |
          echo 'AAB_APPLICATION_SOURCE_SHA=deb98808afe2568ed06da1c684b9b51d60734b12'
          echo 'EAS_BUILD_MAX_REQUESTS=ONE'
          echo 'REMOTE_AUTO_INCREMENT=ONLY_ON_BUILD'
          echo 'NO_OTA_AND_PLAY_SUBMISSION=PASS'
          echo 'NO_BACKEND_MIGRATION_OR_DEPLOY=PASS'
          echo 'GOOGLE_PLAY_SUBMISSION=NOT_REQUESTED'
