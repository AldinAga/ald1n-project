name: Android Native 497 Full Audit

on:
  push:
    branches:
      - audit/android-native-497
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-497-full-audit
  cancel-in-progress: true

env:
  CI: "1"
  EXPO_PUBLIC_APP_ENV: production
  EXPO_PUBLIC_API_URL: https://cms.ald1n.com/api/v1

jobs:
  native-audit:
    name: Patch candidate and certify Gradle runtime
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact audit branch commit
        uses: actions/checkout@v4
        with:
          ref: audit/android-native-497
          fetch-depth: 1

      - name: Source authority
        shell: bash
        run: |
          set -euo pipefail
          echo "AUDIT_HEAD=$(git rev-parse HEAD)"
          echo "AUDIT_BRANCH=$(git branch --show-current)"
          test "$(git branch --show-current)" = "audit/android-native-497"
          test "$(git rev-parse origin/main 2>/dev/null || true)" = "" || true
          test -f apps/mobile/current/package.json

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: apps/mobile/current/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Android SDK inventory
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version
          node --version
          npm --version
          echo "ANDROID_HOME=${ANDROID_HOME:-UNSET}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-UNSET}"
          command -v sdkmanager
          sdkmanager --version
          sdkmanager --list_installed | sed -n '1,220p'

      - name: Ensure SDK 36 build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Patch Build22 candidate in ephemeral checkout
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ci/497c-source-part1.patch \
              .github/ci/497c-source-part2.patch \
              .github/ci/497c-source-part3.patch \
              .github/ci/497c-source-part4.patch > /tmp/497c-source.patch
          test "$(sha256sum /tmp/497c-source.patch | awk '{print $1}')" = "d0b0ea461c1238ae24f1d7b77e2251b5cd44494d2986464deeb7830dc1cdd446"
          git -C apps/mobile/current apply --check /tmp/497c-source.patch
          git -C apps/mobile/current apply /tmp/497c-source.patch
          git diff --check
          echo "PATCHED_FILES_BEGIN"
          git diff --name-only --no-renames
          echo "PATCHED_FILES_END"

      - name: Install locked Mobile dependencies
        working-directory: apps/mobile/current
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

      - name: Expo compatibility check
        working-directory: apps/mobile/current
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/expo/bin/cli install --check

      - name: Mobile typecheck
        working-directory: apps/mobile/current
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck

      - name: Mobile project validator
        working-directory: apps/mobile/current
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-project.mjs | tee /tmp/mobile-validator-497.log
          grep -Fq "Ukupno FAIL: 0" /tmp/mobile-validator-497.log

      - name: Prebuild Android from corrected candidate
        working-directory: apps/mobile/current
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/expo/bin/cli prebuild --platform android --clean --no-install

      - name: Generated native contract
        working-directory: apps/mobile/current
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'proguard-android-optimize.txt' android/app/build.gradle
          grep -Fq 'android.r8.optimizedResourceShrinking=true' android/gradle.properties
          if grep -RFn 'android:screenOrientation="portrait"' android/app/src/main/AndroidManifest.xml; then
            echo 'Portrait orientation lock unexpectedly remains.' >&2
            exit 1
          fi
          echo 'GENERATED_NATIVE_CONTRACT=PASS'

      - name: Register corrected Gradle audit tasks
        working-directory: apps/mobile/current
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/.github/ci/ald1n-audit-497c.gradle" android/app/ald1n-audit-497c.gradle
          printf '\napply from: file("ald1n-audit-497c.gradle")\n' >> android/app/build.gradle

      - name: Resolve native SDK and release configuration
        working-directory: apps/mobile/current/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:ald1nNativeSnapshot497C
          cat app/ald1n-native-497c.json

      - name: Resolve release dependency graph
        working-directory: apps/mobile/current/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:ald1nReleaseGraph497C
          node - <<'NODE'
          const fs = require('node:fs');
          const native = JSON.parse(fs.readFileSync('app/ald1n-native-497c.json', 'utf8'));
          const graph = JSON.parse(fs.readFileSync('app/ald1n-graph-497c.json', 'utf8'));
          const failures = [];
          if (String(native.agp) !== '8.12.0') failures.push(`AGP=${native.agp}`);
          if (Number(native.compileSdk) !== 36) failures.push(`compileSdk=${native.compileSdk}`);
          if (Number(native.minSdk) !== 24) failures.push(`minSdk=${native.minSdk}`);
          if (Number(native.targetSdk) !== 36) failures.push(`targetSdk=${native.targetSdk}`);
          if (native.minify !== true) failures.push(`minify=${native.minify}`);
          if (native.shrinkResources !== true) failures.push(`shrinkResources=${native.shrinkResources}`);
          if (!Array.isArray(native.proguard) || !native.proguard.includes('proguard-android-optimize.txt')) failures.push(`proguard=${JSON.stringify(native.proguard)}`);
          if (String(native.optimizedShrinking) !== 'true') failures.push(`optimizedShrinking=${native.optimizedShrinking}`);
          if (Number(graph.unresolved) !== 0) failures.push(`unresolved=${graph.unresolved}`);
          if (!Array.isArray(graph.material) || graph.material.length !== 1) failures.push(`material=${JSON.stringify(graph.material)}`);
          if (failures.length) {
            console.error('NATIVE_497_ASSERTIONS=FAIL ' + failures.join(' | '));
            process.exit(1);
          }
          console.log('NATIVE_497_ASSERTIONS=PASS');
          console.log('NATIVE_497_MATERIAL_RESOLVED=' + graph.material[0]);
          console.log('NATIVE_497_FRESCO_RESOLVED=' + (graph.fresco || []).join(','));
          NODE

      - name: Save native audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-497-audit-evidence
          if-no-files-found: warn
          retention-days: 7
          path: |
            apps/mobile/current/android/app/ald1n-native-497c.json
            apps/mobile/current/android/app/ald1n-graph-497c.json
            apps/mobile/current/android/gradle.properties
            apps/mobile/current/android/app/build.gradle
            apps/mobile/current/android/app/src/main/AndroidManifest.xml
