name: B796 bounded browser and owner-rule checkpoint
on:
  push:
    branches: [feat/b796-operator-orders-glass-tracking-20261022]
    paths: ['.github/workflows/b796-browser-contract-checkpoint.yml']
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Update only browser fixtures and owner instructions
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feat/b796-operator-orders-glass-tracking-20261022
          python3 <<'PY'
          from pathlib import Path
          root=Path('apps/cms/current/tests/Browser')
          p=root/'liquid-glass-browser-smoke.cjs';s=p.read_text()
          replacements=[
            ("const shouldCart = persona === 'superadmin';", "const shouldCart = persona === 'buyer';",1),
            ("['superadmin','user']", "['superadmin','user','buyer']",2),
            ("hdr.elements.rate !== null && hdr.elements.cart !== null && hdr.elements.search !== null", "hdr.elements.rate !== null && hdr.elements.cart === null && hdr.elements.search !== null",1),
            ("'HEADER_NO_CART_FOR_USER'", "'HEADER_NO_PERSONAL_CART_FOR_NON_BUYER'",1),
            ("check(await page.locator('.header-cart-button').count() === 0,'USER_CART_ABSENT_AFTER_NAV',mode);", "check(await page.locator('.header-cart-button').count() === (persona === 'buyer' ? 1 : 0),'ROLE_CART_AFTER_NAV',persona+'/'+mode);",1),
            ("mode+'-320-user-no-cart'", "mode+'-320-'+persona+'-cart-contract'",1),
          ]
          for old,new,n in replacements:
            assert s.count(old)==n,(old,s.count(old));s=s.replace(old,new)
          p.write_text(s)
          p=root/'seed-liquid-glass-preview.php';s=p.read_text()
          marker='$product = Product::query()->create(['
          assert s.count(marker)==1
          buyer="""$buyer = User::query()->create([
              'role_id' => Role::query()->where('slug', 'user')->valueOrFail('id'),
              'user_group_id' => 1,
              'username' => 'liquid-browser-buyer',
              'email' => 'liquid-browser-buyer@example.test',
              'password_hash' => Hash::make($password),
              'first_name' => 'Synthetic Buyer', 'status' => 'active',
          ]);

          """
          s=s.replace(marker,buyer+marker)
          s=s.replace("'user_id' => $superAdmin->id,", "'user_id' => $buyer->id,")
          anchor="    'user' => ['login' => $user->username, 'password' => $password],"
          assert s.count(anchor)==1
          s=s.replace(anchor,anchor+"\n    'buyer' => ['login' => $buyer->username, 'password' => $password],")
          s=s.replace('users=2 products=1 orders=1','users=3 products=1 orders=1');p.write_text(s)
          decision='''

          ## 31. First-payment warranty decision and honest baseline QA (2026-10-22)

          - Owner resolved the deposit/installment question: issue an eligible warranty certificate after the FIRST genuinely confirmed positive incoming payment, including an advance or first installment. Full settlement is not required. Do not ask this question again. This is an implementation rule, not evidence of deployed warranty automation. Preserve existing certificate identity/duration; separate issuance from contractual start so a pre-delivery payment does not silently shorten protection. R4/R5 remain separately tested and gated after B796.
          - B796 implements R1/R3/R6 only: operator-scoped SuperAdministrator orders, restrained shared Glass motion and canonical first-panel shipment tracking. Normal buyers retain personal cart/orders; direct sales and historical ownership are preserved. No schema/payment/warranty/expiry broadcast or public-storefront activation in this source package.
          - Whole-suite QA must report existing failures by name and compare the exact unchanged baseline in the same disposable environment. A baseline-relative PASS is NOT a globally green PHPUnit suite. Dedicated retirement tests keep their required database-name safety guard; do not weaken it to accommodate a generic test DB. Update obsolete cart-layout assertions only to match the approved role semantics and retain positive ordinary-buyer coverage.
          - Progress closure remains Report796 ledger v1: 7/17 (41.2%), CMS 7/15 (46.7%), original UI 6/6 (100%) until actual new deployment/acceptance evidence. Source work does not increment closed milestones. Never repeat B793-795 or their completed migration.
          '''
          p=Path('AGENTS.md');s=p.read_text();assert '## 31. First-payment warranty decision' not in s;p.write_text(s+decision)
          p=Path('docs/operations/OWNER-REQUIREMENTS-20261022.md');s=p.read_text();p.write_text(s+'\n\n## Resolved owner decision: first confirmed payment\n\nWarranty certificate issuance is required after the FIRST confirmed positive incoming payment, including an advance/first installment, not only full settlement. Issuance and contractual start remain distinct; preserve duration and existing certificates. This decision supersedes the earlier open deposit question, but B796 does not implement or activate payment/warranty/expiry behavior.\n')
          p=Path('docs/operations/000-LATEST.md');s=p.read_text()
          prefix='''# B796 source checkpoint / first-payment decision (2026-10-22)

          - R1/R3/R6 operator orders, readable shared Glass motion and first buyer-panel tracking are implemented through PR87. **B796 production execution remains PENDING**; the last verified production/acceptance authority is still B794/B795 below.
          - Owner confirmed warranty issuance after the FIRST confirmed positive incoming payment, including advance/first installment. Full settlement is not required. R4/R5 payment/recipient behavior is not activated by B796. See AGENTS section 31.
          - Full PHPUnit suite remains non-green on the unchanged baseline; retain exact baseline/candidate logs and failure names. Scoped behavior and baseline-relative regression gates must not be described as a globally green suite.
          - Progress ledger unchanged: 7/17 = 41.2%, CMS 7/15 = 46.7%, original UI 6/6 = 100%. Public /katalog storefront remains planned/not activated. Android16KB and SDK58 gates remain separate.

          ---

          '''
          assert not s.startswith('# B796 source checkpoint');p.write_text(prefix+s)
          PY
          node --check apps/cms/current/tests/Browser/liquid-glass-browser-smoke.cjs
          php -l apps/cms/current/tests/Browser/seed-liquid-glass-preview.php
          git add -- apps/cms/current/tests/Browser/liquid-glass-browser-smoke.cjs apps/cms/current/tests/Browser/seed-liquid-glass-preview.php AGENTS.md docs/operations/OWNER-REQUIREMENTS-20261022.md docs/operations/000-LATEST.md
          git diff --cached --name-only | sort > "$RUNNER_TEMP/actual"
          printf '%s\n' AGENTS.md docs/operations/000-LATEST.md docs/operations/OWNER-REQUIREMENTS-20261022.md apps/cms/current/tests/Browser/liquid-glass-browser-smoke.cjs apps/cms/current/tests/Browser/seed-liquid-glass-preview.php | sort > "$RUNNER_TEMP/expected"
          cmp "$RUNNER_TEMP/actual" "$RUNNER_TEMP/expected"
          git rm .github/workflows/b796-browser-contract-checkpoint.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(docs): retain buyer browser coverage and record first-payment warranty rule'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo 'PRODUCTION=UNTOUCHED MAIN=UNTOUCHED RUNTIME_SOURCE_UNCHANGED' >> "$GITHUB_STEP_SUMMARY"
