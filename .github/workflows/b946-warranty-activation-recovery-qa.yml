name: B946 Warranty recovery gated MariaDB QA (NO DEPLOY)

on:
  pull_request:
    paths:
      - 'apps/cms/current/app/Services/WarrantyActivationRecoveryService.php'
      - 'apps/cms/current/app/Models/WarrantyActivationRecoveryAttempt.php'
      - 'apps/cms/current/app/Console/Commands/WarrantyActivationRecoveryCommand.php'
      - 'apps/cms/current/config/warranty_recovery.php'
      - 'apps/cms/current/database/migrations/2026_10_27_230000_create_warranty_activation_recovery_attempts.php'
      - 'apps/cms/current/tests/Feature/WarrantyActivationRecoveryB946Test.php'
      - 'apps/cms/current/tests/Integration/WarrantyActivationB949IntegrationTest.php'
      - '.github/workflows/b946-warranty-activation-recovery-qa.yml'

permissions:
  contents: read

jobs:
  recovery:
    name: B946 read-only, gated recovery and retries on MariaDB 10.11
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_DATABASE: ald1n_test
          MARIADB_USER: ald1n_test
          MARIADB_PASSWORD: ald1n_test
          MARIADB_ROOT_PASSWORD: b946_ci_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
      mailpit:
        image: axllent/mailpit:v1.31.6
        ports: ['1025:1025', '8025:8025']
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: https://cms.ald1n.com
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ald1n_test
      DB_USERNAME: ald1n_test
      DB_PASSWORD: ald1n_test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      MOBILE_PUSH_ENABLED: 'false'
      OPERATIONAL_EMAIL_NOTIFICATIONS: 'false'
      WARRANTY_ACTIVATION_RECOVERY_ENABLED: 'false'
      B949_DISPOSABLE_INTEGRATION_ENABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Exact main source and eight paths only, no cron or Storefront
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          BASE=252580c3d65b126c96709ae240d1e3f797d611f5
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE" HEAD | sort > "$RUNNER_TEMP/actual.txt"
          cat > "$RUNNER_TEMP/expected.txt" <<'FILES'
          .github/workflows/b946-warranty-activation-recovery-qa.yml
          apps/cms/current/app/Console/Commands/WarrantyActivationRecoveryCommand.php
          apps/cms/current/app/Models/WarrantyActivationRecoveryAttempt.php
          apps/cms/current/app/Services/WarrantyActivationRecoveryService.php
          apps/cms/current/config/warranty_recovery.php
          apps/cms/current/database/migrations/2026_10_27_230000_create_warranty_activation_recovery_attempts.php
          apps/cms/current/tests/Feature/WarrantyActivationRecoveryB946Test.php
          apps/cms/current/tests/Integration/WarrantyActivationB949IntegrationTest.php
          FILES
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          git diff --check "$BASE" HEAD
          test "$(git hash-object apps/cms/current/app/Services/WarrantyActivationRecoveryService.php)" = "8e00572ff1ebee5bb25e31fa33db9c5cd00060e4"
          test "$(git hash-object apps/cms/current/tests/Feature/WarrantyActivationRecoveryB946Test.php)" = "b10d9ae1c9796c27fac1703a3f758106bd83ebfd"
          test "$(git hash-object apps/cms/current/tests/Integration/WarrantyActivationB949IntegrationTest.php)" = "3cb30d0375ecea27f4b309e82cd80a4cce914907"
          test "$(git hash-object apps/cms/current/config/warranty_recovery.php)" = "7701ccdb958a59adcd78f41843f478d29fa8e2df"
          test "$(git hash-object apps/cms/current/app/Console/Commands/WarrantyActivationRecoveryCommand.php)" = "f7c566a0146953c98aed513206ec06dbd8bcf4b5"
          test -z "$(git diff --name-only "$BASE" HEAD -- apps/cms/current/routes/console.php)"
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_mysql,pdo_sqlite,dom,curl,fileinfo,openssl,tokenizer,xml,xmlwriter,intl,gd,zip,bcmath
          coverage: none
      - name: PHP 8.4 lint, seven recovery cases, three disposable concurrency/SMTP checks
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          test ! -e .env
          install -m 600 /dev/null .env
          for f in \
            app/Services/WarrantyActivationRecoveryService.php \
            app/Models/WarrantyActivationRecoveryAttempt.php \
            app/Console/Commands/WarrantyActivationRecoveryCommand.php \
            config/warranty_recovery.php \
            database/migrations/2026_10_27_230000_create_warranty_activation_recovery_attempts.php \
            tests/Feature/WarrantyActivationRecoveryB946Test.php \
            tests/Integration/WarrantyActivationB949IntegrationTest.php; do
            php -l "$f"
          done
          composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306;dbname=ald1n_test","ald1n_test","ald1n_test");if(!str_starts_with((string)$p->query("SELECT VERSION()")->fetchColumn(),"10.11.19-MariaDB"))exit(35);'
          vendor/bin/phpunit -c phpunit.mysql.xml --fail-on-warning \
            --log-junit "$RUNNER_TEMP/b946-junit.xml" \
            --filter WarrantyActivationRecoveryB946Test
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors --silent \
            http://127.0.0.1:8025/api/v1/messages > "$RUNNER_TEMP/b949-mailpit-before.json"
          vendor/bin/phpunit -c phpunit.mysql.xml --fail-on-warning \
            --log-junit "$RUNNER_TEMP/b949-integration-junit.xml" \
            tests/Integration/WarrantyActivationB949IntegrationTest.php
      - name: Strict ten unique cases across source and real MariaDB/SMTP, no skips
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/b946-junit.xml" "$RUNNER_TEMP/b949-integration-junit.xml" <<'PY'
          import pathlib, re, sys, xml.etree.ElementTree as ET
          paths = [
              ("tests/Feature/WarrantyActivationRecoveryB946Test.php", "WarrantyActivationRecoveryB946Test", 7),
              ("tests/Integration/WarrantyActivationB949IntegrationTest.php", "WarrantyActivationB949IntegrationTest", 3),
          ]
          seen = set()
          for idx, (path, cls, count) in enumerate(paths):
              source = pathlib.Path(path).read_text()
              expected = set(re.findall(r"public function (test_[a-z0-9_]+)\(", source))
              if len(expected) != count:
                  raise SystemExit("HOLD_B949_SOURCE_TEST_IDENTITY "+path)
              root = ET.parse(sys.argv[idx+1]).getroot()
              cases = root.findall(".//testcase")
              pairs = [(x.attrib.get("classname", ""), x.attrib.get("name", "")) for x in cases]
              if len(pairs) != count or len(set(pairs)) != count or {n for _, n in pairs} != expected:
                  raise SystemExit("HOLD_B949_JUNIT_CASES "+path)
              if any(cls not in c for c, _ in pairs):
                  raise SystemExit("HOLD_B949_JUNIT_CLASS "+path)
              if root.findall(".//failure") or root.findall(".//error") or root.findall(".//skipped") or root.findall(".//warning"):
                  raise SystemExit("HOLD_B949_FAILURE_ERROR_SKIP_OR_WARNING "+path)
              seen.update(pairs)
          if len(seen) != 10:
              raise SystemExit("HOLD_B949_DUPLICATE_CASES")
          print("PASS_B950_EXACT_10_DISPOSABLE_MARIADB_SMTP_CASES")
          PY
      - name: B950 disposable exact-source cross-PR113 plus PR115 integration, no merge
        run: |
          set -euo pipefail
          BASE=252580c3d65b126c96709ae240d1e3f797d611f5
          PR113=35f68ce8de7e351eaf94455469a36ccec65bc128
          PR115=ee00d4de1752b0bff61462558c68224bf3d3314d
          test "$(git rev-parse HEAD)" = "$PR115"
          git cat-file -e "$PR113^{commit}"
          test "$(git merge-base "$PR113" "$PR115")" = "$BASE"
          test "$(git merge-base "$BASE" "$PR113")" = "$BASE"
          cat > "$RUNNER_TEMP/b950-overlay-paths.txt" <<'FILES'
          apps/cms/current/app/Console/Commands/WarrantyActivationRecoveryCommand.php
          apps/cms/current/app/Models/WarrantyActivationRecoveryAttempt.php
          apps/cms/current/app/Services/WarrantyActivationRecoveryService.php
          apps/cms/current/config/warranty_recovery.php
          apps/cms/current/database/migrations/2026_10_27_230000_create_warranty_activation_recovery_attempts.php
          apps/cms/current/tests/Feature/WarrantyActivationRecoveryB946Test.php
          apps/cms/current/tests/Integration/WarrantyActivationB949IntegrationTest.php
          FILES
          git diff --name-only "$BASE" "$PR113" | sort > "$RUNNER_TEMP/b950-pr113-files.txt"
          sort "$RUNNER_TEMP/b950-overlay-paths.txt" > "$RUNNER_TEMP/b950-overlay-sorted.txt"
          comm -12 "$RUNNER_TEMP/b950-pr113-files.txt" "$RUNNER_TEMP/b950-overlay-sorted.txt" > "$RUNNER_TEMP/b950-overlap.txt"
          test ! -s "$RUNNER_TEMP/b950-overlap.txt"
          WORKTREE="$RUNNER_TEMP/b950-disposable-pr113-pr115"
          git worktree add --detach "$WORKTREE" "$PR113"
          while IFS= read -r path; do
            test -f "$path"
            mkdir -p "$WORKTREE/$(dirname "$path")"
            cp "$path" "$WORKTREE/$path"
            cmp -s "$path" "$WORKTREE/$path"
          done < "$RUNNER_TEMP/b950-overlay-paths.txt"
          test "$(git -C "$WORKTREE" rev-parse HEAD)" = "$PR113"
          cd "$WORKTREE/apps/cms/current"
          test ! -e .env
          install -m 600 /dev/null .env
          composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
          export MOBILE_PUSH_EXPO_ACCESS_TOKEN=''
          export TURNSTILE_ENABLED=false
          vendor/bin/phpunit -c phpunit.mysql.xml --fail-on-warning \
            --log-junit "$RUNNER_TEMP/b950-pr113-69-junit.xml" \
            --filter '(MobilePushRecipientOwnershipB909Test|MobilePushRevocationB910Test|MobilePushCategoryRevocationB911Test|MobilePushTokenRotationB912Test|WarrantyExpiryArrayMailDeliveryB916Test|MobilePushPhase3BTest|WarrantyExpiryFreshEligibilityB905Test|WarrantyExpiryDeliveryGuardTest|WarrantyExpiryOptInSourceTest|WarrantyFirstPaymentIssuance798Test|PaymentTransitionNotificationB902Test)'
          vendor/bin/phpunit -c phpunit.mysql.xml --fail-on-warning \
            --log-junit "$RUNNER_TEMP/b950-joined-recovery7-junit.xml" \
            --filter WarrantyActivationRecoveryB946Test
          curl --fail --silent --show-error -X DELETE http://127.0.0.1:8025/api/v1/messages \
            > "$RUNNER_TEMP/b950-mailpit-reset.txt"
          vendor/bin/phpunit -c phpunit.mysql.xml --fail-on-warning \
            --log-junit "$RUNNER_TEMP/b950-joined-integration3-junit.xml" \
            tests/Integration/WarrantyActivationB949IntegrationTest.php
          python3 - "$RUNNER_TEMP/b950-pr113-69-junit.xml" "$RUNNER_TEMP/b950-joined-recovery7-junit.xml" "$RUNNER_TEMP/b950-joined-integration3-junit.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          expect = (69, 7, 3)
          identities = set()
          for xmlpath, count in zip(sys.argv[1:], expect):
              root = ET.parse(xmlpath).getroot()
              cases = root.findall(".//testcase")
              pairs = [(n.get("classname", n.get("class", "")), n.get("name", "")) for n in cases]
              if len(pairs) != count or len(set(pairs)) != count:
                  raise SystemExit("HOLD_B950_COMBINED_CASE_COUNT:" + xmlpath)
              if any(n.tag in ("failure", "error", "skipped", "warning") for n in root.iter()):
                  raise SystemExit("HOLD_B950_COMBINED_NON_PASS:" + xmlpath)
              if any(not c or not n for c, n in pairs):
                  raise SystemExit("HOLD_B950_COMBINED_IDENTITY:" + xmlpath)
              identities.update(pairs)
          if len(identities) != 79:
              raise SystemExit("HOLD_B950_COMBINED_DUPLICATE_IDENTITIES")
          print("PASS_B950_DISPOSABLE_PR113_PLUS_PR115_EXACT_79_CASES")
          PY
          echo B950_SYNTHETIC_CROSS_PR_ONLY_NO_MAIN_MERGE_NO_DEPLOYMENT
      - name: Evidence only, absolutely no deployment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b949-warranty-concurrency-smtp-mariadb-evidence
          path: |
            ${{ runner.temp }}/b946-junit.xml
            ${{ runner.temp }}/b949-integration-junit.xml
            ${{ runner.temp }}/b949-mailpit-before.json
            ${{ runner.temp }}/b950-pr113-69-junit.xml
            ${{ runner.temp }}/b950-joined-recovery7-junit.xml
            ${{ runner.temp }}/b950-joined-integration3-junit.xml
            ${{ runner.temp }}/b950-overlay-paths.txt
            ${{ runner.temp }}/b950-overlap.txt
            .github/workflows/b946-warranty-activation-recovery-qa.yml
            apps/cms/current/app/Services/WarrantyActivationRecoveryService.php
            apps/cms/current/app/Models/WarrantyActivationRecoveryAttempt.php
            apps/cms/current/app/Console/Commands/WarrantyActivationRecoveryCommand.php
            apps/cms/current/config/warranty_recovery.php
            apps/cms/current/database/migrations/2026_10_27_230000_create_warranty_activation_recovery_attempts.php
            apps/cms/current/tests/Feature/WarrantyActivationRecoveryB946Test.php
            apps/cms/current/tests/Integration/WarrantyActivationB949IntegrationTest.php
          retention-days: 7
          if-no-files-found: warn
