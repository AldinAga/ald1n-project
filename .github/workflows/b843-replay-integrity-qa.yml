name: B843 idempotent checkout receipt replay integrity (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'apps/cms/current/app/Services/PublicRetailCheckoutService.php'
      - 'apps/cms/current/app/Services/PublicOrderAccessService.php'
      - 'apps/cms/current/tests/Feature/PublicCheckoutReplayIntegrityB843Test.php'
      - 'docs/security/tools/b846_receipt_scope.py'
      - 'docs/security/tools/test_b846_receipt_scope.py'
      - 'docs/security/B845-B846-SCOPED-NEGATIVE-CONTROLS.md'
      - 'apps/cms/current/tests/Feature/PublicRegisteredReceiptBoundaryB836Test.php'
      - '.github/workflows/b843-replay-integrity-qa.yml'
permissions:
  contents: read
concurrency:
  group: b843-replay-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  replay-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_DATABASE: ald1n_test
          MARIADB_USER: ald1n_test
          MARIADB_PASSWORD: ald1n_test
          MARIADB_ROOT_PASSWORD: ci_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ald1n_test
      DB_USERNAME: ald1n_test
      DB_PASSWORD: ald1n_test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      TURNSTILE_ENABLED: 'false'
      MAIL_MAILER: array
    steps:
      - name: Checkout exact PR source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: PHP 8.4 runtime
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_mysql,pdo_sqlite,dom,curl,fileinfo,openssl,tokenizer,xml,xmlwriter,intl,gd,zip,bcmath
          coverage: none
      - name: Exact dependencies and PHP syntax
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          php -l app/Services/PublicOrderAccessService.php
          php -l app/Services/PublicRetailCheckoutService.php
          php -l tests/Feature/PublicRegisteredReceiptBoundaryB836Test.php
          php -l tests/Feature/PublicCheckoutReplayIntegrityB843Test.php
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306;dbname=ald1n_test","ald1n_test","ald1n_test"); if(!str_starts_with((string)$p->query("SELECT VERSION()")->fetchColumn(),"10.11.19-MariaDB"))exit(35);'
      - name: Validate revoked expired corrupted and purged idempotent receipt replay
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          vendor/bin/phpunit -c phpunit.mysql.xml --fail-on-warning --log-junit "$RUNNER_TEMP/b843-replay-junit.xml" tests/Feature/PublicCheckoutReplayIntegrityB843Test.php > "$RUNNER_TEMP/b843-replay.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/b843-replay.log"; exit 1; }
          tail -n 12 "$RUNNER_TEMP/b843-replay.log"
          vendor/bin/phpunit -c phpunit.mysql.xml --fail-on-warning --log-junit "$RUNNER_TEMP/b843-receipt-regressions-junit.xml" tests/Feature/PublicRegisteredReceiptBoundaryB836Test.php > "$RUNNER_TEMP/b843-receipt-regressions.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/b843-receipt-regressions.log"; exit 1; }
          tail -n 12 "$RUNNER_TEMP/b843-receipt-regressions.log"
          echo 'B843_IDEMPOTENT_REPLAY_AND_RECEIPT=PASS_SCOPED_NO_GLOBAL_RELEASE'
      - name: B846 evidence-compiler fail-closed unit tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s docs/security/tools -p 'test_b846_receipt_scope.py' -v
      - name: B846 exact-head JUnit provenance (not OWASP certification)
        run: |
          set -euo pipefail
          python3 docs/security/tools/b846_receipt_scope.py \
            --replay="$RUNNER_TEMP/b843-replay-junit.xml" \
            --boundary="$RUNNER_TEMP/b843-receipt-regressions-junit.xml" \
            --source-sha="$(git rev-parse HEAD)" \
            --output="$RUNNER_TEMP/b846-receipt-scope.json"
          test "$(git rev-parse HEAD)" = "$(jq -r .source_sha "$RUNNER_TEMP/b846-receipt-scope.json")"
          test "$(jq -r .verified_security_pass "$RUNNER_TEMP/b846-receipt-scope.json")" = 0
          test "$(jq -r .tests.combined "$RUNNER_TEMP/b846-receipt-scope.json")" = 26
      - name: Archive synthetic CI proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b843-replay-and-receipt-scope
          path: |
            ${{ runner.temp }}/b843-replay-junit.xml
            ${{ runner.temp }}/b846-receipt-scope.json
            docs/security/tools/b846_receipt_scope.py
            docs/security/tools/test_b846_receipt_scope.py
            docs/security/B845-B846-SCOPED-NEGATIVE-CONTROLS.md
            ${{ runner.temp }}/b843-replay.log
            ${{ runner.temp }}/b843-receipt-regressions-junit.xml
            ${{ runner.temp }}/b843-receipt-regressions.log
            apps/cms/current/app/Services/PublicRetailCheckoutService.php
            apps/cms/current/tests/Feature/PublicCheckoutReplayIntegrityB843Test.php
            .github/workflows/b843-replay-integrity-qa.yml
          if-no-files-found: ignore
          retention-days: 2
      - name: Production boundary
        if: always()
        run: echo 'B843_SCOPED_ONLY NO_PROD_CHECKOUT NO_PROD_MAIL NO_MERGE NO_EAS NO_DEPLOY'
