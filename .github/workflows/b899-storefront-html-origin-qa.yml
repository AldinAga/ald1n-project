name: B899 Storefront HTML first-party origin confinement (NO DEPLOY)
on:
  pull_request:
    branches: [fix/b896-storefront-register-csp-20261025]
permissions:
  contents: read
jobs:
  relative-public-urls:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_DATABASE: ald1n_test
          MARIADB_USER: ald1n_test
          MARIADB_PASSWORD: ald1n_test
          MARIADB_ROOT_PASSWORD: ci_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: https://cms.ald1n.com
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ald1n_test
      DB_USERNAME: ald1n_test
      DB_PASSWORD: ald1n_test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      TURNSTILE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Exact source, immutable parent, scoped path allowlist
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          BASE=f03fc4ddc04cf20abff3596f38f0195dbf8f80dc
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE" HEAD | sort > "$RUNNER_TEMP/b899-changed.txt"
          printf '%s\n' \
            .github/workflows/b899-storefront-html-origin-qa.yml \
            apps/cms/current/app/Services/PublicRetailCatalogService.php \
            apps/cms/current/resources/views/public-shop/layout.blade.php \
            apps/cms/current/resources/views/public-shop/catalog.blade.php \
            apps/cms/current/resources/views/public-shop/show.blade.php \
            apps/cms/current/resources/views/public-shop/cart.blade.php \
            apps/cms/current/resources/views/public-shop/checkout.blade.php \
            apps/cms/current/resources/views/public-shop/order.blade.php \
            apps/cms/current/resources/views/public-shop/register.blade.php \
            apps/cms/current/tests/Feature/StorefrontHtmlOriginBoundaryB899Test.php | sort > "$RUNNER_TEMP/b899-allowed.txt"
          test -z "$(comm -23 "$RUNNER_TEMP/b899-changed.txt" "$RUNNER_TEMP/b899-allowed.txt")"
          grep -Fx apps/cms/current/tests/Feature/StorefrontHtmlOriginBoundaryB899Test.php "$RUNNER_TEMP/b899-changed.txt"
          test -z "$(git diff --name-only "$BASE" HEAD -- \
            apps/cms/current/tests/Feature/BuyerCheckoutSessionBoundaryB815Test.php \
            apps/cms/current/tests/Feature/StorefrontRegistrationOnlyB809Test.php \
            apps/cms/current/tests/Feature/StorefrontSecurityB806Test.php)"
          git diff --check
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_mysql,pdo_sqlite,dom,curl,fileinfo,openssl,tokenizer,xml,xmlwriter,intl,gd,zip,bcmath
          coverage: none
      - name: Real MariaDB HTTP HTML host-poisoning regression
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          test ! -e .env
          install -m 600 /dev/null .env
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          php -l tests/Feature/StorefrontHtmlOriginBoundaryB899Test.php
          php -l app/Services/PublicRetailCatalogService.php
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306;dbname=ald1n_test","ald1n_test","ald1n_test"); if(!str_starts_with((string)$p->query("SELECT VERSION()")->fetchColumn(),"10.11.19-MariaDB"))exit(35);'
          vendor/bin/phpunit -c phpunit.mysql.xml --fail-on-warning \
            --log-junit "$RUNNER_TEMP/b899-junit.xml" \
            tests/Feature/StorefrontHtmlOriginBoundaryB899Test.php
      - name: Assert exact six unique results and SHA256
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/b899-junit.xml" <<'PY'
          import sys,xml.etree.ElementTree as ET
          cases=list(ET.parse(sys.argv[1]).getroot().iter('testcase'))
          ids=[(x.get('classname') or x.get('class'),x.get('name')) for x in cases]
          assert len(ids)==6 and len(set(ids))==6, 'HOLD_EXPECT_6_DISTINCT_B899_CASES'
          assert all(c and n and c.endswith('StorefrontHtmlOriginBoundaryB899Test') for c,n in ids), 'HOLD_UNKNOWN_TEST_ID'
          assert not any(x.find(t) is not None for x in cases for t in ('failure','error','skipped','warning')), 'HOLD_FAILED_OR_SKIPPED_TEST'
          print('B899_B901_PUBLIC_HTML_6_OF_6_PHP8_MARIADB_HTTP_PASS')
          PY
          sha256sum \
            app/Services/PublicRetailCatalogService.php \
            resources/views/public-shop/layout.blade.php \
            resources/views/public-shop/catalog.blade.php \
            resources/views/public-shop/show.blade.php \
            resources/views/public-shop/cart.blade.php \
            resources/views/public-shop/checkout.blade.php \
            resources/views/public-shop/order.blade.php \
            resources/views/public-shop/register.blade.php \
            tests/Feature/StorefrontHtmlOriginBoundaryB899Test.php > "$RUNNER_TEMP/b899-source.sha256"
      - name: Preserve original source and JUnit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b899-public-origin-evidence
          path: |
            ${{ runner.temp }}/b899-junit.xml
            ${{ runner.temp }}/b899-source.sha256
            ${{ runner.temp }}/b899-changed.txt
            apps/cms/current/app/Services/PublicRetailCatalogService.php
            apps/cms/current/tests/Feature/StorefrontHtmlOriginBoundaryB899Test.php
            .github/workflows/b899-storefront-html-origin-qa.yml
          retention-days: 7
      - name: Production OFF
        if: always()
        run: echo B899_CI_SYNTHETIC_ONLY_NO_HOST_NO_MERGE_NO_EAS_NO_PLAY_STOREFRONT_OFF
