name: B1046 M13 read-only public catalog bridge on merged CMS main (NO DEPLOY)
"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/b1046-m13-readonly-catalog-main-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b1046-m13-readonly-catalog-bridge
  cancel-in-progress: false
jobs:
  exact-m13:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_DATABASE: ald1n_test
          MARIADB_USER: ald1n_test
          MARIADB_PASSWORD: ald1n_test
          MARIADB_ROOT_PASSWORD: b1046_ci_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: https://cms.ald1n.com
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ald1n_test
      DB_USERNAME: ald1n_test
      DB_PASSWORD: ald1n_test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      MOBILE_PUSH_ENABLED: 'false'
      MOBILE_PUSH_EXPO_ACCESS_TOKEN: ''
      TURNSTILE_ENABLED: 'false'
      OPERATIONAL_EMAIL_NOTIFICATIONS: 'false'
      PUBLIC_STOREFRONT_ENABLED: 'false'
      PUBLIC_CHECKOUT_ENABLED: 'false'
      B1046_CACHE_CONTROL_FIX: 'private-no-store-v2'
      WARRANTY_ACTIVATION_RECOVERY_ENABLED: 'false'
    steps:
      - name: Checkout only current merged main in disposable runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: main-src
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout exact original PR111 candidate into separate disposable directory
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3acc37e90332b0d8fde659503c5cc1a8b5fcc6aa
          path: storefront-source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify main source scope and create only a private non-deployed 3-GET preview
        run: |
          set -Eeuo pipefail
          git -C main-src merge-base --is-ancestor e9f0c6a29f9840df102d0bcc2a634a19a66dd53f HEAD || {
            echo 'HOLD_B1046_MAIN_ANCESTRY'; exit 2;
          }
          test -z "$(git -C main-src diff --name-only e9f0c6a29f9840df102d0bcc2a634a19a66dd53f HEAD -- apps/cms/current)"
          python3 main-src/tools/storefront/b1046/b1046_stage_catalog.py main-src storefront-source
          cp main-src/tools/storefront/b1046/B1046M13ReadOnlyCatalogIntegrationTest.php \
            main-src/apps/cms/current/tests/Feature/B1046M13ReadOnlyCatalogIntegrationTest.php
          php -l main-src/apps/cms/current/app/Http/Controllers/PublicShopController.php
          php -l main-src/apps/cms/current/app/Services/PublicRetailCatalogService.php
          php -l main-src/apps/cms/current/app/Services/PublicStorefrontStateService.php
          php -l main-src/apps/cms/current/app/Services/PublicMerchantPolicyService.php
          php -l main-src/apps/cms/current/config/public_storefront.php
          php -l main-src/apps/cms/current/routes/web.php
          php -l main-src/apps/cms/current/tests/Feature/B1046M13ReadOnlyCatalogIntegrationTest.php
      - name: Use isolated pinned PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_mysql,pdo_sqlite,dom,curl,fileinfo,openssl,tokenizer,xml,xmlwriter,intl,gd,zip,bcmath
          coverage: none
      - name: Install main's locked PHP dependencies in disposable runner only
        working-directory: main-src/apps/cms/current
        run: |
          set -Eeuo pipefail
          test ! -e .env
          composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
          php -r '$db=new PDO("mysql:host=127.0.0.1;port=3306;dbname=ald1n_test","ald1n_test","ald1n_test");if(!str_contains((string)$db->query("SELECT VERSION()")->fetchColumn(),"10.11.19-MariaDB"))exit(42);'
          php artisan route:list --path=katalog --json > "$RUNNER_TEMP/b1046-routes.json"
          python3 - "$RUNNER_TEMP/b1046-routes.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf8'))
          correct={('katalog','public-shop.catalog'),('katalog/slika/{image}','public-shop.media'),('katalog/{slug}','public-shop.show')}
          found={(x['uri'],x['name']) for x in r}
          if found!=correct or any(x.get('method') not in ('GET|HEAD','HEAD|GET') for x in r):
              raise SystemExit('HOLD_B1046_NOT_EXACTLY_THREE_PUBLIC_GET_ROUTES: '+str(r))
          print('B1046_ONLY_THREE_PUBLIC_GET_ROUTES=PASS')
          PY
      - name: Real Laravel MariaDB HTTP tests on disposable M13 preview with default OFF
        working-directory: main-src/apps/cms/current
        run: |
          set -Eeuo pipefail
          vendor/bin/phpunit -c phpunit.mysql.xml --fail-on-warning \
            --log-junit "$RUNNER_TEMP/b1046-m13-junit.xml" \
            tests/Feature/B1046M13ReadOnlyCatalogIntegrationTest.php
      - name: Strict original B1046 five-test census, no skipped/failure or fabricated pass
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/b1046-m13-junit.xml" "$RUNNER_TEMP/b1046-m13-receipt.json" <<'PY'
          import hashlib,json,os,pathlib,sys,xml.etree.ElementTree as ET
          path=pathlib.Path(sys.argv[1]); b=path.read_bytes()
          if not 0<len(b)<4000000 or b'<!DOCTYPE' in b.upper() or b'<!ENTITY' in b.upper():
              raise SystemExit('HOLD_B1046_UNSAFE_JUNIT_XML')
          root=ET.fromstring(b)
          expected={
            'test_off_by_default_and_no_checkout_or_cart_routes_exist',
            'test_enabled_synthetic_public_listing_excludes_hidden_prices_and_internal_data',
            'test_catalog_search_uses_literal_wildcards_and_validated_filters',
            'test_product_detail_escapes_untrusted_html_and_has_no_buy_cta',
            'test_media_is_private_no_store_and_revoked_on_emergency_off',
          }
          for suite in root.iter():
              if suite.tag in ('testsuites','testsuite'):
                  for field in ('failures','errors','skipped','warnings'):
                      if suite.get(field) is not None and suite.get(field)!='0':
                          raise SystemExit('HOLD_B1046_NONPASS_'+field)
              if suite.tag in ('failure','error','skipped','warning'):
                  raise SystemExit('HOLD_B1046_TEST_EVENT')
          cases=list(root.iter('testcase'))
          names=[c.get('name','') for c in cases]
          if len(cases)!=5 or set(names)!=expected or len(names)!=len(set(names)) or any('B1046M13ReadOnlyCatalogIntegrationTest' not in (c.get('classname') or c.get('class') or '') for c in cases):
              raise SystemExit('HOLD_B1046_EXACT_TEST_SET_NOT_5')
          receipt={'batch':'B1046','status':'PASS_READONLY_M13_ISOLATED_MAIN_CANDIDATE_HTTP_GATE_ONLY',
            'source_main':os.environ['GITHUB_SHA'],'source_storefront':'3acc37e90332b0d8fde659503c5cc1a8b5fcc6aa',
            'test_count':5,'junit_sha256':hashlib.sha256(b).hexdigest(),'public_routes':'ONLY_3_GET','storefront_enabled':'OFF_BY_DEFAULT',
            'checkout_cart_registration':'NO_ROUTES','full_B803_56':'UNCHANGED_OPEN','production':'UNCHANGED','android_build':'NONE'}
          pathlib.Path(sys.argv[2]).write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n',encoding='utf8')
          print('B1046_M13_READONLY_REAL_LARAVEL_MARIADB_HTTP_TESTS=PASS_5_OF_5')
          PY
      - name: Archive synthetic JUnit and no-deploy report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b1046-m13-readonly-exact-main-bridge-synthetic-evidence
          path: |
            ${{ runner.temp }}/b1046-routes.json
            ${{ runner.temp }}/b1046-m13-junit.xml
            ${{ runner.temp }}/b1046-m13-receipt.json
          if-no-files-found: warn
          retention-days: 30
      - name: Explicitly no public deployment or native build
        if: always()
        run: |
          echo 'B1046_LIVE_STOREFRONT=OFF; CHECKOUT=ABSENT; 56_B803=NOT_WAIVED'
          echo 'B1046_CLOUDLINUX=UNCHANGED; EAS=NONE; OTA=NONE; PLAY=NONE; PROD_DB=UNCHANGED'
