name: B796 browser fixture assembly
on:
  push:
    branches: [feat/b796-operator-motion-tracking-20261022]
    paths: ['.github/workflows/b796-browser-assembly.yml']
permissions:
  contents: write
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply only the two reviewed synthetic browser files
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feat/b796-operator-motion-tracking-20261022
          git apply --check scripts/ci/b796-browser-contract.patch
          git apply --index scripts/ci/b796-browser-contract.patch
          printf '%s\n' apps/cms/current/tests/Browser/liquid-glass-browser-smoke.cjs apps/cms/current/tests/Browser/seed-liquid-glass-preview.php | sort > "$RUNNER_TEMP/expected"
          git diff --cached --name-only | sort > "$RUNNER_TEMP/actual"
          cmp "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          node --check apps/cms/current/tests/Browser/liquid-glass-browser-smoke.cjs
          php -l apps/cms/current/tests/Browser/seed-liquid-glass-preview.php
          git rm scripts/ci/b796-browser-contract.patch .github/workflows/b796-browser-assembly.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(cms): distinguish operator, non-buying user and ordinary buyer browser behavior'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo 'SYNTHETIC_TEST_FILES_ONLY=YES PRODUCTION=UNTOUCHED FINAL_BROWSER_CI=REQUIRED'
