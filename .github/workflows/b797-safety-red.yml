name: B797 safety discovery (no production)
on:
  push:
    branches: ['feat/b797-first-payment-warranty-20261022']
    paths: ['.github/workflows/b797-safety-red.yml']
permissions:
  contents: read
jobs:
  safety:
    strategy:
      fail-fast: false
      matrix:
        image: ['mariadb:10.11.19', 'mysql:8.4']
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_DATABASE: ald1n_warranty797_ci
          MYSQL_USER: ald1n_test
          MYSQL_PASSWORD: ald1n_test
          MYSQL_ROOT_PASSWORD: ci_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent || mariadb-admin ping -h 127.0.0.1 -pci_only --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://127.0.0.1
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ald1n_warranty797_ci
      DB_USERNAME: ald1n_test
      DB_PASSWORD: ald1n_test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      TURNSTILE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_mysql,pdo_sqlite,dom,curl,fileinfo,openssl,tokenizer,xml,xmlwriter,intl,gd,zip,bcmath,pcntl
          coverage: none
      - name: Apply exact unmerged candidate to isolated database
        run: |
          set -euo pipefail
          test "$DB_DATABASE" = ald1n_warranty797_ci
          test "$DB_HOST" = 127.0.0.1
          test ! -e apps/cms/current/.env
          mkdir -p "$RUNNER_TEMP/b797-safety"
          python - <<'PY'
          from pathlib import Path
          import base64,lzma,hashlib,os
          b=''.join(Path(f'qa/b797-candidate/part{i:02d}.b64').read_text().strip() for i in range(5))
          p=lzma.decompress(base64.b64decode(b,validate=True))
          assert hashlib.sha256(p).hexdigest()=='b912d1009f61a1d2d5c71821de73b1b35b66d52efba7c2835134e37f22143185'
          Path(os.environ['RUNNER_TEMP']+'/candidate.patch').write_bytes(p)
          PY
          git apply --check "$RUNNER_TEMP/candidate.patch"
          git apply "$RUNNER_TEMP/candidate.patch"
          python qa/b797-candidate/fix-fixtures.py
          cd apps/cms/current
          install -m 600 /dev/null .env
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Observe real integration failures before safety fixes
        working-directory: apps/cms/current
        run: |
          rc=0
          vendor/bin/phpunit -c phpunit.mysql.xml tests/Integration/Warranty797DatabaseSafetyTest.php --log-junit "$RUNNER_TEMP/b797-safety/safety.xml" > "$RUNNER_TEMP/b797-safety/safety.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/b797-safety/safety.log"
          echo "DISCOVERY_RC=$rc" | tee "$RUNNER_TEMP/b797-safety/result.txt"
          echo 'THIS_IS_FAILURE_DISCOVERY_NOT_RELEASE_CERTIFICATION'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b797-safety-red-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ runner.temp }}/b797-safety/
          retention-days: 7
