name: B806 storefront targeted security regression (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'apps/cms/current/**'
      - '.github/workflows/b806-storefront-security-qa.yml'
permissions:
  contents: read
concurrency:
  group: b806-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  security-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_DATABASE: ald1n_test
          MARIADB_USER: ald1n_test
          MARIADB_PASSWORD: ald1n_test
          MARIADB_ROOT_PASSWORD: ci_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ald1n_test
      DB_USERNAME: ald1n_test
      DB_PASSWORD: ald1n_test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      TURNSTILE_ENABLED: 'false'
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_mysql,pdo_sqlite,dom,curl,fileinfo,openssl,tokenizer,xml,xmlwriter,intl,gd,zip,bcmath
          coverage: none
      - name: Install exact dependencies and verify isolated target
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          test "$APP_ENV" = testing
          test "$DB_DATABASE" = ald1n_test
          test "$DB_HOST" = 127.0.0.1
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          php -l tests/Feature/StorefrontSecurityB806Test.php
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306;dbname=ald1n_test","ald1n_test","ald1n_test");if(!str_starts_with((string)$p->query("SELECT VERSION()")->fetchColumn(),"10.11.19-MariaDB"))exit(35);'
      - name: Synthetic security checks with actual Laravel and MariaDB
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          vendor/bin/phpunit -c phpunit.mysql.xml --fail-on-warning --log-junit "$RUNNER_TEMP/b806-security-junit.xml" tests/Feature/StorefrontSecurityB806Test.php > "$RUNNER_TEMP/b806-security.log" 2>&1 || { tail -n 80 "$RUNNER_TEMP/b806-security.log"; exit 1; }
          tail -n 8 "$RUNNER_TEMP/b806-security.log"
      - name: Preserve synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b806-storefront-security-evidence
          path: |
            ${{ runner.temp }}/b806-security-junit.xml
            ${{ runner.temp }}/b806-security.log
          retention-days: 3
      - name: Boundary
        if: always()
        run: echo 'SYNTHETIC_CI_ONLY NO_PRODUCTION_ATTACK NO_CUSTOMER_MAIL NO_DEPLOY NO_CLEANUP'
