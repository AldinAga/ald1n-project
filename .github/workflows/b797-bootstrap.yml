name: B797 isolated PDF and warranty-terms verification
on:
  push:
    branches: ['feat/b797-pdf-terms-20261023']
    paths: ['.github/workflows/b797-bootstrap.yml']
permissions:
  contents: write
concurrency:
  group: b797-bootstrap
  cancel-in-progress: false
jobs:
  cms:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_DATABASE: ald1n_test
          MARIADB_USER: ald1n_test
          MARIADB_PASSWORD: ald1n_test
          MARIADB_ROOT_PASSWORD: ci_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ald1n_test
      DB_USERNAME: ald1n_test
      DB_PASSWORD: ald1n_test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      TURNSTILE_ENABLED: 'false'
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_mysql,pdo_sqlite,dom,curl,fileinfo,openssl,tokenizer,xml,xmlwriter,intl,gd,zip,bcmath
          coverage: none
      - name: Validate immutable source and prepare phased patch loader
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pdf797-proof"
          cp .github/b797-payload-*.b64 "$RUNNER_TEMP/pdf797-proof/"
          cat > "$RUNNER_TEMP/apply797.py" <<'PY'
          import base64,gzip,hashlib,json,subprocess,sys,pathlib,os
          paths=sorted(pathlib.Path('.github').glob('b797-payload-*.b64'))
          assert len(paths)==3
          for p in paths:
              s=p.read_text().strip()
              if p.name=='b797-payload-1.b64':
                  marker='2BIGNPH4LyvuB/QBPs';first=s.find(marker);second=s.find(marker,first+len(marker))
                  if second>=0:s=s[:first]+s[second:]
                  s=s.replace('s5fg1mzv1bTlR','s5fg1mz1bTlR')
              p.write_text(s)
          raw=base64.b64decode(''.join(p.read_text().strip() for p in paths),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='455c2c7accdeda4ac2a532d2cdd5794101b2bb0dde746740cdbd023fde8dc74d'
          data=json.loads(gzip.decompress(raw))
          assert data['base']=='9bf18d475cd603783c7c81c6a2001875aed3ccee'
          subprocess.run(['git','merge-base','--is-ancestor',data['base'],'HEAD'],check=True)
          phase=sys.argv[1]
          for row in data['files']:
              p=pathlib.Path(row['path'])
              assert '..' not in p.parts and not p.is_absolute()
              assert str(p).startswith('apps/cms/current/') or str(p)=='.github/workflows/b797-pdf-qa.yml'
              if phase!='check' and row['phase']!=phase:continue
              if row['before'] is None:assert not p.exists(),str(p)
              else:
                  assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()==row['before'],str(p)
              if phase=='check':continue
              if 'text' in row:
                  p.parent.mkdir(parents=True,exist_ok=True);p.write_text(row['text'],encoding='utf-8')
              else:subprocess.run(['git','apply','--whitespace=error','-'],input=row['patch'],text=True,check=True)
              assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()==row['after'],str(p)
          if phase=='check':
              pathlib.Path(os.environ['RUNNER_TEMP']+'/pdf797-proof/source-files.json').write_text(json.dumps([{k:v for k,v in r.items() if k not in ('patch','text')} for r in data['files']],indent=2)+'\n')
              pathlib.Path(os.environ['RUNNER_TEMP']+'/paths797.txt').write_text('\n'.join(r['path'] for r in data['files'])+'\n')
          print('PHASE='+phase+' IMMUTABLE_SOURCE=PASS')
          PY
          python3 "$RUNNER_TEMP/apply797.py" check
      - name: Exact dependencies in disposable database environment
        working-directory: apps/cms/current
        run: |
          test "$APP_ENV" = testing
          test "$DB_HOST" = 127.0.0.1
          test "$DB_DATABASE" = ald1n_test
          test ! -e .env
          install -m 600 /dev/null .env
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Full pre-change project test suite
        working-directory: apps/cms/current
        run: |
          if composer test -- -c phpunit.mysql.xml --log-junit "$RUNNER_TEMP/pdf797-proof/baseline.xml" > "$RUNNER_TEMP/pdf797-proof/baseline.txt" 2>&1; then rc=0; else rc=$?; fi
          echo "$rc" > "$RUNNER_TEMP/pdf797-proof/baseline.rc"
          tail -n 14 "$RUNNER_TEMP/pdf797-proof/baseline.txt"
          test -s "$RUNNER_TEMP/pdf797-proof/baseline.xml"
      - name: Watch actual layout and prospective-terms regressions fail on baseline
        run: |
          python3 "$RUNNER_TEMP/apply797.py" tests
          cd apps/cms/current
          if vendor/bin/phpunit -c phpunit.mysql.xml tests/Unit/PdfLayout797Test.php tests/Feature/WarrantyTerms797Test.php --log-junit "$RUNNER_TEMP/pdf797-proof/red.xml" > "$RUNNER_TEMP/pdf797-proof/red.txt" 2>&1; then rc=0; else rc=$?; fi
          echo "$rc" > "$RUNNER_TEMP/pdf797-proof/red.rc"
          tail -n 12 "$RUNNER_TEMP/pdf797-proof/red.txt"
          test "$rc" -ne 0
          python3 - <<'PY'
          import os,xml.etree.ElementTree as E
          root=E.parse(os.environ['RUNNER_TEMP']+'/pdf797-proof/red.xml').getroot()
          assert len(root.findall('.//failure'))>=4
          assert not root.findall('.//error'), 'RED must fail on real assertions, not setup errors'
          print('REAL_REGRESSION_RED=PASS')
          PY
      - name: Apply bounded source and run scoped GREEN
        run: |
          python3 "$RUNNER_TEMP/apply797.py" source
          cd apps/cms/current
          php bin/static-check.php > "$RUNNER_TEMP/pdf797-proof/static.txt"
          vendor/bin/phpunit --fail-on-warning -c phpunit.mysql.xml tests/Unit/PdfLayout797Test.php tests/Unit/BusinessDocumentPdfServiceTest.php tests/Unit/CommissionReportPdfServiceTest.php tests/Unit/SimplePdfWriterSerbianLatinTest.php tests/Feature/WarrantyTerms797Test.php tests/Feature/OrderEmailsIpsWarrantyTest.php tests/Feature/ReceivablesCollectionTest.php tests/Feature/WarrantyExpiryDeliveryGuardTest.php tests/Feature/WarrantyExpiryPreferenceApiTest.php --log-junit "$RUNNER_TEMP/pdf797-proof/green.xml" > "$RUNNER_TEMP/pdf797-proof/green.txt" 2>&1
          tail -n 12 "$RUNNER_TEMP/pdf797-proof/green.txt"
          php bin/pdf797-layout-smoke.php "$RUNNER_TEMP/pdf797-proof/matrix"
          python3 -m venv "$RUNNER_TEMP/pdf797-venv"
          "$RUNNER_TEMP/pdf797-venv/bin/pip" install --disable-pip-version-check PyMuPDF==1.26.7
          "$RUNNER_TEMP/pdf797-venv/bin/python" tests/Tools/verify_pdf797_geometry.py "$RUNNER_TEMP/pdf797-proof/matrix"
      - name: Full post-change project suite and exact baseline-debt comparison
        working-directory: apps/cms/current
        run: |
          if composer test -- -c phpunit.mysql.xml --log-junit "$RUNNER_TEMP/pdf797-proof/candidate.xml" > "$RUNNER_TEMP/pdf797-proof/candidate.txt" 2>&1; then rc=0; else rc=$?; fi
          echo "$rc" > "$RUNNER_TEMP/pdf797-proof/candidate.rc"
          tail -n 14 "$RUNNER_TEMP/pdf797-proof/candidate.txt"
          python3 - <<'PY'
          import os,json,xml.etree.ElementTree as E,pathlib
          d=pathlib.Path(os.environ['RUNNER_TEMP'])/'pdf797-proof'
          def parse(name):
              r=E.parse(d/(name+'.xml')).getroot(); tests=r.findall('.//testcase'); bad={}
              for t in tests:
                  for tag in ('failure','error'):
                      for f in t.findall(tag):bad[t.get('classname','')+'::'+t.get('name','')]=tag
              return {'tests':len(tests),'bad':bad}
          b=parse('baseline');a=parse('candidate')
          added={k:v for k,v in a['bad'].items() if k not in b['bad'] or b['bad'][k]!=v}
          result={'baseline':b,'candidate':a,'new_failures':added,'whole_suite_green':not a['bad']}
          (d/'full-suite-comparison.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps({'baseline_tests':b['tests'],'candidate_tests':a['tests'],'baseline_problems':len(b['bad']),'candidate_problems':len(a['bad']),'new_failures':added}))
          assert a['tests']>=b['tests']+14
          assert not added
          PY
      - name: Commit only tested delta to isolated candidate branch
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/b797-pdf-terms-20261023 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          while IFS= read -r p; do git add -- "$p"; done < "$RUNNER_TEMP/paths797.txt"
          git rm -f -- .github/b797-payload-1.b64 .github/b797-payload-2.b64 .github/b797-payload-3.b64 .github/workflows/b797-bootstrap.yml
          git diff --cached --check
          git commit -m 'fix(cms): measured paginated PDFs and prospective warranty terms (B797)'
          git push origin HEAD:refs/heads/feat/b797-pdf-terms-20261023
          git rev-parse HEAD > "$RUNNER_TEMP/pdf797-proof/tested-source.txt"
          git diff 9bf18d475cd603783c7c81c6a2001875aed3ccee..HEAD --stat > "$RUNNER_TEMP/pdf797-proof/source-stat.txt"
      - name: Preserve evidence without customer data or standalone font files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b797-bootstrap-${{ github.sha }}
          path: ${{ runner.temp }}/pdf797-proof/
          retention-days: 7
          if-no-files-found: warn
