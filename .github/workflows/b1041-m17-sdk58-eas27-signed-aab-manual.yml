name: B1041 M17 SDK58 EAS27 signed Android AAB (MANUAL ONLY)

# An authorized owner must click Run workflow on main. No push/PR/schedule trigger.
# This is one paid AAB dispatch at most, never OTA or Google Play submission.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: b1041-m17-sdk58-signed-aab-6adb3b440b8c
  cancel-in-progress: false

jobs:
  m17-exact-source-aab:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_FETCH_RETRIES: '1'
      M17_SOURCE_SHA: '6adb3b440b8cfdc068b142a98c418d9d91487f64'
      M17_SOURCE_TREE: 'fc4578c93820df8b0c85f5215924ab2bc501ba01'
      M17_PROFILE: 'm17-sdk58-play-rc'
      M17_RUNTIME: '1.0.0-m17-sdk58-play2'
      M17_PROJECT_ID: 'd43b3866-6838-4217-a23e-3dc7f2cc76cc'
      M17_PACKAGE: 'com.ald1n.mobile'

    steps:
      - name: Guard exact PR128 source and seven successful source/native workflows
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077
          test "$GITHUB_REF" = refs/heads/main
          test -n "$GH_READ_TOKEN"
          curl -fsS --retry 2 --retry-delay 2 \
            -H "Authorization: Bearer $GH_READ_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/AldinAga/ald1n-project/pulls/128' \
            > "$RUNNER_TEMP/b1041-pr128.json"
          curl -fsS --retry 2 --retry-delay 2 \
            -H "Authorization: Bearer $GH_READ_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/AldinAga/ald1n-project/actions/runs?head_sha=$M17_SOURCE_SHA&per_page=100" \
            > "$RUNNER_TEMP/b1041-source-ci.json"
          node - "$RUNNER_TEMP/b1041-pr128.json" "$RUNNER_TEMP/b1041-source-ci.json" <<'NODE'
          const fs=require('node:fs');
          const pr=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const ci=JSON.parse(fs.readFileSync(process.argv[3],'utf8'));
          const sha=process.env.M17_SOURCE_SHA;
          if(pr.head?.sha!==sha || pr.head?.repo?.full_name!=='AldinAga/ald1n-project' ||
             pr.state!=='open' || pr.draft!==true || pr.merged_at!==null)
            throw Error('HOLD_PR128_SOURCE_CHANGED_NO_BUILD');
          const expected=[41333706448,41333706461,41333706455,41333706508,41333706470,41333706450,41333706493];
          if(!Array.isArray(ci.workflow_runs))throw Error('HOLD_CI_RESPONSE_UNTRUSTED');
          for(const id of expected){
            const list=ci.workflow_runs.filter(x=>x.id===id);
            if(list.length!==1 || list[0].head_sha!==sha || list[0].status!=='completed' || list[0].conclusion!=='success')
              throw Error('HOLD_EXACT_SOURCE_CI_NOT_SUCCESS_'+id);
          }
          console.log('B1041_EXACT_PR128_SOURCE_AND_7_OF_7_CI=PASS');
          NODE

      - name: Checkout immutable SDK58 source without persisted GitHub credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6adb3b440b8cfdc068b142a98c418d9d91487f64
          fetch-depth: 1
          persist-credentials: false

      - name: Use Node.js 22.23.4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'

      - name: Isolated npm12.2.1 and EAS CLI27.2.0 on disposable runner
        run: |
          set -Eeuo pipefail
          umask 077
          test "$(node --version)" = v22.23.4
          mkdir -p "$RUNNER_TEMP/b1041-npm12" "$RUNNER_TEMP/b1041-eas27" "$RUNNER_TEMP/b1041-bin"
          npm install --prefix "$RUNNER_TEMP/b1041-npm12" --no-save --ignore-scripts --no-audit --no-fund npm@12.2.1
          npm12="$RUNNER_TEMP/b1041-npm12/node_modules/npm/bin/npm-cli.js"
          node "$npm12" --version | grep -Fx '12.2.1'
          node "$npm12" install --prefix "$RUNNER_TEMP/b1041-eas27" --no-save --ignore-scripts --no-audit --no-fund eas-cli@27.2.0
          eas_bin="$(node - "$RUNNER_TEMP/b1041-eas27/node_modules/eas-cli" <<'NODE'
          const path=require('node:path'),fs=require('node:fs');
          const root=path.resolve(process.argv[2]);
          const pkg=JSON.parse(fs.readFileSync(path.join(root,'package.json'),'utf8'));
          if(pkg.version!=='27.2.0')throw Error('HOLD_EAS_VERSION_CHANGED');
          const relative=typeof pkg.bin==='string'?pkg.bin:pkg.bin?.eas;
          if(typeof relative!=='string'||relative.split('/').includes('..'))throw Error('HOLD_EAS_BIN_UNTRUSTED');
          const bin=path.resolve(root,relative);
          if(!bin.startsWith(root+path.sep)||!fs.statSync(bin).isFile())throw Error('HOLD_EAS_BIN_UNTRUSTED');
          process.stdout.write(bin);
          NODE
          )"
          test -f "$eas_bin"
          node "$eas_bin" --version | grep -E '27\.2\.0'
          # Only on the disposable runner: make EAS subprocesses use the pinned npm12.
          printf '#!/bin/sh\nexec "%s" "%s" "$@"\n' "$(command -v node)" "$npm12" > "$RUNNER_TEMP/b1041-bin/npm"
          printf '#!/bin/sh\nexec "%s" "%s" "$@"\n' "$(command -v node)" "$RUNNER_TEMP/b1041-npm12/node_modules/npm/bin/npx-cli.js" > "$RUNNER_TEMP/b1041-bin/npx"
          chmod 700 "$RUNNER_TEMP/b1041-bin/npm" "$RUNNER_TEMP/b1041-bin/npx"
          printf '%s\n' "$RUNNER_TEMP/b1041-bin" >> "$GITHUB_PATH"
          printf 'B1041_NPM12_CLI=%s\n' "$npm12" >> "$GITHUB_ENV"
          printf 'B1041_EAS27_CLI=%s\n' "$eas_bin" >> "$GITHUB_ENV"
          echo 'B1041_ISOLATED_NPM12_EAS27=PASS'

      - name: Verify exact Android release identity and app configuration
        working-directory: apps/mobile/current
        env:
          EXPO_PUBLIC_APP_ENV: production
          EAS_BUILD_PROFILE: m17-sdk58-play-rc
          ALD1N_M17_SDK58_PLAY_RC: source-only
          ALD1N_M17_SDK58_PLAY_PROFILE: m17-sdk58-play-rc
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$M17_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$M17_SOURCE_TREE"
          node - <<'NODE'
          const fs=require('node:fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const eas=JSON.parse(fs.readFileSync('eas.json','utf8'));
          const cfg=require('./app.config.js')({config:{}});
          const profile=eas.build?.[process.env.M17_PROFILE];
          const google=JSON.parse(fs.readFileSync('google-services.json','utf8'));
          const packages=(google.client||[]).map(x=>x.client_info?.android_client_info?.package_name);
          const okay=pkg.name==='ald1n-mobile' && pkg.version==='1.0.0' && pkg.packageManager==='npm@12.2.1' &&
            pkg.dependencies?.expo==='~58.0.22' && pkg.dependencies?.['react-native']==='0.88.1' &&
            pkg.dependencies?.['react-native-nitro-google-signin']==='2.3.1' &&
            pkg.dependencies?.['react-native-nitro-modules']==='0.37.1' &&
            eas.cli?.version==='27.2.0' && eas.cli?.appVersionSource==='remote' &&
            profile?.extends==='production' && profile?.environment==='production' &&
            profile?.distribution==='store' && profile?.channel==='production' &&
            profile?.autoIncrement===true && profile?.android?.buildType==='app-bundle' &&
            profile?.env?.ALD1N_M17_SDK58_PLAY_RC==='source-only' &&
            profile?.env?.ALD1N_M17_SDK58_PLAY_PROFILE===process.env.M17_PROFILE &&
            cfg.version==='1.0.0' && cfg.android?.package===process.env.M17_PACKAGE &&
            cfg.runtimeVersion===process.env.M17_RUNTIME &&
            cfg.extra?.eas?.projectId===process.env.M17_PROJECT_ID &&
            cfg.extra?.apiUrl==='https://cms.ald1n.com/api/v1' &&
            packages.includes(process.env.M17_PACKAGE);
          if(!okay)throw Error('HOLD_RELEASE_IDENTITY_PROFILE_OR_GOOGLE_SERVICES');
          console.log('B1041_ANDROID_PACKAGE_PROFILE_CHANNEL_RUNTIME_GOOGLE_SERVICES=PASS');
          NODE
          git diff --exit-code -- package.json package-lock.json eas.json app.config.js

      - name: Install exact npm12 lock before loading Expo config plugins
        working-directory: apps/mobile/current
        run: |
          set -Eeuo pipefail
          node "$B1041_NPM12_CLI" ci --ignore-scripts --no-audit --no-fund --engine-strict
          test -d node_modules/expo-router
          git diff --exit-code -- package.json package-lock.json eas.json app.config.js
          echo 'B1041_LOCKED_NPM12_CI_AND_EXPO_ROUTER=PASS'

      - name: EAS authenticated duplicate check and remote versionCode 28 gate
        id: preflight
        working-directory: apps/mobile/current
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_APP_ENV: production
          EAS_BUILD_PROFILE: m17-sdk58-play-rc
          ALD1N_M17_SDK58_PLAY_RC: source-only
          ALD1N_M17_SDK58_PLAY_PROFILE: m17-sdk58-play-rc
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$EXPO_TOKEN" || { echo 'HOLD_GITHUB_EXPO_TOKEN_MISSING_NO_BUILD'; exit 2; }
          node "$B1041_EAS27_CLI" project:info > "$RUNNER_TEMP/b1041-project-info.txt"
          grep -Fq "$M17_PROJECT_ID" "$RUNNER_TEMP/b1041-project-info.txt" || { echo 'HOLD_EAS_PROJECT_ID_MISMATCH'; exit 2; }
          node "$B1041_EAS27_CLI" config --platform android --profile "$M17_PROFILE" --json \
            > "$RUNNER_TEMP/b1041-effective-config.json"
          node "$B1041_EAS27_CLI" build:version:get --platform android --profile "$M17_PROFILE" --json --non-interactive \
            > "$RUNNER_TEMP/b1041-remote-version.json"
          node "$B1041_EAS27_CLI" build:list --platform android --build-profile "$M17_PROFILE" --limit 50 --json --non-interactive \
            > "$RUNNER_TEMP/b1041-build-history.json"
          node - "$RUNNER_TEMP/b1041-remote-version.json" "$RUNNER_TEMP/b1041-build-history.json" <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const read=(p)=>fs.readFileSync(p,'utf8');
          const safeParse=(p,category)=>{
            const raw=read(p);
            let value;
            try{value=JSON.parse(raw)}catch{
              const digest=crypto.createHash('sha256').update(raw).digest('hex');
              console.log(`${category}_JSON_FORMAT_HOLD bytes=${Buffer.byteLength(raw)} sha256=${digest}`);
              throw Error(`HOLD_${category}_JSON_INVALID_NO_BUILD`);
            }
            return value;
          };
          const v=safeParse(process.argv[2],'REMOTE_VERSION');
          const code=v?.versionCode??v?.androidVersionCode??v?.android?.versionCode;
          if(Number(code)!==28 || !/^(28)$/.test(String(code)))throw Error('HOLD_REMOTE_VERSION_NOT_28_NO_BUILD');
          const raw=safeParse(process.argv[3],'BUILD_HISTORY');
          const rows=Array.isArray(raw)?raw:Array.isArray(raw?.builds)?raw.builds:null;
          if(!rows)throw Error('HOLD_BUILD_HISTORY_SHAPE_INVALID_NO_BUILD');
          const cutoff=Date.parse('2026-11-02T10:40:00Z');
          for(const b of rows){
            if(b?.buildProfile!==process.env.M17_PROFILE)throw Error('HOLD_BUILD_HISTORY_PROFILE_INCONSISTENT');
            const time=Date.parse(b?.createdAt??'');
            if(!Number.isFinite(time))throw Error('HOLD_BUILD_HISTORY_DATE_UNKNOWN');
            if(time>=cutoff)throw Error('HOLD_EXISTING_M17_RELEASE_PROFILE_BUILD_NO_DUPLICATE');
            if(b?.gitCommitHash===process.env.M17_SOURCE_SHA)throw Error('HOLD_EXISTING_SAME_SHA_BUILD_NO_DUPLICATE');
          }
          if(rows.length>=50){
            const last=Date.parse(rows[rows.length-1]?.createdAt??'');
            if(!Number.isFinite(last)||last>=cutoff)throw Error('HOLD_BUILD_HISTORY_TRUNCATED_NO_BUILD');
          }
          console.log('B1041_EAS_PROJECT_MATCH_NO_NEW_M17_BUILD_REMOTE_CODE_28=PASS');
          NODE
          git diff --exit-code -- package.json package-lock.json eas.json app.config.js

      - name: Dispatch one signed SDK58 Android AAB without Play submission
        id: dispatch
        working-directory: apps/mobile/current
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_APP_ENV: production
          EAS_BUILD_PROFILE: m17-sdk58-play-rc
          ALD1N_M17_SDK58_PLAY_RC: source-only
          ALD1N_M17_SDK58_PLAY_PROFILE: m17-sdk58-play-rc
        run: |
          set -Eeuo pipefail
          umask 077
          printf 'SOURCE_SHA=%s\nPROFILE=%s\nCOUNT_LIMIT=1\nSTATE=ONE_SHOT_INTENT_RECORDED\n' \
            "$M17_SOURCE_SHA" "$M17_PROFILE" > "$RUNNER_TEMP/b1041-one-shot-intent.txt"
          if ! node "$B1041_EAS27_CLI" build --platform android --profile "$M17_PROFILE" \
               --non-interactive --freeze-credentials --no-wait --json \
               --message "ALD1N B1041 M17 SDK58 one signed AAB source $M17_SOURCE_SHA" \
               > "$RUNNER_TEMP/b1041-build-dispatch.json"; then
            echo 'HOLD_EAS_DISPATCH_AMBIGUOUS_CHECK_REMOTE_BEFORE_ANY_RETRY'
            exit 2
          fi
          node - "$RUNNER_TEMP/b1041-build-dispatch.json" "$GITHUB_OUTPUT" <<'NODE'
          const fs=require('node:fs');
          let raw;
          try{raw=JSON.parse(fs.readFileSync(process.argv[2],'utf8'))}
          catch{throw Error('HOLD_DISPATCH_SUCCEEDED_BUT_JSON_UNTRUSTED_DO_NOT_RETRY')}
          const b=Array.isArray(raw)?raw[0]:raw;
          if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(b?.id??''))
            throw Error('HOLD_DISPATCH_UUID_UNKNOWN_DO_NOT_RETRY');
          fs.appendFileSync(process.argv[3],`build_id=${b.id}\n`);
          console.log('B1041_EAS_ONE_AAB_BUILD_DISPATCHED_ID='+b.id);
          console.log('B1041_PENDING_BINARY_16KB_VERIFICATION_NOT_PLAY_AUTHORIZED');
          NODE

      - name: Authenticated single-build readback (not signed AAB validation)
        if: steps.dispatch.outcome == 'success'
        working-directory: apps/mobile/current
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_APP_ENV: production
          EAS_BUILD_PROFILE: m17-sdk58-play-rc
          ALD1N_M17_SDK58_PLAY_RC: source-only
          ALD1N_M17_SDK58_PLAY_PROFILE: m17-sdk58-play-rc
          EAS_BUILD_ID: ${{ steps.dispatch.outputs.build_id }}
        run: |
          set -Eeuo pipefail
          umask 077
          node "$B1041_EAS27_CLI" build:view "$EAS_BUILD_ID" --json > "$RUNNER_TEMP/b1041-build-view.json"
          node - "$RUNNER_TEMP/b1041-build-view.json" <<'NODE'
          const fs=require('node:fs');
          const b=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(b?.id!==process.env.EAS_BUILD_ID || b?.buildProfile!==process.env.M17_PROFILE ||
             (b?.gitCommitHash&&b.gitCommitHash!==process.env.M17_SOURCE_SHA))
            throw Error('HOLD_EAS_BUILD_PROVENANCE_CHANGED_NO_PLAY');
          const sanitized={state:'DISPATCHED_NOT_FINISHED_NOT_PLAY_AUTHORIZED',
            id:b.id,status:b.status??'UNKNOWN',observedCode:b.appBuildVersion??null,
            sourceSha:process.env.M17_SOURCE_SHA,observedSha:b.gitCommitHash??null,
            profile:process.env.M17_PROFILE,channel:'production',versionName:'1.0.0',
            runtimeVersion:process.env.M17_RUNTIME,androidPackage:process.env.M17_PACKAGE,
            actualSignedAabSha256:'NOT_YET_VERIFIED',signerSha256:'NOT_YET_VERIFIED',
            elf16k:'NOT_YET_VERIFIED',bundletool16k:'NOT_YET_VERIFIED',device16kUat:'NOT_YET_VERIFIED',
            playSubmit:'NONE',ota:'NONE',productionCheckout:'UNCHANGED'};
          fs.writeFileSync(process.env.RUNNER_TEMP+'/b1041-sanitized-receipt.json',JSON.stringify(sanitized,null,2)+'\n',{mode:0o600});
          console.log('B1041_ONE_BUILD_READBACK='+sanitized.id);
          NODE

      - name: Archive only sanitized dispatch intent and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1041-m17-sdk58-aab-receipt-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/b1041-sanitized-receipt.json
            ${{ runner.temp }}/b1041-one-shot-intent.txt
          if-no-files-found: warn
          retention-days: 14
