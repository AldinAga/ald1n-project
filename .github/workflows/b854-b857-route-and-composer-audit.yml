name: B854-B857 storefront route census and Composer SCA (NO RELEASE)
on:
  pull_request:
    paths:
      - 'apps/cms/current/routes/web.php'
      - 'apps/cms/current/routes/api.php'
      - 'apps/cms/current/composer.lock'
      - 'docs/security/tools/b854_route_surface.py'
      - 'docs/security/tools/test_b854_route_surface.py'
      - 'docs/security/tools/b857_composer_audit_gate.py'
      - 'docs/security/tools/test_b857_composer_audit_gate.py'
      - 'docs/security/B854-B857-ROUTE-SURFACE-SCA.md'
      - '.github/workflows/b854-b857-route-and-composer-audit.yml'
permissions:
  contents: read
concurrency:
  group: b854-security-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  route-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ald1n_test
      DB_USERNAME: ald1n_test
      DB_PASSWORD: ald1n_test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      TURNSTILE_ENABLED: 'false'
    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_DATABASE: ald1n_test
          MARIADB_USER: ald1n_test
          MARIADB_PASSWORD: ald1n_test
          MARIADB_ROOT_PASSWORD: ci_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - name: Exact event head without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Locked PHP 8.4 runtime
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_mysql,pdo_sqlite,dom,curl,fileinfo,openssl,tokenizer,xml,xmlwriter,intl,gd,zip,bcmath
          coverage: none
      - name: Offline adversarial tests for route drift and middleware omissions
        run: |
          set -euo pipefail
          python3 -m unittest discover -s docs/security/tools -p 'test_b854_route_surface.py' -v
      - name: Load locked Laravel route table, no HTTP or production access
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          test "$APP_ENV" = testing
          test "$DB_HOST" = 127.0.0.1
          test "$DB_DATABASE" = ald1n_test
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          php artisan route:list --json > "$RUNNER_TEMP/b854-real-routes.json"
          python3 -m json.tool "$RUNNER_TEMP/b854-real-routes.json" > /dev/null
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          sha256sum "$RUNNER_TEMP/b854-real-routes.json"
      - name: B855 fail-closed 14-endpoint allowlist and exact-source evidence
        run: |
          set -euo pipefail
          python3 docs/security/tools/b854_route_surface.py \
            --routes="$RUNNER_TEMP/b854-real-routes.json" \
            --source-sha="$(git rev-parse HEAD)" \
            --output="$RUNNER_TEMP/b854-route-surface.json"
          test "$(jq -r .target_commit "$RUNNER_TEMP/b854-route-surface.json")" = "$(git rev-parse HEAD)"
          test "$(jq -r .public_contract_total "$RUNNER_TEMP/b854-route-surface.json")" = 14
          test "$(jq -r .verified_owasp_security_pass "$RUNNER_TEMP/b854-route-surface.json")" = 0
          test "$(jq -r .release "$RUNNER_TEMP/b854-route-surface.json")" = HOLD
          sha256sum "$RUNNER_TEMP/b854-route-surface.json"
      - name: Archive source-only route map and checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b854-route-and-middleware-census
          path: |
            ${{ runner.temp }}/b854-real-routes.json
            ${{ runner.temp }}/b854-route-surface.json
            docs/security/tools/b854_route_surface.py
            docs/security/tools/test_b854_route_surface.py
            docs/security/B854-B857-ROUTE-SURFACE-SCA.md
            .github/workflows/b854-b857-route-and-composer-audit.yml
          retention-days: 7
          if-no-files-found: ignore
      - name: Boundary
        if: always()
        run: echo 'ROUTE_TABLE_SOURCE_ONLY NO_ACTIVE_CSRF_PROBE NO_PRODUCTION NO_RELEASE OWASP_UNASSESSED'

  composer-lock-sca:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Exact event head, no persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: PHP 8.4 and Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          coverage: none
      - name: B857 synthetic advisory-failure gate tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s docs/security/tools -p 'test_b857_composer_audit_gate.py' -v
      - name: Official Composer locked advisory audit, fail closed
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          test -f composer.lock
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          set +e
          composer audit --locked --no-interaction --format=json > "$RUNNER_TEMP/b857-composer-audit.json" 2> "$RUNNER_TEMP/b857-composer-audit.err"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$RUNNER_TEMP/b857-composer-audit.rc"
          test -s "$RUNNER_TEMP/b857-composer-audit.json" || { echo 'B857_COMPOSER_AUDIT_NO_JSON_HOLD'; exit 9; }
          python3 ../../../docs/security/tools/b857_composer_audit_gate.py \
            --audit-json="$RUNNER_TEMP/b857-composer-audit.json" \
            --lockfile=composer.lock \
            --source-sha="$(git rev-parse HEAD)" \
            --exit-code="$rc" \
            --output="$RUNNER_TEMP/b857-composer-sca-evidence.json"
          sha256sum "$RUNNER_TEMP/b857-composer-sca-evidence.json"
      - name: Archive read-only vulnerability and provenance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b857-composer-locked-advisories
          path: |
            ${{ runner.temp }}/b857-composer-audit.json
            ${{ runner.temp }}/b857-composer-audit.rc
            ${{ runner.temp }}/b857-composer-audit.err
            ${{ runner.temp }}/b857-composer-sca-evidence.json
            apps/cms/current/composer.lock
            docs/security/tools/b857_composer_audit_gate.py
            docs/security/tools/test_b857_composer_audit_gate.py
            .github/workflows/b854-b857-route-and-composer-audit.yml
          retention-days: 7
          if-no-files-found: ignore
      - name: Boundary
        if: always()
        run: echo 'B857_COMPOSER_LOCK_SCA_ONLY NO_CUSTOMER_DATA NO_RELEASE NO_PRODUCTION_MUTATION'
