name: Android LG-03 native lock metadata (disposable)
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/android-lg03-wave2-native-navigation-candidate-20261020
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Resolve exact npm v0.2.1 candidate into disposable lock
        working-directory: apps/mobile/current
        run: |
          set -euo pipefail
          npm --version
          npm install --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund react-native-android-liquid-glass@0.2.1
          node - <<'NODE'
          const fs=require('node:fs');
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const entry=lock.packages?.['node_modules/react-native-android-liquid-glass'];
          if(lock.packages?.['']?.dependencies?.['react-native-android-liquid-glass']!=='0.2.1'||!entry||entry.version!=='0.2.1'||!entry.integrity||!entry.resolved)process.exit(41);
          console.log('NPM_NATIVE_GLASS_EXACT_LOCK_ENTRY='+JSON.stringify(entry));
          console.log('NPM_NATIVE_GLASS_ROOT_DEP=0.2.1');
          console.log('NO_RELEASE_NO_APP_BUILD');
          NODE
