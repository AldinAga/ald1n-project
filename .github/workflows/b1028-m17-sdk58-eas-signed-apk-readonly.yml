name: B1028 M17 SDK58 EAS signed internal APK provenance (READ ONLY)

# One bounded automatic read after the source audit workflow is installed.
# No paid EAS build, OTA, Play, credentials update, or deployment commands.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b1028-m17-sdk58-eas-signed-apk-readonly.yml'
      - '.github/scripts/b1028-eas-apk-attest.mjs'
      - '.github/scripts/b1028-eas-apk-attest.test.mjs'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: b1028-m17-signed-apk-readonly
  cancel-in-progress: false

jobs:
  attest-eas-internal-apk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_FETCH_RETRIES: '1'
      M17_BUILD_ID: '994c264d-a147-40a4-ba7b-51f8734b3422'
      M17_SOURCE_SHA: '4af7b16c4f47c6aa09271ed03993f477c9be1bd8'
      M17_PROFILE: 'm17-sdk58-uat'
      M17_RUNTIME: '1.0.0-m17-sdk58-uat1'
      M17_PROJECT_ID: 'd43b3866-6838-4217-a23e-3dc7f2cc76cc'
      EXPO_PUBLIC_APP_ENV: 'preview'
      EAS_BUILD_PROFILE: 'm17-sdk58-uat'
      ALD1N_M17_SDK58_UAT: 'isolated'
      ALD1N_M17_SDK58_PROFILE: 'm17-sdk58-uat'
    steps:
      - name: Checkout CI-only verifier from main, no retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Use pinned Node 22.23.4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'

      - name: Verify signed APK verifier logic with synthetic regression cases
        run: |
          set -Eeuo pipefail
          node --check .github/scripts/b1028-eas-apk-attest.mjs
          node --test .github/scripts/b1028-eas-apk-attest.test.mjs
          echo 'B1028_SIX_SOURCE_REGRESSIONS=PASS_CI_ONLY'

      - name: Verify immutable PR123 source and already-successful B1025 request
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          umask 077
          test "$GITHUB_REF" = 'refs/heads/main'
          test -n "$GH_READ_TOKEN"
          curl -fsS --retry 2 --retry-delay 2 \
            -H "Authorization: Bearer $GH_READ_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/AldinAga/ald1n-project/pulls/123' \
            > "$RUNNER_TEMP/b1028-pr123.json"
          curl -fsS --retry 2 --retry-delay 2 \
            -H "Authorization: Bearer $GH_READ_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/AldinAga/ald1n-project/actions/runs/41318158284' \
            > "$RUNNER_TEMP/b1028-original-build-request.json"
          node - "$RUNNER_TEMP/b1028-pr123.json" "$RUNNER_TEMP/b1028-original-build-request.json" <<'NODE'
          const fs=require('node:fs');
          const pr=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const run=JSON.parse(fs.readFileSync(process.argv[3],'utf8'));
          if(pr.state!=='open' || pr.draft!==true || pr.merged_at!==null
             || pr.head?.sha!==process.env.M17_SOURCE_SHA
             || pr.head?.repo?.full_name!=='AldinAga/ald1n-project')
            throw Error('HOLD_B1028_PR123_SOURCE_CHANGED');
          if(run.id!==41318158284 || run.event!=='workflow_dispatch'
             || run.name!=='B1025 M17 SDK58 one internal EAS Android APK (MANUAL ONLY)'
             || run.status!=='completed' || run.conclusion!=='success')
            throw Error('HOLD_B1028_EAS_REQUEST_PROVENANCE_CHANGED');
          console.log('B1028_ORIGINAL_B1025_APPROVED_DISPATCH_AND_PR123_SOURCE=PASS');
          NODE

      - name: Checkout immutable SDK58 source into isolated subfolder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4af7b16c4f47c6aa09271ed03993f477c9be1bd8
          path: sdk58-src
          fetch-depth: 1
          persist-credentials: false

      - name: Install locked SDK58 source tooling without changing any repository
        working-directory: sdk58-src/apps/mobile/current
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$M17_SOURCE_SHA"
          test "$(node --version)" = 'v22.23.4'
          test "$(npm --version | cut -d. -f1)" = 10
          npm ci --ignore-scripts --no-audit --no-fund --engine-strict
          git diff --exit-code -- package.json package-lock.json eas.json app.config.js
          echo 'B1028_SOURCE_TOOLING_ISOLATED=PASS'

      - name: Read authenticated EAS build status by exact immutable build ID (NO BUILD)
        id: metadata
        working-directory: sdk58-src/apps/mobile/current
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -Eeuo pipefail
          umask 077
          if test -z "$EXPO_TOKEN"; then
            echo 'HOLD_B1028_EXPO_TOKEN_MISSING'; exit 2
          fi
          npm exec --yes --package=eas-cli@25.0.0 -- eas build:view "$M17_BUILD_ID" --json \
            > "$RUNNER_TEMP/b1028-eas-view.json"
          node "$GITHUB_WORKSPACE/.github/scripts/b1028-eas-apk-attest.mjs" metadata \
            "$RUNNER_TEMP/b1028-eas-view.json" \
            "$RUNNER_TEMP/b1028-sanitized-receipt.json" \
            "$RUNNER_TEMP/b1028-validated-private-artifact-url.txt"
          echo 'B1028_EAS_READ_ONLY=TRUE; NEW_EAS_BUILD=NONE'

      - name: Use verified JDK17 for Android build-tools inspection (no app build)
        if: steps.metadata.outputs.build_status == 'FINISHED'
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Inspect signed EAS APK certificate versionCode native ELF and 16KiB ZIP (if finished)
        if: steps.metadata.outputs.build_status == 'FINISHED'
        working-directory: sdk58-src/apps/mobile/current
        run: |
          set -Eeuo pipefail
          umask 077
          test -s "$RUNNER_TEMP/b1028-validated-private-artifact-url.txt"
          command -v curl
          command -v unzip
          command -v readelf
          sdk="${ANDROID_HOME:?}"
          test -d "$sdk/cmdline-tools" || {
            echo 'HOLD_B1028_NO_ANDROID_CMDLINE_TOOLS_ON_RUNNER'; exit 2;
          }
          manager="$(find "$sdk/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -x "$manager" || {
            echo 'HOLD_B1028_SDKMANAGER_NOT_FOUND_IN_SDK_PATH'; exit 2;
          }
          tools="$sdk/build-tools/36.0.0"
          if ! test -x "$tools/aapt" || ! test -x "$tools/apksigner" || ! test -x "$tools/zipalign"; then
            "$manager" 'build-tools;36.0.0' > "$RUNNER_TEMP/b1028-sdkmanager.log" 2>&1 || {
              echo 'HOLD_B1028_RUNNER_BUILD_TOOLS_NOT_AVAILABLE'; exit 2;
            }
          fi
          test -x "$tools/aapt"
          test -x "$tools/apksigner"
          test -x "$tools/zipalign"
          apk="$RUNNER_TEMP/b1028-actual-signed.apk"
          trap 'rm -f "$RUNNER_TEMP/b1028-actual-signed.apk"' EXIT
          curl --fail --silent --show-error --location --retry 2 --retry-delay 2 \
            --max-time 240 --max-filesize 400000000 \
            --output "$apk" "$(cat "$RUNNER_TEMP/b1028-validated-private-artifact-url.txt")"
          test -s "$apk"
          unzip -tqq "$apk"
          AAPT_BIN="$tools/aapt" APKSIGNER_BIN="$tools/apksigner" ZIPALIGN_BIN="$tools/zipalign" \
            node "$GITHUB_WORKSPACE/.github/scripts/b1028-eas-apk-attest.mjs" apk \
              "$RUNNER_TEMP/b1028-eas-view.json" \
              "$RUNNER_TEMP/b1028-sanitized-receipt.json" "$apk"
          echo 'B1028_SIGNED_INTERNAL_APK_STATIC_GATE=PASS_NOT_DEVICE_UAT'

      - name: Archive only sanitized receipt (never APK, private URL or Expo credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1028-m17-sdk58-signed-apk-readonly-${{ github.run_id }}
          path: ${{ runner.temp }}/b1028-sanitized-receipt.json
          if-no-files-found: warn
          retention-days: 30
