name: B877-B881 public media OFF cache + relative cart redirects (NO DEPLOY)
on:
  pull_request:
    branches:
      - fix/b872-public-no-script-csp-20261025
    paths:
      - 'apps/cms/current/app/Http/Controllers/PublicShopController.php'
      - 'apps/cms/current/app/Http/Middleware/SecurityHeaders.php'
      - 'apps/cms/current/tests/Feature/PublicMediaCacheAndCartRedirectB877Test.php'
      - 'docs/security/B877-B881-MEDIA-ORIGIN-AND-B803-TRIAGE.md'
      - '.github/workflows/b877-public-media-cart-qa.yml'
permissions:
  contents: read
concurrency:
  group: b877-media-cart-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  media-and-cart-real-http:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/b877-public-media-and-cart-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_DATABASE: ald1n_test
          MARIADB_USER: ald1n_test
          MARIADB_PASSWORD: ald1n_test
          MARIADB_ROOT_PASSWORD: ci_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ald1n_test
      DB_USERNAME: ald1n_test
      DB_PASSWORD: ald1n_test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      TURNSTILE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Exact stacked source and three-file CMS diff gate
        run: |
          set -euo pipefail
          BASE=5315d72a7b918f7a9f0104a820656d0a6920fe0d
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          git cat-file -e "$BASE^{commit}"
          diff -u \
            <(printf '%s\n' \
              apps/cms/current/app/Http/Controllers/PublicShopController.php \
              apps/cms/current/app/Http/Middleware/SecurityHeaders.php \
              apps/cms/current/tests/Feature/PublicMediaCacheAndCartRedirectB877Test.php | sort) \
            <(git diff --name-only "$BASE" HEAD -- apps/cms/current | sort)
          test "$(git rev-parse "$BASE:apps/cms/current/composer.lock")" = "$(git rev-parse HEAD:apps/cms/current/composer.lock)"
          test -z "$(git diff --name-only "$BASE" HEAD -- apps/cms/current/tests/Feature/StorefrontRegistrationOnlyB809Test.php apps/cms/current/tests/Feature/BuyerCheckoutSessionBoundaryB815Test.php)"
          git diff --check
          echo B877_SRC_SCOPE=3_FILES_NO_PREVIOUS_FIXTURE_OR_COMPOSER_DRIFT
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_mysql,dom,curl,fileinfo,openssl,tokenizer,xml,xmlwriter,intl,gd,zip,bcmath
          coverage: none
      - name: Composer locked install and PHP syntax
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          test ! -e .env
          install -m 600 /dev/null .env
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          php -l app/Http/Controllers/PublicShopController.php
          php -l app/Http/Middleware/SecurityHeaders.php
          php -l tests/Feature/PublicMediaCacheAndCartRedirectB877Test.php
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306;dbname=ald1n_test","ald1n_test","ald1n_test");if(!str_starts_with((string)$p->query("SELECT VERSION()")->fetchColumn(),"10.11.19-MariaDB"))exit(35);'
      - name: New media/cache/Host cases plus six unchanged real-MariaDB security suites
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          vendor/bin/phpunit -c phpunit.mysql.xml --fail-on-warning \
            --filter 'PublicMediaCacheAndCartRedirectB877Test|PublicCatalogSurfaceSecurityB847Test|PublicResponseHeadersB866Test|PublicNoScriptCspB872Test|CoreAccessRoleIdStabilityB876Test|PublicCheckoutReplayIntegrityB843Test|PublicRegisteredReceiptBoundaryB836Test' \
            --log-junit "$RUNNER_TEMP/b877-combined.xml" tests/Feature \
            > "$RUNNER_TEMP/b877-combined.log" 2>&1 || {
              tail -n 150 "$RUNNER_TEMP/b877-combined.log"; exit 1;
            }
          tail -n 18 "$RUNNER_TEMP/b877-combined.log"
      - name: Fail-closed case identity, count and warning gate
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP" "$(git rev-parse HEAD)" <<'PY'
          import collections,hashlib,json,pathlib,sys,xml.etree.ElementTree as ET
          folder=pathlib.Path(sys.argv[1])
          xml=(folder/'b877-combined.xml').read_bytes()
          cases=list(ET.fromstring(xml).iter('testcase'))
          ids=[(x.get('classname') or x.get('class'),x.get('name')) for x in cases]
          actual=collections.Counter((a or '').replace('\\','.').split('.')[-1] for a,b in ids)
          expected={
            'PublicMediaCacheAndCartRedirectB877Test':9,
            'PublicCatalogSurfaceSecurityB847Test':15,
            'PublicResponseHeadersB866Test':11,
            'PublicNoScriptCspB872Test':13,
            'CoreAccessRoleIdStabilityB876Test':3,
            'PublicCheckoutReplayIntegrityB843Test':11,
            'PublicRegisteredReceiptBoundaryB836Test':15,
          }
          if len(ids)!=77 or len(set(ids))!=77 or actual!=expected or any(not a or not b for a,b in ids):
            raise SystemExit('HOLD_B877_MISSING_DUPLICATE_OR_RENAMED_TESTS_'+str(actual))
          if any(x.find(e) is not None for x in cases for e in ('failure','error','skipped','warning')):
            raise SystemExit('HOLD_B877_ERROR_FAILURE_WARNING_OR_SKIPPED')
          receipt={'source_sha':sys.argv[2],'junit_sha256':hashlib.sha256(xml).hexdigest(),
              'cases':77,'class_counts':dict(actual),
              'scope':'SYNTHETIC_REAL_HTTP_ONLY_NO_DEPLOY',
              'media_cache':'PRIVATE_NO_STORE_FOR_200_AND_404',
              'cart_redirect':'RELATIVE_LOCATION_NO_HOST_DERIVATION',
              'old_full_suite_failures':56,'old_failures_waived':0,
              'total_owasp_items_independently_completed':0,'production_changed':False,
              'release':'HOLD'}
          (folder/'b877-evidence.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print('B877_HTTP_SCOPED_77_OF_77_PASS_ZERO_SKIP')
          PY
          sha256sum "$RUNNER_TEMP/b877-combined.xml" "$RUNNER_TEMP/b877-evidence.json"
      - name: Preserve exact source and CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b877-b881-private-media-and-relative-cart
          path: |
            ${{ runner.temp }}/b877-combined.xml
            ${{ runner.temp }}/b877-combined.log
            ${{ runner.temp }}/b877-evidence.json
            apps/cms/current/app/Http/Controllers/PublicShopController.php
            apps/cms/current/app/Http/Middleware/SecurityHeaders.php
            apps/cms/current/tests/Feature/PublicMediaCacheAndCartRedirectB877Test.php
            docs/security/B877-B881-MEDIA-ORIGIN-AND-B803-TRIAGE.md
            .github/workflows/b877-public-media-cart-qa.yml
          if-no-files-found: ignore
          retention-days: 7
      - name: Production boundary
        if: always()
        run: echo B877_SCOPED_CI_ONLY_GLOBAL_B803_56_FAIL_UNWAIVED_OWASP368_NOT_FULL_PASS_NO_PROD_NO_SSH_NO_EAS_NO_OTA_NO_PLAY_NO_MERGE
