name: Android LG-03 Wave 1 (isolated Build25-safe source QA)

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/current/src/components/layout/android-glass-material-policy.ts'
      - 'apps/mobile/current/src/components/layout/app-bottom-nav.tsx'
      - 'apps/mobile/current/scripts/release25/android-liquid-glass-wave1.test.mjs'
      - 'apps/mobile/current/docs/ANDROID-LIQUID-GLASS-LG03.md'
      - '.github/workflows/android-lg03-wave1-source-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wave1:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_APP_ENV: production
    steps:
      - name: Checkout exact PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pinned Node 22.23.4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Install locked mobile dependencies
        working-directory: apps/mobile/current
        run: npm ci --no-audit --no-fund
      - name: Install strictly isolated npm12.2.1 for this SDK58 native CI
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/ald1n-npm12"
          npm install --prefix "$RUNNER_TEMP/ald1n-npm12" --no-save --no-package-lock --ignore-scripts --engine-strict --no-audit --no-fund npm@12.2.1
          test "$(node "$RUNNER_TEMP/ald1n-npm12/node_modules/npm/bin/npm-cli.js" --version)" = '12.2.1'
          echo 'M17_NPM12_ISOLATED_CI=PASS'
      - name: Exact SDK57-or-SDK58 native baseline and forbidden release drift
        working-directory: apps/mobile/current
        run: |
          set -euo pipefail
          node - <<'NODE'
          const p=require('./package.json');
          const c=require('fs').readFileSync('./app.config.js','utf8');
          const e=require('./eas.json');
          // This LG-03 source gate is shared by the existing accepted SDK57 release
          // and the isolated SDK58 PR candidate. Reject unsupported/mixed versions.
          const exactBaselines = {
            '~57.0.27': { rn:'0.86.3', google:'1.0.2', nitro:'0.36.1', npm:'npm@10.9.2', eas:'25.0.0', label:'SDK57' },
            '~58.0.25': { rn:'0.88.1', google:'2.3.1', nitro:'0.37.1', npm:'npm@12.2.1', eas:'27.2.0', label:'SDK58' },
          };
          const baseline = exactBaselines[p.dependencies.expo];
          if(p.version!=='1.0.0'||p.packageManager!==baseline.npm||!baseline
             ||p.dependencies['react-native']!==baseline.rn)process.exit(31);
          if(p.dependencies['react-native-nitro-google-signin']!==baseline.google
             ||p.dependencies['react-native-nitro-modules']!==baseline.nitro)process.exit(36);
          console.log('LG03_EXACT_'+baseline.label+'_RN_AND_GOOGLE_BRIDGE_BASELINE=PASS');
          if(p.dependencies['expo-blur']||p.dependencies['react-native-android-liquid-glass']!=='0.2.1')process.exit(32);
          if(!c.includes("ALD1N_V15_RELEASE_GATE === 'approved'"))process.exit(33);
          const config=require('./app.config.js');
          const normal=config({config:{}});
          if(normal.version!=='1.0.0'||normal.runtimeVersion!=='1.0.0-build17')process.exit(35);
          if(e.cli.version!==baseline.eas||e.cli.appVersionSource!=='remote'||e.build?.production?.channel!=='production'||e.build?.production?.android?.buildType!=='app-bundle')process.exit(34);
          console.log('LG03_NATIVE_DEPENDENCY_16KB_PIN_AND_DEFAULT_RUNTIME_ISOLATION=PASS');
          NODE
      - name: TypeScript and canonical mobile static validation
        working-directory: apps/mobile/current
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/ald1n-npm12/node_modules/npm/bin/npm-cli.js" run typecheck
          node "$RUNNER_TEMP/ald1n-npm12/node_modules/npm/bin/npm-cli.js" run validate
      - name: All Release25 source regression tests including Android LG-03
        working-directory: apps/mobile/current
        run: npm run test:release25
      - name: Build25-compatible Android JS bundle export (never publish)
        working-directory: apps/mobile/current
        run: |
          set -euo pipefail
          npx expo export --platform android --output-dir "$RUNNER_TEMP/ald1n-lg03-wave1-android-export"
          test -d "$RUNNER_TEMP/ald1n-lg03-wave1-android-export"
          echo "ANDROID_JS_BUNDLE_EXPORT=PASS_NO_PUBLISH"
      - name: No release or backend operations
        if: always()
        run: |
          echo 'APK_NATIVE_BUILD=NONE'
          echo 'EAS_BUILD=NONE'
          echo 'OTA=NONE'
          echo 'GOOGLE_PLAY=NONE'
          echo 'PRODUCTION_DB_MUTATION=NONE'
