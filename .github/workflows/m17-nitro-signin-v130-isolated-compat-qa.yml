name: M17 Nitro Google Sign-In 1.3.0 isolated SDK58 Kotlin compatibility probe (NO RELEASE)
on:
  pull_request:
    paths:
      - .github/workflows/m17-nitro-signin-v130-isolated-compat-qa.yml
permissions:
  contents: read
jobs:
  candidate-nitro130:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_APP_ENV: production
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_FETCH_RETRIES: '1'
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - name: Read-only checkout exact PR revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pinned Node22.23.4 and npm10
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: JDK17 isolated
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify exact pre-probe source and preserve release files
        working-directory: apps/mobile/current
        shell: bash
        run: |
          set -Eeuo pipefail
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const e=JSON.parse(fs.readFileSync('eas.json','utf8'));
          assert.equal(p.dependencies.expo,'~58.0.22');
          assert.equal(p.dependencies['react-native'],'0.88.1');
          assert.equal(p.dependencies['react-native-nitro-google-signin'],'1.0.2');
          assert.equal(p.dependencies['react-native-nitro-modules'],'0.36.1');
          assert.equal(p.version,'1.0.0');
          assert.equal(p.packageManager,'npm@10.9.2');
          assert.equal(e.cli.version,'25.0.0');
          assert.equal(e.cli.appVersionSource,'remote');
          assert.equal(e.build.production.android.buildType,'app-bundle');
          assert.ok(!process.env.EAS_BUILD_PROFILE && !process.env.ALD1N_V15_RELEASE_GATE);
          const app=require('./app.config.js')({config:{}});
          assert.equal(app.android.package,'com.ald1n.mobile');
          assert.equal(app.runtimeVersion,'1.0.0-build17');
          console.log('M17_NITRO130_RELEASE_AND_BASELINE=PASS');
          NODE
          sha256sum app.config.js eas.json src/features/auth/google-auth.ts src/app/'(auth)'/login.tsx > "$RUNNER_TEMP/m17-nitro-protected.before"
      - name: Install candidate Nitro1.3.0 using npm10 only in ephemeral checkout
        working-directory: apps/mobile/current
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(node --version)" = v22.23.4
          npm ci --ignore-scripts --no-audit --no-fund --engine-strict
          npm install --save-exact --ignore-scripts --no-audit --no-fund --engine-strict react-native-nitro-google-signin@1.3.0
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const l=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          assert.equal(p.dependencies['react-native-nitro-google-signin'],'1.3.0');
          assert.equal(l.packages[''].dependencies['react-native-nitro-google-signin'],'1.3.0');
          assert.equal(l.packages['node_modules/react-native-nitro-google-signin'].version,'1.3.0');
          assert.equal(require('./node_modules/react-native-nitro-google-signin/package.json').version,'1.3.0');
          assert.equal(p.dependencies['react-native-nitro-modules'],'0.36.1');
          const src=fs.readFileSync('node_modules/react-native-nitro-google-signin/android/src/main/java/com/nitrogooglesignin/GoogleSignInButtonShadowNode.kt','utf8');
          assert.ok(!src.includes('themedContext'),'HOLD_UPSTREAM_KOTLIN_SHADOW_NODE_STILL_OLD');
          assert.ok(src.includes('PixelUtil.toPixelFromDIP(STANDARD_WIDTH_DP)'));
          console.log('M17_NITRO130_UPSTREAM_KOTLIN_FIX_AND_LOCK=PASS');
          NODE
          node - <<'NODE'
          const fs=require('node:fs');
          const path='scripts/validate-project.mjs';
          const s=fs.readFileSync(path,'utf8');
          const from="packageJson.dependencies?.['react-native-nitro-google-signin'] === '1.0.2'";
          const to="packageJson.dependencies?.['react-native-nitro-google-signin'] === '1.3.0'";
          if(s.split(from).length!==2)throw Error('HOLD_NITRO130_VALIDATOR_ANCHOR_DRIFT');
          fs.writeFileSync(path,s.replace(from,to));
          console.log('M17_NITRO130_EPHEMERAL_VALIDATOR_ADAPTED=PASS');
          NODE
          mkdir -p "$RUNNER_TEMP/m17-nitro130-candidate"
          cp package.json package-lock.json scripts/validate-project.mjs "$RUNNER_TEMP/m17-nitro130-candidate/"
          node node_modules/expo/bin/cli install --check
      - name: Strict TypeScript, full project validator, Expo Doctor, Release25 tests
        working-directory: apps/mobile/current
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run typecheck
          npm run validate
          npm run doctor
          npm run test:release25
          echo 'M17_NITRO130_APPLICATION_AND_RELEASE_REGRESSION=PASS'
      - name: Bounded Android SDK36 and NDK27
        shell: bash
        run: |
          set -Eeuo pipefail
          sdk="${ANDROID_HOME:-}"
          test -n "$sdk"
          manager="$(find "$sdk/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -x "$manager"
          "$manager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
          echo 'M17_NITRO130_JDK17_SDK36_NDK27=PASS'
      - name: Expo58 Android prebuild and actual debug Kotlin compilation
        working-directory: apps/mobile/current
        shell: bash
        run: |
          set -Eeuo pipefail
          node node_modules/expo/bin/cli prebuild --platform android --no-install --clean
          test -s android/gradlew
          chmod u+x android/gradlew
          (cd android && ./gradlew :app:compileDebugKotlin :react-native-android-liquid-glass:compileDebugKotlin --no-daemon --stacktrace --warning-mode=summary)
          echo 'M17_NITRO130_SDK58_NATIVE_KOTLIN=PASS_CI_ONLY'
      - name: Verify release config/Google login unchanged; inspect candidate diff
        if: always()
        working-directory: apps/mobile/current
        shell: bash
        run: |
          set -Eeuo pipefail
          sha256sum app.config.js eas.json src/features/auth/google-auth.ts src/app/'(auth)'/login.tsx > "$RUNNER_TEMP/m17-nitro-protected.after"
          diff -u "$RUNNER_TEMP/m17-nitro-protected.before" "$RUNNER_TEMP/m17-nitro-protected.after"
          git diff --exit-code -- app.config.js eas.json src/features/auth/google-auth.ts src/app/'(auth)'/login.tsx
          git diff --check
          echo 'M17_NITRO130_NO_RELEASE_GOOGLE_AUTH_SOURCE_MUTATION=PASS'
          echo 'EAS_BUILD=NONE OTA=NONE PLAY=NONE SIGNED_AAB=NONE'
      - name: Archive candidate manifests only, no credentials / build binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m17-nitro130-sdk58-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m17-nitro130-candidate/package.json
            ${{ runner.temp }}/m17-nitro130-candidate/package-lock.json
            ${{ runner.temp }}/m17-nitro130-candidate/validate-project.mjs
          if-no-files-found: ignore
          retention-days: 21
