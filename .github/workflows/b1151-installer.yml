# B1151 legal e-mail visibility, merchant draft and password-change throttle installer. CI only, nothing is deployed.
#
# PAYLOAD GATE. The payload heads (PR 164 codex/legal-email-visible-20261112 and PR 165 codex/merchant-draft-password-throttle-20261112)
# are named in ONE place: the block marked B1151_PAYLOAD in tools/storefront/b1151/LegalAccountInstallCoordinator.php (BASE_COMMIT,
# EMAIL_COMMIT, THROTTLE_COMMIT and STEPS). If a head moves, change only that block; this file reads the commits from it (step with id
# "payload") and exports them as B1151_EMAIL and B1151_THROTTLE to the later steps. The step fails when a commit is missing or malformed.
name: B1151 legal e-mail, merchant draft and password throttle installer (NO DEPLOY)
on:
  push:
    branches: [codex/b1151-installer-20261112]
    paths: ['.github/workflows/b1151-installer.yml', 'tools/storefront/b1151/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  # The B1150 payload head the live tree was built from (Report1116), the B1149 payload head, and the operator tooling heads:
  # B1150 (2c74fd7b, the tooling the owner ran) and B1149 (bf5ac045).
  B1150_SOURCE: 14e628ba61b77e3c6854bed100c634d1999b5f33
  B1150_TOOLING: 2c74fd7b84ecfb242df9d2a94b8a22a707c858d6
  B1149_SOURCE: 7e7481582fa0be3e95503a81b316be63836e508c
  B1149_TOOLING: bf5ac045a8b045fbe0f7cd9fc8e7f154d6ff49f0
jobs:
  installer:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 240
    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_ROOT_PASSWORD: isolated-ci-only
          MARIADB_DATABASE: ald1n_b1151_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -pisolated-ci-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Fetch the chain commits (B1146 base, B1146-B1150 heads, main eca7755c, tooling bases 6558e7a1, bf5ac045 and 2c74fd7b) by SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" fetch --no-tags origin \
            77a3efeabf59281fd820b4afffa14c4ebc209049 ef3f927b77ba573881c2b6dba341732c417e6725 eabe16af8c19fade882e25c70425eb43c3e17ed9 \
            764bf5135ad6241d64f728e4b141cc2713dc6c48 560828458974a56a8f7173b986a40d46629e4d8b eca7755c6efe05143a6d3cd19f8c9e70b9ee3515 \
            55d06b9cc010c976dfc56743763dbfeb09b87acf 7e7481582fa0be3e95503a81b316be63836e508c c41f78fcd0382c2f161a717a0061d5883d641730 \
            6558e7a1584c58753af8b2bdfc7c0c7274d8f291 84facde9ff138d1e7dd0de7af5c811d800b0ccfe afa0c704a1c4ad096918f904b98a77e223398e22 \
            bf5ac045a8b045fbe0f7cd9fc8e7f154d6ff49f0 14e628ba61b77e3c6854bed100c634d1999b5f33 2c74fd7b84ecfb242df9d2a94b8a22a707c858d6
          for c in 77a3efeabf59281fd820b4afffa14c4ebc209049 ef3f927b77ba573881c2b6dba341732c417e6725 eabe16af8c19fade882e25c70425eb43c3e17ed9 764bf5135ad6241d64f728e4b141cc2713dc6c48 560828458974a56a8f7173b986a40d46629e4d8b eca7755c6efe05143a6d3cd19f8c9e70b9ee3515 55d06b9cc010c976dfc56743763dbfeb09b87acf 7e7481582fa0be3e95503a81b316be63836e508c c41f78fcd0382c2f161a717a0061d5883d641730 6558e7a1584c58753af8b2bdfc7c0c7274d8f291 bf5ac045a8b045fbe0f7cd9fc8e7f154d6ff49f0 14e628ba61b77e3c6854bed100c634d1999b5f33 2c74fd7b84ecfb242df9d2a94b8a22a707c858d6; do
            test "$(git rev-parse --verify "$c^{commit}")" = "$c"
          done
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: opcache,pdo_mysql,mysqli,pdo_sqlite,sqlite3,mbstring,dom,libxml,fileinfo,curl,gd,intl,bcmath,zip,posix
          coverage: none
      - name: Pin cms.ald1n.com to loopback so CI can never reach production
        run: |
          set -euo pipefail
          printf '\n127.0.0.1 cms.ald1n.com\n::1 cms.ald1n.com\n' | sudo tee -a /etc/hosts >/dev/null
          python3 -c 'import socket,sys;a={i[4][0] for i in socket.getaddrinfo("cms.ald1n.com",443)};print(sorted(a));sys.exit(0 if a and a<={"127.0.0.1","::1"} else 2)'
      - name: Syntax, portable operator shell, pinned helpers, tooling base and forbidden mechanisms absent from shipped code
        run: |
          set -euo pipefail
          for f in tools/storefront/b1151/*.php tools/storefront/b1150/*.php tools/storefront/b1149/*.php tools/storefront/b1148/*.php tools/storefront/b1147/*.php tools/storefront/b1146/*.php tools/storefront/b1145/*.php tools/storefront/b1144/*.php tools/storefront/b1134/*.php; do php -l "$f"; done
          w=tools/storefront/b1151/operator-wrapper.sh
          bash -n "$w"
          if grep -nE '<\(|>\(|/dev/fd|python3' "$w"; then exit 2; fi
          grep -q 'setsid nohup bash "$SCRIPT" --worker > /dev/null 2>&1 < /dev/null &' "$w"
          test "$(grep -v '^#' "$w" | head -n 1)" = "clear 2>/dev/null || printf '\033c'"
          grep -q 'exec >> "$REPORT" 2>&1 < /dev/null' "$w"
          grep -q 'if($highest<1116)exit(2)' "$w"
          printf '%s\n' \
            '9dce8324bd4464a1689918775736bcd3a850f2b1c2b1b0ca7e130a9e486da12b  tools/storefront/b1134/InstallFileOps.php' \
            '20ba7d5baa2affa719f8e858a5d5c6e89d46341cb20d2dbef4d8cfb2ca64b077  tools/storefront/b1134/ReleasePrimitives.php' \
            '1e790c20fb9712d416399975d6cbcce3be1bd2dc12ede59a95f2e1cc75ea7e3e  tools/storefront/b1134/runtime-directories.json' \
            '7e62150fcad0884255ddb3c18063f5e2a23852a3eb0fdecb978c2955392ccf6e  tools/storefront/b1144/LeanGates.php' \
            '3dbf4762e419d8df053fa7e642bd1b85df07d66dbffdb94fe0d8d5cdc1b50616  tools/storefront/b1144/FreshnessProbe.php' \
            '54a04bc4dea81d56ad5fe0e6b25a141d4a86acf803f6df95f1c5d2b7adff6a73  tools/storefront/b1144/LeanWeb.php' \
            '04a4bbd13b8aef346247d8641445ccb9f0a2d7fd3f26f7a03723724fc0132f69  tools/storefront/b1145/EnvFlags.php' \
            '642ddede76db8f1ea66bfc6a8d1ad74c894a70b665204cac4c96de17e97113a5  tools/storefront/b1145/AppState.php' \
            '46b159fbeab6c4f849dbb1a9291bbf13245b511ea58fd51646f26f28caa53fb9  tools/storefront/b1145/MigrateUnclampCoordinator.php' \
            'abcc9c64c6b9918d180afd387ec917a4924e1ce28c0099c0bbdae500e811c01f  tools/storefront/b1146/OverlayProbe.php' \
            '68b4b2af5ad5a6399991adf474cfc753abf77a483fb12d2c1669a4b307ce2c2b  tools/storefront/b1146/AppCheck.php' \
            'c4e4c0935b4c14e7fbee1089243f5be4784c5b25c5c0a62d11551d5dfa1461ce  tools/storefront/b1147/CatalogWeb.php' \
            '278b03d1914580063a71f4f12c99e741376fbedb268e4570614dc3ccf3213b73  tools/storefront/b1147/AppCheck.php' \
            'd52bf4d475d3b3b1e6bd33fb6e766d24414b19b0fb3ee4dc0e9cdce59ed9cde9  tools/storefront/b1147/CatalogOverlayCoordinator.php' \
            '69bbdca104bfcbc62948e06a464fcaff55b5bf100a7ab513299fb19d00600c7c  tools/storefront/b1148/GlassWeb.php' \
            '0951b1ca3e9fcf6b7a2c722ce412903b593a9aa0b63dca5200f810a54c39e16a  tools/storefront/b1148/AppCheck.php' \
            '332a13a5014845051aea3ffa68591b6075d798e94be5428e3cb288d222d3641b  tools/storefront/b1148/GlassOverlayCoordinator.php' \
            '3742a8c1100f9d7bab9c4c489cc2e22d789a4d954fb47e01eeb112c52067e1d3  tools/storefront/b1149/StorefrontInstallCoordinator.php' \
            'c090e207891fe0e70efaaa6c09ffb6eb00b44c475ccf4acc5790ac672a07c2ca  tools/storefront/b1149/StorefrontWeb.php' \
            'da100fde8e75fd0885e81366bc95d695f01bbedf31842dccec5fa5b2baa7aed3  tools/storefront/b1149/AppCheck.php' \
            'cf85b7822a0acba558c4c8a1b52a2dbdd24ee3c168be297cd1c663126e1402cb  tools/storefront/b1150/MediaInstallCoordinator.php' \
            '6c570b0c89be1e11d35a3155972c661d6af4b504d0ba6c68a9d8f397415227a8  tools/storefront/b1150/MediaWeb.php' \
            'd438f04becd62f226902d0cb66f9cb7cf2cb12a11d1b0dd624f44344c982f196  tools/storefront/b1150/AppCheck.php' \
            '2c29266b5f7c6f5d995f2fed17f4fd6515a9fa9a98bc972a5478cff5e2703016  tools/storefront/b1150/operator-entry.php' \
            | sha256sum --check --strict
          # The B1134-B1149 tooling is the reviewed bf5ac045 copy (B1149 PASS, Report1115), byte for byte; it installs B1146 to B1149 for real below.
          git diff --quiet bf5ac045a8b045fbe0f7cd9fc8e7f154d6ff49f0 HEAD -- tools/storefront/b1134 tools/storefront/b1144 tools/storefront/b1145 tools/storefront/b1146 tools/storefront/b1147 tools/storefront/b1148 tools/storefront/b1149
          # The B1150 tooling is the reviewed 2c74fd7b copy (B1150 PASS, Report1116); the digests above are those of the members of the ZIP the owner ran. It installs B1150 for real below.
          git diff --quiet 2c74fd7b84ecfb242df9d2a94b8a22a707c858d6 HEAD -- tools/storefront/b1150
          shipped='tools/storefront/b1151/operator-entry.php tools/storefront/b1151/LegalAccountInstallCoordinator.php tools/storefront/b1151/AppCheck.php tools/storefront/b1151/operator-wrapper.sh'
          if grep -niE '/usr/local/cpanel|uapi|DomainInfo|opcache_reset|php_flag|HostProcessGuard|--seed|migrate:fresh|migrate:rollback|migrate:refresh|migrate:reset|db:wipe|config:cache|view:cache|route:cache|public_storefront_open|Mail::|mail\(|CURLOPT_POST|CURLOPT_CUSTOMREQUEST|->set\(' $shipped; then exit 2; fi
          if grep -n $'\r' $shipped tools/storefront/b1151/README-SR.md; then exit 2; fi
          # No numbered operation report may ride along: the owner's wrapper would number the live report one higher.
          if git ls-files docs/operations | grep -E '/(111[7-9]|11[2-9][0-9])-'; then exit 2; fi
      - name: PAYLOAD GATE - the payload heads are read from the B1151_PAYLOAD block of the coordinator
        id: payload
        continue-on-error: false
        run: |
          set -euo pipefail
          c=tools/storefront/b1151/LegalAccountInstallCoordinator.php
          test "$(grep -c 'B1151_PAYLOAD (begin)' "$c")" = 1
          test "$(grep -c 'B1151_PAYLOAD (end)' "$c")" = 1
          block="$(sed -n '/B1151_PAYLOAD (begin)/,/B1151_PAYLOAD (end)/p' "$c")"
          base="$(grep -o "BASE_COMMIT='[a-f0-9]\{40\}'" <<<"$block" | cut -d"'" -f2)"
          email="$(grep -o "EMAIL_COMMIT='[a-f0-9]\{40\}'" <<<"$block" | cut -d"'" -f2)"
          throttle="$(grep -o "THROTTLE_COMMIT='[a-f0-9]\{40\}'" <<<"$block" | cut -d"'" -f2)"
          test -n "$base" && test -n "$email" && test -n "$throttle"
          test "$base" = "$B1150_SOURCE"
          test "$email" != "$throttle" && test "$email" != "$base" && test "$throttle" != "$base"
          grep -q "public const STEPS=\[" <<<"$block"
          echo "B1151_EMAIL=$email" >> "$GITHUB_ENV"
          echo "B1151_THROTTLE=$throttle" >> "$GITHUB_ENV"
          echo "payload heads: email=$email throttle=$throttle base=$base"
      - name: Fetch the B1151 payload heads by SHA
        if: ${{ !cancelled() && steps.payload.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" fetch --no-tags origin "$B1151_EMAIL" "$B1151_THROTTLE"
          for c in "$B1151_EMAIL" "$B1151_THROTTLE"; do
            test "$(git rev-parse --verify "$c^{commit}")" = "$c"
            git merge-base --is-ancestor "$B1150_SOURCE" "$c"
          done
          git merge-base --is-ancestor "$B1149_SOURCE" "$B1150_SOURCE"
      - name: Rebuild the inert runtime bundle of ef3f927b (the 7-day artifact 13363389798 has expired) and pin its manifest digest
        if: ${{ !cancelled() && steps.payload.outcome == 'success' }}
        id: runtime
        run: |
          set -euo pipefail
          # The bundle is built exactly as the B1130 job of b1082-storefront-current-main.yml built it (same source commit, same composer
          # 2.11.1, same locked dependencies, same manifest layout). The manifest holds the sha256 of every file, so the pinned manifest
          # digest d737387e... proves the rebuilt tree is byte for byte the tree that is on the host. The tar.gz itself carries a gzip
          # timestamp and is not byte-reproducible; nothing downstream pins its digest (the stage is made from the manifest).
          work="$RUNNER_TEMP/b1151-runtime"
          mkdir -p "$work/payload" "$work/stage" "$work/build/runtime"
          export B1130_BUILD="$work/build" B1130_HEAD_SHA=ef3f927b77ba573881c2b6dba341732c417e6725 B1130_OUT="$work/payload" B1130_WS="$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          work=pathlib.Path(os.environ['B1130_BUILD']); dest=work/'runtime'; ws=os.environ['B1130_WS']
          source=os.environ['B1130_HEAD_SHA']; prefix='apps/cms/current/'
          roots=('app/','bootstrap/','config/','database/migrations/','database/seeders/','resources/','routes/','public/','bin/')
          files={'artisan','composer.json','composer.lock','VERSION','RELEASE-TAG','CHANGELOG.md'}
          entries=subprocess.check_output(['git','-C',ws,'ls-tree','-r','-z',source,prefix]).split(b'\0')
          selected=[]
          for raw in entries:
              if not raw: continue
              meta,name=raw.decode().split('\t',1); mode,kind,blob=meta.split(); rel=name.removeprefix(prefix)
              if rel not in files and not rel.startswith(roots): continue
              parts=pathlib.PurePosixPath(rel).parts
              assert not rel.startswith('/') and '..' not in parts and '\\' not in rel,rel
              assert mode in ('100644','100755') and kind=='blob',(rel,mode,kind)
              assert not any(x in ('storage','node_modules','.git','tests','test','fixtures') or x.startswith('.env') for x in parts),rel
              if rel.startswith('bootstrap/cache/'): continue
              assert not rel.endswith(('.sql','.sql.gz','.gpg','.p12','.pfx','.key','.sqlite','.sqlite3','.dump')),rel
              body=subprocess.check_output(['git','-C',ws,'cat-file','blob',blob])
              target=dest/rel; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(body); target.chmod(0o755 if mode=='100755' else 0o644)
              selected.append({'path':rel,'blob':blob,'sha256':hashlib.sha256(body).hexdigest()})
          assert files.issubset({x['path'] for x in selected}),files
          assert hashlib.sha256((dest/'composer.lock').read_bytes()).hexdigest()=='4937d2e652bd41f83005faebfa5f238e4425db3a02506985695b4f3da2b8613b'
          (work/'source-files.json').write_text(json.dumps(selected,indent=2))
          PY
          curl --fail --silent --show-error --location https://getcomposer.org/download/2.11.1/composer.phar --output "$work/build/composer.phar"
          echo "6f1b891e1d4927d62740276c540fb490e47689e19e102c49e8da849794882f8c  $work/build/composer.phar" | sha256sum --check --strict
          export COMPOSER_HOME="$work/build/composer-home" COMPOSER_CACHE_DIR="$work/build/composer-cache"
          php "$work/build/composer.phar" install --working-dir="$work/build/runtime" --no-dev --no-scripts --no-plugins --prefer-dist --no-interaction --optimize-autoloader --no-progress
          php "$work/build/composer.phar" check-platform-reqs --working-dir="$work/build/runtime" --no-dev
          (cd "$work/build/runtime" && php -r 'require "vendor/autoload.php";foreach(json_decode(file_get_contents("vendor/composer/installed.json"),true,512,JSON_THROW_ON_ERROR)["packages"] as $package){$name=$package["name"];echo $name,"\t",Composer\InstalledVersions::getPrettyVersion($name),"\n";}') > "$work/build/installed-versions.tsv"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,stat,subprocess,tarfile
          work=pathlib.Path(os.environ['B1130_BUILD']); root=work/'runtime'; out=pathlib.Path(os.environ['B1130_OUT']); ws=os.environ['B1130_WS']
          source=os.environ['B1130_HEAD_SHA']; lock=json.loads((root/'composer.lock').read_text())
          expected={p['name']:p['version'] for p in lock['packages']}
          actual={}
          for line in (work/'installed-versions.tsv').read_text().splitlines():
              name,version=line.split('\t'); actual[name]=version
          project=json.loads((root/'composer.json').read_text())['name']; actual.pop(project,None)
          assert actual==expected,{'missing':sorted(set(expected)-set(actual)),'extra':sorted(set(actual)-set(expected)),'different':[n for n in expected.keys() & actual.keys() if expected[n]!=actual[n]]}
          for item in json.loads((work/'source-files.json').read_text()):
              assert hashlib.sha256((root/item['path']).read_bytes()).hexdigest()==item['sha256'],item['path']
          installed=json.loads((root/'vendor/composer/installed.json').read_text())
          assert installed.get('dev') is False and not installed.get('dev-package-names'),installed.get('dev')
          files=[]; dirs=[]; total=0
          for item in sorted(root.rglob('*')):
              rel=item.relative_to(root).as_posix(); parts=pathlib.PurePosixPath(rel).parts; mode=item.lstat().st_mode
              assert not item.is_symlink() and (stat.S_ISDIR(mode) or stat.S_ISREG(mode)),rel
              assert not rel.startswith('/') and '..' not in parts and '\\' not in rel,rel
              assert not any(p.startswith('.env') or p in ('.git','node_modules','storage','tests','test','fixtures','__fixtures__') for p in parts),rel
              assert not rel.startswith('bootstrap/cache/'),rel
              if item.is_dir(): dirs.append(rel); continue
              assert item.stat().st_nlink==1,rel
              assert not rel.endswith(('.sql','.sql.gz','.gpg','.p12','.pfx','.key','.sqlite','.sqlite3','.dump')),rel
              content=item.read_bytes(); size=len(content); assert size<=16*1024*1024,rel
              total+=size; files.append({'path':rel,'size':size,'sha256':hashlib.sha256(content).hexdigest()})
          assert 0<len(files)<=30000 and total<=192*1024*1024,(len(files),total)
          archive=out/'cms-runtime.tar.gz'
          with tarfile.open(archive,'w:gz',format=tarfile.PAX_FORMAT) as tar:
              for rel in dirs+[f['path'] for f in files]:
                  p=root/rel; info=tar.gettarinfo(str(p),arcname=rel); info.uid=info.gid=0; info.uname=info.gname=''; info.mtime=0
                  if info.isfile():
                      with p.open('rb') as stream: tar.addfile(info,stream)
                  else: tar.addfile(info)
          tree=subprocess.check_output(['git','-C',ws,'rev-parse',source+'^{tree}'],text=True).strip()
          manifest={'schemaVersion':1,'sourceCommit':source,'sourceTree':tree,'composerLockSHA256':hashlib.sha256((root/'composer.lock').read_bytes()).hexdigest(),'prodPackages':expected,'files':files,'totalFiles':len(files),'totalBytes':total,'archiveRoot':'CMS relative','productionMutation':False,'deploymentAuthorized':False,'storefrontActivationAuthorized':False}
          (out/'runtime-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps({'files':len(files),'bytes':total,'manifestSHA256':hashlib.sha256((out/'runtime-manifest.json').read_bytes()).hexdigest()}))
          assert len(files)==8531,len(files)
          assert hashlib.sha256((out/'runtime-manifest.json').read_bytes()).hexdigest()=='d737387e60a981b3b404e0980d9b70cb95b6e1d506a39211981d49dcd12be4c6','MANIFEST_DIGEST_DIFFERS_FROM_THE_ONE_ON_THE_HOST'
          with tarfile.open(archive) as tar:
              assert all((m.isfile() or m.isdir()) and not m.name.startswith('/') and '..' not in pathlib.PurePosixPath(m.name).parts for m in tar.getmembers())
              tar.extractall(work.parent/'stage',filter='data')
          PY
      - name: Build the B1146 to B1150 ZIPs (fixture predecessors) and the B1151 operator ZIP from git (the two source diffs must equal the coded STEPS set)
        if: ${{ !cancelled() && steps.payload.outcome == 'success' }}
        id: package
        run: |
          set -euo pipefail
          s="$GITHUB_WORKSPACE/tools/storefront"
          manifest="$RUNNER_TEMP/b1151-runtime/payload/runtime-manifest.json"
          php "$s/b1146/package.php" "$GITHUB_WORKSPACE" "$s/b1146" "$s/b1134" "$s/b1144" "$s/b1145" "$manifest" "$RUNNER_TEMP/package-b1146" 84facde9ff138d1e7dd0de7af5c811d800b0ccfe > "$RUNNER_TEMP/package-b1146.json"
          php "$s/b1147/package.php" "$GITHUB_WORKSPACE" "$s/b1147" "$s/b1134" "$s/b1144" "$s/b1145" "$s/b1146" "$manifest" "$RUNNER_TEMP/package-b1147" afa0c704a1c4ad096918f904b98a77e223398e22 > "$RUNNER_TEMP/package-b1147.json"
