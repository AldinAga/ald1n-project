          unzip -p "$RUNNER_TEMP/package-b1150/b1150-operator.zip" incoming/b1150-package.sha256 | grep -E '  b1150-(app-check|coordinator|web)\.php$' | sort -k2 > "$RUNNER_TEMP/b1150-members.txt"
