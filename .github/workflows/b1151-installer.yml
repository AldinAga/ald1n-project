          steps="$(php -r 'preg_match("/public const STEPS=\[(.*?)\n    \];/s",file_get_contents($argv[1]),$b);echo preg_match_all("/\[\x27[^\x27]+\x27,\x27(?:new|modified)\x27,\x27[A-D]\x27,\x27[ET]\x27\]/",$b[1]);' tools/storefront/b1151/LegalAccountInstallCoordinator.php)"
