          # B1150 exactly as the owner's ZIP was built: helper source bf5ac045 (HELPER_SOURCE_SHA of Report1116), payload head 14e628ba.
          php "$s/b1150/package.php" "$GITHUB_WORKSPACE" "$s/b1150" "$s/b1134" "$s/b1144" "$s/b1145" "$s/b1146" "$s/b1147" "$s/b1148" "$s/b1149" "$manifest" "$RUNNER_TEMP/package-b1150" bf5ac045a8b045fbe0f7cd9fc8e7f154d6ff49f0 "$B1150_SOURCE" > "$RUNNER_TEMP/package-b1150.json"
