name: M17 Expo SDK58 isolated migration candidate (NO RELEASE)

on:
  pull_request:
    paths:
      - '.github/workflows/m17-sdk58-isolated-upgrade-candidate.yml'
      - 'apps/mobile/current/package.json'
      - 'apps/mobile/current/package-lock.json'
      - 'apps/mobile/current/tsconfig.json'
      - 'apps/mobile/current/scripts/validate-project.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk58-isolated-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_FETCH_RETRIES: '1'
      NPM_CONFIG_REGISTRY: 'https://registry.npmjs.org/'
    steps:
      - name: Checkout exact PR source without write token
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use exact Node 22.23.4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Protect source/release identity and preserve SDK57 baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(node -v)" = 'v22.23.4'
          test "$(npm -v | cut -d. -f1)" = '10'
          node - <<'NODE'
          const fs = require('node:fs');
          const p=JSON.parse(fs.readFileSync('apps/mobile/current/package.json'));
          const e=JSON.parse(fs.readFileSync('apps/mobile/current/eas.json'));
          const c=fs.readFileSync('apps/mobile/current/app.config.js','utf8');
          if (p.dependencies.expo!=='~57.0.27' || p.dependencies['react-native']!=='0.86.3' ||
              p.dependencies.react!=='19.2.3' || p.packageManager!=='npm@10.9.2' ||
              e.cli.version!=='25.0.0' || e.cli.appVersionSource!=='remote' ||
              !c.includes("'1.5.0-native2'") || !c.includes("'1.0.0-build17'")) {
            throw Error('HOLD_M17_UNEXPECTED_REPO_BASELINE');
          }
          console.log('M17_SOURCE_BASELINE_LOCK=PASS Expo57/RN0.86/React19.2/npm10/EAS25 runtime frozen');
          NODE
          sha256sum apps/mobile/current/eas.json apps/mobile/current/app.config.js > "$RUNNER_TEMP/m17-release-before.sha256"
          echo "M17_CANDIDATE_SOURCE_COMMIT=$GITHUB_SHA"
          echo 'M17_NO_PRODUCTION_BUILD_OTA_PLAY=PASS'
      - name: Generate SDK58 target manifest from Expo bundledNativeModules in isolated runner
        shell: bash
        working-directory: apps/mobile/current
        run: |
          set -Eeuo pipefail
          META="$RUNNER_TEMP/m17-expo58-metadata"
          mkdir -p "$META"
          npm view expo@58.0.22 version engines --json
          npm install --prefix "$META" --ignore-scripts --no-save --no-package-lock --no-audit --no-fund --engine-strict expo@58.0.22
          node - "$META/node_modules/expo/bundledNativeModules.json" <<'NODE'
          const fs=require('node:fs');
          const bundle=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const path='package.json';
          const p=JSON.parse(fs.readFileSync(path,'utf8'));
          const expected={expo:'~58.0.22',react:'19.3.0','react-dom':'19.3.0','react-native':'0.88.1'};
          if (p.dependencies.expo!=='~57.0.27'||p.dependencies['react-native']!=='0.86.3') throw Error('HOLD_M17_PACKAGE_DRIFT');
          for(const section of ['dependencies','devDependencies']){
            for(const [name,old] of Object.entries(p[section]||{})){
              if(name in bundle){
                const target=bundle[name];
                if(typeof target!=='string'||!target.trim())throw Error('HOLD_M17_INVALID_EXPO_BUNDLED_TARGET_'+name);
                expected[name]=target;
              }
            }
          }
          // React/React Native contract is specified by SDK58 and pinned independently of latest tags.
          Object.assign(expected,{expo:'~58.0.22',react:'19.3.0','react-dom':'19.3.0','react-native':'0.88.1','@types/react':'~19.3.0'});
          const report=[];
          for(const section of ['dependencies','devDependencies']){
            for(const name of Object.keys(p[section]||{})){
              if(Object.hasOwn(expected,name) && expected[name]!==p[section][name]){
                report.push(`${section} ${name}: ${p[section][name]} -> ${expected[name]}`);
                p[section][name]=expected[name];
              }
            }
          }
          // packageManager, EAS release pins, app/runtime version and app config remain unchanged.
          if(p.packageManager!=='npm@10.9.2'||p.version!=='1.0.0'||!report.length)throw Error('HOLD_M17_SOURCE_RELEASE_LOCK');
          fs.writeFileSync(path,JSON.stringify(p,null,2)+'\n');
          report.forEach(l=>console.log('M17_SDK58_CANDIDATE_TARGET '+l));
          console.log(`M17_SDK58_TARGET_COUNT=${report.length}`);
          NODE
          npm install --ignore-scripts --no-audit --no-fund --engine-strict --package-lock=true
          echo 'M17_SDK58_NPM10_CANDIDATE_INSTALL=PASS'
      - name: Actual Expo SDK58 dependency contract check (read-only detector)
        working-directory: apps/mobile/current
        shell: bash
        run: |
          set -Eeuo pipefail
          node node_modules/expo/bin/cli install --check
          echo 'M17_EXPO58_DEPENDENCY_CHECK=PASS'
      - name: Actual TypeScript strict migration check
        working-directory: apps/mobile/current
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run typecheck
          echo 'M17_SDK58_TYPECHECK=PASS'
      - name: Actual app validator / Expo Doctor / selected non-release tests
        working-directory: apps/mobile/current
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run validate
          echo 'M17_SDK58_VALIDATOR=PASS'
          npm run doctor
          echo 'M17_SDK58_DOCTOR=PASS'
          npm run test:release25
          echo 'M17_RELEASE25_SOURCE_TESTS=PASS'
      - name: Verify limited change scope and protected release identity
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          sha256sum apps/mobile/current/eas.json apps/mobile/current/app.config.js > "$RUNNER_TEMP/m17-release-after.sha256"
          diff -u "$RUNNER_TEMP/m17-release-before.sha256" "$RUNNER_TEMP/m17-release-after.sha256"
          node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('apps/mobile/current/package.json'));
          const e=JSON.parse(fs.readFileSync('apps/mobile/current/eas.json'));
          if (p.version!=='1.0.0'||p.packageManager!=='npm@10.9.2'||e.cli.version!=='25.0.0'||e.cli.appVersionSource!=='remote')throw Error('HOLD_M17_RELEASE_PIN_MUTATION');
          console.log('M17_RELEASE_CONFIG_UNCHANGED=PASS');
          NODE
          unexpected="$(git diff --name-only -- . ':!apps/mobile/current/package.json' ':!apps/mobile/current/package-lock.json')"
          if test -n "$unexpected"; then printf 'HOLD_M17_UNEXPECTED_FILE_DIFF=%s\n' "$unexpected"; exit 2; fi
          git diff --check
          echo 'M17_SOURCE_MUTATION_ONLY_EPHEMERAL_NPM_PACKAGE_AND_LOCK=PASS'
          echo 'M17_EAS_BUILD_SUBMIT_OTA_PLAY=NONE'
      - name: Archive generated candidate manifests and lock for source review (NO AUTO COMMIT)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m17-sdk58-candidate-manifests-${{ github.run_id }}
          path: |
            apps/mobile/current/package.json
            apps/mobile/current/package-lock.json
          retention-days: 14
          if-no-files-found: warn
