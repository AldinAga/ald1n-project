name: Build26 native glass current-main QA (NO BUILD)
on:
  push:
    branches:
      - feature/build26-native-liquid-glass-foundation-main-20261021
  pull_request:
    paths:
      - 'apps/mobile/current/package.json'
      - 'apps/mobile/current/package-lock.json'
      - 'apps/mobile/current/app.config.js'
      - 'apps/mobile/current/eas.json'
      - 'apps/mobile/current/src/app/(app)/_layout.tsx'
      - 'apps/mobile/current/src/components/layout/android-native-glass-bottom-nav.tsx'
      - 'apps/mobile/current/src/components/layout/app-bottom-nav.tsx'
      - 'apps/mobile/current/scripts/release25/build26-native-foundation-main-contract.test.mjs'
      - '.github/workflows/build26-native-liquid-glass-current-main-qa.yml'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - working-directory: apps/mobile/current
        run: npm ci --no-audit --no-fund
      - working-directory: apps/mobile/current
        run: |
          set -euo pipefail
          node --test scripts/release25/build26-native-foundation-main-contract.test.mjs
          npm run typecheck
          npm run validate
          npm run test:release25
      - if: always()
        run: echo 'NO_EAS_BUILD=YES NO_OTA=YES NO_GOOGLE_PLAY=YES'
