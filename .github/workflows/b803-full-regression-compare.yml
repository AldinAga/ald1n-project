name: B803 full CMS baseline versus candidate (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'apps/cms/current/**'
      - '.github/workflows/b803-full-regression-compare.yml'
permissions:
  contents: read
concurrency:
  group: b803-full-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  full-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_DATABASE: ald1n_test
          MARIADB_USER: ald1n_test
          MARIADB_PASSWORD: ald1n_test
          MARIADB_ROOT_PASSWORD: ci_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ald1n_test
      DB_USERNAME: ald1n_test
      DB_PASSWORD: ald1n_test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      TURNSTILE_ENABLED: 'false'
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_mysql,pdo_sqlite,dom,curl,fileinfo,openssl,tokenizer,xml,xmlwriter,intl,gd,zip,bcmath
          coverage: none
      - name: Build immutable runtime predecessor and candidate manifest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b803-evidence" "$RUNNER_TEMP/b803-baseline"
          git rev-parse HEAD > "$RUNNER_TEMP/b803-evidence/source-head.txt"
          git archive 32def73e4145b00f51e672b7b1810b34d8fe44e4 apps/cms/current | tar -x -C "$RUNNER_TEMP/b803-baseline"
          php apps/cms/current/tests/Support/build-b803-runtime-manifest.php "$RUNNER_TEMP/b803-evidence/runtime-manifest.json"
      - name: Complete baseline suite - record inherited failures without hiding them
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/b803-baseline/apps/cms/current"
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          rc=0
          vendor/bin/phpunit -c phpunit.mysql.xml --log-junit "$RUNNER_TEMP/b803-evidence/baseline-junit.xml" > "$RUNNER_TEMP/b803-evidence/baseline-tests.log" 2>&1 || rc=$?
          printf '%s\n' "$rc" > "$RUNNER_TEMP/b803-evidence/baseline-rc.txt"
          tail -n 10 "$RUNNER_TEMP/b803-evidence/baseline-tests.log"
      - name: Complete candidate suite and compare every failure by test identity
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          rc=0
          vendor/bin/phpunit -c phpunit.mysql.xml --log-junit "$RUNNER_TEMP/b803-evidence/candidate-junit.xml" > "$RUNNER_TEMP/b803-evidence/candidate-tests.log" 2>&1 || rc=$?
          printf '%s\n' "$rc" > "$RUNNER_TEMP/b803-evidence/candidate-rc.txt"
          tail -n 10 "$RUNNER_TEMP/b803-evidence/candidate-tests.log"
          php tests/Support/compare-b803-full-suite.php "$RUNNER_TEMP/b803-evidence"
      - name: Preserve actual suite results and runtime hashes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b803-full-regression-evidence
          path: ${{ runner.temp }}/b803-evidence
          retention-days: 2
      - name: Production boundary
        if: always()
        run: echo 'DISPOSABLE_ONLY NO_PRODUCTION_WRITES NO_CUSTOMER_MAIL NO_DEPLOY_NO_EAS_OTA_PLAY'
