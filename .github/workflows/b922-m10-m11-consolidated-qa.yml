name: B922 M10+M11 one combined 69-case real Laravel QA (NO DEPLOY)
"on":
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  combined-warranty:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mariadb:
        image: mariadb:10.11.19
        env:
          MARIADB_DATABASE: ald1n_test
          MARIADB_USER: ald1n_test
          MARIADB_PASSWORD: ald1n_test
          MARIADB_ROOT_PASSWORD: ci_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: https://cms.ald1n.com
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: ald1n_test
      DB_USERNAME: ald1n_test
      DB_PASSWORD: ald1n_test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      MOBILE_PUSH_ENABLED: 'false'
      MOBILE_PUSH_EXPO_ACCESS_TOKEN: ''
      TURNSTILE_ENABLED: 'false'
      OPERATIONAL_EMAIL_NOTIFICATIONS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Exact main ancestor, six PR source Git blob pins and 16-file M10/M11-only scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          BASE=252580c3d65b126c96709ae240d1e3f797d611f5
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE" HEAD | sort > "$RUNNER_TEMP/b937-changed.txt"
          cat > "$RUNNER_TEMP/b937-expected.txt" <<'FILES'
          .github/workflows/b922-m10-m11-consolidated-qa.yml
          apps/cms/current/app/Services/ExpoPushTransport.php
          apps/cms/current/app/Services/MobilePushDispatcher.php
          apps/cms/current/app/Services/MobilePushOutboxService.php
          apps/cms/current/app/Services/OrderPaymentService.php
          apps/cms/current/app/Services/OrderWorkflowService.php
          apps/cms/current/app/Services/PushEventCategory.php
          apps/cms/current/app/Services/WarrantyExpiryRecipientPolicy.php
          apps/cms/current/tests/Feature/MobilePushCategoryRevocationB911Test.php
          apps/cms/current/tests/Feature/MobilePushRecipientOwnershipB909Test.php
          apps/cms/current/tests/Feature/MobilePushRevocationB910Test.php
          apps/cms/current/tests/Feature/MobilePushTokenRotationB912Test.php
          apps/cms/current/tests/Feature/PaymentTransitionNotificationB902Test.php
          apps/cms/current/tests/Feature/WarrantyExpiryArrayMailDeliveryB916Test.php
          apps/cms/current/tests/Feature/WarrantyExpiryFreshEligibilityB905Test.php
          apps/cms/current/tests/Feature/WarrantyFirstPaymentIssuance798Test.php
          FILES
          diff -u "$RUNNER_TEMP/b937-expected.txt" "$RUNNER_TEMP/b937-changed.txt"
          test -z "$(git diff --name-only "$BASE" HEAD -- \
            apps/cms/current/tests/Feature/BuyerCheckoutSessionBoundaryB815Test.php \
            apps/cms/current/tests/Feature/StorefrontRegistrationOnlyB809Test.php \
            apps/cms/current/tests/Feature/StorefrontSecurityB806Test.php)"
          # Exact six Git blobs from PR93 / PR110 / PR111, tested on PR111+B932 via Report878.
          test "$(git hash-object apps/cms/current/app/Services/OrderPaymentService.php)" = "55e9a81c5d775496586b96a61f21d062c8ebb0ef"
          test "$(git hash-object apps/cms/current/app/Services/OrderWorkflowService.php)" = "91e19794dcb79ab9be3d5e410e4bf5fdcc76dee6"
          test "$(git hash-object apps/cms/current/app/Services/WarrantyExpiryRecipientPolicy.php)" = "a3558a1b61093dab890d979b7be33054a6d8b5ae"
          test "$(git hash-object apps/cms/current/tests/Feature/PaymentTransitionNotificationB902Test.php)" = "77f4f4f2286657c86229dcd6f467a6a63542281c"
          test "$(git hash-object apps/cms/current/tests/Feature/WarrantyExpiryFreshEligibilityB905Test.php)" = "e7f343c8646f39cee89ba0e14a3cb5dd90f2713f"
          test "$(git hash-object apps/cms/current/tests/Feature/WarrantyFirstPaymentIssuance798Test.php)" = "5efbf3d55e63b4b6236faaca393851656dcaa986"
          # M10 and M11 live-gate requirements; never enable public Storefront.
          grep -Fq 'issueForVerifiedPaymentLocked($locked, $payment, $actor)' apps/cms/current/app/Services/OrderWorkflowService.php
          test "$(grep -Fc 'if ($transitioned) $this->notifyCustomer' apps/cms/current/app/Services/OrderPaymentService.php)" -eq 2
          grep -Fq 'issued_pending_delivery' apps/cms/current/app/Services/WarrantyIssuanceService.php
          grep -Fq '$currentRecipient->notificationPreference()->first()?->warranty_expiry_alerts === true' apps/cms/current/app/Services/WarrantyExpiryRecipientPolicy.php
          git diff --check "$BASE" HEAD
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_mysql,pdo_sqlite,dom,curl,fileinfo,openssl,tokenizer,xml,xmlwriter,intl,gd,zip,bcmath
          coverage: none
      - name: Install locked packages and test 69 real Laravel MariaDB cases
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          test ! -e .env
          install -m 600 /dev/null .env
          composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
          php -l tests/Feature/WarrantyExpiryArrayMailDeliveryB916Test.php
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306;dbname=ald1n_test","ald1n_test","ald1n_test");if(!str_starts_with((string)$p->query("SELECT VERSION()")->fetchColumn(),"10.11.19-MariaDB"))exit(35);'
          vendor/bin/phpunit -c phpunit.mysql.xml --fail-on-warning \
            --log-junit "$RUNNER_TEMP/b922-junit.xml" \
            tests/Feature/MobilePushRecipientOwnershipB909Test.php \
            tests/Feature/MobilePushRevocationB910Test.php \
            tests/Feature/MobilePushCategoryRevocationB911Test.php \
            tests/Feature/MobilePushTokenRotationB912Test.php \
            tests/Feature/WarrantyExpiryArrayMailDeliveryB916Test.php \
            tests/Feature/MobilePushPhase3BTest.php \
            tests/Feature/WarrantyExpiryFreshEligibilityB905Test.php \
            tests/Feature/WarrantyExpiryDeliveryGuardTest.php \
            tests/Unit/WarrantyExpiryOptInSourceTest.php \
            tests/Feature/WarrantyFirstPaymentIssuance798Test.php \
            tests/Feature/PaymentTransitionNotificationB902Test.php
      - name: Strict unique 69-case JUnit gate and source hashes
        working-directory: apps/cms/current
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/b922-junit.xml" <<'PY'
          import hashlib
          import pathlib
          import re
          import sys
          import xml.etree.ElementTree as ET
          
          # Fixed 11-class, 69-method census, compared to pinned source identities.
          fixtures = {'tests/Feature/MobilePushRecipientOwnershipB909Test.php': 6, 'tests/Feature/MobilePushRevocationB910Test.php': 6, 'tests/Feature/MobilePushCategoryRevocationB911Test.php': 9, 'tests/Feature/MobilePushTokenRotationB912Test.php': 7, 'tests/Feature/WarrantyExpiryArrayMailDeliveryB916Test.php': 10, 'tests/Feature/MobilePushPhase3BTest.php': 3, 'tests/Feature/WarrantyExpiryFreshEligibilityB905Test.php': 9, 'tests/Feature/WarrantyExpiryDeliveryGuardTest.php': 7, 'tests/Unit/WarrantyExpiryOptInSourceTest.php': 3, 'tests/Feature/WarrantyFirstPaymentIssuance798Test.php': 6, 'tests/Feature/PaymentTransitionNotificationB902Test.php': 3}
          required_manifest_sha256 = "01fdcebe4e53839cecf64c6275c5a0c0715e13770fc45cb958cb30217ea187dc"
          expected = set()
          for filename, count in fixtures.items():
              path = pathlib.Path(filename)
              if not path.is_file():
                  raise SystemExit("HOLD_B932_MISSING_TEST_SOURCE:" + filename)
              source = path.read_text(encoding="utf-8")
              cls = path.stem
              namespace = "Tests\\Unit" if filename.startswith("tests/Unit/") else "Tests\\Feature"
              if ("namespace " + namespace + ";") not in source or not re.search(r"\bclass\s+" + re.escape(cls) + r"\b", source):
                  raise SystemExit("HOLD_B932_SOURCE_CLASS_IDENTITY:" + filename)
              names = re.findall(r"\bfunction\s+(test_[A-Za-z0-9_]+)\s*\(", source)
              if len(names) != count or len(set(names)) != count:
                  raise SystemExit("HOLD_B932_SOURCE_METHOD_COUNT:" + filename)
              expected.update(namespace + "\\" + cls + "::" + name for name in names)
          if len(expected) != 69:
              raise SystemExit("HOLD_B932_EXPECTED_MANIFEST_COUNT")
          manifest = ("\n".join(sorted(expected)) + "\n").encode("utf-8")
          if hashlib.sha256(manifest).hexdigest() != required_manifest_sha256:
              raise SystemExit("HOLD_B932_PINNED_69_IDENTITIES_DRIFT")
          
          path = pathlib.Path(sys.argv[1])
          xml = path.read_bytes()
          if b"<!DOCTYPE" in xml.upper() or b"<!ENTITY" in xml.upper():
              raise SystemExit("HOLD_B932_XML_DTD_OR_ENTITY")
          try:
              root = ET.fromstring(xml)
          except ET.ParseError:
              raise SystemExit("HOLD_B932_XML_PARSE")
          if root.tag not in ("testsuites", "testsuite"):
              raise SystemExit("HOLD_B932_JUNIT_ROOT")
          for suite in root.iter():
              if suite.tag in ("testsuites", "testsuite"):
                  for key in ("failures", "errors", "skipped", "warnings"):
                      if key in suite.attrib and suite.attrib[key] != "0":
                          raise SystemExit("HOLD_B932_SUITE_" + key.upper())
          if root.get("tests") is not None and root.get("tests") != "69":
              raise SystemExit("HOLD_B932_ROOT_COUNT")
          if any(node.tag in ("failure", "error", "skipped", "warning") for node in root.iter()):
              raise SystemExit("HOLD_B932_FAILED_SKIPPED_OR_WARNING_CASE")
          nodes = list(root.iter("testcase"))
          if len(nodes) != 69:
              raise SystemExit("HOLD_B932_JUNIT_NOT_69_CASES")
          found = set()
          for node in nodes:
              cls = node.get("classname") or node.get("class") or ""
              name = node.get("name") or ""
              canon_cls = cls.replace(".", "\\").replace("/", "\\")
              identity = canon_cls + "::" + name
              if identity not in expected:
                  raise SystemExit("HOLD_B932_UNKNOWN_CASE:" + identity)
              if identity in found:
                  raise SystemExit("HOLD_B932_DUPLICATE_CASE:" + identity)
              found.add(identity)
          if found != expected:
              raise SystemExit("HOLD_B932_MISSING_EXACT_CASES")
          print("PASS_B932_EXACT_69_JUNIT_SOURCE_PINNED_IDENTITIES_NO_FAILURES")
          PY
          sha256sum tests/Feature/WarrantyExpiryArrayMailDeliveryB916Test.php > "$RUNNER_TEMP/b922-source.sha256"
      - name: Evidence (no deployment)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b922-m11-array-mail-mariadb-evidence
          path: |
            ${{ runner.temp }}/b922-junit.xml
            ${{ runner.temp }}/b922-source.sha256
            ${{ runner.temp }}/b922-changed.txt
            apps/cms/current/tests/Feature/WarrantyExpiryArrayMailDeliveryB916Test.php
          retention-days: 7
      - name: Explicit no release operations
        if: always()
        run: echo B922_M10_M11_SOURCE_ONLY_NO_SMTP_NO_HOST_DEPLOY_NO_STORE_FRONT_NO_EAS_NO_PLAY
